[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-grpc-servicer"
version = "0.9.1"
description = "SMG gRPC servicer implementations for LLM inference engines (vLLM, MLX, TokenSpeed, SGLang)"
requires-python = ">=3.10"
dependencies = [
    "smg-grpc-proto>=0.4.16",  # 0.4.16: first release with GenerateRequest.data_parallel_rank (field 12)
    "grpcio>=1.81.1",
    "grpcio-reflection>=1.81.1",
    "grpcio-health-checking>=1.81.1",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Chang Su", email = "mckvtl@gmail.com"},
    {name = "Simo Lin", email = "linsimo.mark@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
vllm = ["vllm>=0.19.0", "pyzmq>=25.0.0", "msgspec>=0.18.0"]
# 0.5.18 dropped the server_args parameter from
# create_load_snapshot_reader(); the floor tracks that signature, which the
# request manager calls unconditionally. (Earlier floors recorded the shmem
# load snapshots that replaced the WatchLoadUpdateReq piggyback path in
# 0.5.13, removed upstream in v0.5.14.)
sglang = ["sglang>=0.5.18"]
# smg-grpc-proto>=0.4.7 is the first release that ships mlx_engine_pb2;
# without this floor, installing [mlx] against an older proto build would
# crash at import time when smg_grpc_servicer.mlx.server runs.
# transformers<5.13: 5.13.0 regressed AutoTokenizer.register on string keys,
# which mlx-lm's NewlineTokenizer registration hits at import.
mlx = ["smg-grpc-proto>=0.4.7", "mlx>=0.22.0", "mlx-lm>=0.22.0", "transformers<5.13"]
# TokenSpeed itself is installed from source (no PyPI release); these are the
# extra runtime deps the KV-event bridge needs on top of a TokenSpeed install.
tokenspeed = ["pyzmq>=25.0.0", "msgspec>=0.18.0"]

[project.urls]
Homepage = "https://github.com/smg-project/smg"
Repository = "https://github.com/smg-project/smg"

[tool.setuptools.packages.find]
where = ["."]
include = ["smg_grpc_servicer*"]
