# The test cluster: a controller and six one-CPU nodes on a Docker network,
# each node reached by its name. Everything runs as root unless a job is
# submitted as alice.
ClusterName=e2e
SlurmctldHost=slurmctl
AuthType=auth/munge
CredType=cred/munge
SlurmUser=root
SlurmdUser=root
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
JobAcctGatherType=jobacct_gather/none
AccountingStorageType=accounting_storage/none
SelectType=select/cons_tres
SelectTypeParameters=CR_CPU
SchedulerType=sched/backfill
ReturnToService=2
MpiDefault=none
# The runner's CPU count is not this file's business.
SlurmdParameters=config_overrides
# One CPU per node, so a node runs one job at a time: every worker listens on
# the same port.
NodeName=node[1-6] CPUs=1 State=UNKNOWN
PartitionName=debug Nodes=node[1-5] Default=YES MaxTime=INFINITE State=UP
PartitionName=other Nodes=node6 MaxTime=INFINITE State=UP
