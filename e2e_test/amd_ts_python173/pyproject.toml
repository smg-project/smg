[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-ts-python173-proof"
version = "0.0.1"
requires-python = ">=3.11"

[project.entry-points.pytest11]
smg-ts-python173-proof = "ts_python173.plugin"

[tool.setuptools.package-data]
ts_python173 = ["contract.json", "cases.json"]
