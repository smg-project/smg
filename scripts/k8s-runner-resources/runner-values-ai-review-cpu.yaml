## The review runner set: the Claude and Codex review workflows run here and nothing else
## should. Compared with k8s-runner-cpu it has no Docker (no dind sidecar, no socket, no
## privileged container), no API key or token in its environment, its own quota, so a test
## fan-out never delays a review, and a plain CPU node pool. The keys the reviews use come
## from the `ai-review` GitHub environment and are held by proxy processes; see
## .github/workflows/codex-code-review.yml and claude-code-review.yml.
githubConfigUrl: "https://github.com/smg-project/smg"
githubConfigSecret: github-arc-secret

controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: org-actions-runner

## One warm runner so a review starts within seconds of a push.
minRunners: 1
maxRunners: 8

runnerScaleSetName: "ai-review-cpu"

resourceMeta: {}
keyVault: {}

template:
  spec:
    nodeSelector:
      oke.oraclecloud.com/pool.name: standard-apps
    volumes:
      - name: work
        emptyDir: {}
    containers:
      - name: runner
        image: fra.ocir.io/idqj093njucb/action-runner:2.337.0
        command:
          - /home/runner/run.sh
        # No DOCKER_HOST and no credentials: the reviewers read code, they build nothing.
        env: []
        securityContext:
          privileged: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: "4"
            memory: "16Gi"
            ephemeral-storage: "20Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
            ephemeral-storage: "20Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
