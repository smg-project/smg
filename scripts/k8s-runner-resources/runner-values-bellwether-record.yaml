# bellwether's recording runners (smg-project/bellwether, .github/workflows/record.yml): one job per checkpoint group
# records its corpus sources and pushes the new sets to a branch with the job's own token. Registered to the bellwether
# repository alone, so no organization runner group is involved. The repository is public, so the pods carry no
# credential and run no docker. A recorder holds up to ~19 GB (tau2, 4 sets a call), hence 64 GiB for two at once; the
# 40 GiB disk request keeps pods off the 35 GB CPU nodes. CPU-only nodes are preferred, GPU nodes take the overflow.
githubConfigUrl: "https://github.com/smg-project/bellwether"
githubConfigSecret: github-arc-secret
controllerServiceAccount:
  name: arc-gha-rs-controller
  namespace: org-actions-runner
minRunners: 2
maxRunners: 40
runnerScaleSetName: "bellwether-record"
resourceMeta: {}
keyVault: {}
template:
  spec:
    tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: nvidia.com/gpu.present
                  operator: DoesNotExist
    volumes:
      - name: work
        emptyDir: {}
    containers:
      - name: runner
        image: fra.ocir.io/idqj093njucb/action-runner:2.337.0
        command:
          - /home/runner/run.sh
        resources:
          requests:
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "40Gi"
          limits:
            cpu: "8"
            memory: "64Gi"
            ephemeral-storage: "80Gi"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
