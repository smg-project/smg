# The bounds of the nightly gRPC router stress cells (`report.py --bounds`): per cell, the most the
# gateway may fail, shed, grow, cost or take before the nightly turns red. A cell is named without its
# repeat suffix (`-r<k>`); a cell this file does not name is reported as unbounded and judged by nothing.
# A figure a cell is bounded on and does not report is a breach: a renamed or dropped figure does not void
# its bound in silence, and a key no figure answers to ends the report (exit 2). The figures hold for the
# nightly's configuration (REPEATS=1, DURATION=40, WARMUP=5, GW_THREADS=2 on one hosted runner): run_all.sh
# judges a run only when BOUNDS names a file, as the nightly workflow does, so a run under the script's full
# defaults or on another host is not held to them.
#
# How the figures were set (2026-11-08): from the 23 nightly runs recorded between 2026-10-17 and
# 2026-11-08 (`report.json` of each run's artifact), per cell the largest value seen over those nights,
# plus a quarter of it (at least one unit) for the rates, costs and latencies; the counts are the
# largest seen, exactly. The idle cell sheds by design: 10,000 streams against the default admission
# bound, of which the bound admits 4,197 and sheds 5,803 every night, so its shed and failed counts are
# that figure. A bound is moved by a change that explains the new level in its own PR, never by the
# night that breached it.
#
# The anon-RSS slope bound judges the steady-state slope (`report.py`: the fit over the second
# half of the measured window). A cold gateway grows through the first 15 to 20 s of load
# (allocator arenas, first connections, caches filling), and a whole-window fit records that
# growth instead of a leak: 662 MB/min in the idle cell and 190 in the responses cell at the
# most over the recorded nights, against 11 and 42 over the second half. Set 2026-11-09 from the
# 24 nights recorded between 2026-10-17 and 2026-11-09, by the rule above (the largest steady
# slope seen plus a quarter of it, at least one unit).

[idle-default-idle10k]
failed_max = 5803
shed_max = 5803
rss_anon_steady_slope_mb_per_min_max = 14
cpu_ms_per_req_max = 1.7
ttft_p99_ms_max = 62400
e2e_p99_ms_max = 62800
rss_mb_max_max = 542

