# Router with the standalone policy controller beside it: a Deployment of its
# own and the Service <fullname>-policy-controller (the gateways' gRPC port,
# the operators' port and the metrics port). The controller runs on its own
# today: nothing here points the router at it.
# The controller's image is the router's with -policy-controller appended to
# the tag. For an image of your own, build one from
# docker/policy-controller.Dockerfile and name
# policyController.image.repository and policyController.image.tag.
# Usage: helm install smg deploy/helm/smg -f deploy/helm/smg/examples/with-policy-controller.yaml
router:
  workerUrls:
    - http://worker-1:8000
policyController:
  enabled: true
  # No listener takes a caller's stated name until it is named, and a
  # listener that is not named refuses every call of its scopes but Leader
  # as unauthenticated. Nothing is verified on a named listener: whoever
  # reaches its port acts as any principal of its scopes. Name the gateways'
  # listener only behind a mesh that verifies its callers, or a network
  # policy that admits them alone:
  # identityAsTold: [gateway]
  # The policy spec the controller runs, a document of apiVersion
  # smg.policy/v1: here, the healthy worker with the least load. The chart
  # mounts it as a file the controller watches, so a changed document moves
  # no pod: the running controller applies it in place, or rejects one that
  # does not run and keeps the one it runs.
  spec:
    apiVersion: smg.policy/v1
    profiles:
      default:
        filter: [healthy]
        score: [least-load]
        pick: best
  # The controller runs 2 runtime worker threads by default
  # (runtimeWorkerThreads), the CPU limit here: raise the two together.
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: "2"
      memory: 512Mi
