# Router with Prometheus ServiceMonitor, Grafana dashboard and alerting rules.
# Usage: helm install smg deploy/helm/smg -f deploy/helm/smg/examples/with-monitoring.yaml
router:
  workerUrls:
    - http://worker-1:8000
  metrics:
    serviceMonitor:
      enabled: true
      interval: 15s
      labels:
        release: prometheus
grafana:
  dashboard:
    enabled: true
    labels:
      grafana_dashboard: "1"
prometheusRule:
  enabled: true
  labels:
    release: prometheus
  # Thresholds are the chart defaults; see values.yaml for the rationale.
  # alerts:
  #   ttftP99Seconds: 2
