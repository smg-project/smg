# Router with Slurm discovery: a worker on every node of each running job
# whose name is listed, found with `squeue` and `scontrol`.
#
# The published gateway image has no Slurm client; its `-slurm` variant, the
# release tag with `-slurm` appended, carries the Slurm 23.11 clients, which a
# controller on 23.11 through 25.05 accepts. What the cluster's authentication
# needs still comes from the deployment: its slurm.conf, and a running munged's
# socket (a sidecar or the host; the image starts none and ships no key) or
# auth/jwt with SLURM_JWT, which router.extraEnv can take from a Secret. The
# router runs as UID 65532, so name the Slurm user whose jobs are the workers.
#
# Usage: helm install smg deploy/helm/smg -f deploy/helm/smg/examples/with-slurm-discovery.yaml
global:
  image:
    tag: "1.16.0-slurm"

router:
  policy: cache_aware
  discovery:
    provider: slurm
    checkIntervalSecs: 15
    slurm:
      jobNames:
        - llama-serve
      port: 8000
      user: svc-llm
      partition: gpu
