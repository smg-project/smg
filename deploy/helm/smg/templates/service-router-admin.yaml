{{- if .Values.router.adminPort }}
{{- /* The admin listener's Service: the control plane reachable inside the
     cluster on its own name and port, never through the ingress, which
     names the data Service alone. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "smg.fullname" . }}-router-admin
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    app.kubernetes.io/component: router
  {{- /* No router.adminService when an upgrade reuses the values of a release
       from before it, and only the members given when it is given in part:
       the chart's defaults then. */}}
  {{- with (.Values.router.adminService).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ (.Values.router.adminService).type | default "ClusterIP" }}
  ports:
    - name: admin
      port: {{ (.Values.router.adminService).port | default 9001 }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "smg.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: router
{{- end }}
