{{- if .Values.prometheusRule.enabled }}
{{- $a := .Values.prometheusRule.alerts }}
{{- /* The matcher that selects this release's series: its namespace and the job label the scraped Service gets. The namespace keeps a same-named release in another namespace out (a rule that read it would mask absent() and evaluate that fleet too). Every expression carries the matcher and keeps namespace and job through its aggregation, so several releases on one Prometheus alert apart and a firing alert names its gateway. */}}
{{- $job := .Values.prometheusRule.jobSelector | default (printf "namespace=%q, job=%q" .Release.Namespace (printf "%s-router" (include "smg.fullname" .))) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "smg.fullname" . }}-router
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.prometheusRule.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  groups:
    - name: smg.router
      rules:
        - alert: SmgGatewayDown
          expr: up{ {{ $job }} } == 0 or absent(up{ {{ $job }} })
          for: {{ $a.scrapeMissingFor }}
          labels:
            severity: critical
          annotations:
            summary: "A gateway stopped answering its metrics scrape, or has no scrape target"
            description: "The scrape target {{ `{{ $labels.instance }}` }} has been down for {{ $a.scrapeMissingFor }}, or no target matches the release's job selector at all: the pod is gone, not ready, unreachable on its metrics port, or the selector names no Service."
        {{- /* smg_worker_health is a per-worker series that leaves the scrape with its registration, so a gateway with no worker at all (none registered yet, or every one removed: a pod deleted, scaled away or no longer published) has no series and an empty sum, which `== 0` does not match. The absent() leg covers it while the gateway's own scrape is up; a gateway that is down is SmgGatewayDown's. */}}
        - alert: SmgNoHealthyWorker
          expr: |
            sum by (namespace, job) (max by (namespace, job, worker) (smg_worker_health{ {{ $job }} })) == 0
              or (absent(smg_worker_health{ {{ $job }} }) and on () (up{ {{ $job }} } == 1))
          for: {{ $a.noHealthyWorkerFor }}
          labels:
            severity: critical
          annotations:
            summary: "No healthy worker behind the gateway"
            description: "Every worker registered with {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} has failed its health probes, or none is registered at all, for {{ $a.noHealthyWorkerFor }}; requests are refused until a healthy one is registered."
        {{- /* The ratio reads client traffic alone: the probe routes (/health, /readiness, /liveness) are the kubelet's polls, answered 503 for the whole of an engine's bring-up with no client in sight, and 200 every few seconds once the fleet serves, where they would dilute the share of failing client responses. The access log demotes the same three routes. */}}
        - alert: SmgHighErrorRatio
          expr: |
            sum by (namespace, job) (rate(smg_http_responses_total{ {{ $job }}, path!~"/health|/readiness|/liveness", status_code=~"5.." }[5m]))
              / sum by (namespace, job) (rate(smg_http_responses_total{ {{ $job }}, path!~"/health|/readiness|/liveness" }[5m])) > {{ $a.errorRatio }}
          for: {{ $a.errorRatioFor }}
          labels:
            severity: critical
          annotations:
            summary: "Too many responses are server errors"
            description: "{{ `{{ $value | humanizePercentage }}` }} of the responses of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }}, the probe routes excluded, were 5xx over the last 5 minutes (threshold {{ $a.errorRatio }})."
        {{- /* The edge family counts a response once, by its head: a stream that fails after its first token (an engine that died mid-generation, a worker whose connection broke, an output the reader could not parse) is a 200 there, with no error code, and the ratio above never sees it. The router families count the request and its failure whatever the point of failure, so a wave of failed streams reads here. The refusals the client earned stay out of the numerator: a malformed request (validation_error), a model nobody serves, or whose every worker is unavailable (no_workers, SmgNoHealthyWorker's case), a tenant over its limit (rate_limit_error) and a grammar of the client's own (constraint_error). */}}
        - alert: SmgHighRouterErrorRatio
          expr: |
            sum by (namespace, job) (rate(smg_router_request_errors_total{ {{ $job }}, error_type!~"validation_error|no_workers|rate_limit_error|constraint_error" }[5m]))
              / sum by (namespace, job) (rate(smg_router_requests_total{ {{ $job }} }[5m])) > {{ $a.errorRatio }}
          for: {{ $a.errorRatioFor }}
          labels:
            severity: critical
          annotations:
            summary: "Too many routed requests fail"
            description: "{{ `{{ $value | humanizePercentage }}` }} of the requests routed by {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} failed server-side over the last 5 minutes (threshold {{ $a.errorRatio }}), streams that failed after their first token included; the edge's response families count those as 200s, and the client's own refusals are not counted."
        - alert: SmgTtftP99High
          expr: |
            histogram_quantile(0.99, sum by (le, namespace, job) (rate(smg_router_ttft_seconds_bucket{ {{ $job }} }[5m]))) > {{ $a.ttftP99Seconds }}
          for: {{ $a.ttftP99For }}
          labels:
            severity: critical
          annotations:
            summary: "Time to first token p99 of streamed answers is over the SLO"
            description: "p99 TTFT of the streamed answers of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} is {{ `{{ $value | humanizeDuration }}` }} (threshold {{ $a.ttftP99Seconds }}s) for {{ $a.ttftP99For }}: queues are building in front of the engines. A collected answer records no first token, so the p99 is over the streamed share alone."
        - alert: SmgKvUsageNearCapacity
          expr: max by (namespace, job, worker) (smg_engine_token_usage{ {{ $job }} }) > {{ $a.kvUsage }}
          for: {{ $a.kvUsageFor }}
          labels:
            severity: warning
          annotations:
            summary: "A worker's KV cache is nearly full"
            description: "Worker {{ `{{ $labels.worker }}` }} of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} reports {{ `{{ $value | humanizePercentage }}` }} KV token usage for {{ $a.kvUsageFor }}; the engine preempts and recomputes above this level."
        - alert: SmgCircuitBreakerOpen
          expr: max by (namespace, job, worker) (smg_worker_cb_state{ {{ $job }} }) > 0
          for: {{ $a.circuitBreakerOpenFor }}
          labels:
            severity: warning
          annotations:
            summary: "A worker's circuit breaker is open or half-open"
            description: "The circuit breaker of worker {{ `{{ $labels.worker }}` }} of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} has been open or half-open for {{ $a.circuitBreakerOpenFor }}: the worker fails requests although it may still pass its health probes."
        {{- /* One limiter is live at a time: the concurrency limit (smg_admission_queue_rejected_total by reason; its counter also takes the multimodal bounds and a selection timeout under either mode) or the opt-in priority scheduler (smg_scheduler_admit_total by class and outcome, the rejected_* outcomes). The union reads whichever is live; the two label sets never coincide, so `or` drops nothing. */}}
        - alert: SmgAdmissionRejections
          expr: |
            sum by (namespace, job) (
              rate(smg_admission_queue_rejected_total{ {{ $job }} }[5m])
                or rate(smg_scheduler_admit_total{ {{ $job }}, outcome=~"rejected_.*" }[5m])
            ) > 0
          for: {{ $a.admissionRejectionsFor }}
          labels:
            severity: warning
          annotations:
            summary: "The gateway is rejecting requests at admission"
            description: "{{ `{{ $value | humanize }}` }} requests per second have been rejected at admission by {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} for {{ $a.admissionRejectionsFor }}: the concurrency limit, or the priority scheduler's queue bound or wait, is reached."
        - alert: SmgEventLoopStalls
          expr: sum by (namespace, job) (increase(smg_tokio_event_loop_stalls_total{ {{ $job }} }[10m])) > {{ $a.eventLoopStalls }}
          labels:
            severity: warning
          annotations:
            summary: "The gateway's event loop is stalling"
            description: "{{ `{{ $value | humanize }}` }} event-loop stalls in 10 minutes on {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} (threshold {{ $a.eventLoopStalls }}): a worker thread is blocked or the process is starved of CPU."
        - alert: SmgDroppedLogLines
          expr: sum by (namespace, job, sink) (delta(smg_log_dropped_lines{ {{ $job }} }[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Log lines are being dropped"
            description: "The {{ `{{ $labels.sink }}` }} log sink of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} dropped {{ `{{ $value | humanize }}` }} lines in 10 minutes; the sink cannot keep up with the log volume."
        - alert: SmgKvEventDegradedRanks
          expr: sum by (namespace, job) (smg_kv_event_degraded_ranks{ {{ $job }} }) > 0
          for: {{ $a.degradedRanksFor }}
          labels:
            severity: warning
          annotations:
            summary: "The KV event index is partial for a worker"
            description: "{{ `{{ $value }}` }} engine ranks of {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.job }}` }} have a possibly stale KV index for {{ $a.degradedRanksFor }} (an unreplayed gap or a late relay snapshot); cache-aware routing under-predicts their cached prefixes until the next resync."
{{- end }}
