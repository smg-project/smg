{{- if .Values.prometheusRule.enabled }}
{{- $a := .Values.prometheusRule.alerts }}
{{- $job := .Values.prometheusRule.jobSelector | default (printf "job=%q" (printf "%s-router" (include "smg.fullname" .))) }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "smg.fullname" . }}-router
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.prometheusRule.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
spec:
  groups:
    - name: smg.router
      rules:
        - alert: SmgGatewayDown
          expr: up{{ "{" }}{{ $job }}{{ "}" }} == 0
          for: {{ $a.scrapeMissingFor }}
          labels:
            severity: critical
          annotations:
            summary: "A gateway stopped answering its metrics scrape"
            description: "The scrape target {{ `{{ $labels.instance }}` }} has been down for {{ $a.scrapeMissingFor }}: the pod is gone, not ready, or its metrics port is unreachable."
        - alert: SmgNoHealthyWorker
          expr: sum(max by (worker) (smg_worker_health)) == 0
          for: {{ $a.noHealthyWorkerFor }}
          labels:
            severity: critical
          annotations:
            summary: "No healthy worker behind the gateway"
            description: "Every registered worker has failed its health probes for {{ $a.noHealthyWorkerFor }}; requests are refused until one returns."
        - alert: SmgHighErrorRatio
          expr: |
            sum(rate(smg_http_responses_total{status_code=~"5.."}[5m]))
              / sum(rate(smg_http_responses_total[5m])) > {{ $a.errorRatio }}
          for: {{ $a.errorRatioFor }}
          labels:
            severity: critical
          annotations:
            summary: "Too many responses are server errors"
            description: "{{ `{{ $value | humanizePercentage }}` }} of responses were 5xx over the last 5 minutes (threshold {{ $a.errorRatio }})."
        - alert: SmgTtftP99High
          expr: |
            histogram_quantile(0.99, sum by (le) (rate(smg_router_ttft_seconds_bucket[5m]))) > {{ $a.ttftP99Seconds }}
          for: {{ $a.ttftP99For }}
          labels:
            severity: critical
          annotations:
            summary: "Time to first token p99 is over the SLO"
            description: "p99 TTFT is {{ `{{ $value | humanizeDuration }}` }} (threshold {{ $a.ttftP99Seconds }}s) for {{ $a.ttftP99For }}: queues are building in front of the engines."
        - alert: SmgKvUsageNearCapacity
          expr: max by (worker) (smg_engine_token_usage) > {{ $a.kvUsage }}
          for: {{ $a.kvUsageFor }}
          labels:
            severity: warning
          annotations:
            summary: "A worker's KV cache is nearly full"
            description: "Worker {{ `{{ $labels.worker }}` }} reports {{ `{{ $value | humanizePercentage }}` }} KV token usage for {{ $a.kvUsageFor }}; the engine preempts and recomputes above this level."
        - alert: SmgCircuitBreakerOpen
          expr: max by (worker) (smg_worker_cb_state) == 1
          for: {{ $a.circuitBreakerOpenFor }}
          labels:
            severity: warning
          annotations:
            summary: "A worker's circuit breaker is open"
            description: "Worker {{ `{{ $labels.worker }}` }} has been skipped by the router for {{ $a.circuitBreakerOpenFor }} after consecutive failures."
        - alert: SmgAdmissionRejections
          expr: sum(rate(smg_admission_queue_rejected_total[5m])) > 0
          for: {{ $a.admissionRejectionsFor }}
          labels:
            severity: warning
          annotations:
            summary: "The gateway is rejecting requests at admission"
            description: "{{ `{{ $value | humanize }}` }} requests per second have been rejected at the admission queue for {{ $a.admissionRejectionsFor }}: the concurrency limit is reached."
        - alert: SmgEventLoopStalls
          expr: sum(increase(smg_tokio_event_loop_stalls_total[10m])) > {{ $a.eventLoopStalls }}
          labels:
            severity: warning
          annotations:
            summary: "The gateway's event loop is stalling"
            description: "{{ `{{ $value | humanize }}` }} event-loop stalls in 10 minutes (threshold {{ $a.eventLoopStalls }}): a worker thread is blocked or the process is starved of CPU."
        - alert: SmgDroppedLogLines
          expr: sum by (sink) (delta(smg_log_dropped_lines[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Log lines are being dropped"
            description: "The {{ `{{ $labels.sink }}` }} log sink dropped {{ `{{ $value | humanize }}` }} lines in 10 minutes; the sink cannot keep up with the log volume."
        - alert: SmgKvEventDegradedRanks
          expr: sum(smg_kv_event_degraded_ranks) > 0
          for: {{ $a.degradedRanksFor }}
          labels:
            severity: warning
          annotations:
            summary: "The KV event index is partial for a worker"
            description: "{{ `{{ $value }}` }} engine ranks have a possibly stale KV index for {{ $a.degradedRanksFor }} (an unreplayed gap or a late relay snapshot); cache-aware routing under-predicts their cached prefixes until the next resync."
{{- end }}
