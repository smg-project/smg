{{- /* Created for what reads pods through the Kubernetes API
     (smg.usesKubernetesApi): Kubernetes worker discovery and mesh router
     discovery. The file, Slurm and Consul providers never call it. */}}
{{- if or .Values.rbac.create (include "smg.usesKubernetesApi" .) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if include "smg.discoveryClusterWide" . }}
kind: ClusterRole
{{- else }}
kind: Role
{{- end }}
metadata:
  name: {{ include "smg.fullname" . }}
  {{- /* In the namespace discovery reads pods from, when that is not the
       release's: a Role grants nothing outside its own namespace. */}}
  {{- if and (not (include "smg.discoveryClusterWide" .)) (ne (include "smg.discoveryNamespace" .) .Release.Namespace) }}
  namespace: {{ include "smg.discoveryNamespace" . }}
  {{- end }}
  labels:
    {{- include "smg.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
{{- end }}
