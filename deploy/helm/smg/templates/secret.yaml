{{- if .Values.huggingface.token }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smg.fullname" . }}-hf-token
  labels:
    {{- include "smg.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.huggingface.token | quote }}
{{- end }}
{{- if and .Values.auth.apiKey (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smg.fullname" . }}-auth
  labels:
    {{- include "smg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "smg.authSecretKey" . }}: {{ .Values.auth.apiKey | quote }}
{{- end }}
{{- if and .Values.auth.controlPlane.apiKeys (not .Values.auth.controlPlane.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smg.fullname" . }}-control-plane
  labels:
    {{- include "smg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "smg.controlPlaneSecretKey" . }}: {{ .Values.auth.controlPlane.apiKeys | quote }}
{{- end }}
