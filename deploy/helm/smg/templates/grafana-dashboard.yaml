{{- if .Values.grafana.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "smg.fullname" . }}-grafana-dashboard
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    {{- range $key, $value := .Values.grafana.dashboard.labels }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
data:
  smg-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Traffic",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "title": "Request rate",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (model, endpoint) (rate(smg_router_requests_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "{{ "{{" }}model{{ "}}" }} {{ "{{" }}endpoint{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 1
          }
        },
        {
          "title": "Responses by status",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (status_code) (rate(smg_http_responses_total{namespace=~\"$namespace\", job=~\"$job\", path!~\"/health|/readiness|/liveness\"}[5m]))",
              "legendFormat": "{{ "{{" }}status_code{{ "}}" }}"
            }
          ],
          "description": "Every response but the probe routes' (/health, /readiness, /liveness: the kubelet's polls, left out as the SmgHighErrorRatio alert leaves them out).",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 1
          }
        },
        {
          "title": "5xx ratio",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "(sum(rate(smg_http_responses_total{namespace=~\"$namespace\", job=~\"$job\", path!~\"/health|/readiness|/liveness\", status_code=~\"5..\"}[5m])) or vector(0)) / sum(rate(smg_http_responses_total{namespace=~\"$namespace\", job=~\"$job\", path!~\"/health|/readiness|/liveness\"}[5m]))",
              "legendFormat": "5xx (edge)"
            },
            {
              "expr": "(sum(rate(smg_router_request_errors_total{namespace=~\"$namespace\", job=~\"$job\", error_type!~\"validation_error|no_workers|rate_limit_error|constraint_error\"}[5m])) or vector(0)) / sum(rate(smg_router_requests_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "router errors"
            }
          ],
          "description": "Server-side failures over every response but the probe routes' (/health, /readiness, /liveness), as the SmgHighErrorRatio alert reads them, and the router's server-side failed share of its requests, as SmgHighRouterErrorRatio reads it (the client's own refusals left out): a stream that fails after its first token is a 200 at the edge and a router error; both alerts fire above prometheusRule.alerts.errorRatio.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 1
          }
        },
        {
          "title": "Errors by API code",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (error_code) (rate(smg_http_responses_total{namespace=~\"$namespace\", job=~\"$job\", error_code!=\"\"}[5m]))",
              "legendFormat": "{{ "{{" }}error_code{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 9
          }
        },
        {
          "title": "Router errors by type",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (error_type) (rate(smg_router_request_errors_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "{{ "{{" }}error_type{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 9
          }
        },
        {
          "title": "Token throughput",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (token_type) (rate(smg_router_tokens_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "{{ "{{" }}token_type{{ "}}" }}"
            }
          ],
          "description": "Prompt and generated tokens per second (gRPC backends).",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 9
          }
        },
        {
          "title": "Latency",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "panels": []
        },
        {
          "title": "Time to first token",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(smg_router_ttft_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(smg_router_ttft_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(smg_router_ttft_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "description": "The gRPC router's streamed answers alone, across models: the HTTP router records none, and a collected answer records no first token (nor does a streamed Responses answer on the Harmony pipeline). This p99 combines the selected namespaces and jobs; the SmgTtftP99High alert evaluates each namespace and job on its own and fires when its p99 stays above prometheusRule.alerts.ttftP99Seconds for ttftP99For.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 18
          }
        },
        {
          "title": "Time to first token p99 by model",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, model) (rate(smg_router_ttft_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "{{ "{{" }}model{{ "}}" }}"
            }
          ],
          "description": "The gRPC router's streamed answers alone: the HTTP router records none, and a collected answer records no first token.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 18
          }
        },
        {
          "title": "Time per output token",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(smg_router_tpot_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(smg_router_tpot_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(smg_router_tpot_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "p99"
            }
          ],
          "description": "The gRPC router's streamed answers alone, across models: the HTTP router records none, and a collected answer records no first token and so no time per output token.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 18
          }
        },
        {
          "title": "Time per output token p99 by model",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, model) (rate(smg_router_tpot_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "{{ "{{" }}model{{ "}}" }}"
            }
          ],
          "description": "The gRPC router's streamed answers alone: the HTTP router records none, and a collected answer records no first token and so no time per output token.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 26
          }
        },
        {
          "title": "Request duration p99 by endpoint",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, endpoint) (rate(smg_router_request_duration_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "{{ "{{" }}endpoint{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 26
          }
        },
        {
          "title": "HTTP duration p99 by route",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, path) (rate(smg_http_request_duration_seconds_bucket{namespace=~\"$namespace\", job=~\"$job\"}[5m])))",
              "legendFormat": "{{ "{{" }}path{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 26
          }
        },
        {
          "title": "Capacity and queues",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "panels": []
        },
        {
          "title": "Admission: in flight and queued",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(smg_admission_inflight{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "in flight"
            },
            {
              "expr": "sum(smg_admission_queue_depth{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "queued"
            },
            {
              "expr": "sum by (class) (smg_scheduler_inflight{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}class{{ "}}" }} in flight (scheduler)"
            },
            {
              "expr": "sum by (class) (smg_scheduler_queue_depth{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}class{{ "}}" }} queued (scheduler)"
            }
          ],
          "description": "One limiter is live at a time: the concurrency limit's in-flight and queued requests, or the priority scheduler's per class.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 35
          }
        },
        {
          "title": "Admission rejections",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(rate(smg_admission_queue_rejected_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "rejected"
            },
            {
              "expr": "sum by (class, outcome) (rate(smg_scheduler_admit_total{namespace=~\"$namespace\", job=~\"$job\", outcome=~\"rejected_.*\"}[5m]))",
              "legendFormat": "{{ "{{" }}class{{ "}}" }} {{ "{{" }}outcome{{ "}}" }}"
            }
          ],
          "description": "Rejections by whichever limiter is live: the concurrency limit's queue, or the priority scheduler's per-class queues (rejected_queue_full, rejected_queue_timeout); the SmgAdmissionRejections alert fires on their sum.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 35
          }
        },
        {
          "title": "Engine running requests per worker",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_engine_running_requests{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 35
          }
        },
        {
          "title": "Engine waiting requests per worker",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_engine_waiting_requests{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 43
          }
        },
        {
          "title": "KV cache usage per worker",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_engine_token_usage{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "description": "The engine's KV token usage ratio; the SmgKvUsageNearCapacity alert fires above prometheusRule.alerts.kvUsage.",
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.8
                  },
                  {
                    "color": "red",
                    "value": 0.9
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 43
          }
        },
        {
          "title": "In-flight requests by age",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (le) (smg_http_inflight_request_age_count{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "<= {{ "{{" }}le{{ "}}" }} s"
            }
          ],
          "description": "Non-cumulative age buckets; a growing tail is work that does not finish.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 43
          }
        },
        {
          "title": "Requests in flight (edge)",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(smg_http_connections_active{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "requests"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 51
          }
        },
        {
          "title": "Workers",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 59
          },
          "panels": []
        },
        {
          "title": "Healthy workers",
          "type": "stat",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum(max by (worker) (smg_worker_health{namespace=~\"$namespace\", job=~\"$job\"})) or vector(0)",
              "legendFormat": "healthy"
            }
          ],
          "description": "Registered workers whose health probes pass. A worker's series leaves the scrape with its registration, so a gateway with no worker at all has no series: shown as 0, the state the SmgNoHealthyWorker alert fires on.",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "noValue": "0",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none"
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 60
          }
        },
        {
          "title": "Worker health",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_worker_health{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "description": "1 healthy, 0 unhealthy, per worker.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 60
          }
        },
        {
          "title": "Circuit breaker state",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_worker_cb_state{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "description": "0 closed, 1 open (the worker is skipped), 2 half-open.",
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 60
          }
        },
        {
          "title": "Health checks by result",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (result) (rate(smg_worker_health_checks_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "{{ "{{" }}result{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 68
          }
        },
        {
          "title": "Overload: shed and fallback",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (stage) (rate(smg_worker_overload_shed_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "shed {{ "{{" }}stage{{ "}}" }}"
            },
            {
              "expr": "sum by (stage) (rate(smg_worker_overload_fallback_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "fallback {{ "{{" }}stage{{ "}}" }}"
            },
            {
              "expr": "sum by (stage) (rate(smg_worker_liveness_fallback_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "liveness fallback {{ "{{" }}stage{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 68
          }
        },
        {
          "title": "Worker retries",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "sum by (endpoint) (rate(smg_worker_retries_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "retry {{ "{{" }}endpoint{{ "}}" }}"
            },
            {
              "expr": "sum by (endpoint) (rate(smg_worker_retries_exhausted_total{namespace=~\"$namespace\", job=~\"$job\"}[5m]))",
              "legendFormat": "exhausted {{ "{{" }}endpoint{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 68
          }
        },
        {
          "title": "Cache and KV events",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 76
          },
          "panels": []
        },
        {
          "title": "Engine prefix cache hit rate per worker",
          "type": "timeseries",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "max by (worker) (smg_engine_cache_hit_rate{namespace=~\"$namespace\", job=~\"$job\"})",
              "legendFormat": "{{ "{{" }}worker{{ "}}" }}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit"
            },
