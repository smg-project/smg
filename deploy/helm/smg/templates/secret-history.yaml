{{- /*
The history store's connection URL, when the chart manages it: the store's
`url` with no `existingSecret` replacing it. The router reads the URL from
the environment variable its Deployment wires to this Secret, never from an
argument; the pod template carries a checksum of this file, so a changed URL
rolls the pods.
*/ -}}
{{- if include "smg.historySecretManaged" . }}
{{- $store := index .Values.history (include "smg.historyStore" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smg.fullname" . }}-history
  labels:
    {{- include "smg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "smg.historySecretKey" . }}: {{ $store.url | quote }}
{{- end }}
