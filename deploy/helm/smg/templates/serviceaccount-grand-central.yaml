{{- if and (.Values.grandCentral).enabled (include "smg.grandCentralElection" .) }}
{{- /* Grand Central's own account, with the election on: its token
     is mounted in the controller's pods alone, and the Role beside it is
     all it is granted. The router's account is untouched. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smg.grandCentralName" . }}
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    app.kubernetes.io/component: grand-central
{{- end }}
