{{- if and (.Values.grandCentral).enabled (include "smg.grandCentralElection" .) }}
{{- /* Follows role-grand-central.yaml: the controller's account alone. */}}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "smg.grandCentralName" . }}
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    app.kubernetes.io/component: grand-central
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "smg.grandCentralName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smg.grandCentralName" . }}
    namespace: {{ .Release.Namespace | quote }}
{{- end }}
