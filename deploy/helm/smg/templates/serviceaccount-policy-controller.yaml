{{- if and (.Values.policyController).enabled (include "smg.policyControllerElection" .) }}
{{- /* The policy controller's own account, with the election on: its token
     is mounted in the controller's pods alone, and the Role beside it is
     all it is granted. The router's account is untouched. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smg.policyControllerName" . }}
  labels:
    {{- include "smg.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy-controller
{{- end }}
