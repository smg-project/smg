{{- /* Follows role.yaml. */}}
{{- if or .Values.rbac.create (include "smg.usesKubernetesApi" .) }}
apiVersion: rbac.authorization.k8s.io/v1
{{- if include "smg.discoveryClusterWide" . }}
kind: ClusterRoleBinding
{{- else }}
kind: RoleBinding
{{- end }}
metadata:
  name: {{ include "smg.fullname" . }}
  labels:
    {{- include "smg.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  {{- if include "smg.discoveryClusterWide" . }}
  kind: ClusterRole
  {{- else }}
  kind: Role
  {{- end }}
  name: {{ include "smg.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "smg.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
