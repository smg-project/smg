{{- /*
The Oracle credentials (connect descriptor, database user, password), when
the chart manages them: the ones set under history.oracle with no
`existingSecret` replacing them. The router reads each from the environment
variable its Deployment wires to this Secret, never from an argument; the pod
template carries a checksum of this file, so a changed credential rolls the
pods. The Secret keeps the name <fullname>-secrets and the keys oracle-dsn /
oracle-user / oracle-password (history.oracle.secretKeys) of the chart's
earlier versions, which wrote it without reading it.
*/ -}}
{{- if include "smg.oracleSecretManaged" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smg.fullname" . }}-secrets
  labels:
    {{- include "smg.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range (include "smg.oracleCredentials" . | fromJsonArray) }}
  {{ .key }}: {{ .value | quote }}
  {{- end }}
{{- end }}
