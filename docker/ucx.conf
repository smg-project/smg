# UCX settings the engine image ships, read by the UCX that NIXL bundles from
# /etc/ucx/ucx.conf (its compiled-in config directory) in every process that
# creates a UCX context, the engine's tensor-parallel workers included, with
# no environment variable to pass through.
#
# TCP transport: a prefill and a decode leg on different hosts without an
# RDMA device move the KV over UCX's TCP transport, and the decode side's
# read of a remote block list is UCX's software-emulated GET: active-message
# fragments of the send segment, 8 KiB by UCX's default, each staged through
# host memory on both ends. Measured on one prefill + one decode leg (TP 2,
# about 100 MB per rank per request): 0.36 s per pull = 2.2 Gbit/s per rank
# stream with the default, 0.073 s = 11 Gbit/s with 1 MiB segments, the rate
# of a plain socket between the same pods; the 4 req/s cell goes from a
# 2.7 req/s ceiling with 33 s first tokens to 3.93 req/s with 0.35 s first
# tokens. These two keys configure the tcp transport only: the RDMA (rc, ud)
# and CUDA IPC paths read none of them. The receive segment must be at least
# the send segment. A file of the same name in a process's working directory,
# in $UCX_CONFIG_DIR, or the variables in its environment take precedence
# over this one.
UCX_TCP_TX_SEG_SIZE=1m
UCX_TCP_RX_SEG_SIZE=1m
