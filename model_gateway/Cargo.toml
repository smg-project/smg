[package]
name = "smg"
version = "1.9.0"
edition = "2021"
description = "High-performance model-routing gateway for large-scale LLM deployments"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
    "Keyang Ru <rukeyang@gmail.com>",
]
keywords = ["llm", "inference", "gateway", "load-balancer", "openai"]
readme = "../README.md"
categories = ["web-programming", "network-programming"]

[features]
default = ["grpc-client"]
grpc-client = []
grpc-server = []
opencv-video = ["llm-multimodal/opencv-video"]
mm-rdma = ["smg-mm-rdma/nixl"]
# Client-injection seam for this crate's own K8s discovery integration tests
# (auto-enabled by the self dev-dependency below, never in production builds).
test-util = []

vendored-openssl = ["openssl/vendored"]

[lib]
name = "smg"
crate-type = ["rlib"]

[[bin]]
name = "smg"
path = "src/main.rs"

[[bin]]
name = "amg"
path = "src/main.rs"

[dependencies]
# Workspace dependencies (simple)
anyhow.workspace = true
async-trait.workspace = true
blake3.workspace = true
chrono.workspace = true
dashmap.workspace = true
futures.workspace = true
http.workspace = true
lru.workspace = true
parking_lot.workspace = true
prost.workspace = true
prost-types.workspace = true
rand.workspace = true
thiserror.workspace = true
tonic.workspace = true
tonic-prost.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Workspace dependencies (with extra features)
axum = { workspace = true, features = ["macros", "multipart", "ws", "tracing"] }
bytemuck = { workspace = true, features = ["derive"] }
reqwest = { workspace = true, features = ["stream", "blocking", "json", "rustls", "multipart"] }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["serde"] }

# Workspace crates
openai-protocol = { workspace = true, features = ["axum"] }
reasoning-parser.workspace = true
tool-parser.workspace = true
wfaas.workspace = true
llm-tokenizer.workspace = true
smg-auth.workspace = true
smg-mcp.workspace = true
kv-index.workspace = true
smg-data-connector.workspace = true
llm-multimodal = { workspace = true, default-features = false }
smg-mm-rdma.workspace = true
smg-wasm = { workspace = true, features = ["storage-hooks"] }
smg-mesh.workspace = true
smg-grpc-client.workspace = true
engine-zmq-client.workspace = true

# External dependencies (not in workspace)
bincode = "1.3"
clap = { version = "4", features = ["derive", "env"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
ndarray = "0.17"
memmap2 = "0.9"
rayon = "1.12"
rustix = { version = "1", features = ["fs", "process"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7", features = ["trace", "compression-gzip", "cors", "timeout", "limit", "request-id", "util"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order"] }
bytes = "1.12.0"
http-body = "1.0"
http-body-util = "0.1"
futures-util = "0.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tracing-log = "0.2"
tracing-appender = "0.2.5"
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32", features = ["trace", "grpc-tonic"] }
tracing-opentelemetry = "0.33"
kube = { version = "3.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.27.0", features = ["v1_33"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
regex = "1.12"
memchr = "2.8"
url = "2.5.8"
tokio-stream = { version = "0.1", features = ["sync"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2"
openssl = "0.10.81"
rmcp = { version = "1.7", features = ["client"] }
serde_yaml = "0.9"
openai-harmony = "0.0.8"
openmetrics-parser = "0.4.4"
arc-swap = "1.9.1"
bitflags.workspace = true
once_cell = "1.21.4"
sha2 = "0.11"
base64 = "0.22"
image = { version = "0.25.10", default-features = false }
tokio-tungstenite = { workspace = true }
webpki-roots = { workspace = true }
wasmtime = { workspace = true }
tempfile = "3.27"
multer = { workspace = true }
str0m = { workspace = true }

[build-dependencies]
chrono = { version = "0.4", features = ["clock"] }
toml = "1.1"

[dev-dependencies]
# Self dev-dependency: turns on `test-util` for this crate's own test targets.
smg = { path = ".", features = ["test-util"] }
# Enable the mock engine for the ZMQ client's loopback tests.
engine-zmq-client = { workspace = true, features = ["mock-engine"] }
criterion = { version = "0.8", features = ["html_reports"] }
mock-worker = { path = "../crates/mock_worker" }
tower = { version = "0.5", features = ["util"] }
# Used by PD metrics integration tests to capture metric emission via a
# thread-local Prometheus recorder (same versions as the runtime deps above).
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
http-body-util = "0.1"
portpicker = "0.1"
lazy_static = "1.5"
wasm-encoder = "0.254"
npyz = { version = "0.9", features = ["npz"] }
opentelemetry-proto = { version = "0.32", features = ["gen-tonic"] }
serial_test = "3.5"
rsa = { version = "0.9", features = ["sha2"] }
jsonwebtoken = { version = "10.4", features = ["rust_crypto"] }
validator = "0.20.0"
tracing-test = "0.2"
tokio = { workspace = true, features = ["test-util"] }
kv-index.workspace = true
wasmtime-wasi = { workspace = true }
lru = { workspace = true }
wat = "1.252"
zip = "8.6"

[[bench]]
name = "wasm_middleware_latency"
harness = false
path = "benches/wasm_middleware_latency.rs"

[[bench]]
name = "request_processing"
harness = false
path = "benches/request_processing.rs"

[[bench]]
name = "router_registry_bench"
harness = false

[[bench]]
name = "tokenizer_benchmark"
harness = false
path = "benches/tokenizer_benchmark.rs"

[[bench]]
name = "tool_parser_benchmark"
harness = false
path = "benches/tool_parser_benchmark.rs"

[[bench]]
name = "manual_policy_benchmark"
harness = false
path = "benches/manual_policy_benchmark.rs"

[[bench]]
name = "radix_tree_benchmark"
harness = false
path = "benches/radix_tree_benchmark.rs"

[[bench]]
name = "wasm_instantiation"
harness = false
path = "benches/wasm_instantiation.rs"

[[bench]]
name = "routing_allocation_bench"
harness = false
path = "benches/routing_allocation_bench.rs"

[[bench]]
name = "sync_alloc_bench"
harness = false
path = "benches/sync_alloc_bench.rs"

[[bench]]
name = "workers_endpoint"
harness = false
path = "benches/workers_endpoint.rs"

[[bench]]
name = "scheduler_admission"
harness = false
path = "benches/scheduler_admission.rs"

[[bench]]
name = "scheduler_load"
harness = false
path = "benches/scheduler_load.rs"

[lints]
workspace = true
