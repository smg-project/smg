[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-nixl-environment-proof"
version = "0.0.1"
requires-python = ">=3.11"

[project.entry-points.pytest11]
smg-nixl-environment-proof = "nixl_environment.plugin"

[tool.setuptools.packages.find]
include = ["nixl_environment*"]

[tool.setuptools.package-data]
nixl_environment = ["cases.json", "private-wheel.json"]
