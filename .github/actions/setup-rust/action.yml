name: 'Setup Rust Environment'
description: 'Install Rust and the Rust cache. Requires checkout to be done first.'

inputs:
  cache-key:
    description: >-
      rust-cache shared key. Every job saving under the same key races for
      one cache entry per lockfile hash and only the first save wins, so a
      job whose target dir differs from the rest (bench profile, other
      features) should use its own key to keep its artifacts warm.
    required: false
    default: 'rust-cache'

runs:
  using: 'composite'
  steps:
    - name: Install Rust dependencies
      shell: bash
      run: bash scripts/ci_install_rust.sh

    - name: Verify Cargo.lock
      shell: bash
      run: cargo metadata --locked --no-deps --format-version 1 > /dev/null

    # No compiler cache in front of rustc: the units one would serve are the
    # dependency units the Rust cache restores, a hosted runner's local disk
    # cache never outlives its job, and the Actions-cache backend was taken out
    # for its request volume. The Rust cache is the whole of the caching.
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: .
        # The Go FFI build (bindings/golang/Makefile) overrides CARGO_TARGET_DIR
        # to bindings/golang/target, which `workspaces: .` does not cover — so
        # its dependency compilation was never cached. Cache that dir explicitly
        # so the Go FFI build is incremental across runs like the wheel build.
        cache-directories: |
          bindings/golang/target
        shared-key: ${{ inputs.cache-key }}
        cache-all-crates: true
        # Only a job that completed, on main, saves (smg-project/smg-lab#157):
        # - cache-on-failure would widen the post step to failed AND cancelled
        #   jobs, and a push to main cancels the run before it; the partial
        #   target directory of a cancelled job was then saved under the exact
        #   key, and every pull request restored that fragment.
        # - an entry a pull request saves is visible only to that pull request,
        #   and at a few hundred runs a day their 1-2.4 GB entries pushed every
        #   entry out of the repository's 10 GB cache within about twenty
        #   minutes, main's included.
        # A pull request's run restores the newest entry main saved under the
        # same key (the restore keys match on the prefix, so a different
        # lockfile still restores). For the rust-lint and rust-tests jobs that
        # entry comes from the Rust Cache Warmer workflow
        # (rust-cache-warmer.yml), which builds every test shard and lint leg
        # under the key `unit-tests` on a schedule, since main's own jobs
        # seldom complete between merges.
        cache-on-failure: false
        save-if: ${{ github.ref == 'refs/heads/main' }}
