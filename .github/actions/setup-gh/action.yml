name: 'Setup gh CLI'
description: >-
  Installs the GitHub CLI into ~/.local/bin and puts it on the PATH when the
  runner has none: a pinned release, verified against its SHA-256 before it is
  unpacked. Requires checkout to be done first.

inputs:
  version:
    description: 'The gh release to install.'
    required: false
    default: '2.74.0'
  sha256:
    description: 'SHA-256 of that release''s linux amd64 tarball.'
    required: false
    default: 'e55c9d49dc49c0b0fef0a9acd3510482fd9e27ff52ae80f8a6e838cd25b4cd89'

runs:
  using: 'composite'
  steps:
    - name: Install gh CLI
      shell: bash
      env:
        GH_VERSION: ${{ inputs.version }}
        GH_SHA256: ${{ inputs.sha256 }}
      run: |
        if ! command -v gh &>/dev/null; then
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --connect-timeout 10 --max-time 120 -o /tmp/gh.tgz \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "${GH_SHA256}  /tmp/gh.tgz" | sha256sum --check --quiet
          tar xzf /tmp/gh.tgz --strip-components=2 -C "$HOME/.local/bin" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        fi
