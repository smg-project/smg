name: 'Export API key from pod env'
description: >-
  Takes an API key the runner pod carries in its environment (ANTHROPIC_API_KEY by default)
  into the job's environment, masked in the logs; the job fails here, with a clear message,
  when the pod has none.

inputs:
  variable:
    description: 'The environment variable the runner pod holds the key in.'
    required: false
    default: 'ANTHROPIC_API_KEY'

runs:
  using: 'composite'
  steps:
    - name: Export API key from pod env
      shell: bash
      env:
        VARIABLE: ${{ inputs.variable }}
      run: |
        value="${!VARIABLE:-}"
        if [ -z "${value}" ]; then
          echo "::error::${VARIABLE} is not present in the runner pod environment"
          exit 1
        fi
        echo "::add-mask::${value}"
        echo "${VARIABLE}=${value}" >> "$GITHUB_ENV"
