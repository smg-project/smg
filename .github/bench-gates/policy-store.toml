# Regression gate for `cargo bench -p smg-policy-controller --bench store_view`, run by
# .github/workflows/benchmark-policy-store.yml on pull requests through scripts/bench_gate.py.
#
# The gate runs sixteen single-threaded rows of the store's bench and holds each of them to a threshold.
# Nine are at 8, 64 and 512 workers:
# one load record's write inside the publication window (`policy_store/load_write/<n>`), one publication
# (`policy_store/publish/<n>`) and the reference cell (`policy_store/floor/<n>`): the decision benches' gated
# build, its rows written from facts in hand.
#
# Two rows read the store beside other gateways' vetoes, 512 of them in the pool of 512: one veto's write
# (`policy_store/veto_write/512`) and one membership write (`policy_store/member_write/512`). A veto's write
# builds its own gateway's entries alone: the first row fails when that stops holding.
#
# One row reads a membership write where the vetoes are spread: 512 members over 64 pools and twelve other
# gateways holding a veto on each member, 6,144 in all (`policy_store/member_write_spread/512`). A membership
# write builds every pool's runs again, and a run holds one pool's share of its gateway's list: the row fails
# when a run is reserved for the whole list, which no case can see. With that reserve put back the row read
# 790.8 µs against 321.5 through this gate, and the gate failed it.
#
# One row reads a membership write under a generation that declares the view's three lists: 512 members of one
# pool, each stating an engine family, a zone and twelve labels, under two families, four zones and eight
# selectors (`policy_store/member_write_listed/512`). A membership write reads the worker it writes under the
# lists and carries every other member's fields: the row fails when a write reads every member again. Its
# identical-build spread is not read yet, so it stands at the membership write's threshold.
#
# Two rows read one membership write of a fleet of pairs, 512 prefills and 512 decodes of one model that name
# no runtime and report no descriptor: one prefill's registration written again as it stands, which moves no
# offer (`policy_store_pairs/kept/512`), and its runtime named and unnamed in turn, which moves its offer at
# every write (`policy_store_pairs/moved/512`). Each is gated at its own identical-build spread. The first
# fails when a write that moves no offer derives the pair classes again. The second holds the whole write of a
# moved offer: at 512 a side, deriving every worker's class again is under a tenth of that write by instruction
# count, inside the row's threshold, so the row does not hold the derivation to the written worker. The crate's
# cases do: the count of whole derivations a store ran, and the classes carried by address.
#
# One row reads a membership write beside a worker that lists many models: one of eight workers of one model
# written again, in a store that also holds one worker of 1,024 models
# (`policy_store_models/member_write/1024`). A write builds every pool again and reads each row's models as it
# goes: the row fails when a model is looked for among the row's earlier ones, a scan that grows with the square
# of the list. With that scan in place the row read 1.73 ms against 0.72, six rounds a side.
#
# The filter leaves out the binary's other rows. The three `policy_store_held/` rows time a publication beside a
# reader that holds the rows it would write over. The four `policy_store_pairs/` rows at 8 and at 64 a side are
# the two membership writes of smaller fleets of pairs. The two other `policy_store_models/` rows read the same
# write beside a list of 128 and of 4,096 models: the scan is a sixth of the first, and six rounds of one build
# read the second at 3.4 to 8.9 ms.
#
# Threshold (the method is described in tokenizer.toml). The identical-build spread, (max - min) / median of the
# per-run criterion medians over six runs of one build pinned to one core, read through this gate as three base
# and three pull-request runs (the base a copy of the binary with one byte appended, so the gate does not take
# the two for one file), on a shared many-core build host. Three readings and a later pair stand in the table. The
# nine rows at 8, 64 and 512 workers are of a reading launched at a load of 47, its six runs begun at 28 to 47.
# The two rows beside other gateways' vetoes are of a reading of the whole gate that did not wait for a quiet
# host: its six runs began at a load of 43 to 81, with a second run of the gate on a core beside it. The spread
# membership write is of the later pair, five runs a side: the two write rows alone at a load of 78 to 161, and
# the whole gate while the load rose from 9 to 113. The two rows of pairs are of a reading of their own, six runs
# of the two alone at a load of 112 to 123, and the row of many models of six runs at a load of 59 to 141:
#
#   rows                                        identical build   threshold
#   floor/{8,64,512}                            0.5 - 1.3 %       10 %
#   load_write/{8,64,512}                       0.7 - 4.8 %       10 %
#   publish/{8,64}                              2.3 - 4.1 %       10 %
#   publish/512                                 7.9 %             15 %
#   veto_write/512                              1.2 %             10 %
#   member_write/512                            7.8 %             20 %
#   member_write_spread/512                     12.9 - 17.6 %     40 %
#   member_write_listed/512                     not read          20 %
#   pairs kept/512                              8.5 %             20 %
#   pairs moved/512                             12.5 %            25 %
#   models member_write/1024                    5.8 %             15 %
#
# The threshold is the smallest multiple of 5 % that is at least twice the identical-build spread, never under
# 10 % (the hosted runner is noisier than the build host). One row stands under that rule: `publish/512` at
# 15 %, where the rule gives 20 %, since the hosted runner's own two jobs read its spread at 1.0 to 5.9 % a side
# (three runs a side). On top of the threshold the gate fails an id only when every pull-request run is slower
# than every base run (scripts/bench_gate.py), so one slow run cannot fail the job. The null case passed in both
# readings: 0 failed, 0 suspect of 21 ids, the largest change of medians -5.3 %, and of 27 ids, -3.4 %. In the
# later reading of 28 ids the spread membership write alone stood beyond 10 %, at +11.5 % with its runs
# overlapping: its threshold is its own.
#
# The busier reading is not the table's for the rows at 8, 64 and 512 workers, twenty-one of them then. There
# they read 1.1 to 9.1 %, five of them over 5 % (1.2 to 6.9 % without each one's slowest run), and `publish/512`
# read 36.4 %: two runs of six at 1.75 µs beside four at 1.26 to 1.37. A publication then allocated its 512 rows,
# by one of two paths by the allocator's state, and the rule that every pull-request run be slower than every
# base run is what held that row. A publication now writes over rows the store holds, so those readings are of
# the allocating publication and the row's threshold stands until its spread is read again.
#
# Placement, as policy-engine.toml records it: the workflow builds both binaries with every function on a 64-byte
# boundary, and the reference cell writes into a buffer that starts on a page's start (benches/common/placed.rs).
# The gate caught an inserted regression when it ran twenty-one rows, twelve of them of a decision's build that
# has left the bench since. The regression stood in that build (20 dependent multiply-adds plus 2 per candidate
# before it returns, never committed), read at a host load of 29 to 39: 12 of 21 ids failed and 0 were suspect,
# the twelve build rows at +27 to +112 % (the eight-worker rows +27 to +35 %), each confirmed by the re-measure
# round; the floor, write and publish rows, which the mutant does not touch, passed at -0.8 to +0.5 %.
#
# Count: `count = true`, as policy-engine.toml records it. A pull request's job failed `policy_store/floor/8`
# by time on a change that does not touch the cell: 26.2 against 29.0 ns, +10.6 % against 10 %, re-measured
# +43.5 %. Its two binaries, built again, run the cell in the same count in every batch after the first, 290.0
# instructions an iteration, with the cell's measured function at 0x180 of its page in the base's binary and at
# 0xc40 in the pull request's: by that job's own timings the gate passes with the one placement, in four reads
# of four. Read on the 28 ids this file held then, two copies of one binary of main: 21 count the same in every
# batch after the first, four do not count steadily (`publish/8`, `publish/64`, `member_write_spread/512` and one
# row of a decision's build that has left since) and three were not read, the bench having stopped under the
# counter. The two rows of a fleet of pairs and the row of many models, added since, do not count steadily
# either. A row that does not count steadily, or whose count is not read, keeps the time's verdict; where every
# count of a row is within half a percent, a second measurement decides it.
#
# Every job uploads bench-gate/results.json with the raw per-run medians of both sides; the hosted runner's
# own spread can be read from those and the thresholds tightened once it is known.

repeats = 3
count = true
# The count ends 3,180 s into the run: the gate step's bound is 55 minutes, and the report is written
# in the two minutes behind the count. No count starts in the budget's last 30 s.
run_budget = 3180
filter = "^policy_store/|^policy_store_pairs/(kept|moved)/512$|^policy_store_models/member_write/1024$"

# The files that feed this binary beyond the measured crate: the base side is built with them as the
# pull request has them (bench_gate.py build --sources-from), so a row added here cannot move the
# gated rows through the binary's inlining. A row joins this binary, in the pull request whose change it
# measures, only when it calls nothing the base branch's crate lacks: both sides are then built from these
# sources and the row reads the change. Any other row goes to a bench target of its own.
sources = [
    "crates/policy_controller/benches/store_view.rs",
    "crates/policy_controller/benches/common/mod.rs",
    "crates/policy_controller/benches/common/placed.rs",
]

# The first gate whose pattern matches an id decides its threshold.
[[gate]]
pattern = "^policy_store/publish/512$"
threshold = 0.15
note = "identical build 7.9 % on the build host, 1.0 - 5.9 % a side by the hosted runner's own two jobs"

[[gate]]
pattern = "^policy_store/member_write_spread/512$"
threshold = 0.40
note = "identical build 12.9 - 17.6 %, the second read while the host's load rose from 9 to 113"

[[gate]]
pattern = "^policy_store/member_write/512$"
threshold = 0.20
note = "identical build 7.8 %, read on a busier host"

[[gate]]
pattern = "^policy_store/member_write_listed/512$"
threshold = 0.20
note = "a membership write, held as member_write/512 is: its own identical-build spread is not read yet"

[[gate]]
pattern = "^policy_store_pairs/kept/512$"
threshold = 0.20
note = "identical build 8.5 %, read at a load of 112 to 123"

[[gate]]
pattern = "^policy_store_pairs/moved/512$"
threshold = 0.25
note = "identical build 12.5 %, read at a load of 112 to 123"

[[gate]]
pattern = "^policy_store_models/member_write/1024$"
threshold = 0.15
note = "identical build 5.8 %, read at a load of 59 to 141"

[[gate]]
pattern = "^policy_store/"
threshold = 0.10
note = "identical build 0.5 - 4.8 %"
