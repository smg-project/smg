# Advisory gate for the gateway's cost per request on the CPU mock bed
# (crates/gateway_perf, the gateway-perf binary, run by .github/workflows/benchmark-gateway-perf.yml
# on pull requests; the driver applies scripts/bench_gate.py's rule natively: an id regresses
# only when its change is worse than the threshold AND every head repeat is worse than every
# base repeat). The job reports and never fails on a verdict (a failed run fails it); the thresholds say what the table marks.
#
# Ids are `<path>/<metric>`; the values are counts and sizes per request (the id names the
# unit), lower is better. Thresholds from measured spreads, the SAME binary on both sides
# ("identical build"), three interleaved repeats per side, 10,000 requests per cell, the
# gateway pinned to 8 cores of a shared many-core machine at load 15-40:
#
#   metric                              identical build (5 paths)   threshold
#   allocation_calls_per_request        0.08 - 0.22 %               2 %   (the tools path has per-process modes of a few calls per thousand)
#   kib_requested_per_request           0.01 - 0.02 %               2 %
#   user_instructions_per_request_M     0.08 - 0.17 %               2 %   (only where perf stat counts; a hosted runner has no PMU)
#   rss_anon_mb_after_window            0.0 - 5.7 % (see below)     10 %  (the allocator's decay band on the anonymous part)
#   rss_mb_after_window                 1.3 - 2.6 %                 report only (carries the file part)
#   rss_file_mb_after_window            the page cache, placement   report only
#   cpu_us_per_request                  6.8 - 18.8 %                report only (load-dependent: the machine's noise, not the code's)
#
# The thresholds are ten times the identical-build spread of the exact counts (the perf
# ledger's bar for a hot-path change is +2 % user instructions and +5 % RSS) and about
# twice the band of the memory id. The deterministic ids are the judgement; CPU time,
# cycles, instructions with the kernel share, context switches and large allocations are
# report only until the hosted runner's own spread is read from the uploaded results.json
# files. The peak RSS is the whole set's high-water mark (VmHWM; the kernel reports no
# peak of a part): it carries the file part, so like the whole set it is reported and
# never judged across two binaries.
#
# The memory id is the ANONYMOUS part of the resident set (RssAnon: what the gateway
# allocated). The whole set also holds the file pages the kernel has mapped (RssFile:
# mostly the gateway's own binary, and its shared libraries, 3.8 MB of 40 at idle) and
# shared memory (RssShmem, zero here). A fault maps the cached neighbours inside the 64 KB
# window around it, so the file part follows two things that are not the gateway's work.
# One is how much of the measured FILE the page cache holds: on the pull-request job the
# whole set read 7 to 15 % lower on the head on ten runs in a row (30 cells, every head
# repeat under every base repeat; the head's binary is built first and two more builds
# push its pages out of the cache), while the anonymous part of the same cells read -2.0
# to +2.4 %. The other is where the linker put the code that runs: with both files held
# in the cache, a change that touched nearly as many pages of its binary on both sides read
# the whole set 0.9 to 2.6 % higher on every path, the same code lying in more windows. The
# anonymous band is the per-side spread of three repeats of one binary at the job's own
# cell (4,000 requests, three paths): 95 of 96 samples inside it and one at 10.4 %. 10 %
# of the part is 2 to 2.5 MB, under the 3 MB that 5 % of the whole set was. The whole set
# stays in the tables for one release beside its two parts.

repeats = 3

[[gate]]
pattern = "/allocation_calls_per_request$"
threshold = 0.02
note = "identical build 0.08 - 0.22 %; exact counts, the tools path's per-process modes stay under it"

[[gate]]
pattern = "/kib_requested_per_request$"
threshold = 0.02
note = "identical build 0.01 - 0.02 %"

[[gate]]
pattern = "/user_instructions_per_request_M$"
threshold = 0.02
note = "identical build 0.08 - 0.17 %; present only where perf stat counts instructions"

[[gate]]
pattern = "/rss_anon_mb_after_window$"
threshold = 0.10
note = "identical build 0.0 - 5.7 %; the allocator's decay band on the anonymous part; the whole set and the file part are report only"
