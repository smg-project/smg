# Advisory gate for the gateway's cost per request on the CPU mock bed
# (scripts/bench/gateway_perf, run by .github/workflows/benchmark-gateway-perf.yml on pull
# requests through scripts/bench_gate.py's rule: an id regresses only when its change is
# worse than the threshold AND every head repeat is worse than every base repeat). The
# job reports and never fails; the thresholds say what the table marks.
#
# Ids are `<path>/<metric>`; the values are counts and sizes per request (the id names the
# unit), lower is better. Thresholds from measured spreads, the SAME binary on both sides
# ("identical build"), three interleaved repeats per side, 10,000 requests per cell, the
# gateway pinned to 8 cores of a shared many-core machine at load 15-40:
#
#   metric                              identical build (5 paths)   threshold
#   allocation_calls_per_request        0.08 - 0.22 %               2 %   (the tools path has per-process modes of a few calls per thousand)
#   kib_requested_per_request           0.01 - 0.02 %               2 %
#   user_instructions_per_request_M     0.08 - 0.17 %               2 %   (only where perf stat counts; a hosted runner has no PMU)
#   rss_mb_after_window                 1.3 - 2.6 %                 5 %   (the allocator's decay band)
#   cpu_us_per_request                  6.8 - 18.8 %                report only (load-dependent: the machine's noise, not the code's)
#
# The thresholds are ten times the identical-build spread of the exact counts (the perf
# ledger's bar for a hot-path change is +2 % user instructions and +5 % RSS) and twice the
# RSS band. The deterministic ids are the judgement; CPU time, cycles, instructions with the
# kernel share, context switches, large allocations and the peak RSS are report only until
# the hosted runner's own spread is read from the uploaded results.json files.

repeats = 3

[[gate]]
pattern = "/allocation_calls_per_request$"
threshold = 0.02
note = "identical build 0.08 - 0.22 %; exact counts, the tools path's per-process modes stay under it"

[[gate]]
pattern = "/kib_requested_per_request$"
threshold = 0.02
note = "identical build 0.01 - 0.02 %"

[[gate]]
pattern = "/user_instructions_per_request_M$"
threshold = 0.02
note = "identical build 0.08 - 0.17 %; present only where perf stat counts instructions"

[[gate]]
pattern = "/rss_mb_after_window$"
threshold = 0.05
note = "identical build 1.3 - 2.6 %; the allocator's decay band"
