# Regression gate for `cargo bench -p smg-policy-controller --bench prefix_hash`, the fourth row of the matrix
# in .github/workflows/benchmark-policy-engine.yml, run on pull requests through scripts/bench_gate.py. The
# first row gates the `decision` binary with policy-engine.toml, which records the placement every row is
# built with (every function on a 64-byte boundary) and why.
#
# The gate runs the whole file: one decision of the `prefix_hash` preset for a request keyed by its prompt's
# prefix, at 8, 64 and 512 candidates (`policy_engine/prefix_hash/<path>/<n>`): the key's owner takes the
# request (`owner`), the owner is past the bounded-load rule and the fewest requests in flight take it
# (`passed_over`), and the same two under two boundary levels (`levels_owner`, `levels_passed_over`), where a
# passed owner hands the request to the owner at the shallower level. 12 single-threaded rows, a fresh seed
# per iteration, about two minutes a run, so three interleaved runs a side take about twelve minutes.
#
# Threshold (the method is described in tokenizer.toml). The identical-build spread, (max - min) / median of
# the per-run criterion medians of one build, was read twice on the build host and in two jobs on the
# hosted runner, where the gate runs.
#
#   rows                           first reading   second reading                 threshold
#   <path>/512 (4.8 - 5.3 us)      2.9 - 3.8 %     1.7 - 5.5 %                    15 %
#   <path>/64 (750 - 845 ns)       1.2 - 4.9 %     2.9 - 5.2 %, one row 45.2 %    10 %
#   <path>/8 (265 - 305 ns)        2.1 - 4.0 %     2.7 - 6.5 %, one row 41.9 %    10 %
#
# Each reading: six pinned runs of one build, read through the gate script itself: one build as both sides
# (the second side the same binary with one byte appended past its image), three interleaved runs a side,
# each from a fresh copy of the binary with a fresh criterion home, on a reserved core of a shared many-core
# build host. The script held each run until the host's one-minute load was at most 45 (`--busy-above 45`);
# the loads before the runs were 32 to 40 and 22 to 44. A build ran on the host beside the second reading's
# later runs, and its two wide rows each hold one slow run of six (1,080 ns among 740 to 770, 424 ns among
# 298 to 307): that width is the host's and not a row's, and the first reading holds neither.
#
# The hosted runner's reading: the two jobs of one pull request that ran both sides, three interleaved runs
# a side at a load of 1.1 to 3.4. A side's three runs are one build. The base side read 0.1 to 2.9 % on
# every id in both jobs. The pull request's side, by id, the first job and the second:
#
#   <path>                 /8              /64              /512
#   owner                  0.4, 3.2 %      12.2, 1.4 %      6.2, 6.7 %
#   passed_over            0.6, 3.4 %      11.5, 1.4 %      5.7, 6.2 %
#   levels_owner           0.2, 3.4 %      1.3, 2.2 %       4.99, 11.1 %
#   levels_passed_over     0.6, 3.4 %      0.5, 0.8 %       5.1, 10.5 %
#
# A row whose spread reads above 5 % on the hosted runner takes 15 %: the four 512-row ids, in an entry of
# their own. `owner/64` and `passed_over/64` read above it in the first job on one slow run of three, and
# 1.4 % in the second: that width is the run's and not a row's, as in the build host's second reading, and
# they keep 10 %, as every other row does. The width stood on the pull request's side alone, at counts two
# to four instructions apart.
#
# The threshold is the smallest multiple of 5 % that is at least twice the identical-build spread, never
# under 10 %. Every row reads 4.9 % or less in the build host's first reading and takes 10 % by it. The
# gate runs on the hosted runner, and its reading departs from that rule for the four 512-row ids: twice
# their wider job reads 12.4 to 22.2 %, which the rule would take to 15 % for two ids and to 25 % for two.
# The four take 15 % together, and the mark covers the rest: a slower id on a level count is a placement
# up to twice its threshold. The gate fails an id only when every pull-request run is slower than every
# base run, so one slow run cannot fail the job. Read as three base and three head runs, both null cases
# passed at 10 %: 0 failed, 0 suspect of 12 ids.
#
# A pull request that moves no file of this binary builds two binaries of the same bytes, which the gate
# passes without a run. Every job that runs both sides uploads bench-gate/results.json with the raw per-run
# medians.

# Count: `count = true`, as policy-engine.toml records it. Read on this file's 12 ids, one build against its
# own copy: 10 count the same in every batch after the first, and the two passed-over rows at 512 workers
# did not count steadily (12 instructions an iteration between two processes of one build, 0.02 %). They
# keep the time's verdict, which a second measurement decides where every count is within half a percent.
# Every id times a whole decision and carries `whole_pass = true`, as policy-engine.toml records it: the
# mark follows a row that read slower on a count a few instructions apart. A pull request that takes two
# instructions off a decision read `passed_over/8` and `levels_passed_over/8` 11.7 and 10.6 % slower on
# the hosted runner on 2 instructions fewer an iteration, 0.06 and 0.05 % of their counts, and every other
# id 1.1 to 7.6 % slower. On a second host the same gate read those two 1.1 and 0.8 % slower, and the same
# two sources built without the alignment read all 12 ids faster there, the four 64-row ids by 11.2 to
# 12.9 % (2026-11-18).
repeats = 3
count = true
# The count ends 2,280 s into the run. The gate step's bound is 60 minutes, which the `decision` row needs,
# and this binary's runs and its report end long before it. No count starts in the budget's last 30 s.
run_budget = 2280
filter = "^policy_engine/prefix_hash/"

# The files that feed this binary beyond the measured crate: the base side is built with them as the pull
# request has them (bench_gate.py build --sources-from), so the two binaries differ in the measured code alone.
sources = [
    "crates/policy_controller/benches/prefix_hash.rs",
    "crates/policy_controller/benches/common/mod.rs",
]

# The first gate whose pattern matches an id decides its threshold.
[[gate]]
pattern = "^policy_engine/prefix_hash/[a-z_]+/512$"
threshold = 0.15
whole_pass = true
note = "identical build 6.2 - 11.1 % on the hosted runner, each id's wider job of two; a whole decision"

[[gate]]
pattern = "^policy_engine/prefix_hash/"
threshold = 0.10
whole_pass = true
note = "identical build 1.2 - 4.9 % on the build host; a whole decision"
