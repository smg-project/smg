# Regression gate for `cargo bench -p smg --bench manual_policy_benchmark`, run by
# .github/workflows/benchmark-manual-policy.yml on pull requests through scripts/bench_gate.py.
#
# The gate runs the single-threaded selection groups of the sticky-session policy: the fast path
# (a key already placed), the slow path (a vacant key), no routing key, per worker count, and the
# cache-size sweep (16 ids, about a minute a run). `manual_policy/concurrent` runs on a thread pool
# and measures the runner's free cores; `failover` rebuilds its workers in the setup of every
# iteration and spreads 180 - 550 % between identical runs; `vs_baseline/raw_random` is 3 ns, the
# timer's spread. A push to main keeps running the whole file.
#
# Threshold (the method is described in tokenizer.toml). The identical-build spread, (max - min) /
# median of the per-run criterion medians over ten pinned runs of one build through this gate (five
# "base" and five "pull request" runs of the same binary), measured twice on a shared build host at
# a load of 250 to 480 on 192 cores: 13 - 32 % for fast_path, 13 - 21 % for no_routing_key, 16 - 54 %
# for slow_path_vacant, 8 - 48 % for cache_size, numbers that say more about that host than about
# the benchmark (the tokenizer's ids read 0.8 - 6.7 % on the same host at a lower load). Both null
# cases at a 10 % threshold passed through the overlap rule (0 failed; 3 and 1 of 20 suspect). 25 %
# is provisional: it fails the regressions that matter on this path (a 2 x slower selection) and
# holds under the noise seen; every job uploads bench-gate/results.json with the raw per-run
# medians of both sides, and the hosted runner's own spread, read from those, is the number to
# tighten this to.

repeats = 3
filter = "^manual_policy/(fast_path|slow_path_vacant|no_routing_key|cache_size)/"

[[gate]]
pattern = "^manual_policy/"
threshold = 0.25
note = "provisional: identical build 8 - 54 % on a loaded host; tighten from the runner's results.json"
