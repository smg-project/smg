# Regression gate for `cargo bench -p smg --bench radix_tree_benchmark`, run by
# .github/workflows/benchmark-radix-tree.yml on pull requests through scripts/bench_gate.py.
#
# The gate runs the single-threaded ids of the `benchmark_summary` group the push-to-main job
# prints: insert and match of the string tree and the token tree, match and store of the chain
# index, per worker count and size (72 ids, about four minutes a run on one core). The three
# `*_concurrent_*` ids run on a thread pool and measure the runner's free cores; the kv-index
# throughput sweeps and the Mooncake replays are not criterion groups and do not fit a pull
# request's runner: a push to main keeps running all of them.
#
# Threshold (the method is described in tokenizer.toml). The identical-build spread was first
# measured on a shared build host at loads of 15 to 480 (11 - 235 % and 14 - 117 % over the 72 ids,
# numbers that described the host, not the benchmark) and the gate opened at a provisional 25 %. The
# hosted runner's own null cases (the gate pull request's two runs of 2026-11-04: two builds of the
# same source, three interleaved runs a side, 72 ids, both 0 failed and 0 suspect) read, per family,
# as the median and the largest per-id spread of a side's three runs, and the largest change of
# medians between the two builds (the first run, then the second, whose runner was the noisier: one
# of its runs took 286 s against 230 s):
#
#   family          identical build (run 1 / run 2)    across builds   the tokenizer rule
#   indexer_match   3.4 - 8.7 %   /  4.3 - 10.2 %      3.8 / 9.3 %     25 %
#   indexer_store   4.4 - 11.9 %  /  9.7 - 29.6 %      10.7 / 11.7 %   60 %
#   string_match    7.3 - 9.4 %   /  8.0 - 16.0 %      4.6 / 4.4 %     35 %
#   token_match     6.4 - 17.0 %  /  9.8 - 27.5 %      8.1 / 20.2 %    55 %
#   string_insert   10.5 - 20.9 % /  21.2 - 74.7 %     9.5 / 65.2 %    150 %
#   token_insert    14.2 - 91.9 % /  26.5 - 98.3 %     14.8 / 75.2 %   200 %
#
# The rule (the smallest multiple of 5 % that is at least twice the identical-build spread and 1.5 x
# the across-build change) would loosen every family, the insert ones to no gate at all: the runner's
# spread on the insert rows is the allocator's and the machine's, not the code's. 25 % stays for every
# family; both null cases passed it through the overlap rule (an id fails only when every pull-request
# run is slower than every base run). Whether the insert rows should be gated at all, gated at the
# rule's numbers, or run with more repeats is an open decision; this header records the numbers.

#
# Placement. The workflow's benchmark job builds its binaries, the gate's pair and the summary
# run's, with every function and every hot loop on a 64-byte boundary (RUSTFLAGS:
# `-C llvm-args=-align-all-functions=6 -C llvm-args=-align-loops=64`, beside the outliner flag
# of .cargo/config.toml; LLVM's block placement aligns the loop blocks it marks hot and leaves
# cold blocks and loops entered by a hot fall-through on its 16-byte default, so a short-trip
# hot loop can still move between placement classes).
# symphony.toml records why: identical code sits in one of two speed states chosen by where its
# unchanged hot functions land modulo 64, and a pull request's code size alone moved them. Under the
# function flag (#5371; the two reads of this paragraph were measured with functions aligned only
# and predate the loop flag) this gate's null read (the same bytes twice, three interleaved runs a
# side on one core, 72 ids) read 0 failed, 0 suspect with a largest change of medians of +14.6 %,
# so the thresholds stand. An inserted regression on the path the rows run (one dependent
# multiply-add per 12 input bytes in the string tree walks, per 4 tokens in the token tree walks
# and 96 per chain-index key) is caught: 41 of 72 failed, string insert +53 to +95 %, string match
# 8 of 9 at +30 to +35 %, token insert +45 to +61 %, token match +38 to +67 %, the 10-worker
# chain-index lookups +29 to +51 %.
# Under the 25 % threshold: string_match_10w_4096c at +24.8 %, the 100-worker lookups at +10 to +12
# % and the 500-worker lookups at +2 to +3 % (their cost is the worker scoring), and the store rows
# within 6 % (allocation and generation).
# The loop flag came after the function flag, from a pull request whose token insert did main's
# work (+10 instructions per 4,096-token re-insert by differencing, the same 7-instruction compare
# loop under line tables) and read the six 1024/4096 token_insert ids +27.8 to +33.1 % on the
# hosted runner: its smaller code in front of the 21-byte compare loop had moved the loop from
# bytes 32-52 of a 64-byte line to across a line boundary, which the function flag does not govern
# (LLVM places loops on 16 bytes). With both flags the same two sources read +2.9 to +10.0 % on
# those ids (five interleaved runs a side on one core). The flag is this gate's, applied where it
# is measured: symphony.toml records that aligning loops parks both arms of its scanner in the
# slower state and hides an inserted regression there, and the other gates' regression reads were
# taken with functions aligned only.

repeats = 3
filter = "^benchmark_summary/(indexer|string|token)_(match|insert|store)_"

# The files that feed this binary beyond the measured crate: the base side is built with them as the
# pull request has them (bench_gate.py build --sources-from), so a row added here cannot move the
# gated rows through the binary's inlining (symphony.toml records the case). A new row goes to a
# bench target of its own.
sources = ["model_gateway/benches/radix_tree_benchmark.rs"]

[[gate]]
pattern = "^benchmark_summary/"
threshold = 0.25
note = "runner null cases of 2026-11-04: identical build 3 - 98 % by family (the header); 25 % kept, carried by the overlap rule"
