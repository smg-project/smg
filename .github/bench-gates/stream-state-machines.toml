# Regression gate for `cargo bench -p smg --bench stream_state_machines`, run by
# .github/workflows/benchmark-stream-state-machines.yml on pull requests through scripts/bench_gate.py.
#
# The five rows each drive one stream of 300 single-token chunks and a completion through a stream state
# machine (a chat under the legacy parsers, the same chat under a Symphony table, a completion, a generate
# and a Messages stream) over a scripted engine stream decoded by the client's own codec, no socket under it;
# criterion's warmed-up sample medians, in nanoseconds per chunk.
#
# Threshold. tokenizer.toml describes the method: the smallest multiple of 5 % that is at least twice the
# identical-build spread, (max - min) / median over every run of a side. The spread here was measured three
# times (ten pinned interleaved runs of one build, five a side of the gate, on a busy shared build host).
# Quiet, 2.2 - 3.6 % over every run (chat_legacy 3.6 %, chat_symphony 3.0 %, completion 2.2 %, generate
# 2.8 %, messages 2.4 %). Busy, 8.3 - 17.1 % and 7.5 - 15.2 % over every run, where a single run per side
# sat 10 - 17 % above its four siblings (261 - 306 us on chat_legacy) while those four stayed within
# 0.5 - 7.6 % of each other and the two sides' medians within 3 %. This gate deviates from the method in
# one point: the busy spread is taken over the four closest runs of five (7.6 %), not over every run,
# because a lone spike is what the gate's overlap rule is for (an id fails only when every pull-request
# run is worse than every base run) and a threshold covering it (35 %) would let a real regression through.
# The rule on that trimmed spread gives 20 % (twice 7.6 % is 15.2 %), which is also more than five times
# the quiet spread. The null case through this gate passed all three times.

repeats = 3
filter = "^stream_state_machines/"

[[gate]]
pattern = "^stream_state_machines/"
threshold = 0.20
note = "identical build 2.2 - 3.6 % quiet, 0.5 - 7.6 % over the four closest runs of five busy (trimmed)"
