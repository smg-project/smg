version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    # The Dockerfiles live in docker/; their base images are pinned by digest
    # and this entry keeps the digests current.
    directory: /docker
    schedule:
      interval: weekly
