name: Release SMG+TokenSpeed Docker Image

run-name: >-
  SMG+TokenSpeed |
  base=${{ inputs.base_image_ref || 'latest nightly carrier' }} |
  engine=${{ inputs.tokenspeed_commit || 'latest' }} |
  smg=${{ github.event_name == 'pull_request' && 'main' || inputs.smg_commit || 'v1.12.0' }} |
  ${{ github.event_name == 'pull_request' && 'dry-run |' || '' }}
  by @${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - bindings/python/pyproject.toml
  pull_request:
    branches: [main]
    paths:
      - 'docker/engine.Dockerfile'
      - '.github/workflows/_build-engine-image.yml'
      - '.github/workflows/release-*-docker.yml'
      - 'scripts/installation/**'
  workflow_dispatch:
    inputs:
      base_image_ref:
        description: 'Base image override (empty = latest dated TokenSpeed nightly carrier)'
        required: false
        type: string
      tokenspeed_repo:
        description: 'TokenSpeed repo URL (empty = use engine from base image)'
        required: false
        type: string
      tokenspeed_commit:
        description: 'TokenSpeed commit/ref ("latest" for HEAD)'
        required: false
        default: 'latest'
        type: string
      smg_repo:
        description: 'SMG repo URL'
        required: false
        default: 'https://github.com/smg-project/smg'
        type: string
      smg_commit:
        description: 'SMG commit/ref ("latest" for HEAD)'
        required: false
        default: 'v1.12.0'
        type: string
      tag:
        description: 'Override image tag (default includes the SMG and TokenSpeed nightly versions)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    uses: ./.github/workflows/_build-engine-image.yml
    with:
      engine: tokenspeed
      base_image_ref: ${{ inputs.base_image_ref }}
      engine_repo: ${{ inputs.tokenspeed_repo }}
      engine_commit: ${{ inputs.tokenspeed_commit || 'latest' }}
      smg_repo: ${{ inputs.smg_repo || 'https://github.com/smg-project/smg' }}
      smg_commit: ${{ github.event_name == 'pull_request' && 'main' || inputs.smg_commit || 'v1.12.0' }}
      tag: ${{ inputs.tag }}
      dry_run: ${{ github.event_name == 'pull_request' }}
    secrets: inherit
