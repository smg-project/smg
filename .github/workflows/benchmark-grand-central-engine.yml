name: Benchmark - Grand Central Engine

# Both path lists are one list in one sorted order (a `!` line stays under the
# entry it narrows), so a row added by a pull request is one line in each.
on:
  push:
    branches: [ main ]
    paths:
      - '.github/bench-gates/grand-central-engine-affinity.toml'
      - '.github/bench-gates/grand-central-engine-bucket.toml'
      - '.github/bench-gates/grand-central-engine-power-of-two.toml'
      - '.github/bench-gates/grand-central-engine-prefix-hash.toml'
      - '.github/bench-gates/grand-central-engine.toml'
      - '.github/workflows/benchmark-grand-central-engine.yml'
      - 'crates/grand_central/Cargo.toml'
      - 'crates/grand_central/benches/affinity.rs'
      - 'crates/grand_central/benches/bucket.rs'
      - 'crates/grand_central/benches/common/column.rs'
      - 'crates/grand_central/benches/common/mod.rs'
      - 'crates/grand_central/benches/common/placed.rs'
      - 'crates/grand_central/benches/common/preset.rs'
      - 'crates/grand_central/benches/decision.rs'
      - 'crates/grand_central/benches/power_of_two.rs'
      - 'crates/grand_central/benches/prefix_hash.rs'
      - 'crates/grand_central/src/**'
      - '!crates/grand_central/src/**/tests/**'
      - '!crates/grand_central/src/**/tests.rs'
      - '!crates/grand_central/src/**/*_test.rs'
      - 'scripts/bench_gate.py'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/bench-gates/grand-central-engine-affinity.toml'
      - '.github/bench-gates/grand-central-engine-bucket.toml'
      - '.github/bench-gates/grand-central-engine-power-of-two.toml'
      - '.github/bench-gates/grand-central-engine-prefix-hash.toml'
      - '.github/bench-gates/grand-central-engine.toml'
      - '.github/workflows/benchmark-grand-central-engine.yml'
      - 'crates/grand_central/Cargo.toml'
      - 'crates/grand_central/benches/affinity.rs'
      - 'crates/grand_central/benches/bucket.rs'
      - 'crates/grand_central/benches/common/column.rs'
      - 'crates/grand_central/benches/common/mod.rs'
      - 'crates/grand_central/benches/common/placed.rs'
      - 'crates/grand_central/benches/common/preset.rs'
      - 'crates/grand_central/benches/decision.rs'
      - 'crates/grand_central/benches/power_of_two.rs'
      - 'crates/grand_central/benches/prefix_hash.rs'
      - 'crates/grand_central/src/**'
      - '!crates/grand_central/src/**/tests/**'
      - '!crates/grand_central/src/**/tests.rs'
      - '!crates/grand_central/src/**/*_test.rs'
      - 'scripts/bench_gate.py'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-grand-central-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Grand Central Engine (${{ matrix.bench }})
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One row a bench binary, with its own gate file, its own runner and its
      # own bound: a failure or a lost runner on one row never takes another
      # row's verdict. One path list starts every row: every binary is built
      # from the crate's sources.
      fail-fast: false
      matrix:
        include:
          - bench: decision
            gates: grand-central-engine.toml
            artifact: grand-central-engine-results
          - bench: power_of_two
            gates: grand-central-engine-power-of-two.toml
            artifact: grand-central-engine-power-of-two-results
          - bench: affinity
            gates: grand-central-engine-affinity.toml
            artifact: grand-central-engine-affinity-results
          - bench: prefix_hash
            gates: grand-central-engine-prefix-hash.toml
            artifact: grand-central-engine-prefix-hash-results
          - bench: bucket
            gates: grand-central-engine-bucket.toml
            artifact: grand-central-engine-bucket-results
    env:
      BENCH: ${{ matrix.bench }}
      GATES: ${{ matrix.gates }}
      # Every bench binary of this job, the gate's pair and the summary run's,
      # places every function on a 64-byte boundary, so a pull request's code
      # size does not move the unchanged hot functions into another placement
      # class (the two speed states of identical code described in
      # .github/bench-gates/grand-central-engine.toml). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in the row's gate file under .github/bench-gates; the job fails on a gated
      # regression.
      # A push to main keeps the single summary run.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py ".github/bench-gates/$GATES" "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates ".github/bench-gates/$GATES" \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg-grand-central --bench "$BENCH" --no-run

      - name: Build the base branch's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/$GATES" \
            --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
            cargo bench -p smg-grand-central --bench "$BENCH" --no-run
          git checkout --quiet "$head"

      # The gate counts an id that fails by time, on both binaries under valgrind's
      # callgrind, before the verdict (`count` in the row's gate file): the same
      # instruction count on both sides, with the measured function moved and the
      # change within twice the threshold, is a placement, reported and not failed.
      # Without the tool the count is not read and the id fails as the time read
      # it, so this step never fails the job.
      - name: Install valgrind
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        continue-on-error: true
        run: |
          bash scripts/ci_apt_install.sh sudo -y --no-install-recommends valgrind

      # The bound is the `decision` row's need. Its 39 ids take about 37 minutes of
      # rounds, three a side, and the count of an id that fails by the clock runs
      # behind them. Under 40 minutes that count had no room, and a runner a few
      # per cent slow would run past the bound. Each row's gate file ends its
      # count below this bound (`run_budget`).
      - name: Run the benchmark gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates ".github/bench-gates/$GATES" \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd crates/grand_central --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench -p smg-grand-central --bench "$BENCH" 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            target/criterion/engine*/
            target/criterion/policy_affinity*/
            benchmark_output.txt
            bench-gate/
          retention-days: 30

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "## Grand Central Engine Benchmark ($BENCH)" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 benchmark_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
