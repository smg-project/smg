name: CI Prepared GPU Runner Image

# Nightly checks image availability; unchanged recipes do not trigger rebuilds.
on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - 'docker/ci-gpu-runner.Dockerfile'
      - 'scripts/ci_retry.sh'
      - 'scripts/ci_apt_mirror.sh'
      - 'scripts/ci_setup_python_venv.sh'
      - 'scripts/ci_prepared_backend_env.sh'
      - 'scripts/ci_ensure_python_headers.sh'
      - 'scripts/ci_install_vllm.sh'
      - 'scripts/ci_install_sglang.sh'
      - 'scripts/ci_install_flashinfer_jit_cache.sh'
      - 'scripts/ci_gpu_runner_image.py'
      - 'scripts/tests/test_ci_gpu_runner_image.py'
      - '.github/workflows/ci-gpu-runner-image.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build a separate run-tagged candidate without layer cache'
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-gpu-runner-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'smg-project/smg'
    runs-on: ${{ vars.SMG_RUNNER_DOCKER || 'cpu-e5' }}
    timeout-minutes: 120
    env:
      BASE_IMAGE: ${{ vars.SMG_CI_GPU_RUNNER_BASE_IMAGE }}
      UV_CUDA_DRIVER_VERSION: ${{ vars.SMG_CI_GPU_RUNNER_CUDA_DRIVER_VERSION }}
      IMAGE_REPOSITORY: ${{ vars.SMG_CI_GPU_RUNNER_IMAGE_REPOSITORY || format('ghcr.io/{0}/smg', github.repository_owner) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test image identity and availability handling
        run: python3 -m unittest scripts.tests.test_ci_gpu_runner_image

      - name: Resolve prepared image
        id: resolve
        env:
          FORCE_REBUILD: ${{ inputs.force == true }}
        run: |
          force_run=""
          if [ "$FORCE_REBUILD" = true ]; then force_run="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"; fi
          tag="$(python3 scripts/ci_gpu_runner_image.py tag \
            --base-image "$BASE_IMAGE" --cuda-driver-version "$UV_CUDA_DRIVER_VERSION" --force-run "$force_run")"
          if [[ ! "$IMAGE_REPOSITORY" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]]; then
            echo 'SMG_CI_GPU_RUNNER_IMAGE_REPOSITORY must be an untagged GHCR repository' >&2
            exit 1
          fi
          echo "image=${IMAGE_REPOSITORY}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for an existing image
        id: exists
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          # Only a missing manifest means rebuild. Auth/network failures fail
          # this step rather than spending hours rebuilding an unusable target.
          exists="$(python3 scripts/ci_gpu_runner_image.py exists "$IMAGE")"
          echo "exists=${exists}" >> "$GITHUB_OUTPUT"
          echo "**Prepared image:** \`${IMAGE}\`; exists=${exists}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build image on CPU
        id: build
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci-gpu-runner.Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          no-cache: ${{ inputs.force == true }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            UV_CUDA_DRIVER_VERSION=${{ env.UV_CUDA_DRIVER_VERSION }}
          tags: ${{ steps.resolve.outputs.image }}

      - name: Validate both prepared environments as the runner user
        if: steps.exists.outputs.exists != 'true' || inputs.force
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          container="smg-ci-env-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          # Expand the probe's variables inside the container.
          # shellcheck disable=SC2016
          timeout --kill-after=30s 5m docker run --rm --name "$container" \
            --entrypoint bash -e SMG_BUILD_PREPARED_ENV=1 "$IMAGE" -euo pipefail -c '
            test "$(id -u)" -ne 0
            source /opt/smg-ci/scripts/ci_prepared_backend_env.sh
            for backend in vllm sglang; do
              venv="/opt/smg-ci/${backend}/.venv"
              smg_prepared_env_matches "$backend" "$venv"
              "$venv/bin/python" -c "import torch; assert torch.version.cuda is not None; print(torch.__version__, torch.version.cuda)"
              touch "$venv/.write-canary"
              rm "$venv/.write-canary"
            done
            test ! -x /usr/local/cuda/bin/nvcc
            if command -v nvcc >/dev/null; then
              echo "Unexpected nvcc on the default PATH" >&2
              exit 1
            fi
            test -x /usr/local/cuda-13.0/bin/nvcc
          '

      - name: Publish validated image
        if: steps.exists.outputs.exists != 'true' || inputs.force
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          bash scripts/ci_retry.sh 3 30 docker push "$IMAGE"
          echo "**Published:** \`${IMAGE}\` (CPU checks passed; GPU canary required before rollout)" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up the local built image
        if: always() && steps.build.outcome == 'success'
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: docker rmi "$IMAGE" || true
