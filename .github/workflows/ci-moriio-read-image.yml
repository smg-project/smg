name: CI MoRI READ Candidate Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/moriio-read/Dockerfile.rocm'
      - 'docker/moriio-read/bake.hcl'
      - 'docker/moriio-read/upstream-bake.hcl'
      - 'docker/moriio-read/source.git_archival.txt'
      - 'scripts/ci_moriio_image_publication.py'
      - '.github/workflows/ci-moriio-read-image.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docker/moriio-read/**'
      - 'scripts/ci_moriio_image_publication.py'
      - 'scripts/tests/test_ci_moriio_image_publication.py'
      - '.github/workflows/ci-moriio-read-image.yml'

permissions:
  contents: read

concurrency:
  group: ci-moriio-read-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  recipe-check:
    if: >-
      github.repository == 'smg-project/smg' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check exact recipe without Docker, credentials or engine imports
        run: python3 -I -B scripts/ci_moriio_image_publication.py --check
      - name: Check publisher contracts without Docker or network
        run: python3 -I -B -m unittest discover -s scripts/tests -p test_ci_moriio_image_publication.py -v

  publish-candidate:
    needs: [recipe-check]
    if: github.repository == 'smg-project/smg' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.SMG_RUNNER_DOCKER || 'cpu-e5' }}
    # Source checkouts precede a single 12h operation plus 60s owned cleanup.
    timeout-minutes: 735
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout actual main source
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Checkout immutable public engine
        uses: actions/checkout@v7
        timeout-minutes: 5
        with:
          repository: chunfangamd/vllm
          ref: f9e4ca9653da9bd731c8b5bf83483cb2083c8dc9
          path: engine-source
          persist-credentials: false
      - name: Set up Docker Buildx client
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Login to repository container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build both full targets and publish a new candidate
        env:
          MORIIO_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -I -B scripts/ci_moriio_image_publication.py --publish \
            --engine-checkout "$GITHUB_WORKSPACE/engine-source" \
            --output "$RUNNER_TEMP/moriio-publication-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve exact candidate and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moriio-read-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/moriio-publication-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ runner.temp }}/moriio-publication-${{ github.run_id }}-${{ github.run_attempt }}/*.log
          if-no-files-found: error
          retention-days: 14
