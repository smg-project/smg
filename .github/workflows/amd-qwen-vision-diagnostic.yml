name: AMD Qwen vision diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: amd-qwen-vision-e915
  cancel-in-progress: false

jobs:
  qwen-vision-diagnostic:
    name: qwen-vision-diagnostic
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
    timeout-minutes: 20
    container:
      image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models
    env:
      E2E_ENGINE: sglang
      E2E_RUNTIME: sglang
      E2E_GPU_TIER: '1'
      HF_HOME: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      SHOW_WORKER_LOGS: '0'
      SHOW_ROUTER_LOGS: '0'
      PYTHONPATH: e2e_test
      PYTEST_ADDOPTS: ''
    steps:
      - uses: actions/checkout@v7

      - name: Mark owned processes
        run: echo "E2E_JOB_MARKER=qwen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"

      - name: Verify and reuse fixed producer artifacts
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/amd-diagnostics/reuse_foundation.py

      - name: Install the original SGLang test dependencies once
        timeout-minutes: 3
        run: |
          python3 -m pip install --retries 0 -e crates/grpc_client/python/ -e grpc_servicer/
          python3 -m pip uninstall -y smg
          python3 -m pip install --retries 0 wheel/*.whl e2e_test/ clients/python/
          python3 -m pip install --retries 0 'grpcio-health-checking==1.81.*' 'grpcio-reflection==1.81.*'
          python3 -c "import torch, sglang, mooncake, smg_grpc_servicer; assert torch.version.hip; assert sglang.__version__ == '0.5.21'; print('sglang', sglang.__version__, 'HIP', torch.version.hip)"
          python3 -m pip freeze > diagnostic-results/pip-freeze.txt

      - name: Compare twelve requests without retries
        timeout-minutes: 15
        run: |
          remaining=$((QWEN_DIAG_DEADLINE - $(date +%s)))
          test "$remaining" -gt 0
          timeout --signal=INT --kill-after=15s "${remaining}s" \
            python3 -m pytest .github/amd-diagnostics/test_qwen_vision_routes.py \
            --confcutdir=.github/amd-diagnostics -o addopts='' -p no:rerunfailures \
            -s -vv --junitxml=diagnostic-results/diagnostic.xml

      - name: Reap only processes from this job
        if: always() && env.E2E_JOB_MARKER != ''
        timeout-minutes: 2
        run: python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER"

      - name: Upload diagnostic evidence including failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: amd-qwen-vision-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostic-results/
          if-no-files-found: error
          retention-days: 7
