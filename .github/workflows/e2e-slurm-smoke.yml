name: E2E Slurm Smoke

# The gateway against a real one-node Slurm in a container: a job is
# discovered, replaced when requeued and removed when cancelled. A
# compatibility smoke of Slurm's commands, not a required check: the Slurm
# daemons and the scheduler's timing can fail for reasons that are not the
# gateway's. Discovery's own rules are covered by the CLI-contract lane in
# e2e-kind-discovery.yml.
on:
  pull_request:
    paths:
      - model_gateway/src/service_discovery/slurm.rs
      - e2e_test/slurm_smoke/**
      - .github/workflows/e2e-slurm-smoke.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  slurm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          sccache-version: 'v0.10.0'

      - name: Build smg and mock-worker
        run: |
          source "$HOME/.cargo/env"
          cargo build -p smg -p mock-worker

      - name: Build the Slurm image
        run: |
          stage=$(mktemp -d)
          cp e2e_test/slurm_smoke/Dockerfile e2e_test/slurm_smoke/slurm.conf \
            e2e_test/slurm_smoke/cgroup.conf e2e_test/slurm_smoke/entrypoint.sh \
            target/debug/smg target/debug/mock-worker "$stage"
          docker build -t smg-slurm-smoke:e2e "$stage"

      - name: Run the real-Slurm smoke
        timeout-minutes: 15
        run: |
          pip install pytest requests
          SMG_SLURM_SMOKE=1 SMG_SLURM_SMOKE_IMAGE=smg-slurm-smoke:e2e \
            SMG_SLURM_SMOKE_LOGS="$RUNNER_TEMP/slurm-smoke-logs" \
            pytest e2e_test/slurm_smoke --confcutdir e2e_test/slurm_smoke -v

      - name: Upload the Slurm, gateway and job logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slurm-smoke-logs
          path: ${{ runner.temp }}/slurm-smoke-logs
          if-no-files-found: warn
