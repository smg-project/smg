name: Codex Code Review

# Codex (OpenAI) reviews pull requests beside the Claude review: a full review when a PR
# opens, an incremental one on every push, a full one on `@codex review` in a PR comment, a
# reply when a developer answers in one of its threads, and a verdict on each finding the
# Claude reviewer posts. After Codex has posted, Claude grades Codex's findings in the same run.
#
# Trust boundary. No key reaches any job: the runner pod's key-proxy sidecar
# (scripts/k8s-runner-resources/runner-values-cpu.yaml) holds both keys, and the reviewers
# talk to it on localhost with placeholder keys, so a pull request that edits this file can
# at most spend. A pull request from a fork is never reviewed and its commands are ignored;
# the author or the commenter must have write access (scripts/codex_review_post.py gates
# every run, and the Codex action checks the actor itself). The PR events use
# `pull_request`, not `pull_request_target`: Claude's App-token exchange rejects the OIDC
# token of a `pull_request_target` run, and the comment events run from `main` anyway.
# Codex runs in a read-only sandbox in a job with read permissions; a second job posts its
# result as the SMG Codex Review GitHub App, with a one-hour installation token the sidecar
# mints from the App key it holds once the job has proved itself with its GitHub OIDC token;
# the codex and post jobs' own tokens cannot write. The review-comment events
# (`pull_request_review`, `pull_request_review_comment`) run the pull request's own copy of
# this file, so a branch older than a change here keeps the old behaviour for its thread
# replies and verdicts until it takes `main`.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '*.md'
      - '*.lock'
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

# One review at a time per PR, the newest push winning; one verification pass per PR, the
# last of Claude's burst of comments winning after the settle wait. Events this workflow
# ignores (a plain comment, another reviewer's review) get a group of their own, so they
# cancel nothing; thread replies never cancel each other.
concurrency:
  group: >-
    codex-${{
      github.event_name == 'pull_request_review_comment' && format('reply-{0}', github.event.comment.id)
      || github.event_name == 'pull_request_review' && github.event.review.user.login == 'claude[bot]' && format('verify-{0}', github.event.pull_request.number)
      || github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex review') && format('review-{0}', github.event.issue.number)
      || github.event_name == 'pull_request' && format('review-{0}', github.event.pull_request.number)
      || format('noop-{0}', github.run_id)
    }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

env:
  CODEX_MODEL: gpt-6-astra
  CODEX_EFFORT: xhigh
  CODEX_VERSION: '0.167.0'
  CODEX_OTHER_BOT: claude[bot]
  CODEX_BOT: smg-codex-review[bot]  # the GitHub App Codex posts as; scripts/codex_review_post.py agrees
  AI_KEY_PROXY: http://127.0.0.1:8787
  OPENAI_PLACEHOLDER_KEY: sk-placeholder-the-sidecar-holds-the-key
  ANTHROPIC_PLACEHOLDER_KEY: sk-ant-placeholder-the-sidecar-holds-the-key

jobs:
  # The status note, posted the moment a review run is admitted so the pull request shows what is
  # happening while Codex works; the post job turns it into the outcome, and finish-status into
  # a failure notice. Thread replies and verdict passes get none.
  announce:
    name: Codex review status
    if: >-
      github.repository == 'smg-project/smg'
      && github.actor != 'dependabot[bot]'
      && (
        (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && github.event.comment.user.type != 'Bot'
            && contains(github.event.comment.body, '@codex review'))
      )
    runs-on: ${{ vars.SMG_RUNNER_REVIEW || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: ./.github/actions/codex-posting-token
        id: app-token

      - name: Say that the review is under way
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/codex_review_post.py announce --state reviewing

  codex:
    name: Codex review
    # A first filter from the event alone; the context step applies the full gate (fork,
    # write access, command) with the API before anything of the PR is checked out.
    if: >-
      github.repository == 'smg-project/smg'
      && github.actor != 'dependabot[bot]'
      && (
        (github.event_name == 'pull_request'
            && github.event.pull_request.head.repo.full_name == github.repository)
        || (github.event_name == 'issue_comment'
            && github.event.issue.pull_request
            && github.event.comment.user.type != 'Bot'
            && contains(github.event.comment.body, '@codex review'))
        || (github.event_name == 'pull_request_review_comment'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.comment.user.type != 'Bot')
        || (github.event_name == 'pull_request_review'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.review.user.login == 'claude[bot]')
      )
    runs-on: ${{ vars.SMG_RUNNER_REVIEW || 'k8s-runner-cpu' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.context.outputs.skip }}
      mode: ${{ steps.context.outputs.mode }}
      pr: ${{ steps.context.outputs.pr }}
    steps:
      - name: Let Claude's burst of comments settle
        if: github.event_name == 'pull_request_review'
        run: sleep 120

      # The default branch: this workflow's scripts, prompts and schemas. The pull request's
      # own tree goes into ./pr below, read by Codex, executed by nothing.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Gate the run and resolve what it does
        id: context
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/codex_review_post.py context --out-dir .codex-review

      - name: Check out the pull request head into ./pr and write the diffs
        if: steps.context.outputs.skip != 'true'
        run: |
          ctx=.codex-review/context.json
          field() { python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2]) or '')" "$ctx" "$1"; }
          pr=$(field pr); head=$(field head_sha); base=$(field base_sha); before=$(field before_sha)
          git fetch --no-tags --quiet origin "refs/pull/${pr}/head:refs/remotes/pr/${pr}" \
            "refs/heads/$(field base_ref):refs/remotes/origin/$(field base_ref)"
          git worktree add --quiet --detach pr "${head}"
          mv .codex-review pr/.codex-review
          git diff --no-color "${base}...${head}" > pr/.codex-review/pr.diff
          if [ -n "${before}" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git diff --no-color "${before}..${head}" > pr/.codex-review/push.diff
          fi
          wc -l pr/.codex-review/*.diff

      - name: Assemble the review skills
        if: steps.context.outputs.skip != 'true'
        run: |
          git clone --quiet --depth 1 https://github.com/smg-project/smg-dev-guide.git \
            "$RUNNER_TEMP/smg-dev-guide"
          git clone --quiet --depth 1 --filter=blob:none --sparse \
            https://github.com/anthropics/claude-plugins-official.git "$RUNNER_TEMP/claude-plugins-official"
          git -C "$RUNNER_TEMP/claude-plugins-official" sparse-checkout set plugins/pr-review-toolkit
          python scripts/codex_review_skills.py \
            --target "$HOME/.agents/skills" \
            --guide "$RUNNER_TEMP/smg-dev-guide" \
            --agents "$RUNNER_TEMP/claude-plugins-official/plugins/pr-review-toolkit/agents"
          # The guide's skills call their scripts through this variable.
          echo "CLAUDE_PLUGIN_ROOT=$RUNNER_TEMP/smg-dev-guide" >> "$GITHUB_ENV"

      # The action's drop-sudo strategy removes the runner's sudo with setfacl, which the
      # runner image lacks; install it while sudo is still available (one short apt call).
      - name: Install the acl package drop-sudo needs
        if: steps.context.outputs.skip != 'true'
        run: |
          if ! command -v setfacl >/dev/null; then
            sudo -n apt-get update -qq
            sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends acl
          fi
          command -v setfacl

      # A placeholder key: the action's local proxy forwards to the pod's key-proxy sidecar,
      # which puts the real key on the request. No key is in the job environment.
      - name: Run Codex
        if: steps.context.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ env.OPENAI_PLACEHOLDER_KEY }}
          responses-api-endpoint: ${{ env.AI_KEY_PROXY }}/openai/v1/responses
          prompt-file: .github/codex/${{ steps.context.outputs.mode }}-prompt.md
          output-schema-file: .github/codex/${{ steps.context.outputs.mode }}-schema.json
          output-file: pr/.codex-review/output.json
          working-directory: pr
          model: ${{ env.CODEX_MODEL }}
          effort: ${{ env.CODEX_EFFORT }}
          codex-version: ${{ env.CODEX_VERSION }}
          permission-profile: ':read-only'
          allow-bot-users: claude[bot]

      - name: Keep the run's inputs and output
        if: always() && steps.context.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-review-${{ github.run_id }}
          path: pr/.codex-review/
          include-hidden-files: true  # the directory is dot-prefixed; v4 skips those by default
          retention-days: 7

  post:
    name: Post Codex review
    needs: codex
    if: needs.codex.result == 'success' && needs.codex.outputs.skip != 'true'
    runs-on: ${{ vars.SMG_RUNNER_REVIEW || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # the job's OIDC token is how it proves itself to the sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v8
        with:
          name: codex-review-${{ github.run_id }}
          path: .codex-review

      # The posting token is the Codex App's, minted by the runner pod's sidecar for this job's
      # GitHub OIDC token (.github/actions/codex-posting-token). It lives an hour and is masked.
      - uses: ./.github/actions/codex-posting-token
        id: app-token

      - name: Post to the pull request
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/codex_review_post.py post --dir .codex-review

  finish-status:
    name: Codex review status (failed)
    needs: codex
    if: always() && needs.codex.result == 'failure' && needs.codex.outputs.mode == 'review'
    runs-on: ${{ vars.SMG_RUNNER_REVIEW || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: ./.github/actions/codex-posting-token
        id: app-token

      - name: Say that the review failed
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python scripts/codex_review_post.py announce --state failed

  # Claude grades Codex's findings here, right after the posting, rather than on the
  # pull_request_review event the App-posted review raises: one pass per review, no extra run.
  verify-by-claude:
    name: Claude verifies Codex findings
    needs: [codex, post]
    if: needs.post.result == 'success' && needs.codex.outputs.mode == 'review'
    runs-on: ${{ vars.SMG_RUNNER_REVIEW || 'k8s-runner-cpu' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: codex-review-${{ github.run_id }}
          path: .codex-review

      - name: Check out the pull request head
        run: |
          pr=${{ needs.codex.outputs.pr }}
          head=$(python3 -c "import json; print(json.load(open('.codex-review/context.json'))['head_sha'])")
          git fetch --no-tags --quiet origin "refs/pull/${pr}/head:refs/remotes/pr/${pr}"
          git checkout --quiet --detach "${head}"

      - name: Install gh CLI
        uses: ./.github/actions/setup-gh

      - uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ env.AI_KEY_PROXY }}/anthropic
        with:
          anthropic_api_key: ${{ env.ANTHROPIC_PLACEHOLDER_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.codex.outputs.pr }}
            The Codex reviewer (user ${{ env.CODEX_BOT }}) posted findings on this pull
            request. Grade each one against the code and answer in its thread.

            1. List the review comments:
                 gh api repos/${{ github.repository }}/pulls/${{ needs.codex.outputs.pr }}/comments --paginate \
                   --jq '.[] | {id, in_reply_to_id, user: .user.login, path, line, body}'
               A target is a comment by ${{ env.CODEX_BOT }} whose body contains
               "<!-- codex-review -->" and whose in_reply_to_id is null, and for which no
               reply (a comment whose in_reply_to_id is the target's id) contains
               "<!-- claude-verdict -->".
            2. For each target, read the file at HEAD around the line and decide:
               agree (the defect is real and described correctly), disagree (the code does
               not have the defect, or the finding misreads it), or unsure (the code alone
               cannot settle it).
            3. Reply once per target, in its thread:
                 gh api repos/${{ github.repository }}/pulls/${{ needs.codex.outputs.pr }}/comments/<id>/replies \
                   -f body="$BODY"
               where $BODY is the line "<!-- claude-verdict -->", then one of
               "🤝 Agree: ...", "⚠️ Disagree: ..." or "❓ Unsure: ..." with at most two
               sentences of evidence and a line reference.
            Never reply to a reply, never grade a target twice, never post anything else.
            When there are no targets, do nothing.
          claude_args: |
            --model claude-opus-5-5
            --effort xhigh
            --max-turns 30
            --allowedTools "Read,Glob,Grep,Bash"
