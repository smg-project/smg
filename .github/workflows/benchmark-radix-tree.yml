name: Benchmark - Radix Tree

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-radix-tree.yml'
      - '.github/bench-gates/radix-tree.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/radix_tree_benchmark.rs'
      - 'crates/kv_index/**'
      - '!crates/kv_index/**/tests/**'
      - '!crates/kv_index/**/*_test.rs'
      - '!crates/kv_index/**/test_*.rs'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-radix-tree.yml'
      - '.github/bench-gates/radix-tree.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/radix_tree_benchmark.rs'
      - 'crates/kv_index/**'
      - '!crates/kv_index/**/tests/**'
      - '!crates/kv_index/**/*_test.rs'
      - '!crates/kv_index/**/test_*.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-radix-tree-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Radix Tree (Cache-Aware Routing)
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    # CPU-only criterion/throughput benchmarks of the kv-index radix tree —
    # no GPU needed, so it runs on the CPU runner pool rather than competing
    # for GPU runners.
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    env:
      # Every bench binary of this job, the gate's pair and the summary run's,
      # places every function and every hot loop on a 64-byte boundary, so a pull
      # request's code size does not move the unchanged hot functions, or the hot
      # loops inside them, into another placement class (the two speed states of
      # identical code described in .github/bench-gates/radix-tree.toml; the loop
      # flag is this gate's, measured there). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6 -C llvm-args=-align-loops=64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in .github/bench-gates/radix-tree.toml; the job fails on a gated regression.
      # A push to main keeps the single summary run and the throughput sweeps.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py .github/bench-gates/radix-tree.toml "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates .github/bench-gates/radix-tree.toml \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg --bench radix_tree_benchmark --no-run

      - name: Build the base branch's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/radix-tree.toml" \
            --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
            cargo bench -p smg --bench radix_tree_benchmark --no-run
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates .github/bench-gates/radix-tree.toml \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd model_gateway --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run criterion benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 90
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench --bench radix_tree_benchmark -- benchmark_summary 2>&1 | tee benchmark_output.txt

      - name: Run throughput benchmark (synthetic)
        # Heavy throughput sweep OOM-kills the CPU runner on PRs; run on main/nightly only.
        if: github.event_name != 'pull_request'
        timeout-minutes: 30
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench -p kv-index --bench throughput_bench -- \
            --num-sessions 200000 \
            --num-workers 256 \
            --sweep-min-ms 10 \
            --sweep-steps 20 2>&1 | tee throughput_output.txt

      - name: Download Mooncake traces
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/traces"
          for trace in conversation_trace synthetic_trace toolagent_trace; do
            curl -sL "https://raw.githubusercontent.com/kvcache-ai/Mooncake/main/FAST25-release/traces/${trace}.jsonl" \
              -o "$GITHUB_WORKSPACE/traces/${trace}.jsonl"
            echo "Downloaded ${trace}.jsonl ($(wc -l < "$GITHUB_WORKSPACE/traces/${trace}.jsonl") requests)"
          done

      - name: Run throughput benchmark (Mooncake traces)
        if: github.event_name != 'pull_request'
        timeout-minutes: 30
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          for trace in conversation_trace synthetic_trace toolagent_trace; do
            echo "=== ${trace} ==="
            cargo bench -p kv-index --bench throughput_bench -- \
              --trace-path "$GITHUB_WORKSPACE/traces/${trace}.jsonl" \
              --trace-duplication-factor 20 \
              --num-workers 256 \
              --sweep-min-ms 10 \
              --sweep-steps 20 2>&1 | tee -a mooncake_output.txt
            echo "" >> mooncake_output.txt
          done

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: radix-tree-results-${{ github.sha }}
          path: |
            target/criterion/benchmark_summary/
            benchmark_output.txt
            throughput_output.txt
            mooncake_output.txt
            bench-gate/
          retention-days: 30

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "## Radix Tree Benchmark (Cache-Aware Routing)" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 benchmark_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Throughput Benchmark — Synthetic (Block ops/sec)" >> $GITHUB_STEP_SUMMARY
          if [ -f throughput_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 throughput_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Throughput Benchmark — Mooncake Traces (Block ops/sec)" >> $GITHUB_STEP_SUMMARY
          if [ -f mooncake_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 mooncake_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
