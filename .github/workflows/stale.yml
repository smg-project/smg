name: 'Close stale PRs'

on:
  schedule:
    # Daily at 1:30 AM UTC
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  close-stale-prs:
    if: github.repository == 'smg-project/smg'
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          operations-per-run: 500
          exempt-draft-pr: true

          # Disable issue processing
          days-before-issue-stale: -1
          days-before-issue-close: -1

          # PR staleness
          days-before-pr-stale: 14
          days-before-pr-close: 16
          stale-pr-label: 'stale'

          stale-pr-message: >
            This pull request has been automatically marked as stale because it
            has not had any activity within 14 days. It will be automatically
            closed if no further activity occurs within 16 days. Leave a comment
            if you feel this pull request should remain open. Thank you!
          close-pr-message: >
            This pull request has been automatically closed due to inactivity.
            Please feel free to reopen if you intend to continue working on it.
            Thank you!
