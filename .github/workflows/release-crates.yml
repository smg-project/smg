name: Publish Crates

permissions:
  contents: read

# Published only on a maintainer's dispatch against a release tag or branch
# (scripts/release/README.md): no push publishes, and a release candidate (a ref named -rc.) is
# refused: candidates never reach crates.io.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tier 1: Crates with no internal dependencies
  tier1:
    # A candidate never reaches crates.io: its dispatch is a no-op (every tier needs this one), and the first step says
    # why when the job is reached anyway.
    if: ${{ !contains(github.ref_name, '-rc.') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: openai-protocol
            path: crates/protocols
          - crate: reasoning-parser
            path: crates/reasoning_parser
          - crate: kv-index
            path: crates/kv_index
          - crate: data-connector
            path: crates/data_connector
          - crate: wfaas
            path: crates/workflow
          - crate: smg-auth
            path: crates/auth
          - crate: smg-mcp
            path: crates/mcp
          - crate: smg-mm-rdma
            path: crates/mm_rdma
          - crate: engine-zmq-client
            path: crates/engine_zmq_client
          - crate: smg-radix-tree
            path: crates/radix_tree
    steps:
      - name: Refuse a release candidate
        shell: bash
        run: |
          # A release candidate never reaches crates.io (scripts/release/README.md): the job's if makes an -rc. dispatch
          # a no-op, and this step holds the rule, with the reason, when the job is reached anyway.
          case "${GITHUB_REF_NAME:-}" in
            *-rc.*)
              echo "${GITHUB_REF_NAME} is a release candidate: candidates are never published to crates.io (the images, the chart and the GitHub pre-release carry a candidate); dispatch this workflow against a final's tag" >&2
              exit 1 ;;
          esac

      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-crate
        with:
          crate: ${{ matrix.crate }}
          path: ${{ matrix.path }}
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tier 2: Crates depending on tier 1
  tier2:
    needs: tier1
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: tool-parser
            path: crates/tool_parser
          - crate: smg-grpc-client
            path: crates/grpc_client
          - crate: smg-client
            path: clients/rust
          - crate: smg-mesh
            path: crates/mesh
          - crate: smg-wasm
            path: crates/wasm
          - crate: llm-tokenizer
            path: crates/tokenizer
          - crate: smg-rl
            path: crates/rl
          - crate: smg-external-router
            path: crates/external_router
          - crate: smg-symphony
            path: crates/symphony
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-crate
        with:
          crate: ${{ matrix.crate }}
          path: ${{ matrix.path }}
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tier 3: Crates depending on tier 2
  tier3:
    needs: tier2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: llm-multimodal
            path: crates/multimodal
          - crate: engine-zmq-adapter
            path: crates/engine_zmq_adapter
          - crate: smg-response-template
            path: crates/response_template
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-crate
        with:
          crate: ${{ matrix.crate }}
          path: ${{ matrix.path }}
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tier 4: Crates depending on tier 3
  tier4:
    needs: tier3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-crate
        with:
          crate: engine-servicer
          path: crates/engine_servicer
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Tier 5: Main crate depending on all others
  tier5:
    needs: tier4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/publish-crate
        with:
          crate: smg
          path: model_gateway
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
