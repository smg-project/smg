name: PR Helm Chart

# The chart's own checks on a pull request that touches it: `helm lint`, the
# alert rule unit tests (deploy/helm/smg/tests/rules/run.sh, which renders
# the PrometheusRule and replays every test file against it with promtool),
# and the policy controller's block against the controller binary itself,
# which is why a change of that binary's flags starts the workflow too.
on:
  pull_request:
    paths:
      - 'deploy/helm/smg/**'
      - 'bindings/python/tests/test_helm_chart_policy_controller.py'
      - 'crates/policy_controller/Cargo.toml'
      - 'crates/policy_controller/src/**'
      - '.github/workflows/pr-helm.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-helm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Lint the chart and run its alert rule tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The Prometheus release promtool comes from, and the digest of its
      # linux-amd64 tarball from the release's sha256sums.txt.
      PROMETHEUS_VERSION: 3.15.1
      PROMETHEUS_SHA256: 6a726885328ad9efebbf36e876ce2fb6225468a71fd1e7ce3ba666d5f4d97a84
    steps:
      # The job runs a downloaded binary (promtool), so the checkout keeps no
      # credentials, as the repository's other such workflows do.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Install promtool
        run: |
          tarball="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          bash scripts/ci_retry.sh 3 30 curl -fsSL --connect-timeout 10 --max-time 300 -o "$tarball" \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${tarball}"
          echo "${PROMETHEUS_SHA256}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "$tarball" -C "${RUNNER_TEMP}/bin" --strip-components=1 \
            "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          "${RUNNER_TEMP}/bin/promtool" --version

      - name: Lint the chart
        run: helm lint deploy/helm/smg

      - name: Run the alert rule tests
        run: bash deploy/helm/smg/tests/rules/run.sh

  # Every argument the chart's controller Deployment passes is a flag the
  # controller has, held by the binary itself: the job builds it (no cache is
  # saved) and runs the chart's controller tests with it. Without the binary
  # those cases are skipped, as they are in the Python unit test job.
  policy-controller:
    name: Run the policy controller on the chart's arguments
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.0

      - name: Install protoc
        run: bash scripts/ci_install_protoc.sh

      # The toolchain rust-toolchain.toml names, then the controller binary.
      - name: Build the controller
        run: |
          rustup toolchain install
          cargo build --locked --package smg-policy-controller --features controller,kubernetes

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run the chart's controller tests with the binary
        env:
          SMG_POLICY_CONTROLLER_BIN: ${{ github.workspace }}/target/debug/smg-policy-controller
        run: |
          python3 -m pip install pytest pyyaml
          python3 -m pytest -q -rs bindings/python/tests/test_helm_chart_policy_controller.py
