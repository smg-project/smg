name: E2E GPU Job

on:
  workflow_call:
    inputs:
      pilot_profile:
        required: true
        type: string
        description: "Temporary first-batch physical GPU profile: 1g, 2g, or 4g"
      engine:
        required: true
        type: string
        description: "Engine to test: sglang, vllm, trtllm, or tokenspeed"
      gpu_tier:
        required: true
        type: string
        description: "GPU tier: 1, 2, or 4"
      runner:
        required: true
        type: string
        description: "Runner label: 1-gpu-h100, 2-gpu-h100, or 4-gpu-h100"
      timeout:
        required: true
        type: number
        description: "Job timeout in minutes"
      test_timeout:
        required: false
        type: number
        default: 25
        description: "pytest step timeout in minutes (must be < job timeout)"
      extra_deps:
        required: false
        type: string
        default: ""
        description: "Extra pip dependencies"
      test_dirs:
        required: false
        type: string
        default: "e2e_test/"
        description: "pytest test path (e.g., e2e_test/chat_completions)"
      test_filter:
        required: false
        type: string
        default: ""
        description: "pytest -k filter expression"
      extra_models:
        required: false
        type: string
        default: ""
        description: "Extra model ids to download by id (space-separated), for skip_tier_download models"
      setup_agentic_deps:
        required: false
        type: boolean
        default: false
        description: "Set up Oracle DB and Brave MCP for agentic tests"
      vllm_kv_backend:
        required: false
        type: string
        default: "nixl"
        description: "KV transfer backend for vLLM PD workers: nixl or mooncake"
      kv_backend:
        required: false
        type: string
        default: ""
        description: "KV transfer backend for every PD worker, whatever the engine (nixl or mooncake); empty keeps each engine's default"
      vllm_extra_kv_backends:
        required: false
        type: string
        default: ""
        description: "Additional vLLM KV transfer backends to install beside the lane's own (e.g. mooncake), for fleets that mix transports"
      connection_mode:
        required: false
        type: string
        default: ""
        description: "Wire override for local backends: zmq runs the local cases over ZMQ"
      zmq_engine_count:
        required: false
        type: string
        default: ""
        description: "DP engines per ZMQ worker (grouped vLLM launch; empty = 1)"
      mm_processing:
        required: false
        type: string
        default: ""
        description: "Multimodal processing location for vLLM gRPC workers: worker launches them with SMG_VLLM_MM_PROCESSOR=inprocess so the gateway forwards media references; empty keeps router-side preprocessing"
      min_selected:
        required: false
        type: number
        default: 0
        description: "Minimum effective (selected) test count; exported as E2E_MIN_SELECTED for the pytest harness floor check (0 = disabled)"
      tokenspeed_prebuilt_image:
        required: false
        type: string
        default: ""
        description: "Prebuilt TokenSpeed carrier image to extract onto the runner (resolved by detect-changes); empty = build from source"
      servicer_unit_tests:
        required: false
        type: boolean
        default: false
        description: "Also run grpc_servicer/tests here, where the importorskip('vllm') / importorskip('sglang') cases meet a real engine; set on one lane per engine"
      servicer_impl:
        description: "Which SGLang gRPC servicer the workers run (rust or python); empty keeps the engine default"
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    env:
      PILOT_PROFILE: ${{ inputs.pilot_profile }}
      E2E_ENGINE: ${{ inputs.engine }}
      E2E_RUNTIME: ${{ inputs.engine }}
      E2E_GPU_TIER: ${{ inputs.gpu_tier }}
      E2E_VLLM_KV_BACKEND: ${{ inputs.vllm_kv_backend }}
      E2E_KV_BACKEND: ${{ inputs.kv_backend }}
      E2E_VLLM_EXTRA_KV_BACKENDS: ${{ inputs.vllm_extra_kv_backends }}
      E2E_CONNECTION_MODE: ${{ inputs.connection_mode }}
      E2E_ZMQ_ENGINE_COUNT: ${{ inputs.zmq_engine_count }}
      E2E_MM_PROCESSING: ${{ inputs.mm_processing }}
      E2E_SGLANG_SERVICER_IMPL: ${{ inputs.servicer_impl }}
      TOKENSPEED_PREBUILT_IMAGE: ${{ inputs.tokenspeed_prebuilt_image }}
      ROUTER_LOCAL_MODEL_PATH: /models
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The cluster runners share one NAT egress IP and GitHub intermittently
      # 401s anonymous git from it, even for public repos — the TokenSpeed
      # source fetch dies on "could not read Username". Carry the workflow
      # token on every github.com git operation instead.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # Engine-specific setup
      - name: Setup SGLang backend
        if: inputs.engine == 'sglang'
        uses: ./.github/actions/setup-sglang

      - name: Setup vLLM backend
        if: inputs.engine == 'vllm'
        uses: ./.github/actions/setup-vllm

      - name: Setup TRT-LLM backend
        if: inputs.engine == 'trtllm'
        uses: ./.github/actions/setup-trtllm

      - name: Setup TokenSpeed backend
        if: inputs.engine == 'tokenspeed'
        uses: ./.github/actions/setup-tokenspeed

      # Artifact downloads
      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/

      - name: Download WASM test fixtures
        uses: actions/download-artifact@v8
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/
        continue-on-error: true

      - name: Download Python client types
        uses: actions/download-artifact@v8
        with:
          name: python-client-types
          path: clients/python/smg_client/types/

      # Agentic service dependencies (Oracle DB, Brave MCP)
      - name: Check shared services
        if: inputs.setup_agentic_deps
        run: bash scripts/ci_agentic_svc_deps.sh check --oracle oracle-db --brave brave-search-mcp

      # Install
      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh ${{ inputs.extra_deps }}

      - name: Require actual prepared adoption and native CUDA imports
        run: |
          source scripts/ci_prepared_backend_env.sh
          smg_prepared_env_matches "$E2E_ENGINE" "/opt/smg-ci/$E2E_ENGINE/.venv"
          python3 - <<'PYTHON'
          import importlib, importlib.metadata as metadata, json, os, sys
          import torch
          from smg.smg_rs import Router
          backend, profile = os.environ['E2E_ENGINE'], os.environ['PILOT_PROFILE']
          expected = f'/opt/smg-ci/{backend}/.venv'
          assert os.getuid() == 1001, 'Runner user changed'
          assert os.path.realpath(sys.prefix) == expected, 'Fresh installation is not prepared adoption'
          assert torch.cuda.device_count() == int(profile[0]), 'Physical GPU profile changed'
          for module in (backend, 'nixl._api', 'mooncake.engine'):
              importlib.import_module(module)
          torch.empty(1, device='cuda')
          torch.cuda.synchronize()
          print(json.dumps({'uid': os.getuid(), 'profile': profile, 'venv': sys.prefix,
                            'venv_realpath': os.path.realpath(sys.prefix),
                            'devices': [torch.cuda.get_device_name(i) for i in range(torch.cuda.device_count())],
                            'cuda': torch.version.cuda,
                            'versions': {name: metadata.version(name) for name in
                                         ('torch', backend, 'nixl', 'mooncake-transfer-engine-cuda13', 'smg')},
                            'native_imports': 'passed', 'cuda_allocation': 'passed'}))
          PYTHON

      # The servicer's engine-gated unit tests (importorskip("vllm"),
      # importorskip("sglang") for the SGLang ZMQ wire pins) only meet a real
      # engine here; the CPU unit-test job skips them. One lane per engine opts in.
      - name: Run engine-gated servicer unit tests
        if: inputs.servicer_unit_tests
        run: |
          python3 -c "import ${{ inputs.engine }}, msgspec, zmq"  # the gates these tests importorskip on
          pip install pytest-asyncio  # runs the @pytest.mark.asyncio cases; pytest>=8.4 fails them without a plugin
          pytest -q grpc_servicer/tests -p no:cacheprovider -rs

      - name: Setup Oracle
        if: inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh setup-oracle-client
          bash scripts/ci_agentic_svc_deps.sh create-oracle-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh create-oracle-flyway-user oracle-db

      # Pre-download models with flock to prevent races between pods on same node
      - name: Download models
        run: bash scripts/ci_download_model.sh --gpu-tier ${{ inputs.gpu_tier }}

      - name: Download extra models
        if: inputs.extra_models != ''
        # Pass the input via env (not interpolated into the run script) so its
        # text can never become shell syntax; unquoted $EXTRA_MODELS still
        # word-splits into multiple space-separated model ids.
        env:
          EXTRA_MODELS: ${{ inputs.extra_models }}
        run: bash scripts/ci_download_model.sh $EXTRA_MODELS

      # Run tests
      - name: Run E2E tests
        timeout-minutes: ${{ inputs.test_timeout }}
        env:
          SHOW_WORKER_LOGS: "0"
          SHOW_ROUTER_LOGS: "1"
          E2E_LOG_DIR: e2e-logs
          E2E_MIN_SELECTED: ${{ inputs.min_selected }}
          BRAVE_MCP_HOST: ${{ inputs.setup_agentic_deps && 'brave-search-mcp' || '' }}
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          pytest ${{ inputs.test_dirs }} \
            --ignore=e2e_test/benchmarks \
            --ignore=e2e_test/bindings_go \
            ${{ inputs.test_filter }} \
            --reruns 0 --force-reruns 0 \
            --junitxml=runner-pilot-results.xml \
            -s -vv

      # These original transport cases require their own GPU-2 selection tier.
      - name: Download the original DP rank-pinning model
        if: inputs.pilot_profile == '4g' && inputs.engine == 'vllm'
        run: bash scripts/ci_download_model.sh meta-llama/Llama-3.2-1B-Instruct

      - name: Verify original gRPC DP and positive NIXL transfer assertions
        if: inputs.pilot_profile == '4g' && inputs.engine == 'vllm'
        timeout-minutes: 10
        env:
          E2E_GPU_TIER: '2'
          E2E_KV_BACKEND: nixl
          E2E_VLLM_KV_BACKEND: nixl
          E2E_MIN_SELECTED: '3'
          SHOW_WORKER_LOGS: '0'
          SHOW_ROUTER_LOGS: '1'
          E2E_LOG_DIR: e2e-logs
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          pytest \
            'e2e_test/router/test_dp_routing.py::TestDpAwareRankPinning::test_requests_pinned_to_both_ranks[grpc]' \
            'e2e_test/router/test_pd_nixl.py::TestPDNixlKvTransfer::test_kv_transfer_params_relayed[pd_grpc]' \
            'e2e_test/router/test_pd_nixl.py::TestPDNixlKvTransfer::test_decode_worker_performed_nixl_handshake[pd_grpc]' \
            --reruns 0 --force-reruns 0 \
            --junitxml=runner-pilot-nixl-results.xml -s -vv

      - name: Verify original positive Mooncake transfer assertions
        if: inputs.pilot_profile == '4g' && inputs.engine == 'vllm'
        timeout-minutes: 10
        env:
          E2E_GPU_TIER: '2'
          E2E_KV_BACKEND: mooncake
          E2E_VLLM_KV_BACKEND: mooncake
          E2E_MIN_SELECTED: '2'
          SHOW_WORKER_LOGS: '0'
          SHOW_ROUTER_LOGS: '1'
          E2E_LOG_DIR: e2e-logs
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          pytest \
            'e2e_test/router/test_pd_mooncake.py::TestPDMooncakeKvTransfer::test_minted_params_injected[pd_grpc]' \
            'e2e_test/router/test_pd_mooncake.py::TestPDMooncakeKvTransfer::test_workers_transferred_kv[pd_grpc]' \
            --reruns 0 --force-reruns 0 \
            --junitxml=runner-pilot-mooncake-results.xml -s -vv

      - name: Require exact original assertions without skips or retries
        if: always()
        run: |
          python3 - <<'PYTHON'
          import os
          import xml.etree.ElementTree as ET
          profile, engine = os.environ['PILOT_PROFILE'], os.environ['E2E_ENGINE']
          assert profile in ('1g', '2g', '4g') and engine in ('vllm', 'sglang'), 'Unknown pilot slice'
          expected = set()
          if profile == '1g' or (profile == '2g' and engine == 'vllm'):
              paths = (
                  ('chat_completions.test_function_calling.TestOpenAIServerFunctionCalling', 'test_streaming_multiple_choices_without_tools'),
                  ('chat_completions.test_function_calling.TestToolChoiceLlama', 'test_tool_choice_required_non_streaming'),
                  ('chat_completions.test_validation.TestEosTokenStripping', 'test_no_eos_in_content_default'),
              )
              expected = {(cls, f'{method}[{sdk}-grpc]') for cls, method in paths for sdk in ('openai', 'smg')}
          else:
              topology = '1p1d' if profile == '2g' else '2p2d'
              cls = 'router.test_pd_topologies.TestPDTopology'
              expected = {(cls, f'{method}[{topology}]') for method in
                          ('test_workers_registered_by_role', 'test_every_leg_takes_traffic',
                           'test_concurrent_requests_do_not_alias', 'test_long_prompt_context_reaches_decode')}
              if profile == '4g':
                  cls = 'chat_completions.test_openai_server.TestChatCompletionGptOss120B'
                  expected |= {(cls, f'{method}[{sample}-{logprobs}-{sdk}-grpc]')
                               for method in ('test_chat_completion', 'test_chat_completion_stream')
                               for sample in (1, 2) for logprobs in ('None', '5') for sdk in ('openai', 'smg')}
                  if engine == 'vllm':
                      expected.add(('router.test_pd_topologies.TestPDMixedTransport',
                                    'test_every_request_lands_on_a_matching_pair[2p2d-mixed-kv]'))
          cases = ET.parse('runner-pilot-results.xml').getroot().findall('.//testcase')
          actual = {(case.attrib['classname'].removeprefix('e2e_test.'), case.attrib['name']) for case in cases}
          assert len(cases) == len(expected) and actual == expected, f'Original selection changed: missing={expected - actual}, extra={actual - expected}'
          assert all(child.tag in ('system-out', 'system-err', 'properties') for case in cases for child in case), 'An assertion failed, errored, skipped, or reran'
          print(f'{profile}/{engine}: {len(cases)} exact original assertions passed without skips or retries')
          if profile == '4g' and engine == 'vllm':
              extra = {
                  'runner-pilot-nixl-results.xml': {
                      ('router.test_dp_routing.TestDpAwareRankPinning',
                       'test_requests_pinned_to_both_ranks[grpc]'),
                      ('router.test_pd_nixl.TestPDNixlKvTransfer',
                       'test_kv_transfer_params_relayed[pd_grpc]'),
                      ('router.test_pd_nixl.TestPDNixlKvTransfer',
                       'test_decode_worker_performed_nixl_handshake[pd_grpc]'),
                  },
                  'runner-pilot-mooncake-results.xml': {
                      ('router.test_pd_mooncake.TestPDMooncakeKvTransfer',
                       'test_minted_params_injected[pd_grpc]'),
                      ('router.test_pd_mooncake.TestPDMooncakeKvTransfer',
                       'test_workers_transferred_kv[pd_grpc]'),
                  },
              }
              for report, wanted in extra.items():
                  added = ET.parse(report).getroot().findall('.//testcase')
                  actual_added = {(c.attrib['classname'].removeprefix('e2e_test.'), c.attrib['name']) for c in added}
                  assert len(added) == len(wanted) and actual_added == wanted, f'Original addendum selection changed in {report}'
                  assert all(child.tag in ('system-out', 'system-err', 'properties') for c in added for child in c), f'Failure, error, skip or retry in {report}'
              print('4g/vllm: all26 original assertions passed across three native invocations without skips or retries')
          PYTHON

      - name: Upload pilot assertion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-pilot-${{ inputs.pilot_profile }}-${{ inputs.engine }}
          path: |
            runner-pilot-results.xml
            runner-pilot-nixl-results.xml
            runner-pilot-mooncake-results.xml
          retention-days: 7
          if-no-files-found: error

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: |
          LABEL=$(echo '${{ inputs.test_dirs }}' | tr '/' '-')
          # vLLM legs can differ only by KV backend; disambiguate the artifact
          SUFFIX=""
          if [ -n "${{ inputs.kv_backend }}" ]; then
            SUFFIX="-${{ inputs.kv_backend }}"
          elif [ "${{ inputs.engine }}" = "vllm" ]; then
            SUFFIX="-${{ inputs.vllm_kv_backend }}"
          fi
          # gRPC and ZMQ chat legs share engine/GPU/test-dir and differ only by
          # wire mode; fold it in so their log artifacts don't collide.
          MODE="${{ inputs.connection_mode }}"
          if [ -n "$MODE" ]; then
            SUFFIX="${SUFFIX}-${MODE}"
          fi
          # The worker-side media lane reuses the multimodal test files.
          MM="${{ inputs.mm_processing }}"
          if [ -n "$MM" ]; then
            SUFFIX="${SUFFIX}-mm-${MM}"
          fi
          ARTIFACT="e2e-worker-logs-${{ inputs.engine }}-gpu${{ inputs.gpu_tier }}-${LABEL}${SUFFIX}"
          bash scripts/ci_dump_worker_logs.sh e2e-logs "$ARTIFACT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
        id: log-snapshot

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.log-snapshot.outputs.artifact }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

      # The prebuilt TokenSpeed payload is a per-job copy on the node's shared
      # NVMe cache (scripts/ci_fetch_tokenspeed_prebuilt.sh); drop it so the
      # cache does not keep one copy per lane. A hard-killed runner never
      # reaches this step; those copies are swept by the next fetch on the node.
      - name: Remove per-job TokenSpeed payload copy
        if: always() && env.TOKENSPEED_PREBUILT_JOB_DIR != ''
        run: rm -rf "$TOKENSPEED_PREBUILT_JOB_DIR"

      - name: Cleanup Oracle test users
        if: always() && inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-flyway-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-user oracle-db
