name: E2E GPU Job

on:
  workflow_call:
    inputs:
      engine:
        required: true
        type: string
        description: "Engine to test: sglang, vllm, trtllm, or tokenspeed"
      gpu_tier:
        required: true
        type: string
        description: "GPU tier: 1, 2, or 4"
      runner:
        required: true
        type: string
        description: "Runner label: 1-gpu-h100, 2-gpu-h100, or 4-gpu-h100"
      timeout:
        required: true
        type: number
        description: "Job timeout in minutes"
      test_timeout:
        required: false
        type: number
        default: 25
        description: "pytest step timeout in minutes (must be < job timeout)"
      extra_deps:
        required: false
        type: string
        default: ""
        description: "Extra pip dependencies"
      test_dirs:
        required: false
        type: string
        default: "e2e_test/"
        description: "pytest test path (e.g., e2e_test/chat_completions)"
      test_filter:
        required: false
        type: string
        default: ""
        description: "pytest -k filter expression"
      extra_models:
        required: false
        type: string
        default: ""
        description: "Extra model ids to download by id (space-separated), for skip_tier_download models"
      parser:
        required: false
        type: string
        default: ""
        description: "The gateway's --parser, legacy or symphony; blank leaves its default, legacy"
      setup_agentic_deps:
        required: false
        type: boolean
        default: false
        description: "Set up Oracle DB and Brave MCP for agentic tests"
      vllm_kv_backend:
        required: false
        type: string
        default: "nixl"
        description: "KV transfer backend for vLLM PD workers: nixl, mooncake or moriio"
      vllm_moriio_mode:
        required: false
        type: string
        default: ""
        description: "MoRI-IO transfer mode for vLLM PD workers on the moriio backend: read or write (empty = read)"
      vllm_moriio_backend:
        required: false
        type: string
        default: ""
        description: "MoRI-IO transfer engine for vLLM PD workers on the moriio backend: rdma (through the NICs) or xgmi (GPU to GPU on one node) (empty = rdma)"
      kv_backend:
        required: false
        type: string
        default: ""
        description: "KV transfer backend for every PD worker, whatever the engine (nixl, mooncake or moriio); empty keeps each engine's default"
      vllm_extra_kv_backends:
        required: false
        type: string
        default: ""
        description: "Additional vLLM KV transfer backends to install beside the lane's own (e.g. mooncake), for fleets that mix transports"
      connection_mode:
        required: false
        type: string
        default: ""
        description: "Wire override for local backends: zmq runs the local cases over ZMQ"
      zmq_engine_count:
        required: false
        type: string
        default: ""
        description: "DP engines per ZMQ worker (grouped vLLM launch; empty = 1)"
      mm_processing:
        required: false
        type: string
        default: ""
        description: "Multimodal processing location for vLLM gRPC workers: worker launches them with SMG_VLLM_MM_PROCESSOR=inprocess so the gateway forwards media references; empty keeps router-side preprocessing"
      min_selected:
        required: false
        type: number
        default: 0
        description: "Minimum effective (selected) test count; exported as E2E_MIN_SELECTED for the pytest harness floor check (0 = disabled)"
      tokenspeed_prebuilt_image:
        required: false
        type: string
        default: ""
        description: "Prebuilt TokenSpeed carrier image to extract onto the runner (resolved by detect-changes); empty = build from source"
      servicer_unit_tests:
        required: false
        type: boolean
        default: false
        description: "Also run grpc_servicer/tests here, where the importorskip('vllm') / importorskip('sglang') cases meet a real engine; set on one lane per engine"
      servicer_impl:
        description: "Which gRPC servicer the workers of the job's engine run (rust or python), handed to that engine's harness flag; empty keeps the engine default"
        required: false
        type: string
        default: ""
      gpu_vendor:
        description: "GPU vendor of the runner: nvidia, or amd for a lane that runs in an engine's ROCm image"
        required: false
        type: string
        default: "nvidia"
      container_image:
        description: "Image the job runs in, with container_options; empty keeps vars.SMG_CI_GPU_CONTAINER_IMAGE"
        required: false
        type: string
        default: ""
      container_options:
        description: "docker options for container_image (devices, IPC, memlock)"
        required: false
        type: string
        default: ""

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container_image != '' && fromJSON(format('{{"image":{0},"options":{1}}}', toJSON(inputs.container_image), toJSON(inputs.container_options))) || vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    env:
      E2E_ENGINE: ${{ inputs.engine }}
      E2E_RUNTIME: ${{ inputs.engine }}
      E2E_GPU_TIER: ${{ inputs.gpu_tier }}
      E2E_VLLM_KV_BACKEND: ${{ inputs.vllm_kv_backend }}
      E2E_VLLM_MORIIO_MODE: ${{ inputs.vllm_moriio_mode }}
      E2E_VLLM_MORIIO_BACKEND: ${{ inputs.vllm_moriio_backend }}
      E2E_KV_BACKEND: ${{ inputs.kv_backend }}
      E2E_VLLM_EXTRA_KV_BACKENDS: ${{ inputs.vllm_extra_kv_backends }}
      E2E_CONNECTION_MODE: ${{ inputs.connection_mode }}
      E2E_ZMQ_ENGINE_COUNT: ${{ inputs.zmq_engine_count }}
      E2E_MM_PROCESSING: ${{ inputs.mm_processing }}
      # The harness passes this to the gateway as --parser (blank: the gateway's default, legacy).
      E2E_PARSER: ${{ inputs.parser }}
      # The servicer choice reaches the harness flag of the job's engine only.
      E2E_SGLANG_SERVICER_IMPL: ${{ inputs.engine == 'sglang' && inputs.servicer_impl || '' }}
      E2E_VLLM_SERVICER_IMPL: ${{ inputs.engine == 'vllm' && inputs.servicer_impl || '' }}
      E2E_TOKENSPEED_SERVICER_IMPL: ${{ inputs.engine == 'tokenspeed' && inputs.servicer_impl || '' }}
      TOKENSPEED_PREBUILT_IMAGE: ${{ inputs.tokenspeed_prebuilt_image }}
      ROUTER_LOCAL_MODEL_PATH: /models
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Every process this job starts carries the job's marker in its
      # environment: exported here, before anything starts, so the harness's
      # workers and gateway, and their children (an engine's cores, a
      # scheduler's ranks), inherit it. The job's last step ends whatever
      # still carries it (scripts/ci_reap_job_processes.py), so an engine a
      # cancelled or timed-out test step left behind cannot outlive the job.
      - name: Mark this job's processes
        run: echo "E2E_JOB_MARKER=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"

      # The cluster runners share one NAT egress IP and GitHub intermittently
      # 401s anonymous git from it, even for public repos — the TokenSpeed
      # source fetch dies on "could not read Username". Carry the workflow
      # token on every github.com git operation instead.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      # Engine-specific setup
      - name: Setup SGLang backend
        if: inputs.engine == 'sglang' && inputs.gpu_vendor != 'amd'
        uses: ./.github/actions/setup-sglang

      - name: Setup SGLang backend (in SGLang's ROCm image)
        if: inputs.engine == 'sglang' && inputs.gpu_vendor == 'amd'
        env:
          SMG_SGLANG_ROCM_IMAGE: ${{ inputs.container_image }}
        run: |
          python3 scripts/ci_repair_sglang_rocm_native.py
          bash scripts/ci_setup_sglang_rocm_image.sh

      - name: Setup vLLM backend
        if: inputs.engine == 'vllm' && inputs.gpu_vendor != 'amd'
        uses: ./.github/actions/setup-vllm

      - name: Setup vLLM backend (in vLLM's ROCm image)
        if: inputs.engine == 'vllm' && inputs.gpu_vendor == 'amd'
        run: bash scripts/ci_setup_vllm_rocm_image.sh

      - name: Setup TRT-LLM backend
        if: inputs.engine == 'trtllm'
        uses: ./.github/actions/setup-trtllm

      - name: Setup TokenSpeed backend
        if: inputs.engine == 'tokenspeed'
        uses: ./.github/actions/setup-tokenspeed

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wasm-fixtures: 'true'
          client-types: 'true'

      # Agentic service dependencies (Oracle DB, Brave MCP)
      - name: Check shared services
        if: inputs.setup_agentic_deps
        run: bash scripts/ci_agentic_svc_deps.sh check --oracle oracle-db --brave brave-search-mcp

      # Install
      - name: Install wheel and test dependencies
        id: install-dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh ${{ inputs.extra_deps }}

      # The servicer's engine-gated unit tests (importorskip("vllm"),
      # importorskip("sglang") for the SGLang ZMQ wire pins) only meet a real
      # engine here; the CPU unit-test job skips them. One lane per engine opts in.
      - name: Run engine-gated servicer unit tests
        if: inputs.servicer_unit_tests
        run: |
          python3 -c "import ${{ inputs.engine }}, msgspec, zmq"  # the gates these tests importorskip on
          pip install pytest-asyncio  # runs the @pytest.mark.asyncio cases; pytest>=8.4 fails them without a plugin
          pytest -q grpc_servicer/tests -p no:cacheprovider -rs

      - name: Check installed AMD dependencies
        id: amd-dependencies
        if: always() && inputs.gpu_vendor == 'amd' && steps.install-dependencies.conclusion == 'success'
        shell: bash
        run: |
          DIRECTORY="$(mktemp -d "$RUNNER_TEMP/amd-dependencies.XXXXXXXXXX")"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "python=$(command -v python3)" >> "$GITHUB_OUTPUT"
          echo "artifact=amd-dependencies-${{ inputs.engine }}-gpu${{ inputs.gpu_tier }}-${DIRECTORY##*.}" >> "$GITHUB_OUTPUT"
          python3 scripts/ci_check_e2e_dependencies.py "$DIRECTORY" installed

      - name: Setup Oracle
        if: inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh setup-oracle-client
          bash scripts/ci_agentic_svc_deps.sh create-oracle-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh create-oracle-flyway-user oracle-db

      # Pre-download models with flock to prevent races between pods on same node
      - name: Download models
        run: bash scripts/ci_download_model.sh --gpu-tier ${{ inputs.gpu_tier }}

      - name: Download extra models
        if: inputs.extra_models != ''
        # Pass the input via env (not interpolated into the run script) so its
        # text can never become shell syntax; unquoted $EXTRA_MODELS still
        # word-splits into multiple space-separated model ids.
        env:
          EXTRA_MODELS: ${{ inputs.extra_models }}
        run: bash scripts/ci_download_model.sh $EXTRA_MODELS

      # Run tests
      - name: Run E2E tests
        timeout-minutes: ${{ inputs.test_timeout }}
        env:
          SHOW_WORKER_LOGS: "0"
          SHOW_ROUTER_LOGS: "1"
          E2E_LOG_DIR: e2e-logs
          E2E_MIN_SELECTED: ${{ inputs.min_selected }}
          AMD_DEPENDENCY_DIRECTORY: ${{ steps.amd-dependencies.outputs.directory }}
          BRAVE_MCP_HOST: ${{ inputs.setup_agentic_deps && 'brave-search-mcp' || '' }}
          # Every gRPC servicer runs a planned warm-up before it reports
          # SERVING (grpc_servicer/smg_grpc_servicer/warmup.py). At its default
          # level, full (one request per 128-token prefill class), it cost
          # 26-114 s per worker start on the AMD chat row (8:47 over the seven
          # workers before gpt-oss-20b) and +4:13 of pytest on the CUDA vLLM
          # chat row, once per worker start, eight per chat leg. The legs'
          # workers run it at the fast level instead: the decode staircase and
          # the engines' bucket grid (62 of 175 steps and 12 % of the prefill
          # tokens for a 16k-token step), so every start still exercises the
          # path. The full level stays covered once per engine and run by
          # e2e_test/chat_completions/test_servicer_warmup.py, whose one worker
          # sets its knob back to full. The harness copies this environment
          # into every worker it starts (a worker's own extra_env wins).
          SMG_VLLM_SERVICER_WARMUP: fast
          SMG_SGLANG_SERVICER_WARMUP: fast
          SMG_TOKENSPEED_SERVICER_WARMUP: fast
        run: |
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            bash scripts/ci_killall_sglang.sh rocm  # the default mode reads nvidia-smi
          else
            bash scripts/ci_killall_sglang.sh "nuke_gpus"
          fi
          set --
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            test -n "$AMD_DEPENDENCY_DIRECTORY"
            set -- "--junitxml=$AMD_DEPENDENCY_DIRECTORY/e2e.xml"
          fi
          pytest ${{ inputs.test_dirs }} \
            --ignore=e2e_test/benchmarks \
            --ignore=e2e_test/bindings_go \
            ${{ inputs.test_filter }} \
            --reruns 2 --reruns-delay 5 \
            -s -vv "$@"

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: |
          LABEL=$(echo '${{ inputs.test_dirs }}' | tr '/' '-')
          # vLLM legs can differ only by KV backend; disambiguate the artifact
          SUFFIX=""
          if [ -n "${{ inputs.kv_backend }}" ]; then
            SUFFIX="-${{ inputs.kv_backend }}"
          elif [ "${{ inputs.engine }}" = "vllm" ]; then
            SUFFIX="-${{ inputs.vllm_kv_backend }}"
          fi
          # MoRI-IO lanes differ by transfer mode, and AMD lanes by vendor.
          if [ -n "${{ inputs.vllm_moriio_mode }}" ]; then
            SUFFIX="${SUFFIX}-${{ inputs.vllm_moriio_mode }}"
          fi
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            SUFFIX="${SUFFIX}-amd"
          fi
          # gRPC and ZMQ chat legs share engine/GPU/test-dir and differ only by
          # wire mode; fold it in so their log artifacts don't collide.
          MODE="${{ inputs.connection_mode }}"
          if [ -n "$MODE" ]; then
            SUFFIX="${SUFFIX}-${MODE}"
          fi
          # The worker-side media lane reuses the multimodal test files.
          MM="${{ inputs.mm_processing }}"
          if [ -n "$MM" ]; then
            SUFFIX="${SUFFIX}-mm-${MM}"
          fi
          # A Rust-servicer leg runs the same suite as the engine's Python
          # servicer leg; keep their log artifacts apart.
          IMPL="${{ inputs.servicer_impl }}"
          if [ -n "$IMPL" ]; then
            SUFFIX="${SUFFIX}-${IMPL}-servicer"
          fi
          ARTIFACT="e2e-worker-logs-${{ inputs.engine }}-gpu${{ inputs.gpu_tier }}-${LABEL}${SUFFIX}"
          bash scripts/ci_dump_worker_logs.sh e2e-logs "$ARTIFACT"
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
        id: log-snapshot

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.log-snapshot.outputs.artifact }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

      # Whatever the job started and did not stop ends here, found by the
      # marker in its environment: an engine or gateway that outlived a
      # cancelled or timed-out test step keeps its GPU memory and its
      # listening ports, and the next job on this runner would start against
      # them. The script prints what it ended and never fails the job itself.
      - name: Stop every process this job started
        if: always() && env.E2E_JOB_MARKER != ''
        run: python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER"

      # The prebuilt TokenSpeed payload is a per-job copy on the node's shared
      # NVMe cache (scripts/ci_fetch_tokenspeed_prebuilt.sh); drop it so the
      # cache does not keep one copy per lane. A hard-killed runner never
      # reaches this step; those copies are swept by the next fetch on the node.
      - name: Remove per-job TokenSpeed payload copy
        if: always() && env.TOKENSPEED_PREBUILT_JOB_DIR != ''
        run: rm -rf "$TOKENSPEED_PREBUILT_JOB_DIR"

      - name: Cleanup Oracle test users
        if: always() && inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-flyway-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-user oracle-db

      - name: Check final AMD dependencies
        if: always() && inputs.gpu_vendor == 'amd'
        shell: bash
        env:
          INSTALL_RESULT: ${{ steps.install-dependencies.conclusion }}
          DEPENDENCY_DIRECTORY: ${{ steps.amd-dependencies.outputs.directory }}
          DEPENDENCY_PYTHON: ${{ steps.amd-dependencies.outputs.python }}
        run: |
          if [[ "$INSTALL_RESULT" != success ]]; then
            echo "Skipping dependency audit: test dependency installation did not complete."
            exit 0
          fi
          test -n "$DEPENDENCY_DIRECTORY"
          test -n "$DEPENDENCY_PYTHON"
          "$DEPENDENCY_PYTHON" scripts/ci_check_e2e_dependencies.py "$DEPENDENCY_DIRECTORY" final

      - name: Upload AMD dependency evidence
        if: always() && inputs.gpu_vendor == 'amd' && steps.amd-dependencies.outputs.directory != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.amd-dependencies.outputs.artifact }}
          path: ${{ steps.amd-dependencies.outputs.directory }}/
          retention-days: 7
          if-no-files-found: error

      - name: Upload AMD worker logs
        if: always() && inputs.gpu_vendor == 'amd' && steps.amd-dependencies.outputs.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.amd-dependencies.outputs.artifact }}-worker-logs
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore
