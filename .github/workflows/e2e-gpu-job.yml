name: E2E GPU Job

on:
  workflow_call:
    inputs:
      engine:
        required: true
        type: string
        description: "Engine to test: sglang, vllm, trtllm, or tokenspeed"
      gpu_tier:
        required: true
        type: string
        description: "GPU tier: 1, 2, or 4"
      runner:
        required: true
        type: string
        description: "Runner label: 1-gpu-h100, 2-gpu-h100, or 4-gpu-h100"
      timeout:
        required: true
        type: number
        description: "Job timeout in minutes"
      test_timeout:
        required: false
        type: number
        default: 25
        description: "pytest step timeout in minutes (must be < job timeout)"
      extra_deps:
        required: false
        type: string
        default: ""
        description: "Extra pip dependencies"
      test_dirs:
        required: false
        type: string
        default: "e2e_test/"
        description: "pytest test path (e.g., e2e_test/chat_completions)"
      test_filter:
        required: false
        type: string
        default: ""
        description: "pytest -k filter expression"
      extra_models:
        required: false
        type: string
        default: ""
        description: "Extra model ids to download by id (space-separated), for skip_tier_download models"
      startup_profile:
        required: false
        type: string
        default: ""
        description: "Optional declared startup profile; blank preserves ordinary startup behavior"
      parser:
        required: false
        type: string
        default: ""
        description: "The gateway's --parser, legacy or symphony; blank leaves its default, symphony"
      sampling_profile:
        required: false
        type: string
        default: ""
        description: "Original1 request sampling opt-in: original1; blank preserves current sampling"
      setup_agentic_deps:
        required: false
        type: boolean
        default: false
        description: "Set up Oracle DB and Brave MCP for agentic tests"
      provider_api_keys:
        required: false
        type: boolean
        default: false
        description: "Export provider API keys for mixed local/external worker tests"
      vllm_kv_backend:
        required: false
        type: string
        default: "nixl"
        description: "KV transfer backend for vLLM PD workers: nixl, mooncake or moriio"
      vllm_moriio_mode:
        required: false
        type: string
        default: ""
        description: "MoRI-IO transfer mode for vLLM PD workers on the moriio backend: read or write (empty = read)"
      vllm_moriio_backend:
        required: false
        type: string
        default: ""
        description: "MoRI-IO transfer engine for vLLM PD workers on the moriio backend: rdma (through the NICs) or xgmi (GPU to GPU on one node) (empty = rdma)"
      kv_backend:
        required: false
        type: string
        default: ""
        description: "KV transfer backend for every PD worker, whatever the engine (nixl, mooncake or moriio); empty keeps each engine's default"
      vllm_extra_kv_backends:
        required: false
        type: string
        default: ""
        description: "Additional vLLM KV transfer backends to install beside the lane's own (e.g. mooncake), for fleets that mix transports"
      connection_mode:
        required: false
        type: string
        default: ""
        description: "Wire override for local backends: zmq runs the local cases over ZMQ"
      zmq_engine_count:
        required: false
        type: string
        default: ""
        description: "DP engines per ZMQ worker (grouped vLLM launch; empty = 1)"
      mm_processing:
        required: false
        type: string
        default: ""
        description: "Multimodal processing location for vLLM gRPC workers: worker launches them with SMG_VLLM_MM_PROCESSOR=inprocess so the gateway forwards media references; empty keeps router-side preprocessing"
      min_selected:
        required: false
        type: number
        default: 0
        description: "Minimum effective (selected) test count; exported as E2E_MIN_SELECTED for the pytest harness floor check (0 = disabled)"
      tokenspeed_prebuilt_image:
        required: false
        type: string
        default: ""
        description: "Prebuilt TokenSpeed carrier image to extract onto the runner (resolved by detect-changes); empty = build from source"
      servicer_unit_tests:
        required: false
        type: boolean
        default: false
        description: "Also run grpc_servicer/tests here, where the importorskip('vllm') / importorskip('sglang') cases meet a real engine; set on one lane per engine"
      servicer_impl:
        description: "Which gRPC servicer the workers of the job's engine run (rust or python), handed to that engine's harness flag; empty follows the servicer package's default. For trtllm, rust starts this repository's launcher and anything else the engine's own gRPC server"
        required: false
        type: string
        default: ""
      worker_log_filter:
        description: "A tracing filter for the Rust servicer in every worker the harness starts (the worker process's RUST_LOG; the gateway's logging is untouched); a row whose tests read the servicer's per-request line passes info,engine_servicer::request=debug; empty leaves the servicer's default"
        required: false
        type: string
        default: ""
      gpu_vendor:
        description: "GPU vendor of the runner: nvidia, or amd for a lane that runs in an engine's ROCm image"
        required: false
        type: string
        default: "nvidia"
      container_image:
        description: "Image the job runs in, with container_options; empty keeps vars.SMG_CI_GPU_CONTAINER_IMAGE"
        required: false
        type: string
        default: ""
      container_options:
        description: "docker options for container_image (devices, IPC, memlock)"
        required: false
        type: string
        default: ""
      final_environment_check:
        description: "Opt in to fixed-image AMD SGLang setup, live JUnit/log capture and prepared/final pip/cohort verification"
        required: false
        type: boolean
        default: false
      enabled:
        description: "Whether this row runs: false skips the job before it takes a runner (a caller's matrix row the changed paths do not reach)"
        required: false
        type: boolean
        default: true

jobs:
  run:
    if: ${{ inputs.enabled }}
    runs-on: ${{ inputs.runner }}
    container: ${{ inputs.container_image != '' && fromJSON(format('{{"image":{0},"options":{1}}}', toJSON(inputs.container_image), toJSON(inputs.container_options))) || vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: ${{ inputs.timeout }}
    permissions:
      contents: read
    env:
      E2E_ENGINE: ${{ inputs.engine }}
      E2E_RUNTIME: ${{ inputs.engine }}
      # Only the fixed-image AMD SGLang row installs this checked SDK fallback.
      # The harness applies its environment and MoE flags to original GPT-OSS 20B only.
      E2E_SGLANG_GPTOSS_MXFP4_BF16: ${{ inputs.final_environment_check && '1' || '0' }}
      E2E_STARTUP_PROFILE: ${{ inputs.startup_profile }}
      E2E_GPU_TIER: ${{ inputs.gpu_tier }}
      E2E_VLLM_KV_BACKEND: ${{ inputs.vllm_kv_backend }}
      E2E_VLLM_MORIIO_MODE: ${{ inputs.vllm_moriio_mode }}
      E2E_VLLM_MORIIO_BACKEND: ${{ inputs.vllm_moriio_backend }}
      E2E_KV_BACKEND: ${{ inputs.kv_backend }}
      E2E_VLLM_EXTRA_KV_BACKENDS: ${{ inputs.vllm_extra_kv_backends }}
      E2E_CONNECTION_MODE: ${{ inputs.connection_mode }}
      E2E_ZMQ_ENGINE_COUNT: ${{ inputs.zmq_engine_count }}
      E2E_MM_PROCESSING: ${{ inputs.mm_processing }}
      # The harness passes this to the gateway as --parser (blank: the gateway's default, symphony).
      E2E_PARSER: ${{ inputs.parser }}
      E2E_SAMPLING_PROFILE: ${{ inputs.sampling_profile }}
      # The servicer choice reaches the harness flag of the job's engine only.
      E2E_SGLANG_SERVICER_IMPL: ${{ inputs.engine == 'sglang' && inputs.servicer_impl || '' }}
      E2E_VLLM_SERVICER_IMPL: ${{ inputs.engine == 'vllm' && inputs.servicer_impl || '' }}
      E2E_TOKENSPEED_SERVICER_IMPL: ${{ inputs.engine == 'tokenspeed' && inputs.servicer_impl || '' }}
      E2E_TRTLLM_SERVICER_IMPL: ${{ inputs.engine == 'trtllm' && inputs.servicer_impl || '' }}
      TOKENSPEED_PREBUILT_IMAGE: ${{ inputs.tokenspeed_prebuilt_image }}
      ROUTER_LOCAL_MODEL_PATH: /models
    steps:
      - name: Validate Mooncake PD startup contract
        if: inputs.startup_profile == 'vllm-mooncake-pd2'
        env:
          PROFILE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          actual = json.loads(os.environ["PROFILE_INPUTS"])
          expected = {
              "engine": "vllm", "gpu_vendor": "amd", "gpu_tier": "2",
              "test_dirs": "e2e_test/router", "test_filter": "", "min_selected": 15,
              "timeout": 50, "test_timeout": 34, "vllm_kv_backend": "mooncake",
              "kv_backend": "", "vllm_extra_kv_backends": "", "mm_processing": "",
              "servicer_impl": "", "parser": "", "connection_mode": "", "zmq_engine_count": "",
          }
          mismatched = [key for key, value in expected.items() if actual.get(key) != value]
          if mismatched:
              raise SystemExit("Mooncake PD startup contract mismatch: " + ", ".join(mismatched))
          floor = os.environ.get("E2E_STARTUP_TIMEOUT", "").strip()
          if floor and not 0 < int(floor) <= 60:
              raise SystemExit("Mooncake PD gateway startup floor must not exceed 60 seconds")
          PY

      # This is an input check, not HIP transfer qualification. Operators must
      # approve the immutable image and enable the caller separately.
      - name: Validate AMD Mooncake image input
        if: inputs.gpu_vendor == 'amd' && inputs.engine == 'vllm'
        env:
          PROFILE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          inputs = json.loads(os.environ["PROFILE_INPUTS"])
          backends = [inputs.get("vllm_kv_backend", ""), inputs.get("kv_backend", "")]
          backends += inputs.get("vllm_extra_kv_backends", "").split(",")
          if "mooncake" not in {value.strip().lower() for value in backends}:
              raise SystemExit(0)
          image = inputs.get("container_image", "")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._:/-]*@sha256:[0-9a-f]{64}", image):
              raise SystemExit("AMD Mooncake requires an explicitly qualified image pinned by sha256")
          if image.rsplit("@sha256:", 1)[1] == "749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f":
              raise SystemExit("The stock 749f6f3 AMD image has no Mooncake; supply a qualified image")
          PY

      - name: Checkout code
        uses: actions/checkout@v7

      # The harness propagates this marker to workers and the gateway.
      # Each AMD invocation gets a fresh cleanup identity.
      - name: Mark this job's processes
        run: |
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            python3 -c 'import uuid; print("E2E_JOB_MARKER=e2e-" + uuid.uuid4().hex)' >> "$GITHUB_ENV"
          else
            echo "E2E_JOB_MARKER=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"
          fi

      # The cluster runners share one NAT egress IP and GitHub intermittently
      # 401s anonymous git from it, even for public repos — the TokenSpeed
      # source fetch dies on "could not read Username". Carry the workflow
      # token on every github.com git operation instead.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Check final-environment verification scope
        if: inputs.final_environment_check
        env:
          CHECK_ENGINE: ${{ inputs.engine }}
          CHECK_VENDOR: ${{ inputs.gpu_vendor }}
          CHECK_IMAGE: ${{ inputs.container_image }}
        shell: bash
        run: |
          test "$CHECK_ENGINE" = sglang
          test "$CHECK_VENDOR" = amd
          [[ "$CHECK_IMAGE" =~ ^[[:alnum:]][[:alnum:]_.:/-]*:[[:alnum:]_.-]+@sha256:[a-f0-9]{64}$ ]]
          test "$(grep -Ec '^[[:space:]]*IMAGE([[:space:]:=]|$)' scripts/ci_verify_sglang_rocm_cohort.py)" = 1
          grep -Fqx "IMAGE = \"$CHECK_IMAGE\"" scripts/ci_verify_sglang_rocm_cohort.py
          test -s scripts/ci_setup_sglang_rocm_image.sh
          test -s scripts/ci_verify_sglang_rocm_cohort.py


      # Engine-specific setup
      - name: Setup SGLang backend
        if: inputs.engine == 'sglang' && !inputs.final_environment_check
        uses: ./.github/actions/setup-sglang

      - name: Setup AMD SGLang in its fixed ROCm image
        if: inputs.final_environment_check
        env:
          SMG_SGLANG_ROCM_IMAGE: ${{ inputs.container_image }}
        run: bash scripts/ci_setup_sglang_rocm_image.sh


      - name: Setup vLLM backend
        if: inputs.engine == 'vllm' && inputs.gpu_vendor != 'amd'
        uses: ./.github/actions/setup-vllm

      - name: Setup vLLM backend (in vLLM's ROCm image)
        if: inputs.engine == 'vllm' && inputs.gpu_vendor == 'amd'
        run: bash scripts/ci_setup_vllm_rocm_image.sh

      - name: Setup TRT-LLM backend
        if: inputs.engine == 'trtllm'
        uses: ./.github/actions/setup-trtllm

      - name: Setup TokenSpeed backend
        if: inputs.engine == 'tokenspeed'
        uses: ./.github/actions/setup-tokenspeed

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wasm-fixtures: 'true'
          client-types: 'true'

      # Agentic service dependencies (Oracle DB, Brave MCP)
      - name: Check shared services
        if: inputs.setup_agentic_deps
        run: bash scripts/ci_agentic_svc_deps.sh check --oracle oracle-db --brave brave-search-mcp

      # Install
      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh ${{ inputs.extra_deps }}

      - name: Check prepared AMD SGLang environment
        if: inputs.final_environment_check
        timeout-minutes: 2
        shell: bash
        env:
          SMG_SGLANG_ROCM_IMAGE: ${{ inputs.container_image }}
        run: |
          mkdir -p e2e-logs
          pip_status=0
          python3 -m pip check >e2e-logs/prepared-pip.stdout 2>e2e-logs/prepared-pip.stderr || pip_status=$?
          cohort_status=0
          bash scripts/ci_setup_sglang_rocm_image.sh --verify-only e2e-logs/sglang-native-environment-prepared.json \
            >e2e-logs/prepared-cohort.stdout 2>e2e-logs/prepared-cohort.stderr || cohort_status=$?
          printf '{"pip_returncode":%s,"cohort_returncode":%s}\n' "$pip_status" "$cohort_status" >e2e-logs/prepared-environment-status.json
          test "$pip_status" -eq 0
          test "$cohort_status" -eq 0


      # The servicer's engine-gated unit tests (importorskip("vllm"),
      # importorskip("sglang") for the SGLang ZMQ wire pins) only meet a real
      # engine here; the CPU unit-test job skips them. One lane per engine opts in.
      - name: Run engine-gated servicer unit tests
        if: inputs.servicer_unit_tests
        run: |
          python3 -c "import ${{ inputs.engine }}, msgspec, zmq"  # the gates these tests importorskip on
          pip install pytest-asyncio  # runs the @pytest.mark.asyncio cases; pytest>=8.4 fails them without a plugin
          pytest -q grpc_servicer/tests -p no:cacheprovider -rs

      - name: Setup Oracle
        if: inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh setup-oracle-client
          bash scripts/ci_agentic_svc_deps.sh create-oracle-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh create-oracle-flyway-user oracle-db

      # Pre-download models with flock to prevent races between pods on same node
      - name: Download models
        run: bash scripts/ci_download_model.sh --gpu-tier ${{ inputs.gpu_tier }}

      - name: Download extra models
        if: inputs.extra_models != ''
        # Pass the input via env (not interpolated into the run script) so its
        # text can never become shell syntax; unquoted $EXTRA_MODELS still
        # word-splits into multiple space-separated model ids.
        env:
          EXTRA_MODELS: ${{ inputs.extra_models }}
        run: bash scripts/ci_download_model.sh $EXTRA_MODELS

      # Run tests
      - name: Run E2E tests
        timeout-minutes: ${{ inputs.test_timeout }}
        shell: bash
        env:
          SMG_PROVIDER_OPENAI_API_KEY: ${{ inputs.provider_api_keys && secrets.OPENAI_API_KEY || '' }}
          SMG_PROVIDER_XAI_API_KEY: ${{ inputs.provider_api_keys && secrets.XAI_API_KEY || '' }}
          SHOW_WORKER_LOGS: "0"
          SHOW_ROUTER_LOGS: "1"
          E2E_LOG_DIR: e2e-logs
          E2E_MIN_SELECTED: ${{ inputs.min_selected }}
          E2E_AMD_REQUIRE_PASSING_CALL: ${{ inputs.gpu_vendor == 'amd' && '1' || '' }}
          E2E_GPU_VENDOR: ${{ inputs.gpu_vendor }}
          FINAL_ENVIRONMENT_CHECK: ${{ inputs.final_environment_check && '1' || '0' }}
          E2E_WORKER_RUST_LOG: ${{ inputs.worker_log_filter }}
          BRAVE_MCP_HOST: ${{ inputs.setup_agentic_deps && 'brave-search-mcp' || '' }}
          # Every gRPC servicer runs a planned warm-up before it reports
          # SERVING (grpc_servicer/smg_grpc_servicer/warmup.py). At its default
          # level, full (one request per 128-token prefill class), it cost
          # 26-114 s per worker start on the AMD chat row (8:47 over the seven
          # workers before gpt-oss-20b) and +4:13 of pytest on the CUDA vLLM
          # chat row, once per worker start, eight per chat leg. The legs'
          # workers run it at the fast level instead: the decode staircase and
          # the engines' bucket grid (62 of 175 steps and 12 % of the prefill
          # tokens for a 16k-token step), so every start still exercises the
          # path. The full level stays covered once per engine and run by
          # e2e_test/chat_completions/test_servicer_warmup.py, whose one worker
          # sets its knob back to full. The harness copies this environment
          # into every worker it starts (a worker's own extra_env wins).
          SMG_VLLM_SERVICER_WARMUP: fast
          SMG_SGLANG_SERVICER_WARMUP: fast
          SMG_TOKENSPEED_SERVICER_WARMUP: fast
        run: |
          if [ "${{ inputs.provider_api_keys }}" = true ]; then
            if [ -n "$SMG_PROVIDER_OPENAI_API_KEY" ]; then
              export OPENAI_API_KEY="$SMG_PROVIDER_OPENAI_API_KEY"
            fi
            if [ -n "$SMG_PROVIDER_XAI_API_KEY" ]; then
              export XAI_API_KEY="$SMG_PROVIDER_XAI_API_KEY"
            fi
          fi
          unset SMG_PROVIDER_OPENAI_API_KEY SMG_PROVIDER_XAI_API_KEY
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            if [ -z "${E2E_JOB_MARKER:-}" ]; then
              echo "AMD job process marker is missing" >&2
              exit 1
            fi
          else
            bash scripts/ci_killall_sglang.sh "nuke_gpus"
          fi
          pytest_args=(
            ${{ inputs.test_dirs }}
            --ignore=e2e_test/benchmarks
            --ignore=e2e_test/bindings_go
            ${{ inputs.test_filter }}
            --reruns 2 --reruns-delay 5
            -s -vv
          )
          if [ "$FINAL_ENVIRONMENT_CHECK" = 1 ]; then
            mkdir -p e2e-logs
            # Descendants may keep writing after pytest exits. They inherit
            # regular spool files, never the live pumps' pipes.
            : >e2e-logs/pytest.stdout.source
            : >e2e-logs/pytest.stderr.source
            set +e
            pytest "${pytest_args[@]}" --junitxml=e2e-logs/sglang-results.xml \
              >e2e-logs/pytest.stdout.source 2>e2e-logs/pytest.stderr.source &
            pytest_pid=$!
            (
              set -o pipefail
              tail -n +1 --pid="$pytest_pid" --sleep-interval=0.1 -f e2e-logs/pytest.stdout.source \
                | tee e2e-logs/pytest.stdout
            ) &
            stdout_pump_pid=$!
            (
              set -o pipefail
              tail -n +1 --pid="$pytest_pid" --sleep-interval=0.1 -f e2e-logs/pytest.stderr.source \
                | tee e2e-logs/pytest.stderr >&2
            ) &
            stderr_pump_pid=$!
            wait "$pytest_pid"
            pytest_status=$?
            wait "$stdout_pump_pid"
            stdout_status=$?
            wait "$stderr_pump_pid"
            stderr_status=$?
            set -e
            # Preserve pytest's failure; either live-copy failure also rejects green.
            if [ "$pytest_status" -ne 0 ]; then
              exit "$pytest_status"
            fi
            if [ "$stdout_status" -ne 0 ]; then
              exit "$stdout_status"
            fi
            exit "$stderr_status"
          fi
          pytest "${pytest_args[@]}"

      - name: Identify row evidence
        id: evidence-identity
        if: always() && inputs.final_environment_check && inputs.engine == 'sglang' && inputs.gpu_vendor == 'amd'
        env:
          EVIDENCE_INPUTS: ${{ toJSON(inputs) }}
        run: |
          python3 - <<'PYTHON'
          import hashlib
          import json
          import os
          import re
          import uuid

          inputs = json.loads(os.environ["EVIDENCE_INPUTS"])
          canonical = json.dumps(inputs, sort_keys=True, separators=(",", ":"))
          digest = hashlib.sha256(canonical.encode()).hexdigest()[:12]
          engine = inputs.get("engine", "")
          backend = inputs.get("kv_backend") or (
              inputs.get("vllm_kv_backend", "") if engine == "vllm" else ""
          )
          mode = (
              (inputs.get("vllm_moriio_mode", "").strip().lower() or "read")
              if engine == "vllm" and backend == "moriio"
              else ""
          )
          vendor = inputs.get("gpu_vendor") or "unknown"
          dp = str(inputs.get("zmq_engine_count") or "").strip()
          fields = [engine, inputs.get("test_dirs", ""), backend or "auto", mode,
                    vendor, inputs.get("connection_mode", ""),
                    f"dp{dp}" if dp not in ("", "1") else "",
                    inputs.get("servicer_impl", ""), inputs.get("mm_processing", "")]
          label = re.sub(r"[^A-Za-z0-9_.-]+", "-", "-".join(fields)).strip("-.")[:96]
          tier = re.sub(r"[^A-Za-z0-9_.-]+", "-", str(inputs.get("gpu_tier", "")))
          contract = f"{label}-gpu{tier}-{digest}"
          # Keep the existing per-invocation UUID safety for identical parallel rows.
          attempt = int(os.environ["GITHUB_RUN_ATTEMPT"])
          invocation = f"{attempt}-{uuid.uuid4().hex}"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"complete_artifact=sglang-complete-results-{contract}-{invocation}", file=output)
              print(f"worker_artifact=e2e-worker-logs-{contract}-{invocation}", file=output)
          PYTHON


      - name: Check final AMD SGLang environment
        id: final-environment
        if: always() && inputs.final_environment_check && inputs.engine == 'sglang' && inputs.gpu_vendor == 'amd'
        timeout-minutes: 2
        env:
          SMG_SGLANG_ROCM_IMAGE: ${{ inputs.container_image }}
        run: |
          mkdir -p e2e-logs
          pip_status=0
          python3 -m pip check >e2e-logs/final-pip.stdout 2>e2e-logs/final-pip.stderr || pip_status=$?
          cohort_status=0
          bash scripts/ci_setup_sglang_rocm_image.sh --verify-only e2e-logs/sglang-native-environment-final.json \
            >e2e-logs/final-cohort.stdout 2>e2e-logs/final-cohort.stderr || cohort_status=$?
          printf '{"pip_returncode":%s,"cohort_returncode":%s}\n' "$pip_status" "$cohort_status" >e2e-logs/final-environment-status.json
          test "$pip_status" -eq 0
          test "$cohort_status" -eq 0


      - name: Upload AMD SGLang complete test and final-environment evidence
        id: upload-complete-evidence
        if: always() && inputs.final_environment_check && inputs.engine == 'sglang' && inputs.gpu_vendor == 'amd'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.evidence-identity.outputs.complete_artifact }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: error


      - name: Worker failure diagnostics
        if: failure() || cancelled()
        env:
          WORKER_LOG_ARTIFACT: ${{ steps.evidence-identity.outputs.worker_artifact }}
          FINAL_ENVIRONMENT_CHECK: ${{ inputs.final_environment_check && inputs.engine == 'sglang' && inputs.gpu_vendor == 'amd' && '1' || '0' }}
        run: |
          if [ "$FINAL_ENVIRONMENT_CHECK" = 1 ]; then
            bash scripts/ci_dump_worker_logs.sh e2e-logs "$WORKER_LOG_ARTIFACT"
            echo "artifact=${WORKER_LOG_ARTIFACT}" >> "$GITHUB_OUTPUT"
          else
            LABEL=$(echo '${{ inputs.test_dirs }}' | tr '/' '-')
            # Literal pytest node IDs contain colons; preserve old labels for ordinary
            # directory selectors and give node-ID selections a bounded safe digest.
            case "$LABEL" in
              *:*) LABEL="selected-$(printf '%s' '${{ inputs.test_dirs }}' | sha256sum | cut -c1-16)" ;;
            esac
            # vLLM legs can differ only by KV backend; disambiguate the artifact
            SUFFIX=""
            if [ -n "${{ inputs.kv_backend }}" ]; then
              SUFFIX="-${{ inputs.kv_backend }}"
            elif [ "${{ inputs.engine }}" = "vllm" ]; then
              SUFFIX="-${{ inputs.vllm_kv_backend }}"
            fi
            # MoRI-IO lanes differ by transfer mode, and AMD lanes by vendor.
            if [ -n "${{ inputs.vllm_moriio_mode }}" ]; then
              SUFFIX="${SUFFIX}-${{ inputs.vllm_moriio_mode }}"
            fi
            if [ "${{ inputs.gpu_vendor }}" = amd ]; then
              SUFFIX="${SUFFIX}-amd"
            fi
            # gRPC and ZMQ chat legs share engine/GPU/test-dir and differ only by
            # wire mode; fold it in so their log artifacts don't collide.
            MODE="${{ inputs.connection_mode }}"
            if [ -n "$MODE" ]; then
              SUFFIX="${SUFFIX}-${MODE}"
            fi
            # A grouped ZMQ lane runs the same suite over the same wire with
            # several engines per worker; its logs are its own.
            DP="${{ inputs.zmq_engine_count }}"
            if [ -n "$DP" ] && [ "$DP" -gt 1 ]; then
              SUFFIX="${SUFFIX}-dp${DP}"
            fi
            # The worker-side media lane reuses the multimodal test files.
            MM="${{ inputs.mm_processing }}"
            if [ -n "$MM" ]; then
              SUFFIX="${SUFFIX}-mm-${MM}"
            fi
            # A leg that names its servicer runs the same suite as the engine's
            # default leg; keep their log artifacts apart.
            IMPL="${{ inputs.servicer_impl }}"
            if [ -n "$IMPL" ]; then
              SUFFIX="${SUFFIX}-${IMPL}-servicer"
            fi
            ARTIFACT="e2e-worker-logs-${{ inputs.engine }}-gpu${{ inputs.gpu_tier }}-${LABEL}${SUFFIX}"
            bash scripts/ci_dump_worker_logs.sh e2e-logs "$ARTIFACT"
            echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"
          fi
        id: log-snapshot

      - name: Upload worker logs
        id: upload-worker-logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.log-snapshot.outputs.artifact }}
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

      # AMD cleanup verifies process identities and fails on incomplete release.
      # Container/service teardown and GPU release still belong to host admission.
      - name: Stop marked job processes
        if: always() && (inputs.gpu_vendor == 'amd' || env.E2E_JOB_MARKER != '')
        run: |
          if [ "${{ inputs.gpu_vendor }}" = amd ]; then
            python3 scripts/ci_reap_job_processes.py --strict "${E2E_JOB_MARKER:-}"
          else
            python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER"
          fi

      # The prebuilt TokenSpeed payload is a per-job copy on the node's shared
      # NVMe cache (scripts/ci_fetch_tokenspeed_prebuilt.sh); drop it so the
      # cache does not keep one copy per lane. A hard-killed runner never
      # reaches this step; those copies are swept by the next fetch on the node.
      - name: Remove per-job TokenSpeed payload copy
        if: always() && env.TOKENSPEED_PREBUILT_JOB_DIR != ''
        run: rm -rf "$TOKENSPEED_PREBUILT_JOB_DIR"

      - name: Cleanup Oracle test users
        if: always() && inputs.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-flyway-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-user oracle-db
