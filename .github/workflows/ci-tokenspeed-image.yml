name: CI TokenSpeed Image

# Bakes the pinned TokenSpeed build (engine + kernel + scheduler) into a
# runner-matched carrier image (ubuntu:24.04 — the GPU e2e jobs run bare on
# the runner pods, so this is extracted at job time, not used as a job
# container; see docker/ci-tokenspeed.Dockerfile) and pushes it under the
# content-addressed tag printed by scripts/ci_tokenspeed_image_tag.sh
# (engine ref + a hash of the image tooling). The tokenspeed e2e lanes in
# pr-test-rust.yml pull this image (resolved in detect-changes) instead of
# spending ~25 GPU-runner-minutes compiling from source in every job.
#
# The kernel compile needs nvcc but no GPU (arch list is pinned in
# scripts/ci_install_tokenspeed.sh), so this runs on the docker runner pool.
#
# Lifecycle: a PR bumping .github/versions/tokenspeed.ref (or touching the
# image tooling) falls back to the source build — the image for the new tag
# doesn't exist yet, detect-changes resolves an empty image, and the lanes
# degrade gracefully. This workflow builds the new tag on merge, and every
# subsequent run is fast again.

on:
  push:
    branches: [main]
    paths:
      - '.github/versions/tokenspeed.ref'
      - 'docker/ci-tokenspeed.Dockerfile'
      - 'scripts/ci_install_tokenspeed.sh'
      - 'scripts/ci_setup_python_venv.sh'
      - 'scripts/ci_tokenspeed_image_tag.sh'
      - '.github/workflows/ci-tokenspeed-image.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and push even if the tag already exists'
        default: false
        type: boolean
      base_image:
        description: 'Base image override (default: ubuntu:24.04, matching the runner pods)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-tokenspeed-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'smg-project/smg'
    runs-on: ${{ vars.SMG_RUNNER_DOCKER || 'cpu-e5' }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve ref, tag, and base image
        id: resolve
        env:
          BASE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          # Unlike the tolerant resolution in detect-changes, THIS workflow
          # must fail loudly on a broken ref — its whole job is the image.
          tag="$(bash scripts/ci_tokenspeed_image_tag.sh)"
          # ubuntu:24.04 matches the runner pods (see the Dockerfile's
          # portability contract); the dispatch input can override it.
          base="${BASE_OVERRIDE:-ubuntu:24.04}"
          image="ghcr.io/${{ github.repository_owner }}/smg:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "**Image:** \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base:** \`${base}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are content-addressed (engine ref + image-tooling hash, see
      # scripts/ci_tokenspeed_image_tag.sh), so an existing tag means the
      # work is already done (unless force is set).
      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true' || inputs.force
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci-tokenspeed.Dockerfile
          push: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ steps.resolve.outputs.base }}
          tags: ${{ steps.resolve.outputs.image }}

      - name: Clean up local images
        if: always()
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          docker rmi "$IMAGE" || true
          docker rmi "$BASE" || true
