name: CI TokenSpeed Image

# Publishes a runner-matched carrier tagged by the TokenSpeed nightly date.
# Jobs still upgrade nightly wheels and validate their FlashInfer artifacts.

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/versions/tokenspeed.ref'
      - 'docker/ci-tokenspeed.Dockerfile'
      - 'scripts/ci_apt_mirror.sh'
      - 'scripts/ci_ensure_python_headers.sh'
      - 'scripts/ci_install_tokenspeed.sh'
      - 'scripts/ci_install_flashinfer.py'
      - 'scripts/ci_retry.sh'
      - 'scripts/ci_setup_python_venv.sh'
      - 'scripts/ci_tokenspeed_image_tag.sh'
      - '.github/workflows/ci-tokenspeed-image.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild and push even if the tag already exists'
        default: false
        type: boolean
      base_image:
        description: 'Base image override (default: ubuntu:24.04, matching the runner pods)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-tokenspeed-image
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.repository == 'smg-project/smg'
    runs-on: ${{ vars.SMG_RUNNER_DOCKER || 'cpu-e5' }}
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve ref, tag, and base image
        id: resolve
        env:
          BASE_OVERRIDE: ${{ inputs.base_image }}
        run: |
          # Unlike the tolerant resolution in detect-changes, THIS workflow
          # must fail loudly on a broken ref — its whole job is the image.
          version="$(bash scripts/ci_tokenspeed_image_tag.sh --version)"
          tag="ci-tokenspeed-${version##*post}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # ubuntu:24.04 matches the runner pods (see the Dockerfile's
          # portability contract); the dispatch input can override it.
          base="${BASE_OVERRIDE:-ubuntu:24.04}"
          image="ghcr.io/${{ github.repository_owner }}/smg:${tag}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"
          echo "**Image:** \`${image}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Base:** \`${base}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Rebuild on tooling changes even when today's nightly already exists.
      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.exists != 'true' || inputs.force || github.event_name == 'push'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker

      - name: Build and push image
        if: steps.exists.outputs.exists != 'true' || inputs.force || github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/ci-tokenspeed.Dockerfile
          push: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ steps.resolve.outputs.base }}
            TOKENSPEED_VERSION=${{ steps.resolve.outputs.version }}
          tags: ${{ steps.resolve.outputs.image }}

      - name: Clean up local images
        if: always()
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          BASE: ${{ steps.resolve.outputs.base }}
        run: |
          docker rmi "$IMAGE" || true
          docker rmi "$BASE" || true

  # Keep recent carriers for jobs that already resolved an older digest.
  prune:
    needs: [build-and-push]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install gh CLI
        run: |
          if ! command -v gh &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            GH_VERSION="2.74.0"
            GH_SHA256="e55c9d49dc49c0b0fef0a9acd3510482fd9e27ff52ae80f8a6e838cd25b4cd89"
            curl -fsSL --connect-timeout 10 --max-time 120 -o /tmp/gh.tgz \
              "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
            echo "${GH_SHA256}  /tmp/gh.tgz" | sha256sum --check --quiet
            tar xzf /tmp/gh.tgz --strip-components=2 -C "$HOME/.local/bin" "gh_${GH_VERSION}_linux_amd64/bin/gh"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Prune superseded images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci_prune_tokenspeed_images.sh
