name: Nightly PD Topologies

# Sweeps every prefill/decode topology a 4-GPU node allows (1p1d, 1p2d, 2p1d,
# 1p3d, 3p1d, 2p2d) plus a fleet assembled at runtime, per engine. The PR lane
# e2e-4gpu-pd runs one topology; this is where the rest get exercised.

on:
  schedule:
    - cron: "45 9 * * *" # 09:45 UTC daily, after the nightly image builds
  workflow_dispatch:
    inputs:
      engines:
        description: "Space-separated engines (sglang vllm tokenspeed vllm-amd; opt-in vllm-amd-moriio-read); empty = default lanes"
        required: false
        default: ""
      filter:
        description: "pytest -k expression (e.g. 1p3d, or 'not AssembledAtRuntime'); empty = every topology"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: nightly-pd
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      amd_read_rdma_options_json: ${{ steps.plan.outputs.amd_read_rdma_options_json }}
    steps:
      - id: plan
        env:
          ENGINES: ${{ inputs.engines }}
          TEST_FILTER: ${{ inputs.filter }}
          AMD_ENABLED: ${{ vars.SMG_RUN_AMD_LEGS }}
          AMD_RDMA_OPTIONS: ${{ vars.SMG_AMD_RDMA_CONTAINER_OPTIONS }}
        run: |
          wanted="${ENGINES:-sglang vllm tokenspeed}"
          # vllm-amd needs AMD's self-hosted runner; until it is online
          # (SMG_RUN_AMD_LEGS=true) only a dispatch that names it runs it.
          if [ -z "$ENGINES" ] && [ "$AMD_ENABLED" = true ]; then
            wanted="$wanted vllm-amd"
          fi
          for engine in $wanted; do
            if [ "$engine" = vllm-amd-moriio-read ]; then
              if [ -n "$TEST_FILTER" ]; then
                echo "ERROR: READ/RDMA runs the complete topology suite; leave filter empty" >&2
                exit 1
              fi
              python3 - <<'PY_OPTIONS'
          import os
          import re
          import shlex

          args = shlex.split(os.environ["AMD_RDMA_OPTIONS"])
          devices = []
          for i, arg in enumerate(args):
              if arg == "--device" and i + 1 < len(args):
                  devices.append(args[i + 1].split(":", 1)[0])
              elif arg.startswith("--device="):
                  devices.append(arg.split("=", 1)[1].split(":", 1)[0])
          if "/dev/infiniband" not in devices and not (
              "/dev/infiniband/rdma_cm" in devices
              and any(re.fullmatch(r"/dev/infiniband/uverbs[0-9]+", p) for p in devices)
          ):
              raise SystemExit("READ/RDMA needs explicit InfiniBand device options")
          PY_OPTIONS
              # Capture the public device options once, not a later vars lookup.
              options_json=$(jq -cn --arg options "$AMD_RDMA_OPTIONS" '$options')
              echo "amd_read_rdma_options_json=$options_json" >> "$GITHUB_OUTPUT"
            fi
          done
          # One row per engine, plus each engine's other KV transport: vLLM over
          # Mooncake next to its NIXL default, SGLang over NIXL next to its
          # Mooncake default (TokenSpeed only has Mooncake). The NIXL row skips
          # the peer-restart tests: the SGLang prefill segfaults when its decode
          # comes back on the same address (#2503). vllm-amd is vLLM over NIXL
          # and over MoRI-IO in WRITE mode; automatic READ mode is left out
          # while its decode faults on its first transfer over XGMI on AMD's
          # MI300X runners (vllm-project/vllm#61144).
          matrix=$(printf '%s\n' $wanted | jq -Rsc '
            split("\n") | map(select(length > 0)) |
            map(if . == "vllm" then [{engine: "vllm"}, {engine: "vllm", kv_backend: "mooncake"}]
                elif . == "sglang" then [{engine: "sglang"},
                  {engine: "sglang", kv_backend: "nixl",
                   filter: "not sole_leg_outage and not survives_losing"}]
                elif . == "vllm-amd-moriio-read" then [
                  {engine: "vllm", kv_backend: "moriio", moriio_mode: "read", moriio_backend: "rdma", vendor: "amd"}]
                elif . == "vllm-amd" then [
                  {engine: "vllm", kv_backend: "nixl", vendor: "amd"},
                  {engine: "vllm", kv_backend: "moriio", moriio_mode: "write", vendor: "amd"}]
                else [{engine: .}] end) | add')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  build-wheel:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build Python wheel
        run: |
          rm -rf bindings/python/dist/
          bash scripts/ci_setup_python_venv.sh
          bash scripts/ci_build_wheel.sh

      - name: Generate Python client types
        run: |
          source "$HOME/.cargo/env"
          mkdir -p clients/openapi
          cargo run -p openapi-gen -- clients/openapi/smg-openapi.yaml
          pip install 'datamodel-code-generator==0.54.0'
          datamodel-codegen \
            --input clients/openapi/smg-openapi.yaml \
            --input-file-type openapi \
            --output clients/python/smg_client/types/_generated.py \
            --output-model-type pydantic_v2.BaseModel \
            --use-annotated \
            --field-constraints \
            --target-python-version 3.10 \
            --collapse-root-models \
            --use-standard-collections \
            --use-union-operator
          sed -i 's/class \(.*\)(Enum):/class \1(str, Enum):/' clients/python/smg_client/types/_generated.py

      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: bindings/python/dist/*.whl
          retention-days: 1

      - name: Upload Python client types
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: clients/python/smg_client/types/_generated.py
          retention-days: 1

      - name: Upload WASM test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/*.wasm
          retention-days: 1
          if-no-files-found: ignore

  # Same resolution as detect-changes in pr-test-rust.yml: the prebuilt
  # TokenSpeed carrier image, or empty to build from source.
  tokenspeed-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve TokenSpeed CI image
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          tag="$(bash scripts/ci_tokenspeed_image_tag.sh 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            candidate="ghcr.io/${REPO_OWNER}/smg:${tag}"
            if docker login ghcr.io -u "$GH_ACTOR" --password-stdin <<< "$GH_TOKEN" > /dev/null 2>&1 \
               && manifest="$(docker manifest inspect --verbose "$candidate" 2>/dev/null)"; then
              digest="$(jq -r 'if type == "array" then .[] | select(.Descriptor.platform.os == "linux" and .Descriptor.platform.architecture == "amd64") | .Descriptor.digest else .Descriptor.digest // empty end' <<< "$manifest")"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                image="${candidate}@${digest}"
              fi
            fi
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "TokenSpeed image: ${image:-none (nightly wheel install)}"

  pd-topologies:
    name: pd-topologies (${{ matrix.engine }}${{ matrix.kv_backend && format('-{0}', matrix.kv_backend) || '' }}${{ matrix.moriio_mode && format('-{0}', matrix.moriio_mode) || '' }}${{ matrix.vendor && format('-{0}', matrix.vendor) || '' }})
    needs: [plan, build-wheel, tokenspeed-image]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "4"
      runner: ${{ matrix.vendor == 'amd' && (vars.SMG_RUNNER_AMD_GPU_8 || '8-gpu-mi300x') || (vars.SMG_RUNNER_GPU_4 || '4-gpu-h100') }}
      # The AMD rows run in vLLM's ROCm image of the CI's vLLM pin
      # (scripts/ci_install_vllm.sh), which ships NIXL, UCX and MoRI. The
      # container gets the GPUs, the runner's model cache and its HF_TOKEN, but
      # no RDMA devices by default, so those rows move KV over XGMI. An explicit
      # READ/RDMA dispatch instead requires the dedicated, verified RDMA options.
      gpu_vendor: ${{ matrix.vendor || 'nvidia' }}
      container_image: ${{ matrix.vendor == 'amd' && 'vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f' || '' }}
      container_options: ${{ matrix.moriio_backend == 'rdma' && fromJSON(needs.plan.outputs.amd_read_rdma_options_json) || (matrix.vendor == 'amd' && (vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN') || '') }}
      vllm_moriio_mode: ${{ matrix.moriio_mode || '' }}
      vllm_moriio_backend: ${{ matrix.moriio_backend || (matrix.kv_backend == 'moriio' && 'xgmi' || '') }}
      # The whole sweep: ten topologies (eight gRPC, two HTTP), eight on
      # TokenSpeed (no HTTP frontend), each with worker restarts; TokenSpeed
      # also extracts its engine image and loads a slower model. Run
      # 34433711319 took 58 min (sglang), 55 (vllm), 35 (vllm-mooncake) and
      # 78 (tokenspeed) end to end.
      timeout: ${{ matrix.engine == 'tokenspeed' && 190 || 170 }}
      test_timeout: ${{ matrix.engine == 'tokenspeed' && 170 || 150 }}
      test_dirs: e2e_test/router/test_pd_topologies.py
      kv_backend: ${{ matrix.kv_backend || '' }}
      vllm_kv_backend: ${{ matrix.kv_backend || 'nixl' }}
      # The mixed-transport fleet needs both vLLM backends installed whatever the
      # row's own; the AMD image has no Mooncake, so those rows skip that fleet.
      vllm_extra_kv_backends: ${{ matrix.engine == 'vllm' && matrix.vendor != 'amd' && 'mooncake' || '' }}
      # A row's own filter always applies; a dispatch filter narrows within it.
      test_filter: >-
        ${{ (inputs.filter != '' && matrix.filter != '')
            && format('-k "({0}) and ({1})"', inputs.filter, matrix.filter)
            || (inputs.filter != '' && format('-k "{0}"', inputs.filter))
            || (matrix.filter != '' && format('-k "{0}"', matrix.filter))
            || '' }}
      extra_models: ${{ matrix.engine == 'tokenspeed' && 'Qwen/Qwen3.5-9B' || '' }}
      min_selected: 0
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.tokenspeed-image.outputs.image || '' }}
    secrets: inherit
