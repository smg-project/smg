name: Benchmark - Stream State Machines

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-stream-state-machines.yml'
      - '.github/bench-gates/stream-state-machines.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/stream_state_machines.rs'
      - 'model_gateway/src/routers/grpc/**'
      - 'model_gateway/src/routers/common/**'
      - 'crates/grpc_client/src/**'
      - 'crates/tokenizer/src/**'
      - 'crates/symphony/src/**'
      - 'crates/tool_parser/src/**'
      - 'crates/reasoning_parser/src/**'
      - 'crates/protocols/src/**'
      - '!model_gateway/src/**/tests/**'
      - '!model_gateway/src/**/*_test.rs'
      - '!model_gateway/src/**/test_*.rs'
      - '!model_gateway/src/routers/grpc/tokenizer_cache/**'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-stream-state-machines.yml'
      - '.github/bench-gates/stream-state-machines.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/stream_state_machines.rs'
      - 'model_gateway/src/routers/grpc/**'
      - 'model_gateway/src/routers/common/**'
      - 'crates/grpc_client/src/**'
      - 'crates/tokenizer/src/**'
      - 'crates/symphony/src/**'
      - 'crates/tool_parser/src/**'
      - 'crates/reasoning_parser/src/**'
      - 'crates/protocols/src/**'
      - '!model_gateway/src/**/tests/**'
      - '!model_gateway/src/**/*_test.rs'
      - '!model_gateway/src/**/test_*.rs'
      - '!model_gateway/src/routers/grpc/tokenizer_cache/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-stream-state-machines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Stream State Machines
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    env:
      # Every bench binary of this job, the gate's pair and the summary run's,
      # places every function on a 64-byte boundary, so a pull request's code
      # size does not move the unchanged hot functions into another placement
      # class (the two speed states of identical code described in
      # .github/bench-gates/stream-state-machines.toml). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in .github/bench-gates/stream-state-machines.toml; the job fails on a gated
      # regression. A push to main keeps the single run.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py .github/bench-gates/stream-state-machines.toml "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates .github/bench-gates/stream-state-machines.toml \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg --bench stream_state_machines --no-run

      # A base without the bench source (the first pull request that adds it, a
      # release branch it was not backported to) has nothing to gate against:
      # the base build and the gate are skipped, the step says so, and the pull
      # request's binary runs once on its own as a smoke run of the five rows.
      - name: Build the base branch's benchmark
        id: base
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          if [ -f model_gateway/benches/stream_state_machines.rs ]; then
            python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/stream-state-machines.toml" \
              --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
              cargo bench -p smg --bench stream_state_machines --no-run
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base has no stream_state_machines bench; nothing to gate against."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        timeout-minutes: 40
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates .github/bench-gates/stream-state-machines.toml \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd model_gateway --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run the pull request's benchmark (no base to gate against)
        if: github.event_name == 'pull_request' && steps.base.outputs.present != 'true'
        timeout-minutes: 40
        working-directory: model_gateway
        run: |
          set -o pipefail
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion" "$RUNNER_TEMP/bench-gate/pr" --bench --noplot 2>&1 | tee ../benchmark_output.txt

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench -p smg --bench stream_state_machines 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-state-machines-results-${{ github.sha }}
          path: |
            target/criterion/stream_state_machines/
            benchmark_output.txt
            bench-gate/
          retention-days: 30
