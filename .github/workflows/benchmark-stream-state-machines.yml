name: Benchmark - Stream State Machines

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-stream-state-machines.yml'
      - '.github/bench-gates/stream-state-machines.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/stream_state_machines.rs'
      - 'model_gateway/src/bench_support.rs'
      - 'model_gateway/src/routers/grpc/**'
      - 'model_gateway/src/routers/common/**'
      - 'crates/grpc_client/src/**'
      - 'crates/tokenizer/src/**'
      - 'crates/symphony/src/**'
      - 'crates/tool_parser/src/**'
      - 'crates/reasoning_parser/src/**'
      - 'crates/protocols/src/**'
      - '!model_gateway/src/**/tests/**'
      - '!model_gateway/src/**/*_test.rs'
      - '!model_gateway/src/**/test_*.rs'
      # After the test exclusions: the rows decode with this file's character tokenizer.
      - 'model_gateway/src/test_support.rs'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-stream-state-machines.yml'
      - '.github/bench-gates/stream-state-machines.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/stream_state_machines.rs'
      - 'model_gateway/src/bench_support.rs'
      - 'model_gateway/src/routers/grpc/**'
      - 'model_gateway/src/routers/common/**'
      - 'crates/grpc_client/src/**'
      - 'crates/tokenizer/src/**'
      - 'crates/symphony/src/**'
      - 'crates/tool_parser/src/**'
      - 'crates/reasoning_parser/src/**'
      - 'crates/protocols/src/**'
      - '!model_gateway/src/**/tests/**'
      - '!model_gateway/src/**/*_test.rs'
      - '!model_gateway/src/**/test_*.rs'
      # After the test exclusions: the rows decode with this file's character tokenizer.
      - 'model_gateway/src/test_support.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-stream-state-machines-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Stream State Machines
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in .github/bench-gates/stream-state-machines.toml; the job fails on a gated
      # regression. A push to main keeps the single run.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg --bench stream_state_machines --no-run

      - name: Build the base branch's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --out "$RUNNER_TEMP/bench-gate/base" -- \
            cargo bench -p smg --bench stream_state_machines --no-run
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates .github/bench-gates/stream-state-machines.toml \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd model_gateway --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          cargo bench -p smg --bench stream_state_machines 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stream-state-machines-results-${{ github.sha }}
          path: |
            target/criterion/stream_state_machines/
            benchmark_output.txt
            bench-gate/
          retention-days: 30

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats || true
