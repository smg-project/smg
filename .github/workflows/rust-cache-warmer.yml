name: Rust Cache Warmer

# The rust-lint and rust-tests jobs of PR Test (SMG) restore the Rust cache
# entry that main saved under the key `unit-tests` and save nothing
# themselves: the setup-rust action saves on main only, and only from a job
# that completed. Main's own jobs seldom complete, because the next push to
# main cancels the run in progress and a flock of merges leaves none of them
# the time a build takes, so this workflow builds every test shard and every
# clippy configuration of scripts/ci_rust_tests.sh on main on a schedule, with
# the same action inputs and the same environment those jobs have (the cache
# key hashes both), and saves the complete entry the pull requests then
# restore. Its concurrency group is its own, so no merge cancels it, and a run
# that fails saves nothing (smg-project/smg-lab#157).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: rust-cache-warmer
  cancel-in-progress: false

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  warm-unit-tests-cache:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The same interpreter the test jobs build the Python bindings against,
      # so the artifacts they restore are the ones they would build.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: unit-tests

      # The all-features clippy leg builds the opencv-video feature.
      - name: Install OpenCV build dependencies
        run: AUTO_INSTALL=1 bash scripts/install_opencv.sh

      # The same commands as the rust-tests job's "Build the Rust tests" step,
      # shard by shard, so the target directory saved at the end of the job
      # holds what every shard would build.
      - name: Build the Rust tests of every shard
        run: |
          source "$HOME/.cargo/env"
          for shard in $(bash scripts/ci_rust_tests.sh list | awk '{print $1}'); do
            bash scripts/ci_rust_tests.sh build "$shard"
          done

      # The clippy legs of the rust-lint job: their dependency artifacts (the
      # check profile) join the entry, so a pull request lints only what it
      # changed.
      - name: Lint
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          for leg in all-features self-hosted anthropic-only; do
            bash scripts/ci_rust_tests.sh lint "$leg"
          done

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
