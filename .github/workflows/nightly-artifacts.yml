name: Nightly Artifacts

# Publishes last night's wheels and crate tarballs as a dated prerelease on
# this repo, so "last night's smg" is installable without building it.
#
# Runs between the two nightly image builds (06:00 gateway, 07:00 engines) so
# one prerelease page can name the images of the same night.
#
# Deliberately not published to PyPI or crates.io: versions there are
# permanent and cannot be pruned. Retention for these prereleases is handled
# by nightly-prune.yml.

on:
  schedule:
    # 06:30 UTC daily — after nightly-docker (06:00), before the engine images.
    - cron: '30 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and check everything, but do not create the release'
        type: boolean
        default: false
  # Self-validating: a PR touching this file builds everything and skips the
  # release, the same shape release-pypi-dev.yml uses.
  pull_request:
    paths:
      - .github/workflows/nightly-artifacts.yml

concurrency:
  group: nightly-artifacts
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A pull_request run is always a dry run; a dispatch run honours the input.
  DRY_RUN: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}

jobs:
  prepare:
    name: Compute versions and tag
    if: github.repository == 'smg-project/smg'
    runs-on: ubuntu-latest
    outputs:
      smg_version: ${{ steps.compute.outputs.smg_version }}
      proto_version: ${{ steps.compute.outputs.proto_version }}
      servicer_version: ${{ steps.compute.outputs.servicer_version }}
      release_tag: ${{ steps.compute.outputs.release_tag }}
      image_suffix: ${{ steps.compute.outputs.image_suffix }}
    steps:
      - uses: actions/checkout@v7

      - id: compute
        run: |
          set -euo pipefail
          # Same suffix shape the image builds use, so the prerelease and the
          # images of one night are named consistently.
          IMAGE_SUFFIX="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          DEV="dev$(date -u +%Y%m%d)"

          read_version() {
            grep -m1 '^version = ' "$1" | sed 's/version = "\(.*\)"/\1/'
          }

          # Bump patch so a dev version sorts AFTER the current stable in
          # PEP 440 ordering, matching release-pypi-dev.yml.
          bump_patch() {
            local IFS=.
            # shellcheck disable=SC2206
            local parts=($1)
            parts[2]=$(( ${parts[2]} + 1 ))
            echo "${parts[0]}.${parts[1]}.${parts[2]}"
          }

          {
            echo "smg_version=$(bump_patch "$(read_version bindings/python/pyproject.toml)").${DEV}"
            echo "proto_version=$(bump_patch "$(read_version crates/grpc_client/python/pyproject.toml)").${DEV}"
            echo "servicer_version=$(bump_patch "$(read_version grpc_servicer/pyproject.toml)").${DEV}"
            echo "release_tag=nightly-${IMAGE_SUFFIX}"
            echo "image_suffix=${IMAGE_SUFFIX}"
          } >> "$GITHUB_OUTPUT"

  build-smg:
    name: Build smg wheel and sdist
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: smg-repo

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Keeps smg.__version__, the Rust runtime banner and pyproject.toml
      # reporting the same version. PEP 440 for Python, semver for Cargo.
      - name: Patch dev version
        working-directory: smg-repo
        env:
          SMG_VERSION: ${{ needs.prepare.outputs.smg_version }}
        run: |
          set -euo pipefail
          SMG_CARGO_VERSION="${SMG_VERSION/.dev/-dev}"
          sed -i.bak "s/^version = \".*\"/version = \"${SMG_VERSION}\"/" bindings/python/pyproject.toml
          sed -i.bak "s/__version__ = \".*\"/__version__ = \"${SMG_VERSION}\"/" bindings/python/src/smg/version.py
          sed -i.bak "s/^version = \".*\"/version = \"${SMG_CARGO_VERSION}\"/" model_gateway/Cargo.toml
          rm -f bindings/python/pyproject.toml.bak bindings/python/src/smg/version.py.bak model_gateway/Cargo.toml.bak

      - name: Build manylinux x86_64 wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: smg-repo/bindings/python
          target: x86_64
          manylinux: auto
          # A dry run builds one interpreter to stay fast; the nightly builds
          # the full matrix.
          args: --release --out dist --features vendored-openssl --interpreter ${{ env.DRY_RUN == 'true' && '3.12' || '3.10 3.11 3.12 3.13' }}
          rust-toolchain: 1.98.0
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum update -y && yum install -y wget unzip gcc gcc-c++ perl-core make
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y wget unzip gcc g++ perl make
            fi
            (cd /tmp && \
             wget https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip && \
             unzip protoc-32.0-linux-x86_64.zip -d /usr/local && \
             rm protoc-32.0-linux-x86_64.zip)
            protoc --version

      # The manylinux build runs as root in Docker, so dist/ comes back
      # root-owned and the host-side sdist step cannot write to it.
      - name: Reclaim dist ownership
        run: |
          sudo chown -R "$(whoami):$(whoami)" smg-repo/bindings/python/dist
          ls -la smg-repo/bindings/python/dist

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: smg-repo/bindings/python
          command: sdist
          args: --out dist
          rust-toolchain: 1.98.0

      - name: Check packages
        run: |
          pip install -U twine
          twine check --strict smg-repo/bindings/python/dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-smg-dist
          path: smg-repo/bindings/python/dist/

  build-python-packages:
    name: Build ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: smg-grpc-proto
            dir: crates/grpc_client/python
            version_output: proto_version
          - name: smg-grpc-servicer
            dir: grpc_servicer
            version_output: servicer_version
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install build twine grpcio-tools

      - name: Patch dev version
        env:
          VERSION: ${{ matrix.version_output == 'proto_version' && needs.prepare.outputs.proto_version || needs.prepare.outputs.servicer_version }}
        run: |
          set -euo pipefail
          sed -i.bak "s/^version = \".*\"/version = \"${VERSION}\"/" "${{ matrix.dir }}/pyproject.toml"
          rm -f "${{ matrix.dir }}/pyproject.toml.bak"

      # The proto package ships its .proto files through a symlink in the
      # repo; a source build needs real files inside the package directory.
      - name: Materialize proto files
        if: matrix.name == 'smg-grpc-proto'
        run: |
          set -euo pipefail
          cd ${{ matrix.dir }}
          for link in $(find . -type l); do
            target="$(readlink -f "$link")"
            rm "$link"
            cp -r "$target" "$link"
          done

      - name: Build
        run: python -m build --outdir dist ${{ matrix.dir }}

      - name: Check packages
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.name }}-dist
          path: dist/

  package-crates:
    name: Package crates
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0

      - name: Install protoc
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          protoc --version

      # Two deliberate choices here, both forced by how `cargo package` works.
      #
      # Versions are NOT patched to a dev version: cargo verifies a packaged
      # crate by building it against its dependencies AS PUBLISHED, so a
      # version that exists nowhere could never verify.
      #
      # Verification is off for the same reason, one level down. A workspace
      # crate can carry the same version number as its published release while
      # its contents have moved on — `openai-protocol` currently does, and a
      # dependent that uses a field added since the publish fails to build
      # against the registry copy. A nightly is by definition ahead of what is
      # published, so a verify build measures the registry, not this commit.
      # `cargo package --list` is the check instead: it proves the manifest
      # resolves and the file set is well formed, which is what the tarball is.
      - name: Package crates in dependency tier order
        run: |
          set -euo pipefail
          mkdir -p crate-dist filelists

          TIER1="crates/protocols crates/reasoning_parser crates/kv_index crates/data_connector crates/workflow crates/auth crates/mcp crates/mm_rdma crates/engine_zmq_client crates/radix_tree"
          TIER2="crates/tool_parser crates/grpc_client clients/rust crates/mesh crates/wasm crates/tokenizer crates/rl crates/external_router"
          TIER3="crates/multimodal"
          TIER4="model_gateway"

          failed=""
          skipped=""
          for path in $TIER1 $TIER2 $TIER3 $TIER4; do
            name="$(grep -m1 '^name = ' "$path/Cargo.toml" | sed 's/name = "\(.*\)"/\1/')"
            echo "::group::cargo package ${name} (${path})"
            # --list is the acceptance check: it proves the manifest resolves
            # and the file set is well formed, without a full verify build.
            if ! cargo package --list -p "$name" > "filelists/${name}.txt"; then
              echo "::error::cargo package --list failed for ${name}"
              failed="${failed} ${name}"
              echo "::endgroup::"
              continue
            fi
            if ! cargo package --no-verify -p "$name" 2> "pkg-${name}.err"; then
              # Packaging rewrites path dependencies to registry dependencies,
              # so a crate whose dependency has never been published cannot be
              # packaged at all. That is a fact about the registry, not about
              # this commit, and it would fail every night until someone
              # publishes it — so it is recorded loudly and skipped, while any
              # other failure still fails the job.
              if grep -q "no matching package named" "pkg-${name}.err"; then
                dep="$(sed -n 's/.*no matching package named `\([^`]*\)`.*/\1/p' "pkg-${name}.err" | head -1)"
                echo "::warning::skipping ${name}: depends on unpublished crate ${dep}"
                skipped="${skipped} ${name}(needs ${dep})"
              else
                cat "pkg-${name}.err"
                echo "::error::cargo package failed for ${name}"
                failed="${failed} ${name}"
              fi
            fi
            rm -f "pkg-${name}.err"
            echo "::endgroup::"
          done

          find target/package -maxdepth 1 -name '*.crate' -exec cp {} crate-dist/ \;
          echo "Packaged $(find crate-dist -name '*.crate' | wc -l) crates"

          {
            echo "### Crates"
            echo ""
            echo "Packaged: $(find crate-dist -name '*.crate' | wc -l)"
            [ -n "$skipped" ] && echo "Skipped (dependency not on crates.io):${skipped}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$failed" ]; then
            echo "::error::crates failed to package:${failed}"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nightly-crate-dist
          path: crate-dist/

  release:
    name: Publish prerelease
    needs: [prepare, build-smg, build-python-packages, package-crates]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: staging
          pattern: nightly-*
          merge-multiple: true

      - name: List what will be attached
        run: |
          set -euo pipefail
          ls -la staging
          {
            echo "## Nightly artifacts"
            echo ""
            echo "| File | Size |"
            echo "|---|---|"
            for f in staging/*; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create prerelease
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          IMAGE_SUFFIX: ${{ needs.prepare.outputs.image_suffix }}
          SMG_VERSION: ${{ needs.prepare.outputs.smg_version }}
          PROTO_VERSION: ${{ needs.prepare.outputs.proto_version }}
          SERVICER_VERSION: ${{ needs.prepare.outputs.servicer_version }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"

          cat > notes.md <<EOF
          Nightly build of \`${GITHUB_SHA}\`.

          Not published to PyPI or crates.io. These files are pruned after seven days.

          ## Wheels

          | Package | Version |
          |---|---|
          | smg | ${SMG_VERSION} |
          | smg-grpc-proto | ${PROTO_VERSION} |
          | smg-grpc-servicer | ${SERVICER_VERSION} |

          Install the gateway wheel straight from this release:

          \`\`\`
          pip install https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/<wheel filename>
          \`\`\`

          ## Crates

          The \`.crate\` tarballs are the 19 workspace crates packaged at this commit,
          carrying their current workspace versions. crates.io is untouched.

          ## Images of the same night

          \`\`\`
          ghcr.io/${OWNER}/smg:nightly-${IMAGE_SUFFIX}
          ghcr.io/${OWNER}/smg:nightly-${IMAGE_SUFFIX}-vllm-<ver>
          ghcr.io/${OWNER}/smg:nightly-${IMAGE_SUFFIX}-sglang-<ver>
          ghcr.io/${OWNER}/smg:nightly-${IMAGE_SUFFIX}-trtllm-<ver>
          ghcr.io/${OWNER}/smg:nightly-${IMAGE_SUFFIX}-tokenspeed-<ver>
          \`\`\`
          EOF

          gh release create "$RELEASE_TAG" staging/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nightly ${IMAGE_SUFFIX}" \
            --notes-file notes.md \
            --prerelease

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        run: echo "DRY_RUN is set; built and checked everything, created no release." >> "$GITHUB_STEP_SUMMARY"
