name: AMD SGLang complete original default chat validation
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-sglang-chat-original-full
  cancel-in-progress: false
jobs:
  artifact-relay:
    if: inputs.execute
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require one separately admitted complete SGLang default chat row
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path(".github/amd-shared-product/inputs.json").read_text())
          assert data["admitted_lane"] == "sglang-default-chat-full"
          assert data["runtime_cohort_accepted"] is True
          assert all(data[key] is True for key in ("ready", "run_budget_admitted", "artifacts_pinned"))
          recipe = data["recipe"]
          assert recipe["test_dirs"] == "e2e_test/chat_completions" and recipe["test_filter"] == ""
          assert recipe["engine"] == "sglang" and recipe["gpu_tier"] == "1"
          assert recipe["connection_mode"] == "" and recipe["min_selected"] == 204
          assert recipe["parser"] == ""
          assert recipe["servicer_unit_tests"] is False and recipe["unit_test_dirs"] == ""
          assert recipe["job_minutes"] == 36 and recipe["pytest_minutes"] == 28
          assert recipe["reruns"] == 2 and recipe["reruns_delay"] == 5
          assert recipe["setup_agentic_deps"] is False and recipe["same_original_tests_and_oracles"] is True
          PYTHON
      - name: Verify external producer and relay payloads
        id: relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIRECTORY="$RUNNER_TEMP/shared-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          python3 .github/amd-shared-product/relay.py --out "$DIRECTORY"
      - name: Relay wheel without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ steps.relay.outputs.directory }}/smg-wheel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Go FFI without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ steps.relay.outputs.directory }}/go-ffi-library/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay WASM without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ steps.relay.outputs.directory }}/wasm-test-fixtures/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Python types without changing their bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ steps.relay.outputs.directory }}/python-client-types/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve external producer identity and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-producer-relay-evidence
          path: ${{ steps.relay.outputs.directory }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
  amd-sglang-chat:
    needs: artifact-relay
    if: inputs.execute && needs.artifact-relay.result == 'success'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 36
      test_timeout: 28
      test_dirs: e2e_test/chat_completions
      min_selected: 204
      servicer_unit_tests: false
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --ulimit memlock=-1:-1 --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }} --env SPT_NOENV=1 --env SGLANG_GPT_OSS_MXFP4_BF16=1 --env PYTHONDONTWRITEBYTECODE=1
    secrets: inherit

  finish:
    if: always() && inputs.execute
    needs: [artifact-relay, amd-sglang-chat]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 3
    steps:
      - name: Require the relay and complete SGLang default chat row to succeed
        env:
          RELAY: ${{ needs.artifact-relay.result }}
          SG: ${{ needs.amd-sglang-chat.result }}
        run: test "$RELAY" = success && test "$SG" = success
