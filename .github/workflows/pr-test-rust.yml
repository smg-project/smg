name: AMD Go bindings complete original23 validation
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-go-bindings-original23
  cancel-in-progress: false
jobs:
  artifact-relay:
    if: inputs.execute
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require one separately admitted complete Go row
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path(".github/amd-shared-product/inputs.json").read_text())
          assert data["admitted_lane"] == "go-bindings-full23"
          assert data["runtime_cohort_accepted"] is True
          assert all(data[key] is True for key in ("ready", "run_budget_admitted", "artifacts_pinned"))
          recipe = data["recipe"]
          assert recipe["test_dirs"] == "e2e_test/bindings_go" and recipe["test_filter"] == ""
          assert recipe["reference_selected"] == 23 and recipe["models"] == ["meta-llama/Llama-3.2-1B-Instruct"]
          assert recipe["connection_mode"] == "grpc" and recipe["reruns"] == 2 and recipe["reruns_delay"] == 5
          assert recipe["job_minutes"] == 30 and recipe["same_original_tests_and_oracles"] is True
          PYTHON
      - name: Verify external producer and relay payloads
        id: relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIRECTORY="$RUNNER_TEMP/shared-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          python3 .github/amd-shared-product/relay.py --out "$DIRECTORY"
      - name: Relay wheel without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ steps.relay.outputs.directory }}/smg-wheel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Go FFI without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ steps.relay.outputs.directory }}/go-ffi-library/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay WASM without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ steps.relay.outputs.directory }}/wasm-test-fixtures/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Python types without changing their bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ steps.relay.outputs.directory }}/python-client-types/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve external producer identity and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-producer-relay-evidence
          path: ${{ steps.relay.outputs.directory }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
  go-bindings-e2e-amd:
    name: go-bindings-e2e-amd
    needs: artifact-relay
    if: inputs.execute && needs.artifact-relay.result == 'success'
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
    container:
      image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      options: >-
        ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --ulimit memlock=-1:-1 --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
        --env SPT_NOENV=1 --env PYTHONDONTWRITEBYTECODE=1
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SMG_SGLANG_ROCM_IMAGE: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      CGO_ENABLED: '1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mark this job's processes
        run: echo "E2E_JOB_MARKER=go-amd-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"

      - name: Setup SGLang ROCm backend
        run: bash scripts/ci_setup_sglang_rocm_e2e.sh

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          go-ffi-library: 'true'
          client-types: 'true'

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Verify final native environment and record Go FFI
        run: |
          mkdir -p e2e-go-results
          python3 scripts/ci_repair_sglang_rocm_native.py --verify-only e2e-go-results/native-environment.json
          python3 -m pip check
          test -s bindings/golang/target/release/libsmg_go.so
          sha256sum bindings/golang/target/release/libsmg_go.so > e2e-go-results/go-ffi.sha256

      - name: Run Go OAI server E2E tests
        run: |
          export CGO_LDFLAGS="-L$(pwd)/bindings/golang/target/release"
          export LD_LIBRARY_PATH="$(pwd)/bindings/golang/target/release:${LD_LIBRARY_PATH:-}"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 ROUTER_LOCAL_MODEL_PATH="/models" \
          E2E_LOG_DIR=e2e-logs \
            pytest --reruns 2 --reruns-delay 5 e2e_test/bindings_go -s -vv --junitxml=e2e-go-results/junit.xml

      - name: Record Go OAI binary
        if: always()
        run: |
          if [ -f bindings/golang/examples/oai_server/oai_server ]; then
            mkdir -p e2e-go-results
            sha256sum bindings/golang/examples/oai_server/oai_server > e2e-go-results/go-oai.sha256
          fi

      - name: Reap this job's processes
        if: always()
        run: python3 scripts/ci_reap_job_processes.py "${E2E_JOB_MARKER:-}"

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: bash scripts/ci_dump_worker_logs.sh e2e-logs "e2e-worker-logs-go-bindings-amd"

      - name: Upload Go E2E results and worker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-go-bindings-amd
          path: |
            e2e-go-results/
            e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  finish:
    if: always() && inputs.execute
    needs: [artifact-relay, go-bindings-e2e-amd]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 3
    steps:
      - name: Require the relay and complete Go row to succeed
        env:
          RELAY: ${{ needs.artifact-relay.result }}
          GO: ${{ needs.go-bindings-e2e-amd.result }}
        run: test "$RELAY" = success && test "$GO" = success
