                "${{ needs.e2e-1gpu-completions-amd.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-embeddings-amd.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-completions-sglang-amd.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-embeddings-sglang-amd.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-symphony.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-rust-servicer.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-mm-worker.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-zmq.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-chat-zmq-dp.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-completions.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-embeddings.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-realtime.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-gateway.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-gateway-sglang-amd.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-responses.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-pd.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-pd-mm-worker.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-chat.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-gateway.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-epd.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-pd.result }}" =~ $bad || \
