name: Prepared Runner First Batch (temporary)

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Frozen main push run with a successful build-wheel job and unexpired artifacts'
        default: '38066163530'
        required: true
        type: string
      source_sha:
        description: 'Exact main revision built by source_run'
        default: '657ee979b44d7766f46ac96a19b8be070d21e6d3'
        required: true
        type: string
      engine:
        description: 'One backend per dispatch; wait for GPU return before the next'
        required: true
        type: choice
        options: [vllm, sglang]
      integrated_sha:
        description: 'Frozen all-four-PR integration commit; no application changes'
        required: true
        default: 'b30674ede40154cb385eb8d6b7cf82ae9231d4e8'
        type: string
      profile:
        description: 'One representative pool per dispatch; wait for actual GPU return'
        required: true
        type: choice
        options: ['1g', '2g', '4g']

permissions:
  contents: read
  actions: read

concurrency:
  group: smg-prepared-runner-first-batch
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    env:
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      INTEGRATED_SHA: ${{ inputs.integrated_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Verify same-revision successful CPU artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const runId = process.env.SOURCE_RUN;
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9]+$/.test(runId) || !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid run/SHA');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(runId)});
            if (source.event !== 'push' || source.head_branch !== 'main') throw new Error('Use a main push run with a known checkout revision');
            if (source.head_sha !== sha || source.path !== '.github/workflows/pr-test-rust.yml') throw new Error('Source revision/workflow mismatch');
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: Number(runId), filter: 'latest', per_page: 100});
            const wheelJob = jobs.find(job => job.name === 'build-wheel');
            if (!wheelJob || wheelJob.status !== 'completed' || wheelJob.conclusion !== 'success') throw new Error('Exact-run build-wheel job did not pass');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: Number(runId), per_page: 100});
            const required = ['smg-wheel', 'python-client-types'].map(name => {
              const artifact = artifacts.find(item => item.name === name && !item.expired && Date.parse(item.expires_at) > Date.now());
              if (!artifact) throw new Error(`Missing/expired artifact: ${name}`);
              return {id: artifact.id, name: artifact.name, digest: artifact.digest, expires: artifact.expires_at};
            });
            core.info(JSON.stringify({id: source.id, sha: source.head_sha, url: source.html_url, wheel_job: wheelJob.id, artifacts: required}));
      - name: Verify the frozen integration and unchanged application source
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA" "$INTEGRATED_SHA"
          python3 - <<'PYTHON'
          import os, subprocess
          def git(*args): return subprocess.check_output(['git', *args], text=True).strip()
          source, integrated = os.environ['SOURCE_SHA'], os.environ['INTEGRATED_SHA']
          assert source == '657ee979b44d7766f46ac96a19b8be070d21e6d3', 'Artifact application source changed'
          assert integrated == 'b30674ede40154cb385eb8d6b7cf82ae9231d4e8', 'Integration commit changed'
          assert git('rev-parse', integrated + '^{tree}') == '3e03a1584dc79353c54ce5d4ee02e8fe3a410a3d', 'Integration tree changed'
          ci_paths = {'docker/ci-gpu-runner.Dockerfile', 'scripts/ci_ensure_python_headers.sh', 'scripts/ci_install_vllm.sh', 'scripts/ci_setup_python_venv.sh', '.github/actions/setup-sglang/action.yml', 'scripts/ci_prepared_backend_env.sh', '.github/workflows/ci-gpu-runner-image.yml', 'scripts/ci_install_sglang.sh', 'scripts/tests/test_ci_gpu_runner_image.py', 'scripts/ci_gpu_runner_image.py', '.github/workflows/pr-test-rust.yml', 'scripts/tests/test_ci_prepared_backend_env.py', '.github/actions/setup-vllm/action.yml'}
          changed = set(git('diff', '--name-only', source, integrated).splitlines())
          assert changed == ci_paths, f'Application or approved CI scope changed: {changed ^ ci_paths}'
          temporary = {'.github/workflows/pr-test-rust.yml', '.github/workflows/e2e-gpu-job.yml'}
          patched = set(git('diff', '--name-only', integrated, 'HEAD').splitlines())
          assert patched == temporary, f'Unexpected pilot changes: {patched ^ temporary}'
          print(f'Frozen application {source}; integrated CI {integrated}; only two temporary workflows differ')
          PYTHON
      - name: Download same-revision native wheel
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Download same-revision client types
        uses: actions/download-artifact@v8
        with:
          name: python-client-types
          path: clients/python/smg_client/types/
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: Record artifact checksums
        run: sha256sum wheel/*.whl clients/python/smg_client/types/_generated.py
      - name: Seed wheel into this run
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: wheel/*.whl
          if-no-files-found: error
          retention-days: 1
      - name: Seed client types into this run
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: clients/python/smg_client/types/_generated.py
          if-no-files-found: error
          retention-days: 1

  canary:
    needs: seed
    uses: ./.github/workflows/e2e-gpu-job.yml
    secrets: inherit
    with:
      engine: ${{ inputs.engine }}
      pilot_profile: ${{ inputs.profile }}
      gpu_tier: ${{ (inputs.profile == '1g' || (inputs.profile == '2g' && inputs.engine == 'vllm')) && '1' || '4' }}
      runner: ${{ format('smg-prepared-env-canary-{0}', inputs.profile) }}
      timeout: ${{ inputs.profile == '4g' && 60 || inputs.profile == '2g' && 50 || 45 }}
      test_timeout: ${{ inputs.profile == '4g' && 45 || inputs.profile == '2g' && 30 || 15 }}
      connection_mode: ${{ (inputs.profile == '1g' || (inputs.profile == '2g' && inputs.engine == 'vllm')) && 'zmq' || '' }}
      zmq_engine_count: ${{ inputs.profile == '2g' && inputs.engine == 'vllm' && '2' || inputs.profile == '1g' && '1' || '' }}
      vllm_extra_kv_backends: mooncake
      kv_backend: ${{ inputs.profile != '4g' && 'nixl' || '' }}
      min_selected: ${{ inputs.profile == '4g' && (inputs.engine == 'vllm' && 21 || 20) || inputs.profile == '2g' && inputs.engine == 'sglang' && 4 || 6 }}
      test_dirs: ${{ (inputs.profile == '1g' || (inputs.profile == '2g' && inputs.engine == 'vllm')) && 'e2e_test/chat_completions/test_function_calling.py::TestOpenAIServerFunctionCalling::test_streaming_multiple_choices_without_tools e2e_test/chat_completions/test_function_calling.py::TestToolChoiceLlama::test_tool_choice_required_non_streaming e2e_test/chat_completions/test_validation.py::TestEosTokenStripping::test_no_eos_in_content_default' || inputs.profile == '2g' && 'e2e_test/router/test_pd_topologies.py::TestPDTopology::test_workers_registered_by_role[1p1d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_every_leg_takes_traffic[1p1d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_concurrent_requests_do_not_alias[1p1d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_long_prompt_context_reaches_decode[1p1d]' || inputs.engine == 'vllm' && 'e2e_test/chat_completions/test_openai_server.py::TestChatCompletionGptOss120B::test_chat_completion e2e_test/chat_completions/test_openai_server.py::TestChatCompletionGptOss120B::test_chat_completion_stream e2e_test/router/test_pd_topologies.py::TestPDTopology::test_workers_registered_by_role[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_every_leg_takes_traffic[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_concurrent_requests_do_not_alias[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_long_prompt_context_reaches_decode[2p2d] e2e_test/router/test_pd_topologies.py::TestPDMixedTransport::test_every_request_lands_on_a_matching_pair[2p2d-mixed-kv]' || 'e2e_test/chat_completions/test_openai_server.py::TestChatCompletionGptOss120B::test_chat_completion e2e_test/chat_completions/test_openai_server.py::TestChatCompletionGptOss120B::test_chat_completion_stream e2e_test/router/test_pd_topologies.py::TestPDTopology::test_workers_registered_by_role[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_every_leg_takes_traffic[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_concurrent_requests_do_not_alias[2p2d] e2e_test/router/test_pd_topologies.py::TestPDTopology::test_long_prompt_context_reaches_decode[2p2d]' }}
