name: AMD shared product vLLM four-GPU chat validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-shared-product-vllm-four-gpu-chat
  cancel-in-progress: false
jobs:
  artifact-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify external producer and relay payloads
        id: relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIRECTORY="$RUNNER_TEMP/shared-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          python3 .github/amd-shared-product/relay.py --out "$DIRECTORY"
      - name: Relay wheel without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ steps.relay.outputs.directory }}/smg-wheel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Go FFI without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ steps.relay.outputs.directory }}/go-ffi-library/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay WASM without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ steps.relay.outputs.directory }}/wasm-test-fixtures/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Python types without changing their bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ steps.relay.outputs.directory }}/python-client-types/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve external producer identity and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-producer-relay-evidence
          path: ${{ steps.relay.outputs.directory }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
  amd-product-four-gpu-chat:
    needs: artifact-relay
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: '4'
      runner: 1-gpu-mi300x
      timeout: 30
      test_timeout: 25
      test_dirs: e2e_test/chat_completions
      min_selected: 32
      servicer_unit_tests: true
      extra_deps: ./.github/amd-p4-proof
      gpu_vendor: amd
      container_image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      container_options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN --env SPT_NOENV=1 --env SMG_CI_RUNTIME_STATE_DIR=/tmp/smg-p4-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    secrets: inherit
  finish:
    if: always()
    needs: [artifact-relay, amd-product-four-gpu-chat]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require the actual shared workflow to finish successfully
        env:
          RELAY: ${{ needs.artifact-relay.result }}
          CHAT: ${{ needs.amd-product-four-gpu-chat.result }}
        run: test "$RELAY" = success && test "$CHAT" = success
