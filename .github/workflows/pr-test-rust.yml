name: Four-GPU gRPC Benchmark Canary (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: smg-grpc-benchmark-canary
  cancel-in-progress: false

jobs:
  benchmark-canary:
    runs-on: 4-gpu-h100
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      SERIAL_SHA: 122b6e0d471be0fa358ef307f53bffb797b74788
      PARALLEL_SHA: 79c5342f5577b79c6c29c100eee3ac0136caf431
      GENAI_BENCH_IMAGE: ghcr.io/moirai-internal/genai-bench:0.0.4@sha256:9b503266049da17ae85abbc98ed5d57cf14f0af7643ee43a561c1a85d73a1b1f
      E2E_ENGINE: sglang
      E2E_RUNTIME: sglang
      E2E_MODEL: meta-llama/Llama-3.1-8B-Instruct
      E2E_MODEL_TP_OVERRIDES: ''
      E2E_GPU_TIER: '4'
      E2E_CONNECTION_MODE: ''
      ROUTER_LOCAL_MODEL_PATH: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      GENAI_BENCH_TEST_TIMEOUT: '600'
      BENCH_ENFORCE_THRESHOLDS: '1'
      SHOW_WORKER_LOGS: '0'
      SHOW_ROUTER_LOGS: '1'
    steps:
      - name: Checkout frozen parallel source
        uses: actions/checkout@v7
        with:
          ref: 79c5342f5577b79c6c29c100eee3ac0136caf431
      - name: Checkout frozen serial source
        uses: actions/checkout@v7
        with:
          ref: 122b6e0d471be0fa358ef307f53bffb797b74788
          path: serial-source
      - name: Verify existing native artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            fs.mkdirSync('benchmark-evidence', {recursive: true});
            const {data: job} = await github.rest.actions.getJobForWorkflowRun({...context.repo, job_id: 114082181717});
            if (job.run_id !== 38007927521 || job.name !== 'build-wheel' || job.conclusion !== 'success' || job.head_sha !== '3d23811525a9c3ea944b3f7920a4467a3631c535') throw new Error('Producer job identity/failure');
            const required = [[11652154918, 'smg-wheel', 'sha256:59370997b8e3cc6109a5518274cdf1c479ef1efbd3ae81cf7ec1e15b35fbdf35'], [11652562717, 'python-client-types', 'sha256:f2574f83fe724f5a59960f39a5af8cb0c262ae954f2f526eab47537569b253ad']];
            const artifacts = [];
            for (const [id, name, digest] of required) {
              const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: id});
              if (artifact.name !== name || artifact.digest !== digest || artifact.expired || Date.parse(artifact.expires_at) <= Date.now() || artifact.workflow_run.id !== 38007927521) throw new Error(`Artifact missing/changed/expired: ${id}`);
              artifacts.push({id, name, digest, expires: artifact.expires_at});
            }
            fs.writeFileSync('benchmark-evidence/artifacts.json', JSON.stringify({job: job.id, producer_checkout_sha: process.env.PARALLEL_SHA, artifacts}, null, 2));
      - name: Verify shared production inputs
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, subprocess
          from pathlib import Path
          def inputs(checkout):
              lines = subprocess.check_output(['git', '-C', checkout, 'ls-tree', '-r', 'HEAD'], text=True).splitlines()
              return {path: entry for line in lines for entry, path in [line.split('\t', 1)]
                      if not path.startswith(('e2e_test/', '.github/')) and '/tests/' not in path}
          serial, parallel = inputs('serial-source'), inputs('.')
          assert serial == parallel, 'Production library inputs differ; shared wheel is not justified'
          digest = hashlib.sha256(json.dumps(parallel, sort_keys=True).encode()).hexdigest()
          Path('benchmark-evidence/production-inputs.json').write_text(json.dumps({'equal': True, 'count': len(parallel), 'sha256': digest}, indent=2))
          PYTHON
      - name: Setup one shared SGLang environment
        uses: ./.github/actions/setup-sglang
      - name: Download immutable native wheel
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '11652154918'
          path: wheel/
          run-id: '38007927521'
          github-token: ${{ github.token }}
      - name: Download immutable client types
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '11652562717'
          path: clients/python/smg_client/types/
          run-id: '38007927521'
          github-token: ${{ github.token }}
      - name: Install identical native wheel and test packages
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          cp clients/python/smg_client/types/_generated.py serial-source/clients/python/smg_client/types/
          bash scripts/ci_install_e2e_deps.sh
          sha256sum wheel/*.whl clients/python/smg_client/types/_generated.py > benchmark-evidence/installed-artifacts.sha256
          python3 -c 'import importlib.metadata as m, json, torch; print(json.dumps({"versions": {p:m.version(p) for p in ("smg", "sglang", "torch", "pytest-rerunfailures")}, "cuda": torch.version.cuda}))' > benchmark-evidence/environment.json
      - name: Cache verification and native benchmark image
        run: |
          python3 - <<'PYTHON'
          import importlib.util, json, os
          from pathlib import Path
          model_id = 'meta-llama/Llama-3.1-8B-Instruct'
          spec = importlib.util.spec_from_file_location('canary_model_specs', 'e2e_test/infra/model_specs.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          resolved = module.MODEL_SPECS[model_id]['model']
          revision = None
          if Path(resolved).is_dir():
              snapshot = Path(resolved).resolve()
          else:
              hf_home = Path(os.environ.get('HF_HOME', Path.home() / '.cache/huggingface'))
              hub = Path(os.environ.get('HF_HUB_CACHE', hf_home / 'hub'))
              cache = hub / ('models--' + model_id.replace('/', '--'))
              revision = (cache / 'refs/main').read_text().strip()
              snapshot = (cache / 'snapshots' / revision).resolve(strict=True)
          assert (snapshot / 'config.json').is_file(), 'Cached model config missing'
          assert any((snapshot / name).is_file() for name in ('tokenizer.json', 'tokenizer.model')), 'Cached tokenizer missing'
          index = snapshot / 'model.safetensors.index.json'
          weights = [snapshot / name for name in set(json.loads(index.read_text())['weight_map'].values())] if index.is_file() else list(snapshot.glob('*.safetensors'))
          assert weights and all(path.is_file() and path.stat().st_size > 0 for path in weights), 'Cached model weights incomplete; do not stage on this GPU job'
          view = Path.cwd() / '.canary-model-view'
          link = view / model_id
          link.parent.mkdir(parents=True, exist_ok=True)
          link.symlink_to(snapshot, target_is_directory=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env_file:
              env_file.write(f'ROUTER_LOCAL_MODEL_PATH={view}\nCANARY_MODEL_SNAPSHOT={snapshot}\n')
          files = {str(path.relative_to(snapshot)): path.stat().st_size for path in snapshot.iterdir() if path.is_file()}
          Path('benchmark-evidence/model-cache.json').write_text(json.dumps({'model_id': model_id, 'resolved': resolved, 'snapshot': str(snapshot), 'hf_revision': revision, 'model_view': str(link), 'cache_only': True, 'files_and_bytes': files}, indent=2))
          PYTHON
          docker pull "$GENAI_BENCH_IMAGE"
          docker image inspect --format '{"Id":{{json .Id}},"RepoDigests":{{json .RepoDigests}},"Architecture":{{json .Architecture}},"Os":{{json .Os}},"Size":{{json .Size}}}' "$GENAI_BENCH_IMAGE" > benchmark-evidence/genai-image.json
          docker run --rm -e HF_HUB_OFFLINE=1 -e TRANSFORMERS_OFFLINE=1 --entrypoint python "$GENAI_BENCH_IMAGE" -c 'import hashlib, importlib.metadata as m, importlib.util as u, json; from pathlib import Path; names=("genai_bench.logging", "genai_bench.user.openai_user"); sources={n:Path(u.find_spec(n).origin).read_text() for n in names}; assert m.version("genai-bench")=="0.0.4"; assert "GENAI_BENCH_LOGGING_LEVEL" in sources[names[0]] and all(v in sources[names[1]] for v in ("Start Time:", "End Time:", "Time at first token:")); print(json.dumps({"version":m.version("genai-bench"),"source_sha256":{n:hashlib.sha256(s.encode()).hexdigest() for n,s in sources.items()}}))' > benchmark-evidence/native-timing-support.json
          nvidia-smi --query-gpu=index,name,memory.used --format=csv > benchmark-evidence/gpus-before.csv
          for cache in "$HOME/.cache/torch" "$HOME/.cache/triton" "${HF_HOME:-$HOME/.cache/huggingface}/hub/models--meta-llama--Llama-3.1-8B-Instruct/refs/main"; do
            ls -ld "$cache" 2>/dev/null || true
          done > benchmark-evidence/cache-before.txt
      - name: Write disposable native-test wrapper
        run: |
          cat > benchmark-evidence/test_canary_grpc_repeat.py <<'PYTHON'
          """Disposable evidence harness; call the unchanged native benchmark twice."""

          import hashlib
          import json
          import os
          import subprocess
          import time
          from pathlib import Path
          from unittest.mock import patch

          import pytest
          from infra.worker_pool import get_pool

          from e2e_test.benchmarks.test_regular_perf import TestRegularPerf as OriginalRegularPerf


          class TestRepeatedGrpcPerf:
              pytestmark = [mark for mark in OriginalRegularPerf.pytestmark if mark.name != "parametrize"] + [
                  pytest.mark.parametrize("setup_backend", ["grpc"], indirect=True)
              ]
              _serving_identity = None

              @pytest.mark.parametrize("round_name", ["initial", "repeat"])
              def test_regular_perf(self, setup_backend, genai_bench_runner, round_name):
                  arm = os.environ["BENCH_CANARY_ARM"]
                  assert arm in ("serial", "parallel")
                  assert os.environ["BENCH_ENFORCE_THRESHOLDS"] == "1"
                  source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
                  assert source_sha == os.environ["BENCH_CANARY_SOURCE_SHA"]
                  backend, model_path, _, gateway = setup_backend
                  assert backend == "grpc"
                  workers = get_pool()._workers
                  identity = (gateway.process.pid, tuple(worker.process.pid for worker in workers))
                  assert len(workers) == 4 and [worker.gpu_ids for worker in workers] == [[0], [1], [2], [3]]
                  if type(self)._serving_identity is None:
                      type(self)._serving_identity = identity
                  assert identity == type(self)._serving_identity, (
                      "Serving processes restarted between rounds"
                  )
                  assert gateway.is_running and all(worker.is_alive() for worker in workers)

                  evidence = Path(os.environ["BENCH_CANARY_EVIDENCE"])
                  request_logs = evidence / arm / round_name / "request-logs"
                  request_logs.mkdir(parents=True, exist_ok=True)
                  record = {
                      "arm": arm,
                      "round": round_name,
                      "source_sha": source_sha,
                      "gateway_pid": identity[0],
                      "worker_pids": identity[1],
                      "workers": [
                          {"gpu_ids": worker.gpu_ids, "argv": worker.process.args} for worker in workers
                      ],
                      "original_test_sha256": hashlib.sha256(
                          Path("e2e_test/benchmarks/test_regular_perf.py").read_bytes()
                      ).hexdigest(),
                      "started_wall_seconds": time.time(),
                      "started_monotonic_seconds": time.monotonic(),
                      "model_path": model_path,
                      "status": "failed",
                  }
                  build_command = genai_bench_runner.__globals__["_build_command"]

                  def with_native_timing(*args, **kwargs):
                      command = build_command(*args, **kwargs)
                      readonly = {
                          os.environ["ROUTER_LOCAL_MODEL_PATH"],
                          os.environ.get("HF_HOME", str(Path.home() / ".cache/huggingface")),
                      }
                      for index, value in enumerate(command[:-1]):
                          if value == "-v" and any(
                              command[index + 1] == f"{root}:{root}" for root in readonly
                          ):
                              command[index + 1] += ":ro"
                      image_index = command.index(os.environ["GENAI_BENCH_IMAGE"])
                      command[image_index:image_index] = [
                          "-e",
                          "GENAI_BENCH_LOGGING_LEVEL=DEBUG",
                          "-e",
                          "HF_HUB_OFFLINE=1",
                          "-e",
                          "TRANSFORMERS_OFFLINE=1",
                          "-v",
                          f"{os.environ['CANARY_MODEL_SNAPSHOT']}:{os.environ['CANARY_MODEL_SNAPSHOT']}:ro",
                          "-v",
                          f"{evidence}:{evidence}",
                      ]
                      if os.environ.get("HF_HUB_CACHE"):
                          command[image_index:image_index] = [
                              "-v",
                              f"{os.environ['HF_HUB_CACHE']}:{os.environ['HF_HUB_CACHE']}:ro",
                          ]
                      command[command.index("--log-dir") + 1] = str(request_logs)
                      record["genai_bench_argv"] = command
                      return command

                  def distinct_results(**kwargs):
                      record["native_parameters"] = dict(kwargs)
                      kwargs["experiment_folder"] += f"_{arm}_{round_name}"
                      record["experiment_folder"] = kwargs["experiment_folder"]
                      return genai_bench_runner(**kwargs)

                  try:
                      with patch.dict(genai_bench_runner.__globals__, {"_build_command": with_native_timing}):
                          OriginalRegularPerf.test_regular_perf(self, setup_backend, distinct_results)
                      record["status"] = "passed"
                  finally:
                      record["finished_wall_seconds"] = time.time()
                      record["finished_monotonic_seconds"] = time.monotonic()
                      (request_logs.parent / "round.json").write_text(json.dumps(record, indent=2) + "\n")
          PYTHON
          cat > benchmark-evidence/check_clean_gpus.py <<'PYTHON'
          """Observe assigned GPUs; never signal a process or clean shared state."""

          import csv
          import json
          import subprocess
          import sys
          from pathlib import Path

          apps = subprocess.check_output(
              [
                  "nvidia-smi",
                  "--query-compute-apps=pid,process_name,used_gpu_memory",
                  "--format=csv,noheader,nounits",
              ],
              text=True,
          )
          rows = csv.reader(
              subprocess.check_output(
                  ["nvidia-smi", "--query-gpu=index,name,memory.used", "--format=csv,noheader,nounits"],
                  text=True,
              ).splitlines()
          )
          gpus = [{"index": int(row[0]), "name": row[1].strip(), "memory_mib": int(row[2])} for row in rows]
          Path(sys.argv[1]).write_text(
              json.dumps({"gpus": gpus, "compute_apps": apps.splitlines()}, indent=2) + "\n"
          )
          assert len(gpus) == 4 and all("H100" in gpu["name"] for gpu in gpus), (
              "Expected four assigned H100 GPUs"
          )
          assert not apps.strip() and all(gpu["memory_mib"] <= 100 for gpu in gpus), (
              "Assigned GPUs are not clean; stop without killing processes"
          )
          PYTHON
          cp benchmark-evidence/test_canary_grpc_repeat.py e2e_test/benchmarks/
          cp benchmark-evidence/test_canary_grpc_repeat.py serial-source/e2e_test/benchmarks/
      - name: Run serial then parallel, preserving each first and repeated round
        run: |
          root="$GITHUB_WORKSPACE"
          export BENCH_CANARY_EVIDENCE="$root/benchmark-evidence"
          result=0
          for arm in serial parallel; do
            source_dir="$root"
            export BENCH_CANARY_SOURCE_SHA="$PARALLEL_SHA"
            if [ "$arm" = serial ]; then source_dir="$root/serial-source"; export BENCH_CANARY_SOURCE_SHA="$SERIAL_SHA"; fi
            export BENCH_CANARY_ARM="$arm" E2E_LOG_DIR="$root/benchmark-evidence/$arm/worker-logs" E2E_MIN_SELECTED=2
            mkdir -p "$E2E_LOG_DIR"
            cd "$source_dir"
            for cache in "$HOME/.cache/torch" "$HOME/.cache/triton" "$HOME/.cache/flashinfer"; do
              if [ -d "$cache" ]; then find "$cache" -maxdepth 2 -printf '%p %s %T@\n'; else echo "absent: $cache"; fi
            done > "$root/benchmark-evidence/$arm/cache-before.txt"
            git diff --exit-code
            python3 "$root/benchmark-evidence/check_clean_gpus.py" "$root/benchmark-evidence/$arm/gpus-before.json"
            if ! PYTHONPATH=e2e_test pytest e2e_test/benchmarks/test_canary_grpc_repeat.py::TestRepeatedGrpcPerf -o addopts= --reruns 0 --force-reruns 0 --junitxml="$root/benchmark-evidence/$arm/junit.xml" -s -vv; then result=1; fi
            python3 "$root/benchmark-evidence/check_clean_gpus.py" "$root/benchmark-evidence/$arm/gpus-after.json"
          done
          cd "$root"
          python3 - <<'PYTHON'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for arm in ('serial', 'parallel'):
              cases = ET.parse(Path('benchmark-evidence') / arm / 'junit.xml').getroot().findall('.//testcase')
              assert len(cases) == 2 and {c.attrib['name'] for c in cases} == {'test_regular_perf[initial-grpc]', 'test_regular_perf[repeat-grpc]'}, f'{arm}: missing original rounds'
              assert all(child.tag in ('system-out', 'system-err', 'properties') for case in cases for child in case), f'{arm}: failed, skipped, errored or retried'
          PYTHON
          exit "$result"
      - name: Retain all benchmark, initialization and timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grpc-benchmark-canary
          path: |
            benchmark-evidence/
            benchmark_round_robin_regular_grpc_*/
            serial-source/benchmark_round_robin_regular_grpc_*/
          if-no-files-found: error
          retention-days: 7
