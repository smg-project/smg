name: SGLang image source capture

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd-sglang-source-capture-20261022
  cancel-in-progress: false

jobs:
  engine-source-capture:
    name: engine-source-capture
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
    timeout-minutes: 2
    container:
      image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
    steps:
      - uses: actions/checkout@v7
      - name: Require known runner and no GPU device exposure
        run: |
          case "$RUNNER_NAME" in
            amd-mi300x-1|amd-mi300x-2) ;;
            *) exit 1 ;;
          esac
          test ! -e /dev/kfd
          test ! -e /dev/dri
      - name: Read bounded public package sources
        run: timeout --signal=INT --kill-after=5s 40s python3 .github/amd-source/collect_sglang_source.py --output engine-source-results
      - name: Upload source evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: sglang-image-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: engine-source-results/
          if-no-files-found: error
          retention-days: 7
