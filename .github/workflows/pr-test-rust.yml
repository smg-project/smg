name: AMD TokenSpeed original PD2 Qwen functional reference on SGLang
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-tokenspeed-pd2-original-qwen-reference
  cancel-in-progress: false
jobs:
  artifact-relay:
    if: inputs.execute
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require one separately admitted complete original TokenSpeed PD2 reference row
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json
          from pathlib import Path
          data = json.loads(Path(".github/amd-shared-product/inputs.json").read_text())
          assert data["admitted_lane"] == "tokenspeed-pd2-original-qwen-sglang-reference"
          assert data["runtime_cohort_accepted"] is True
          assert all(data[key] is True for key in ("ready", "run_budget_admitted", "artifacts_pinned"))
          recipe = data["recipe"]
          assert data["target_product_commit"] == "565a4a00491afa3910eda66041533f184dc7d31b"
          assert recipe["test_dirs"] == "e2e_test/router" and recipe["test_filter"] == ""
          assert recipe["engine"] == recipe["actual_engine"] == "sglang"
          assert recipe["reference_engine"] == "tokenspeed" and recipe["functional_equivalence_only"] is True
          assert recipe["strict_native_TokenSpeed"] is False and recipe["gpu_tier"] == "2"
          assert recipe["profile_env"] == {"SMG_AMD_TS_PD2_REFERENCE": "1"}
          assert recipe["connection_mode"] == "" and recipe["kv_backend"] == ""
          assert recipe["min_selected"] == 10 and recipe["servicer_unit_tests"] is False
          assert recipe["models"] == ["Qwen/Qwen3.5-9B", "meta-llama/Llama-3.2-1B-Instruct"] and recipe["tp"] == 1
          assert recipe["extra_models"] == "Qwen/Qwen3.5-9B"
          assert recipe["job_minutes"] == 75 and recipe["pytest_minutes"] == 50
          assert recipe["reruns"] == 2 and recipe["reruns_delay"] == 5
          assert recipe["setup_agentic_deps"] is False and recipe["same_original_tests_and_oracles"] is True
          PYTHON
      - name: Verify external producer and relay payloads
        id: relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIRECTORY="$RUNNER_TEMP/shared-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          python3 .github/amd-shared-product/relay.py --out "$DIRECTORY"
      - name: Relay wheel without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ steps.relay.outputs.directory }}/smg-wheel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Go FFI without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ steps.relay.outputs.directory }}/go-ffi-library/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay WASM without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ steps.relay.outputs.directory }}/wasm-test-fixtures/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Python types without changing their bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ steps.relay.outputs.directory }}/python-client-types/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve external producer identity and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-producer-relay-evidence
          path: ${{ steps.relay.outputs.directory }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
  amd-ts-pd2-reference:
    needs: artifact-relay
    if: inputs.execute && needs.artifact-relay.result == 'success'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "2"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_2 || '2-gpu-mi300x' }}
      timeout: 75
      test_timeout: 50
      test_dirs: e2e_test/router
      test_filter: ''
      extra_models: Qwen/Qwen3.5-9B
      connection_mode: ''
      kv_backend: ''
      vllm_kv_backend: nixl
      min_selected: 10
      servicer_unit_tests: false
      setup_agentic_deps: false
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: --device=/dev/kfd --device=/dev/dri --device=/dev/infiniband --ulimit memlock=-1:-1 --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN --env SPT_NOENV=1 --env PYTHONDONTWRITEBYTECODE=1 --env SMG_AMD_TS_PD2_REFERENCE=1
    secrets: inherit

  finish:
    if: always() && inputs.execute
    needs: [artifact-relay, amd-ts-pd2-reference]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 3
    steps:
      - name: Require the relay and complete original TokenSpeed PD2 reference row to succeed
        env:
          RELAY: ${{ needs.artifact-relay.result }}
          SG: ${{ needs.amd-ts-pd2-reference.result }}
        run: test "$RELAY" = success && test "$SG" = success
