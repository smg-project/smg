name: AMD Cairo product setup diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-cairo-product-setup-e915
  cancel-in-progress: false
jobs:
  cairo-product-setup:
    name: cairo-product-setup
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_8 || '8-gpu-mi300x' }}
    timeout-minutes: 5
    container:
      image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
    env:
      SMG_QA_IMAGE: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      PIP_RETRIES: '0'
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Require owned AMD runner
        run: |
          case "$RUNNER_NAME" in
            amd-mi300x-1|amd-mi300x-2) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - name: Run exact product helper and native proof within absolute budget
        shell: bash
        timeout-minutes: 4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/amd-cairo-product/budget.py
      - name: Preserve final device visibility
        if: always()
        shell: bash
        timeout-minutes: 1
        run: python3 .github/amd-cairo-product/proof.py devices-after
      - name: Upload evidence including failures
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: amd-cairo-product-setup-${{ github.run_id }}
          path: cairo-results/
          if-no-files-found: error
          retention-days: 7
