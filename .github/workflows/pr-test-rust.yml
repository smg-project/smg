name: AMD SGLang Rust-servicer

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: amd-sglang-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  artifacts:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    steps:
      # PR Test 40180473165 / a8580fcf: reuse its unchanged compiled sources.
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 40180473165
          artifact-ids: 12595065698,12595120490,12595180385,12594541738
          path: producer
      - name: Verify all six producer payloads
        working-directory: producer
        shell: bash
        run: |
          sha256sum --strict --check <<'SHA256'
          6c8b2d2189ec4167c07ba504da852ce1146bb7f047c556cfdb947dca57e391a5  smg-wheel/smg-1.13.0-cp38-abi3-manylinux_2_28_x86_64.whl
          14d79417b83c7ee5163116ca79a68b4f1a60ea2d071a6678efac6561264fcece  go-ffi-library/libsmg_go.d
          e31d2bfa74b4b2c3d1ba3905f19de38460341c9262afc0a6d64b4b1867414490  go-ffi-library/libsmg_go.so
          db21b2e5ea2316481d796d7324464cc06be94f308a443013abb97ac387a6840e  python-client-types/_generated.py
          7e3a093e09bfe30244d128c1aaaf8558a1b13c05558cc81cff04021947445e11  wasm-test-fixtures/storage_hook_guest.wasm
          3a10ce115ea179026a00f3e85ce6b6a388bcc1f274bc7abfc074be876d7c3e55  wasm-test-fixtures/storage_hook_passthrough.wasm
          SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: producer/smg-wheel/*.whl
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: producer/go-ffi-library/libsmg_go.*
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: producer/python-client-types/_generated.py
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: producer/wasm-test-fixtures/*.wasm
          if-no-files-found: error
          retention-days: 1

  amd-sglang-rust:
    needs: artifacts
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 40
      test_timeout: 32
      test_dirs: e2e_test/chat_completions e2e_test/router/test_admin_ops.py e2e_test/router/test_decisions.py
      min_selected: 204
      setup_agentic_deps: false
      servicer_unit_tests: false
      servicer_impl: rust
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --ulimit memlock=-1:-1 --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }} --env SPT_NOENV=1 --env SGLANG_GPT_OSS_MXFP4_BF16=1 --env PYTHONDONTWRITEBYTECODE=1
    secrets: inherit
