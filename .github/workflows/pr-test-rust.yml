name: AMD TokenSpeed original PD2 Qwen functional reference on SGLang
on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
      cu_stream_diagnostic:
        type: boolean
        default: false
        description: "Private exact4420 current-device CU repair and bounded first-event diagnostic"
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-tokenspeed-pd2-original-qwen-reference
  cancel-in-progress: false
jobs:
  amd-ts-pd2-reference:
    if: inputs.execute
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      external_product_commit: 0bd73870ae7c7aeb09c5b55fc411f3f958627981
      engine: sglang
      gpu_tier: "2"
      runner: 4-gpu-mi300x
      timeout: 75
      test_timeout: 50
      test_dirs: e2e_test/router
      test_filter: ''
      extra_models: Qwen/Qwen3.5-9B
      connection_mode: ''
      kv_backend: ''
      vllm_kv_backend: nixl
      min_selected: 10
      servicer_unit_tests: false
      setup_agentic_deps: false
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: --device=/dev/kfd --device=/dev/dri --device=/dev/infiniband --ulimit memlock=-1:-1 --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN --env SPT_NOENV=1 --env PYTHONDONTWRITEBYTECODE=1 --env SMG_AMD_TS_PD2_REFERENCE=1 --env SMG_SG4_PD_CU_EXISTING_RUNTIME=${{ inputs.cu_stream_diagnostic && '1' || '0' }} --env SMG_SG4_PD_ALLOCATION_PHASE_DIAGNOSTIC=${{ inputs.cu_stream_diagnostic && '1' || '0' }}
    secrets: inherit

  finish:
    if: always() && inputs.execute
    needs: [amd-ts-pd2-reference]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 3
    steps:
      - name: Require the complete original TokenSpeed PD2 reference row including its artifact verification to succeed
        env:
          SG: ${{ needs.amd-ts-pd2-reference.result }}
        run: test "$SG" = success
