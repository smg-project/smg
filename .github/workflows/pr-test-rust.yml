name: PR Test (SMG)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# One group per PR and one for main: a newer push cancels the superseded run.
# On main this tests HEAD rather than every intermediate commit: back-to-back
# merges otherwise stack full GPU matrices on one runner pool and time each
# other out. Re-run an intermediate commit via workflow_dispatch if needed.
concurrency:
  group: gateway-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  GENAI_BENCH_IMAGE: ghcr.io/moirai-internal/genai-bench:0.0.4

jobs:
  pre-commit:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The cluster runners share one NAT egress IP and GitHub intermittently
      # 401s anonymous git from it, even for public repos — pre-commit's
      # hook-repo fetches die on "could not read Username". Carry the workflow
      # token on every github.com git operation instead.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        env:
          SKIP: rustfmt,rustfmt-symphony-fuzz,clippy,no-commit-to-branch,branch-name-check,dco-check,no-ai-co-author
        run: pre-commit run --all-files --show-diff-on-failure

  python-lint:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check e2e_test/ bindings/python/ scripts/

      - name: Ruff format check
        run: ruff format --check e2e_test/ bindings/python/ scripts/

      - name: Mypy (e2e_test)
        run: mypy e2e_test/ --config-file mypy.ini

      - name: Mypy (bindings/python)
        run: mypy bindings/python/ --config-file mypy.ini

  grpc-proto-build-check:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Copy protos and build
        run: |
          rm -f crates/grpc_client/python/smg_grpc_proto/proto
          mkdir -p crates/grpc_client/python/smg_grpc_proto/proto
          cp crates/grpc_client/proto/*.proto crates/grpc_client/python/smg_grpc_proto/proto/
          pip install build grpcio-tools
          rm -rf crates/grpc_client/python/dist/
          cd crates/grpc_client/python && python -m build

      - name: Test import
        run: |
          pip install crates/grpc_client/python/dist/*.whl
          python - <<'PY'
          from smg_grpc_proto import sglang_scheduler_pb2, tokenspeed_scheduler_pb2

          fields = tokenspeed_scheduler_pb2.TensorData.DESCRIPTOR.fields_by_name
          assert "data" not in fields
          assert fields["shape"].number == 1
          assert fields["dtype"].number == 2
          assert fields["inline"].number == 3
          assert fields["shm"].number == 4
          assert fields["remote"].number == 5

          print("OK")
          PY

  build-wheel:
    # CPU-only Rust/wheel/Go-FFI/WASM compile — no GPU needed. Runs on the CPU
    # runner pool (which also tolerates the nvidia.com/gpu taint, so it can use
    # the abundant stranded CPU on GPU nodes) instead of competing for scarce
    # GPU runners.
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No wheel-output cache here. It was keyed on a hash of every crate's
      # source, so it missed on essentially every code PR (all-or-nothing), and
      # on a miss it *masked* the incremental compilation cache by skipping the
      # build entirely — which also meant rust-cache rarely got populated. The
      # build now always runs and leans on rust-cache + sccache (set up in
      # ./.github/actions/setup-rust), which degrade gracefully: with the
      # dependency graph cached, only changed crates recompile.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build Python wheel and Go FFI library
        run: |
          rm -rf bindings/python/dist/
          bash scripts/ci_setup_python_venv.sh
          bash scripts/ci_build_wheel.sh

      - name: Generate Python client types
        run: |
          source "$HOME/.cargo/env"
          mkdir -p clients/openapi
          cargo run -p openapi-gen -- clients/openapi/smg-openapi.yaml
          pip install 'datamodel-code-generator==0.54.0'
          datamodel-codegen \
            --input clients/openapi/smg-openapi.yaml \
            --input-file-type openapi \
            --output clients/python/smg_client/types/_generated.py \
            --output-model-type pydantic_v2.BaseModel \
            --use-annotated \
            --field-constraints \
            --target-python-version 3.10 \
            --collapse-root-models \
            --use-standard-collections \
            --use-union-operator
          sed -i 's/class \(.*\)(Enum):/class \1(str, Enum):/' clients/python/smg_client/types/_generated.py

      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: bindings/python/dist/*.whl
          retention-days: 1

      - name: Upload Go FFI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: bindings/golang/target/release/libsmg_go.*
          retention-days: 1

      - name: Upload Python client types
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: clients/python/smg_client/types/_generated.py
          retention-days: 1

      - name: Upload WASM test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/*.wasm
          retention-days: 1
          if-no-files-found: ignore

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test wheel install
        run: |
          pip install bindings/python/dist/*.whl
          python3 -c "import smg; print('Python package: OK')"
          python3 -c "from smg.smg_rs import Router; print('Rust extension: OK')"
          python3 -m smg.launch_router --help > /dev/null && echo "Entry point: OK"

  python-unit-tests:
    needs: build-wheel
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wheel-path: dist/

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Run Python unit tests
        run: |
          cd bindings/python
          python3 -m pip install pytest pytest-asyncio pytest-cov pytest-xdist
          pytest -q tests --cov=smg --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

      - name: Run grpc_servicer unit tests
        run: |
          rm -f crates/grpc_client/python/smg_grpc_proto/proto
          mkdir -p crates/grpc_client/python/smg_grpc_proto/proto
          cp crates/grpc_client/proto/*.proto crates/grpc_client/python/smg_grpc_proto/proto/
          # msgspec and pydantic gate the sidecar-protocol, fake-redis and
          # limit-options tests; numpy gates the Rust servicer's media bridge
          # tests (it lends tensor buffers as numpy views). Modules gated on
          # zmq or vllm still skip here (-rs lists them): the zmq ones import
          # engine servicers that need torch, and the vllm cases run on the
          # vLLM e2e lane.
          pip install ./crates/grpc_client/python msgspec pydantic numpy pyzmq
          pytest -q grpc_servicer/tests -rs

      - name: Run CI tooling unit tests
        run: pytest -q scripts/tests/test_ci_node_health.py scripts/tests/test_ci_prepared_backend_env.py scripts/tests/test_ci_e2e_dependencies.py scripts/tests/test_ci_tokenspeed_scheduler_pin.py scripts/tests/test_ci_tokenspeed_image_tag.py scripts/tests/test_ci_gpu_runner_image.py scripts/tests/test_bench_gate.py scripts/tests/test_ci_reap_job_processes.py scripts/tests/test_check_release_versions.py scripts/tests/test_ci_rust_tests.py scripts/tests/test_ci_apt_update.py scripts/tests/test_ci_download_model.py scripts/tests/test_ci_vllm_engine_units.py

      # CPU-only unit tests for the e2e harness itself (connection-mode parsing,
      # ZMQ/EPD command builders, ZMQ-lane collection filter). --noconftest keeps
      # e2e_test/conftest.py — which needs the generated smg_client types and a
      # live backend — out of the picture; PYTHONPATH replaces the sys.path setup
      # it would otherwise do.
      - name: Run e2e harness unit tests
        env:
          PYTHONPATH: e2e_test
        run: |
          pip install ./e2e_test
          pytest -q --noconftest e2e_test/infra e2e_test/fixtures

  # --- Rust lint and tests (CPU) ---

  # The Rust checks of a pull request run side by side: this job lints, and
  # rust-tests below runs the test shards of scripts/ci_rust_tests.sh. Both
  # restore the Rust cache entry the Rust Cache Warmer saves on main under the
  # key `unit-tests` (every shard's test profile and every lint leg's
  # dependency artifacts; see rust-cache-warmer.yml) and share the
  # content-addressed sccache namespace with every other job, so a leg
  # compiles only the workspace crates it checks. A failed or cancelled leg
  # fails finish.
  rust-lint:
    name: rust-lint (${{ matrix.leg }})
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.rust-ci == 'true'
      )
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # clippy over every target with every feature, after rustfmt; the one
          # leg that needs the OpenCV libraries (the opencv-video feature).
          - leg: all-features
            opencv: true
            fmt: true
          # The self-hosted-only build (no provider routers) and a
          # single-provider build. Meaningful only because the gateway crate's
          # self dev-dependency disables default features; see
          # model_gateway/Cargo.toml.
          - leg: self-hosted
          - leg: anthropic-only
          # The default feature set compiles without OpenCV: this leg never
          # installs the libraries.
          - leg: default-build
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: unit-tests

      - name: Install OpenCV build dependencies
        if: matrix.opencv
        run: AUTO_INSTALL=1 bash scripts/install_opencv.sh

      - name: Run fmt
        if: matrix.fmt
        run: |
          source "$HOME/.cargo/env"
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          rustup toolchain install nightly --profile minimal
          cargo +nightly fmt -- --check
          # The Symphony fuzz crate is a workspace of its own; the root's fmt does not reach it.
          cargo +nightly fmt --manifest-path crates/symphony/fuzz/Cargo.toml --all -- --check

      - name: Lint
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          bash scripts/ci_rust_tests.sh lint ${{ matrix.leg }}

      # The shard table is a partition of the workspace: every package, every
      # gateway test binary and every radix-tree test binary in exactly one
      # shard of rust-tests (cargo metadata only; one leg is enough).
      - name: Check the Rust test shards
        if: matrix.leg == 'default-build'
        run: |
          source "$HOME/.cargo/env"
          bash scripts/ci_rust_tests.sh check

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # One job per shard of scripts/ci_rust_tests.sh that a pull request can
  # affect: detect-changes maps its rust-* path filters to the shard table and
  # emits the matrix (every shard on a push to main or a dispatch). The build
  # and the test run are separate steps so the test timeout bounds the tests:
  # with nothing restored from the Rust cache, a gateway shard compiles the
  # workspace's test profile up to the gateway first.
  rust-tests:
    name: rust-tests (${{ matrix.shard }})
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && needs.detect-changes.outputs.rust-shards != '[]'
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 75
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.rust-shards) }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: unit-tests

      - name: Build WASM test fixtures
        if: contains(matrix.needs, 'wasm-fixtures')
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh

      # --strict makes a fixture that fails to generate fail this step (the Rust
      # golden tests skip a missing fixture directory, so a silent skip here
      # would silently drop coverage). The step does not block the Rust tests,
      # because a transient hub or pip failure should still leave a test
      # signal; the outcome is re-raised after the tests run.
      - name: Generate vision golden fixtures
        if: contains(matrix.needs, 'golden')
        id: vision-golden
        continue-on-error: true
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers pillow numpy scipy
          python crates/multimodal/scripts/generate_vision_golden.py --strict

      - name: Create isolated Postgres test database
        if: contains(matrix.needs, 'postgres')
        # No continue-on-error here: the Postgres regression suite must
        # actually run in CI, not silently no-op if this step fails (see PR
        # #1935 review discussion). `check --postgres` retries on its own
        # for transient pod-restart flakiness.
        run: |
          bash scripts/ci_agentic_svc_deps.sh check --postgres postgres-db
          bash scripts/ci_agentic_svc_deps.sh create-postgres-db postgres-db

      # ffmpeg and ffprobe let the gated video sampling decode test run instead of returning early.
      - name: Install ffmpeg
        if: contains(matrix.needs, 'ffmpeg')
        run: |
          sudo=""; command -v sudo >/dev/null 2>&1 && sudo=sudo
          export DEBIAN_FRONTEND=noninteractive
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Build the Rust tests
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          bash scripts/ci_rust_tests.sh build ${{ matrix.shard }}

      - name: Run the Rust tests
        timeout-minutes: ${{ matrix.test_timeout }}
        run: |
          source "$HOME/.cargo/env"
          bash scripts/ci_rust_tests.sh run ${{ matrix.shard }}

      - name: Fail if vision golden fixtures did not generate
        if: steps.vision-golden.outcome == 'failure'
        run: |
          echo "::error::Vision golden fixture generation failed; see the 'Generate vision golden fixtures' step"
          exit 1

      - name: Cleanup Postgres test database
        if: always() && contains(matrix.needs, 'postgres')
        run: bash scripts/ci_agentic_svc_deps.sh cleanup-postgres-db postgres-db

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # --- Dependency audit ---

  # cargo audit of Cargo.lock against the RustSec advisory database. A pull
  # request that changes the dependency graph (the lockfile, a manifest, the
  # audit's ignore list) fails here on an advisory that .cargo/audit.toml
  # does not ignore; cargo-audit-nightly.yml runs the same script on main
  # every day, for advisories published after the last lockfile change.
  cargo-audit:
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.dependencies == 'true'
      )
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The advisory database is a git clone from github.com; see pre-commit
      # for why the workflow token rides on every github.com git operation.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: cargo audit
        run: bash scripts/ci_cargo_audit.sh

  # --- AArch64 ---

  # The multimodal crate carries modules that compile only on AArch64 (the
  # vector paths of pixel_convert and jpeg_turbo and of the vision stages
  # orientation, rgb_runs and torch_resample), and the KV index's prefetch
  # hint has an AArch64 arm. The jobs above run on x86_64 and never compile
  # that code, so a compile error, a lint or a failing test in it surfaced
  # first in a nightly image or a release build. This job lints the crates
  # with target-specific code and runs their tests on an arm64 runner
  # (GitHub-hosted, free for a public repository), on the pull requests the
  # rust-lint job runs for. The cache key is the job's own: the action
  # already keys by the runner's architecture, but this job's target
  # directory holds another crate set and profile than the rust-tests shards',
  # and the entry fills from the runs on main (the action saves on main
  # only). sccache is off for this job (the wrapper unset, its GitHub cache
  # disabled): the repository's Actions cache is over its budget, with
  # `incremental = true` sccache would only add this architecture's
  # dependency objects on every cold run, which rust-cache restores anyway,
  # and a local sccache disk cache never outlives a hosted runner. The
  # gateway binary's own AArch64 check
  # (model_gateway/tests/startup/allocator_artifact_test.rs: jemalloc's 64 KiB page
  # setting) is not run here: it builds the smg binary, which the hosted
  # runner cannot afford on every pull request; it stays with the nightly
  # image.
  rust-aarch64:
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.rust-ci == 'true'
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-aarch64

      - name: Lint the crates with AArch64-only code
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          cargo clippy -p llm-multimodal -p kv-index --all-targets -- -D warnings

      - name: Test the crates with AArch64-only code
        run: |
          source "$HOME/.cargo/env"
          cargo test -p llm-multimodal -p kv-index

  # --- Benchmarks (standalone) ---

  # Advisory: the thresholds in e2e_test/benchmarks are absolute latencies on
  # a shared runner pool and sit inside its noise band, so a miss is a warning,
  # not a merge blocker: it shows up as a warning annotation and in the step
  # summary (BENCH_ENFORCE_THRESHOLDS=1 makes it fail). Results are still
  # uploaded and summarized.
  benchmarks:
    needs: [build-wheel, detect-changes]
    if: >-
      needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
    runs-on: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    continue-on-error: true
    timeout-minutes: 36
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wasm-fixtures: 'true'
          client-types: 'true'

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Pull genai-bench image
        run: docker pull ${{ env.GENAI_BENCH_IMAGE }}

      - name: Run benchmarks
        env:
          ROUTER_LOCAL_MODEL_PATH: /models
          E2E_LOG_DIR: benchmark-logs
          GENAI_BENCH_TEST_TIMEOUT: "600"
        run: |
          mkdir -p benchmark-logs
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 pytest e2e_test/benchmarks \
            --ignore=e2e_test/benchmarks/test_go_bindings_perf.py \
            --ignore=e2e_test/benchmarks/test_nightly_perf.py \
            -s -vv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genai-bench-results-all-policies
          path: benchmark_**/

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: bash scripts/ci_dump_worker_logs.sh benchmark-logs benchmark-worker-logs

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-worker-logs
          path: benchmark-logs/
          if-no-files-found: ignore
          retention-days: 7

  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      # The two shortcuts (defined in the "Decide the e2e lanes" step): a docs-only
      # pull request, a change confined to the Symphony crate.
      docs-only: ${{ steps.lanes.outputs.docs-only }}
      symphony-only: ${{ steps.lanes.outputs.symphony-only }}
      rust-ci: ${{ steps.filter.outputs.rust-ci }}
      # The rust-tests matrix: the shards of scripts/ci_rust_tests.sh a pull
      # request can affect (every shard on a push or a dispatch); '[]' skips the job.
      rust-shards: ${{ steps.rust-shards.outputs.rust-shards }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      # The GPU e2e lanes' decisions, one per area, from the tier table (the same step).
      skip-chat-completions: ${{ steps.lanes.outputs.skip-chat-completions }}
      skip-chat-symphony: ${{ steps.lanes.outputs.skip-chat-symphony }}
      skip-completions: ${{ steps.lanes.outputs.skip-completions }}
      skip-embeddings: ${{ steps.lanes.outputs.skip-embeddings }}
      skip-realtime: ${{ steps.lanes.outputs.skip-realtime }}
      skip-agentic: ${{ steps.lanes.outputs.skip-agentic }}
      skip-vendor: ${{ steps.lanes.outputs.skip-vendor }}
      skip-go-bindings: ${{ steps.lanes.outputs.skip-go-bindings }}
      tokenspeed-image: ${{ steps.tokenspeed-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # Resolve the pinned nightly's carrier to an immutable digest.
      # A missing image falls back to installing nightly wheels on the runner.
      # Resolution must stay tolerant so detect-changes can gate other lanes.
      - name: Resolve TokenSpeed CI image
        id: tokenspeed-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(bash scripts/ci_tokenspeed_image_tag.sh 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            candidate="ghcr.io/${{ github.repository_owner }}/smg:${tag}"
            if docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN" > /dev/null 2>&1 \
               && manifest="$(docker manifest inspect --verbose "$candidate" 2>/dev/null)"; then
              digest="$(jq -r 'if type == "array" then .[] | select(.Descriptor.platform.os == "linux" and .Descriptor.platform.architecture == "amd64") | .Descriptor.digest else .Descriptor.digest // empty end' <<< "$manifest")"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                image="${candidate}@${digest}"
              fi
            fi
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [ -n "$image" ]; then
            echo "TokenSpeed lanes use prebuilt image: ${image}"
          else
            echo "Prebuilt TokenSpeed image not available (tag: ${tag:-unresolved}); lanes install nightly wheels"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Lets a filter exclude paths with `!` patterns. Filters without them
          # behave exactly as before: any changed file matching any pattern.
          predicate-quantifier: 'some-with-excludes'
          # Lists each filter's files (`<filter>_files`, one JSON line): the tier
          # table of the "Decide the e2e lanes" step reads `all_files`.
          list-files: json
          filters: |
            docs:
              - '**/*.md'
            non-docs:
              - '**'
              - '!**/*.md'
            tests:
              - 'e2e_test/**'
              - '**/tests/**'
              - '**/fixtures/**'
            # Every changed file, for the tier table.
            all:
              - '**'
            symphony:
              - 'crates/symphony/**'
            # Everything that is not Symphony's crate or the lock file. A PR is Symphony-only
            # when `symphony` matched and this did not. The `!` patterns only exclude under
            # `some-with-excludes` above; with the default quantifier `**` would match every file.
            outside-symphony:
              - '**'
              - '!crates/symphony/**'
              - '!Cargo.lock'
            rust-ci:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'crates/**'
              - 'test_support/**'
              - 'model_gateway/**'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/build.rs'
              - 'bindings/python/src/**'
              - 'bindings/golang/Cargo.toml'
              - 'bindings/golang/src/**'
              - 'clients/rust/**'
              - 'clients/openapi-gen/**'
              - '.cargo/**'
              - '.github/actions/setup-rust/**'
              - 'scripts/ci_install_rust.sh'
              - 'scripts/ci_apt_mirror.sh'
              - '.github/workflows/pr-test-rust.yml'
              - 'scripts/ci_rust_tests.sh'
              - 'examples/wasm/wasm-guest-storage-hook/**'
              - 'examples/wasm/wasm-guest-storage-hook-passthrough/**'
            # --- The Rust test shards (scripts/ci_rust_tests.sh) ---
            # A shard of rust-tests runs on a pull request that touches a crate
            # of its dependency closure (the directories below: every
            # dependency kind, transitively) or the build infrastructure; a
            # push to main runs every shard. scripts/tests/test_ci_rust_tests.py
            # checks these lists against the manifests' path dependencies.
            rust-infra: &rust-infra
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/pr-test-rust.yml'
              - 'scripts/ci_rust_tests.sh'
              - 'scripts/ci_install_rust.sh'
              - 'scripts/ci_apt_mirror.sh'
            # The gateway and everything it links: every crate but the radix tree,
            # plus the sources two gateway integration tests read from disk
            # (the metrics catalogue test walks model_gateway, crates, clients,
            # bindings and examples for recorder and family names, Rust sources
            # only; the dashboard test reads the Helm chart), which the previous
            # filter ran the gateway tests for too. The radix tree keeps its own
            # shard: no gateway metric is named there.
            rust-gateway: &rust-gateway
              - *rust-infra
              - 'model_gateway/**'
              - 'crates/**'
              - '!crates/radix_tree/**'
              - 'bindings/python/src/**/*.rs'
              - 'bindings/golang/src/**/*.rs'
              - 'clients/**/*.rs'
              - 'examples/**/*.rs'
              - 'deploy/helm/smg/templates/grafana-dashboard.yaml'
            rust-bindings:
              - *rust-gateway
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/build.rs'
              - 'bindings/python/src/**'
              - 'bindings/golang/Cargo.toml'
              - 'bindings/golang/src/**'
            rust-tokenizer:
              - *rust-infra
              - 'crates/tokenizer/**'
              - 'crates/protocols/**'
            rust-multimodal:
              - *rust-infra
              - 'crates/multimodal/**'
            rust-symphony:
              - *rust-infra
              - 'crates/symphony/**'
              - 'crates/tool_parser/**'
              - 'crates/reasoning_parser/**'
              - 'crates/response_template/**'
              - 'crates/protocols/**'
            rust-agentic:
              - *rust-infra
              - 'crates/data_connector/**'
              - 'crates/mcp/**'
              - 'crates/wasm/**'
              - 'crates/workflow/**'
              - 'examples/wasm/wasm-guest-storage-hook/**'
              - 'examples/wasm/wasm-guest-storage-hook-passthrough/**'
              - 'scripts/ci_agentic_svc_deps.sh'
            rust-protocols:
              - *rust-infra
              - 'crates/protocols/**'
              - 'crates/external_router/**'
              - 'crates/auth/**'
              - 'crates/rl/**'
              - 'clients/rust/**'
              - 'clients/openapi-gen/**'
              - 'crates/data_connector/**'
              - 'crates/mcp/**'
            rust-engine:
              - *rust-infra
              - 'crates/grpc_client/**'
              - 'crates/engine_zmq_client/**'
              - 'crates/engine_zmq_adapter/**'
              - 'crates/engine_servicer/**'
              - 'crates/mock_worker/**'
              - 'crates/protocols/**'
              - 'crates/tokenizer/**'
              - 'crates/kv_index/**'
            rust-kv:
              - *rust-infra
              - 'crates/kv_index/**'
              - 'crates/mesh/**'
              - 'crates/mm_rdma/**'
              - 'crates/radix_tree/**'
            rust-radix:
              - *rust-infra
              - 'crates/radix_tree/**'
              - 'crates/kv_index/**'
            # The dependency graph: the cargo-audit job runs on a pull request
            # that changes it (or the audit's ignore list and script).
            dependencies:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '.cargo/audit.toml'
              - 'scripts/ci_cargo_audit.sh'
              - '.github/workflows/pr-test-rust.yml'

      # The two shortcuts and whether each GPU e2e lane skips, decided here once:
      # the tier table below maps a changed path to the lanes it can reach. A
      # lane's `if:` reads its `skip-<area>` output and adds only what is its
      # own: `always() && !cancelled()`, its prerequisite's result and, on a pull
      # request, this job's success. The step runs when the filter failed too:
      # its outputs then skip nothing, so a push still runs every lane, and a
      # pull request runs none through the lanes' own condition on this job's
      # result.
      - name: Decide the e2e lanes
        id: lanes
        if: always()
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          # The label `ci:full` runs every lane whatever the paths say. It is read
          # from the event, so a pull request labelled after its last push takes
          # it on the next push (or on a close and reopen).
          FORCE_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
          CHANGED_FILES: ${{ steps.filter.outputs.all_files }}
          DOCS: ${{ steps.filter.outputs.docs }}
          NON_DOCS: ${{ steps.filter.outputs.non-docs }}
          TESTS: ${{ steps.filter.outputs.tests }}
          SYMPHONY: ${{ steps.filter.outputs.symphony }}
          OUTSIDE_SYMPHONY: ${{ steps.filter.outputs.outside-symphony }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          env = os.environ
          pull_request = env.get("PULL_REQUEST") == "true"
          # The label: every lane, and neither shortcut.
          force_full = pull_request and env.get("FORCE_FULL") == "true"

          # Only pull requests take the docs-only shortcut; a push keeps its coverage.
          docs_only = (
              pull_request
              and not force_full
              and env.get("DOCS") == "true"
              and env.get("NON_DOCS") == "false"
              and env.get("TESTS") == "false"
          )
          # Symphony is not wired into the gateway yet: a change confined to its crate and
          # the lock file runs the CPU checks and the Symphony chat lane only.
          symphony_only = (
              not force_full
              and env.get("SYMPHONY") == "true"
              and env.get("OUTSIDE_SYMPHONY") == "false"
          )

          # The areas, one per skip-<area> output, each the gate of a group of lanes:
          #   chat-completions  the chat and router suites on every engine: the chat,
          #                     Rust-servicer, worker-side multimodal, ZMQ, gateway, PD,
          #                     EPD and 4-GPU lanes
          #   chat-symphony     the chat suite read through Symphony
          #   completions, embeddings, realtime, go-bindings   that suite's lane
          #   agentic           the Responses suite on an engine
          #   vendor            the Responses, Messages and realtime suites on the cloud
          #                     providers (CPU)
          AREAS = ("chat-completions", "chat-symphony", "completions", "embeddings",
                   "realtime", "agentic", "vendor", "go-bindings")
          FULL = " ".join(AREAS)
          NONE = ""
          # A gateway module no suite targets: the chat, Symphony and Responses suites
          # and the vendor rows read every response through it and witness a
          # regression; the completions, embeddings, realtime and Go suites drive
          # paths of their own, named below where a change reaches them.
          CORE = "chat-completions chat-symphony agentic vendor"
          # The core, and the Go suite: the Go library links the gateway crate whole
          # and calls these paths itself (the policies and the KV index behind the
          # cache-aware one, the crypto provider, the allocator setting).
          CORE_GO = CORE + " go-bindings"
          # One engine's own files reach the lanes with a row for that engine.
          SGLANG = "chat-completions chat-symphony completions embeddings agentic go-bindings"
          VLLM = "chat-completions chat-symphony completions embeddings realtime"
          TRTLLM = "chat-completions"
          TOKENSPEED = "chat-completions"

          # The tier table: the lanes a changed path can reach. The first row a path
          # matches decides; a path no row matches reaches every lane, so a new path
          # runs the whole matrix until a row places it. `**` spans directories, `*`
          # one segment of a path. A pull request runs the union over its files; a
          # push and a manual run keep every lane.
          TIERS = [
              # documentation, licences, assets, lint and format configuration
              ("**/*.md",                                        NONE),
              ("**/LICENSE",                                     NONE),
              ("docs/**",                                        NONE),
              ("assets/**",                                      NONE),
              (".gitignore",                                     NONE),
              (".dockerignore",                                  NONE),
              (".pre-commit-config.yaml",                        NONE),
              ("clippy.toml",                                    NONE),
              ("rustfmt.toml",                                   NONE),
              ("ruff.toml",                                      NONE),
              ("mypy.ini",                                       NONE),
              ("Makefile",                                       NONE),
              # deployment, images and examples no lane builds; the two WASM guests
              # built with the wheel for the Responses suite's storage-hook cases
              ("deploy/**",                                      NONE),
              ("docker/**",                                      NONE),
              ("examples/wasm/wasm-guest-storage-hook/**",       "agentic vendor"),
              ("examples/wasm/wasm-guest-storage-hook-passthrough/**", "agentic vendor"),
              ("examples/**",                                    NONE),
              # the workspace: the manifest, the lock file and the toolchain shape every binary
              ("Cargo.toml",                                     FULL),
              ("Cargo.lock",                                     FULL),
              ("rust-toolchain.toml",                            FULL),
              (".cargo/audit.toml",                              NONE),
              (".cargo/**",                                      FULL),
              # this workflow, the GPU job and the actions the lanes run; an engine's
              # setup action its rows; other workflows and the repository's automation none
              (".github/workflows/pr-test-rust.yml",             FULL),
              (".github/workflows/e2e-gpu-job.yml",              FULL),
              (".github/workflows/**",                           NONE),
              (".github/actions/setup-sglang/**",                SGLANG),
              (".github/actions/setup-vllm/**",                  VLLM),
              (".github/actions/setup-trtllm/**",                TRTLLM),
              (".github/actions/setup-tokenspeed/**",            TOKENSPEED),
              (".github/actions/setup-gh/**",                    NONE),
              (".github/actions/export-pod-api-key/**",          NONE),
              (".github/actions/publish-crate/**",               NONE),
              (".github/actions/**",                             FULL),
              (".github/versions/tokenspeed.ref",                TOKENSPEED),
              (".github/versions/tokenspeed-nightly.txt",        TOKENSPEED),
              (".github/**",                                     NONE),
              # the CI scripts: an engine's installers its rows; the agentic services the
              # Responses, Messages and vendor lanes; the scripts of other workflows none;
              # the scripts every lane runs (the venv, the wheel, the models, the logs) all
              ("scripts/ci_install_sglang.sh",                   SGLANG),
              ("scripts/ci_install_vllm.sh",                     VLLM),
              ("scripts/ci_install_flashinfer_jit_cache.sh",     VLLM),
              ("scripts/ci_install_trtllm.sh",                   TRTLLM),
              ("scripts/ci_install_tokenspeed.sh",               TOKENSPEED),
              ("scripts/ci_fetch_tokenspeed_prebuilt.sh",        TOKENSPEED),
              ("scripts/ci_tokenspeed_image_tag.sh",             TOKENSPEED),
              ("scripts/ci_tokenspeed_scheduler_pin.py",         TOKENSPEED),
              ("scripts/ci_install_flashinfer.py",               TOKENSPEED),
              ("scripts/ci_agentic_svc_deps.sh",                 "agentic vendor"),
              ("scripts/oracle_flyway/**",                       "agentic vendor"),
              ("scripts/ci_cargo_audit.sh",                      NONE),
              ("scripts/ci_rust_tests.sh",                       NONE),
              ("scripts/ci_gpu_runner_image.py",                 NONE),
              ("scripts/ci_node_health.py",                      NONE),
              ("scripts/ci_prune_tokenspeed_images.sh",          NONE),
              ("scripts/ci_setup_sglang_rocm_image.sh",          SGLANG),
              ("scripts/ci_setup_vllm_rocm_image.sh",             VLLM + " embeddings"),
              ("scripts/ci_*",                                   FULL),
              ("scripts/**",                                     NONE),
              # the servicers: an engine's package its rows; the MLX servicer has its own
              # workflow; the tests and their stub generator two rows run against a real
              # engine; the shared modules and the package every lane
              ("grpc_servicer/smg_grpc_servicer/sglang/**",      SGLANG),
              ("grpc_servicer/smg_grpc_servicer/vllm/**",        VLLM),
              ("grpc_servicer/smg_grpc_servicer/tokenspeed/**",  TOKENSPEED),
              ("grpc_servicer/smg_grpc_servicer/mlx/**",         NONE),
              ("grpc_servicer/tests/**",                         "chat-completions"),
              ("grpc_servicer/scripts/**",                       "chat-completions"),
              ("grpc_servicer/**",                               FULL),
              # the e2e suites: a suite its lane; the suites of other workflows and the
              # advisory benchmarks none; the harness, its fixtures and the client every lane
              ("e2e_test/chat_completions/**",                   "chat-completions chat-symphony"),
              ("e2e_test/router/**",                             "chat-completions"),
              ("e2e_test/completions/**",                        "completions"),
              ("e2e_test/embeddings/**",                         "embeddings"),
              ("e2e_test/realtime/**",                           "realtime vendor"),
              ("e2e_test/responses/**",                          "agentic vendor"),
              ("e2e_test/messages/**",                           "agentic vendor"),
              ("e2e_test/bindings_go/**",                        "go-bindings"),
              ("e2e_test/benchmarks/**",                         NONE),
              ("e2e_test/file_discovery/**",                     NONE),
              ("e2e_test/kind_discovery/**",                     NONE),
              ("e2e_test/mlx/**",                                NONE),
              ("e2e_test/**",                                    FULL),
              ("pytest.ini",                                     FULL),
              ("clients/python/smg_client/api/completions.py",   "completions"),
              ("clients/python/smg_client/api/embeddings.py",    "embeddings"),
              ("clients/python/smg_client/api/responses.py",     "agentic vendor"),
              ("clients/python/smg_client/api/messages.py",      "agentic vendor"),
              ("clients/python/tests/**",                        NONE),
              ("clients/python/**",                              FULL),
              ("clients/openapi-gen/**",                         FULL),
              ("clients/**",                                     NONE),
              # the bindings: the wheel every lane installs; the Go library its lane
              ("bindings/python/tests/**",                       NONE),
              ("bindings/python/.coveragerc",                    NONE),
              ("bindings/python/**",                             FULL),
              ("bindings/golang/**",                             "go-bindings"),
              # the gateway: its test trees none; the Responses and conversations
              # endpoints their lanes; the modules no suite targets the core; the
              # routers (the Symphony seam among them: it chooses the parser of every
              # request), the workers, the configuration, the registration workflow,
              # the server and the entry points every lane
              ("model_gateway/tests/**",                         NONE),
              ("model_gateway/test_harness/**",                  NONE),
              ("model_gateway/benches/**",                       NONE),
              ("model_gateway/src/endpoints/responses/**",       "agentic vendor"),
              ("model_gateway/src/endpoints/conversations/**",   "agentic vendor"),
              ("model_gateway/src/endpoints/**",                 CORE),
              ("model_gateway/src/middleware/**",                CORE),
              ("model_gateway/src/observability/**",             CORE_GO),
              ("model_gateway/src/rate_limit/**",                CORE),
              ("model_gateway/src/policies/**",                  CORE_GO),
              ("model_gateway/src/mesh/**",                      CORE),
              ("model_gateway/src/mesh_discovery/**",            CORE),
              ("model_gateway/src/service_discovery/**",         CORE),
              ("model_gateway/src/wasm/**",                      CORE),
              ("model_gateway/src/tls.rs",                       CORE_GO),
              ("model_gateway/src/version.rs",                   CORE),
              ("model_gateway/src/posture.rs",                   CORE),
              ("model_gateway/src/tenant.rs",                    CORE),
              ("model_gateway/src/rl_adapter.rs",                CORE),
              ("model_gateway/**",                               FULL),
              # the crates: test trees, benches, fuzzers, examples and tooling none (the
              # WASM fixtures directory builds the storage-hook guests); crates no lane's
              # binary links none; the tokenizer the Go lane alone (the Go library links it
              # directly), its oracle for the gateway's lanes being the fixture parity gate
              # (the render and encode of every registered model against the reference
              # fixtures, in its own workflow on every pull request that touches the crate)
              # and the crate's tests
              ("crates/wasm/tests/fixtures/**",                  "agentic vendor"),
              ("crates/*/tests/**",                              NONE),
              ("crates/*/benches/**",                            NONE),
              ("crates/*/fuzz/**",                               NONE),
              ("crates/*/examples/**",                           NONE),
              ("crates/*/docs/**",                               NONE),
              ("crates/*/scripts/**",                            NONE),
              ("crates/*/tools/**",                              NONE),
              ("crates/grpc_client/go/**",                       NONE),
              ("crates/mock_worker/**",                          NONE),
              ("crates/radix_tree/**",                           NONE),
              ("crates/tokenizer/**",                            "go-bindings"),
              # Symphony and the response templates it compiles: read behind
              # --parser symphony, the Symphony lane's flag
              ("crates/symphony/**",                             "chat-symphony"),
              ("crates/response_template/**",                    "chat-symphony"),
              # the Rust servicer and the ZMQ wire: lanes of the chat family
              ("crates/engine_servicer/**",                      "chat-completions"),
              ("crates/engine_zmq_client/**",                    "chat-completions"),
              ("crates/engine_zmq_adapter/**",                   "chat-completions"),
              # the Responses tools, and the provider routers' own subtrees; the rest
              # of that crate (retry, SSE, headers, realtime, the OpenAI bridge) is
              # re-exported and called by the gateway's own routers, on every lane
              ("crates/mcp/**",                                  "agentic vendor"),
              ("crates/external_router/src/openai/**",           "agentic vendor"),
              ("crates/external_router/src/anthropic/**",        "agentic vendor"),
              ("crates/external_router/src/gemini/**",           "agentic vendor"),
              ("crates/external_router/**",                      FULL),
              # crates the gateway links on every suite's path: the core; the Go
              # library links the tool parser directly too (and the tokenizer, the
              # protocols and the gRPC client: the tokenizer's row names the Go lane,
              # the other two reach every lane)
              ("crates/tool_parser/**",                          CORE_GO),
              ("crates/reasoning_parser/**",                     CORE),
              ("crates/multimodal/**",                           CORE),
              ("crates/kv_index/**",                             CORE_GO),
              ("crates/data_connector/**",                       CORE),
              ("crates/auth/**",                                 CORE),
              ("crates/mesh/**",                                 CORE),
              ("crates/mm_rdma/**",                              CORE),
              ("crates/rl/**",                                   CORE),
              ("crates/wasm/**",                                 CORE),
              # the protocol types, the gRPC client with its proto package and the
              # workflow engine of the worker registration: every lane
              ("crates/protocols/**",                            FULL),
              ("crates/grpc_client/**",                          FULL),
              ("crates/workflow/**",                             FULL),
              ("crates/**",                                      FULL),
          ]

          def pattern_regex(pattern):
              out, i = "", 0
              while i < len(pattern):
                  if pattern.startswith("**/", i):
                      out, i = out + "(?:.*/)?", i + 3
                  elif pattern.startswith("**", i):
                      out, i = out + ".*", i + 2
                  elif pattern[i] == "*":
                      out, i = out + "[^/]*", i + 1
                  else:
                      out, i = out + re.escape(pattern[i]), i + 1
              return re.compile(out + r"\Z")

          rows = [(pattern, pattern_regex(pattern), set(areas.split())) for pattern, areas in TIERS]
          unknown = sorted({area for _, _, areas in rows for area in areas} - set(AREAS))
          if unknown:
              sys.exit(f"tier table: no lane area is named {unknown}; the areas are {list(AREAS)}")

          def reach_of(path):
              """The row that places a path and the areas it reaches: every area when no row does."""
              for pattern, regex, areas in rows:
                  if regex.match(path):
                      return pattern, areas
              return None, set(AREAS)

          def named(areas):
              return " ".join(area for area in AREAS if area in areas) or "none"

          files = json.loads(env["CHANGED_FILES"]) if env.get("CHANGED_FILES") else None
          if not pull_request:
              reached, why = set(AREAS), "not a pull request"
          elif force_full:
              reached, why = set(AREAS), "the label ci:full"
          elif files is None:
              # The filter failed: its failure gates the pull request's lanes.
              reached, why = set(AREAS), "no list of the changed files"
          else:
              reached = set()
              for path in files:
                  pattern, areas = reach_of(path)
                  print(f"{path}: {pattern or 'no row'} -> {named(areas)}")
                  reached |= areas
              why = f"{len(files)} changed files"
          print(f"{why}: lanes reached: {named(reached)}")

          # No lane for a docs-only or a Symphony-only change; otherwise the lanes
          # of the areas the changed paths reach.
          skip = {area: docs_only or symphony_only or area not in reached for area in AREAS}
          # The Symphony chat lane runs for a Symphony-only change too: it is the one
          # lane that exercises a table against a real engine.
          skip["chat-symphony"] = docs_only or ("chat-symphony" not in reached and not symphony_only)
          # The vendor lanes have no docs-only shortcut.
          skip["vendor"] = symphony_only or "vendor" not in reached

          decided = {"docs-only": docs_only, "symphony-only": symphony_only}
          decided.update((f"skip-{area}", skipped) for area, skipped in skip.items())
          with open(env["GITHUB_OUTPUT"], "a") as outputs:
              for name, value in decided.items():
                  line = f"{name}={str(value).lower()}"
                  print(line)
                  print(line, file=outputs)
          EOF
      - name: Select the Rust test shards
        id: rust-shards
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
          EVERY_SHARD: ${{ github.event_name != 'pull_request' }}
        run: |
          shards=$(bash scripts/ci_rust_tests.sh matrix "$CHANGES" "$EVERY_SHARD")
          echo "rust-shards=$shards" >> "$GITHUB_OUTPUT"
          echo "Rust test shards: $shards"

  # --- GPU E2E: organized by GPU tier + API, engine as matrix axis ---

  # === 1 GPU ===

  e2e-1gpu-chat:
    name: e2e-1gpu-chat (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    # Now also runs the previously-2-GPU chat tests (gpt-oss-20b,
    # Qwen2.5-14B) since they're tp=1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 36
            test_timeout: 28
            min_selected: 204 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # 21 min end to end on a quiet host (setup ~6 min, tests ~15 min);
          # under runner contention setup alone reached 9 min and the 24 min
          # budget cut the run short. Keep ~30% headroom like the other rows.
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: trtllm
            timeout: 36
            test_timeout: 24
            min_selected: 180 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # tokenspeed builds from source (~30m cold), so keep the job
          # timeout generous even though the test step is short.
          # Admin-ops e2e (flush/profile) piggybacks here because this is
          # the only lane with tokenspeed installed — e2e-1gpu-gateway
          # installs sglang/vllm only. The engine marker filter keeps the
          # rest of e2e_test/router out of this job.
          - engine: tokenspeed
            timeout: 56
            test_timeout: 26
            test_dirs: e2e_test/chat_completions e2e_test/router/test_admin_ops.py e2e_test/router/test_loads.py
            min_selected: 114 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: ${{ matrix.test_dirs || 'e2e_test/chat_completions' }}
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      servicer_unit_tests: ${{ matrix.engine == 'vllm' }}
    secrets: inherit

  # The vLLM row of e2e-1gpu-chat on an AMD Instinct self-hosted runner, in
  # vLLM's ROCm image of the CI's vLLM pin (scripts/ci_install_vllm.sh). Off
  # until AMD's runner is registered and SMG_RUN_AMD_LEGS is "true"; then it
  # runs on pushes to main and dispatches, and SMG_RUN_AMD_ON_PRS = "true" adds
  # the pull requests the vLLM row runs on.
  e2e-1gpu-chat-amd:
    name: e2e-1gpu-chat-amd (vllm)
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      # Measured on the AMD runner: the suite's eight vLLM workers took 18:52
      # to come up and the step 21:58 end to end before the servicers'
      # planned warm-up; with it (the default level, up to 300 s per worker)
      # the seven workers before gpt-oss-20b took 20:08 to come up, and
      # gpt-oss-20b's own start (engine 2:36 + warm-up ~2:45) ran into the
      # 30-minute step cap. The slowest composition seen (the earlier run's
      # engine starts + the later run's warm-ups) projects to ~34 minutes;
      # 45 keeps the ~30 % headroom the CUDA vLLM row keeps over its 24.
      timeout: 60
      test_timeout: 45
      test_dirs: e2e_test/chat_completions
      min_selected: 202 # the vLLM row's floor: both rows select the same cases
      servicer_unit_tests: true
      gpu_vendor: amd
      container_image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  e2e-1gpu-completions-sglang-amd:
    name: e2e-1gpu-completions-sglang-amd
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 50
      test_timeout: 30
      test_dirs: e2e_test/completions
      min_selected: 15
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  e2e-1gpu-embeddings-sglang-amd:
    name: e2e-1gpu-embeddings-sglang-amd
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-embeddings != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 50
      test_timeout: 30
      test_dirs: e2e_test/embeddings
      extra_deps: sentence-transformers
      min_selected: 18
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  # The chat cases with the gateway reading through Symphony (--parser symphony):
  # the same workers and suite as e2e-1gpu-chat, the Symphony path for every
  # model its registry knows. Runs for a chat or common change as the chat lane
  # does, and for a Symphony-only change too, since this is the one lane that
  # exercises a table against a real engine.
  e2e-1gpu-chat-symphony:
    name: e2e-1gpu-chat-symphony (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-symphony != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 36
            test_timeout: 28
            min_selected: 204
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/chat_completions
      min_selected: ${{ matrix.min_selected }}
      parser: symphony
    secrets: inherit

  # The chat cases against the Rust gRPC servicer (SMG_SGLANG_SERVICER_IMPL=rust,
  # SMG_VLLM_SERVICER_IMPL=rust): the same workers, the Rust request path. A
  # row for SGLang and one for vLLM (the TokenSpeed Rust servicer has no
  # PR-time row yet, so this lane says nothing about it): every other lane of
  # those engines runs the Python servicer, so a launcher or binding change
  # that breaks the Rust servicer's start fails here and nowhere else.
  e2e-1gpu-chat-rust-servicer:
    name: e2e-1gpu-chat-rust-servicer (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    # Now also runs the previously-2-GPU chat tests (gpt-oss-20b,
    # Qwen2.5-14B) since they're tp=1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 40
            test_timeout: 32
            # Chat lane plus the admin ops the Rust servicer serves through
            # the wire's control calls.
            test_dirs: e2e_test/chat_completions e2e_test/router/test_admin_ops.py e2e_test/router/test_decisions.py
            min_selected: 204 # floor ≈ 95% of the chat lane's measured effective (215 of 223 ran on the Rust servicer; audit 2026-10-04)
          # The vLLM chat suite on the Rust servicer: the suite, floor and
          # budgets of e2e-1gpu-chat's vllm row (the harness deselects nothing
          # for this servicer), so the two rows differ by the servicer only.
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202 # the vllm chat row's floor: the same selection
          # The TokenSpeed chat suite on the Rust servicer: the suite, floor
          # and budgets of e2e-1gpu-chat's tokenspeed row (its prebuilt engine
          # image, or the source build on a cold path, hence the budget), so
          # the two rows differ by the servicer only. The admin-op and loads
          # cases of that row stay on the Python servicer's row.
          - engine: tokenspeed
            timeout: 56
            test_timeout: 26
            min_selected: 114 # the tokenspeed chat row's floor: the same selection
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: ${{ matrix.test_dirs || 'e2e_test/chat_completions' }}
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      servicer_impl: rust
    secrets: inherit

  # Worker-side media processing: the vLLM gRPC worker fetches and
  # preprocesses media itself (SMG_VLLM_MM_PROCESSOR=inprocess) and the
  # gateway, left in auto mode, forwards media references. Same multimodal
  # cases as the chat lane plus the processing-location assertion.
  e2e-1gpu-chat-mm-worker:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 28
      test_timeout: 20
      test_dirs: e2e_test/chat_completions/test_multimodal.py
      mm_processing: worker
      min_selected: 5 # the 6 Qwen3-VL cases on 1 GPU (Llama-4 Scout is a 4-GPU class)
    secrets: inherit

  e2e-1gpu-chat-zmq:
    name: e2e-1gpu-chat-zmq (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    # Same single-worker chat suite as e2e-1gpu-chat, driven over the ZMQ
    # direct-backend wire. The collection hook deselects the gRPC-only
    # families (PD, EPD, multi-worker) for a ZMQ lane, so this covers the
    # local cases only.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ZMQ lane restarts the engine per model group (66-90s of
          # load+warmup each); the suite needs more headroom than the gRPC
          # lane, whose pool amortizes worker bring-up.
          - engine: vllm
            timeout: 46
            test_timeout: 40
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: tokenspeed
            timeout: 60
            test_timeout: 48
            min_selected: 109 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: sglang
            timeout: 60
            test_timeout: 48
            min_selected: 204 # floor ≈ 95% of measured effective (215 of 223 selected ran; audit 2026-10-03)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/chat_completions
      connection_mode: zmq
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      # The SGLang wire pins (grpc_servicer/tests/test_sglang_zmq_*) need a
      # real SGLang plus pyzmq and msgspec; this is the lane that has them.
      servicer_unit_tests: ${{ matrix.engine == 'sglang' }}
    secrets: inherit

  e2e-2gpu-chat-zmq-dp:
    name: e2e-2gpu-chat-zmq-dp (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    # The 1-GPU ZMQ suite with grouped workers: each ZMQ worker launches two
    # DP engines on one socket set (tp=1 models, one GPU per engine), so the
    # gateway's handshake, the connector's least-loaded selection, and
    # per-rank output attribution all run against a real dp=2 group. The wave
    # protocol is vLLM-only (TokenSpeed ranks run independently).
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: vllm
            timeout: 46
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # The TokenSpeed ZMQ lane restarts the engine per model group, and
          # DP doubles model load + warmup. The ~22-minute TokenSpeed source
          # build eats the front of the budget, and at 50 the first dp run was
          # killed mid-suite while progressing (28 minutes of test time); 60
          # leaves the tests the same ~40 minutes the test_timeout allows.
          - engine: tokenspeed
            timeout: 60
            min_selected: 82 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      # Tier selects the TEST SET (and model downloads): this lane runs the
      # tier-1 chat suite; the second GPU serves the second engine of the
      # group, not 2-GPU-marked tests.
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: 40
      test_dirs: e2e_test/chat_completions
      connection_mode: zmq
      zmq_engine_count: "2"
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
    secrets: inherit

  e2e-1gpu-completions:
    name: e2e-1gpu-completions (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-completions != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 20
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 20
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/completions
      min_selected: ${{ matrix.min_selected }}
    secrets: inherit

  e2e-1gpu-completions-amd:
    name: e2e-1gpu-completions-amd (vllm)
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 50
      test_timeout: 30
      test_dirs: e2e_test/completions
      min_selected: 15
      gpu_vendor: amd
      container_image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  e2e-1gpu-embeddings-amd:
    name: e2e-1gpu-embeddings-amd (vllm)
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-embeddings != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 50
      test_timeout: 30
      test_dirs: e2e_test/embeddings
      min_selected: 20
      extra_deps: sentence-transformers
      gpu_vendor: amd
      container_image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  e2e-1gpu-embeddings:
    name: e2e-1gpu-embeddings (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-embeddings != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 20
            min_selected: 18 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 20
            min_selected: 20 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/embeddings
      extra_deps: "sentence-transformers"
      min_selected: ${{ matrix.min_selected }}
    secrets: inherit

  e2e-1gpu-realtime:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-realtime != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 25
      test_timeout: 20
      test_dirs: e2e_test/realtime
      min_selected: 3 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    secrets: inherit

  e2e-1gpu-gateway:
    name: e2e-1gpu-gateway (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The router suite grew (load reports, overload, restart); the sglang
          # lane also switches models between classes, which restarts a worker.
          - engine: sglang
            timeout: 30
            min_selected: 23 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 30
            min_selected: 3 # vllm gateway lane selects only 3 tests; floor covers all of them (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/router
      min_selected: ${{ matrix.min_selected }}
    secrets: inherit

  e2e-1gpu-gateway-sglang-amd:
    name: e2e-1gpu-gateway-sglang-amd
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && vars.SMG_RUN_AMD_LEGS == 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (vars.SMG_RUN_AMD_ON_PRS == 'true' && needs.detect-changes.result == 'success'))
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
      timeout: 50
      test_timeout: 30
      test_dirs: e2e_test/router
      min_selected: 23
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: ${{ vars.SMG_AMD_CONTAINER_OPTIONS || '--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN' }}
    secrets: inherit

  # === 2 GPU ===

  # e2e-2gpu-chat was retired: all chat_completions tests are tp=1 now
  # and run under e2e-1gpu-chat above.

  e2e-1gpu-responses:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-agentic != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 32
      test_timeout: 24
      test_dirs: e2e_test/responses
      setup_agentic_deps: true
      min_selected: 92 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    secrets: inherit

  e2e-2gpu-pd:
    name: e2e-2gpu-pd (${{ matrix.engine }}${{ matrix.kv_backend && format('-{0}', matrix.kv_backend) || '' }})
    needs: [e2e-1gpu-gateway, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.e2e-1gpu-gateway.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 40
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # The vLLM rows' job budget sits above the sum of their steps: the
          # engine setup takes 3 to 9 minutes (its packages come from the
          # network), the test step has 34, checkout, downloads, diagnostics
          # and the log upload about 4. At 40 the job budget cancelled a long
          # test step minutes before the step's own timeout would have failed
          # it, and the leg ended "cancelled" with its cases passing instead
          # of failing in the step that ran long (smg-project/smg-lab#170).
          - engine: vllm
            timeout: 50
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            kv_backend: mooncake
            timeout: 50
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # TokenSpeed prefill/decode over its Mooncake transfer, on the model
          # its disaggregation path is proven on (Qwen3.5-9B, fetched by id).
          # First run (34173426995): sequential PD passed; 32 concurrent
          # requests deadlocked both legs because the spec's engine window was
          # 4 (prefill waits for a decode that is never admitted). The window
          # now covers the suite's bursts; the over-window deadlock itself is
          # pinned by the topology suite. The prebuilt image is extracted, but
          # a cold path builds from source, hence the larger budgets.
          - engine: tokenspeed
            timeout: 75
            test_timeout: 50
            min_selected: 10 # floor ≈ 95% of the 11 gRPC PD cases marked for tokenspeed
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "2"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout || 34 }}
      test_dirs: e2e_test/router
      vllm_kv_backend: ${{ matrix.kv_backend || 'nixl' }}
      min_selected: ${{ matrix.min_selected }}
      extra_models: ${{ matrix.engine == 'tokenspeed' && 'Qwen/Qwen3.5-9B' || '' }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
    secrets: inherit

  # PD legs both advertise worker-side processing; the M-RoPE class takes the
  # worker path and the Phi-3.5 class must stay on the router path.
  e2e-2gpu-pd-mm-worker:
    needs: [e2e-1gpu-chat-mm-worker, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.e2e-1gpu-chat-mm-worker.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "2"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: 40
      test_timeout: 34
      test_dirs: e2e_test/router/test_pd_multimodal.py
      mm_processing: worker
      min_selected: 4 # the 4 PD multimodal cases
    secrets: inherit

  # === 4 GPU ===

  e2e-4gpu-chat:
    name: e2e-4gpu-chat (${{ matrix.engine }})
    needs: [e2e-1gpu-chat]
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 30
            min_selected: 32 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 30
            min_selected: 32 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: trtllm
            timeout: 45
            min_selected: 24 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/chat_completions
      min_selected: ${{ matrix.min_selected }}
    secrets: inherit

  e2e-4gpu-gateway:
    name: e2e-4gpu-gateway
    needs: [e2e-1gpu-gateway]
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: 25
      test_dirs: e2e_test/router
      test_filter: "-k TestIGWMixedWorkerClassification"
    secrets: inherit

  e2e-4gpu-epd:
    name: e2e-4gpu-epd (tokenspeed)
    needs: [e2e-1gpu-chat, detect-changes]
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: tokenspeed
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: 75
      test_timeout: 65
      test_dirs: e2e_test/chat_completions/test_epd_multimodal.py
      extra_models: "Qwen/Qwen3.5-9B"
      min_selected: 6 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
      tokenspeed_prebuilt_image: ${{ needs.detect-changes.outputs.tokenspeed-image }}
    secrets: inherit

  # PD disaggregation under one 4-GPU topology (2 prefill + 2 decode) plus a
  # fleet assembled at runtime through the worker API, per engine. The full
  # topology sweep (1p1d .. 3p1d) runs in nightly-pd.yml; this lane guards
  # every PR with the topology that exercises both legs' load balancing.
  e2e-4gpu-pd:
    name: e2e-4gpu-pd (${{ matrix.engine }}${{ matrix.kv_backend && format('-{0}', matrix.kv_backend) || '' }})
    needs: [e2e-1gpu-gateway, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.e2e-1gpu-gateway.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-chat-completions != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 50
            test_timeout: 42
          - engine: vllm
            timeout: 50
            test_timeout: 42
          # Qwen3.5-9B loads slower and the prebuilt image is extracted first;
          # a cold path builds the engine from source.
          - engine: tokenspeed
            timeout: 85
            test_timeout: 60
          # The other KV transport of each engine (TokenSpeed only has
          # Mooncake): the same slice on vLLM over Mooncake, and a 1p1d
          # smoke of SGLang over NIXL (its venv gets NIXL only on this row,
          # #2498). The peer-restart test stays out of the NIXL smoke: the
          # SGLang prefill segfaults when its decode comes back on the same
          # address (#2503). The full sweeps run in nightly-pd.
          - engine: vllm
            kv_backend: mooncake
            timeout: 50
            test_timeout: 42
          - engine: sglang
            kv_backend: nixl
            timeout: 60
            test_timeout: 50
            test_filter: -k "1p1d and not http and not sole_leg_outage"
            min_selected: 11
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/router/test_pd_topologies.py
      # The 2p2d slice (which carries the mixed-transport fleet on vLLM), the
      # runtime-assembled fleet, the over-window burst, and the two fleets
      # placement must refuse (mismatched transports, mismatched explicit
      # protocols); the full sweep runs in nightly-pd.
      # Run 34440725835: 9-16 min of tests per row against the 42/60 budgets.
      test_filter: ${{ matrix.test_filter || '-k "(2p2d and not http) or AssembledAtRuntime or SmallWindow or MismatchedTransport or MismatchedProtocol"' }}
      extra_models: ${{ matrix.engine == 'tokenspeed' && 'Qwen/Qwen3.5-9B' || '' }}
      # floor ≈ 93% of the slice: 15 cases on sglang/tokenspeed, 17 on vllm
      # (its two transport classes); the 1p1d smoke selects 13, floor 11
      min_selected: ${{ matrix.min_selected || 14 }}
      kv_backend: ${{ matrix.kv_backend || '' }}
      vllm_kv_backend: ${{ matrix.kv_backend || 'nixl' }}
      # The mixed-transport fleet needs both vLLM backends installed whatever the lane's own
      vllm_extra_kv_backends: ${{ matrix.engine == 'vllm' && 'mooncake' || '' }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
    secrets: inherit

  # --- Vendor E2E: CPU-only cloud backend tests ---

  e2e-vendor:
    name: ${{ matrix.name }}
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-vendor != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anthropic-messages
            vendor: anthropic
            test_path: e2e_test/messages
            timeout: 20
            setup_agentic_deps: true
            external_tests: true

          - name: openai-responses
            vendor: openai
            test_path: e2e_test/responses
            timeout: 30
            setup_agentic_deps: true
            external_tests: true

          - name: openai-realtime
            vendor: openai
            test_path: e2e_test/realtime
            timeout: 20

          - name: xai-responses
            vendor: xai
            test_path: e2e_test/responses
            timeout: 15
            setup_agentic_deps: true

    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      E2E_VENDOR: ${{ matrix.vendor }}
      E2E_GPU_TIER: "0"
      SHOW_ROUTER_LOGS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check shared services
        if: matrix.setup_agentic_deps
        run: bash scripts/ci_agentic_svc_deps.sh check --oracle oracle-db --brave brave-search-mcp

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wasm-fixtures: 'true'
          client-types: 'true'

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Setup Oracle
        if: matrix.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh setup-oracle-client
          bash scripts/ci_agentic_svc_deps.sh create-oracle-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh create-oracle-flyway-user oracle-db

      - name: Run E2E tests
        env:
          BRAVE_MCP_HOST: ${{ matrix.setup_agentic_deps && 'brave-search-mcp' || '' }}
        run: |
          ROUTER_LOCAL_MODEL_PATH="/models" pytest ${{ matrix.test_path }} \
            -m "not external" \
            --reruns 2 --reruns-delay 5 \
            -s -vv

      # Tests that depend on services beyond the vendor API itself (hosted
      # tool execution, web search) fail for reasons this repo cannot fix, so
      # they report but never gate.
      - name: Run external-service E2E tests (advisory)
        if: matrix.external_tests
        continue-on-error: true
        env:
          BRAVE_MCP_HOST: brave-search-mcp
        run: |
          ROUTER_LOCAL_MODEL_PATH="/models" pytest ${{ matrix.test_path }} \
            -m external \
            --reruns 2 --reruns-delay 5 \
            -s -vv

      - name: Cleanup Oracle test users
        if: always() && matrix.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-flyway-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-user oracle-db

  go-unit-tests:
    name: go-unit-tests
    needs: build-wheel
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Install build tools
        run: |
          bash scripts/ci_apt_mirror.sh
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          wheel: 'false'
          go-ffi-library: 'true'

      - name: Run Go unit tests
        run: |
          cd bindings/golang
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/target/release"
          export LD_LIBRARY_PATH="$(pwd)/target/release:$LD_LIBRARY_PATH"
          go test -v ./...

  go-bindings-e2e:
    name: go-bindings-e2e
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request' || needs.detect-changes.result == 'success')
      && needs.detect-changes.outputs.skip-go-bindings != 'true'
    runs-on: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    # 19 min on a quiet host (SGLang setup ~6.5 min, Go ~4 min, tests ~6.5
    # min); under runner contention the setup step reached 10 min and the
    # job was cancelled as the last test passed. Keep ~35% headroom.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          go-ffi-library: 'true'
          client-types: 'true'

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Run Go OAI server E2E tests
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          export CGO_LDFLAGS="-L$(pwd)/bindings/golang/target/release"
          export LD_LIBRARY_PATH="$(pwd)/bindings/golang/target/release:$LD_LIBRARY_PATH"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 ROUTER_LOCAL_MODEL_PATH="/models" \
          E2E_LOG_DIR=e2e-logs \
            pytest --reruns 2 --reruns-delay 5 e2e_test/bindings_go -s -vv

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: bash scripts/ci_dump_worker_logs.sh e2e-logs "e2e-worker-logs-go-bindings"

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-worker-logs-go-bindings
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  go-bindings-benchmark:
    name: go-bindings-benchmark
    needs: build-wheel
    if: false  # Disabled
    runs-on: ${{ vars.SMG_RUNNER_GPU || 'k8s-runner-gpu' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: 32
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Download build artifacts
        uses: ./.github/actions/download-build-artifacts
        with:
          go-ffi-library: 'true'

      - name: Install wheel
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl

      - name: Install test dependencies
        run: |
          python3 -m pip install pytest pytest-rerunfailures httpx openai grpcio grpcio-health-checking numpy

      - name: Pull genai-bench image
        run: docker pull ${{ env.GENAI_BENCH_IMAGE }}

      - name: Run Go bindings benchmark
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          export CGO_LDFLAGS="-L$(pwd)/bindings/golang/target/release"
          export LD_LIBRARY_PATH="$(pwd)/bindings/golang/target/release:$LD_LIBRARY_PATH"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 ROUTER_LOCAL_MODEL_PATH="/models" \
            pytest e2e_test/benchmarks/test_go_bindings_perf.py -s -vv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genai-bench-results-go-bindings
          path: benchmark_go_bindings/

  finish:
    needs: [detect-changes, pre-commit, python-lint, grpc-proto-build-check, build-wheel, python-unit-tests, cargo-audit, rust-lint, rust-tests, rust-aarch64, benchmarks, e2e-1gpu-chat, e2e-1gpu-chat-amd, e2e-1gpu-completions-amd, e2e-1gpu-embeddings-amd, e2e-1gpu-chat-symphony, e2e-1gpu-chat-rust-servicer, e2e-1gpu-chat-mm-worker, e2e-1gpu-chat-zmq, e2e-2gpu-chat-zmq-dp, e2e-1gpu-completions, e2e-1gpu-embeddings, e2e-1gpu-realtime, e2e-1gpu-gateway, e2e-1gpu-responses, e2e-2gpu-pd, e2e-2gpu-pd-mm-worker, e2e-4gpu-chat, e2e-4gpu-gateway, e2e-4gpu-epd, e2e-4gpu-pd, e2e-vendor, go-unit-tests, go-bindings-e2e, e2e-1gpu-completions-sglang-amd, e2e-1gpu-embeddings-sglang-amd, e2e-1gpu-gateway-sglang-amd]
    if: always()
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Self-check: every e2e-* and rust-* job defined in this workflow must
      # gate merge via finish.needs AND the failure check below. Keeps a new
      # (or forgotten) lane from silently becoming non-blocking.
      - name: Gate-integrity lint
        run: |
          python3 - <<'EOF'
          import re, sys

          path = ".github/workflows/pr-test-rust.yml"
          src = open(path).read()
          jobs = re.findall(r"^  ((?:e2e|rust)-[a-z0-9_-]*):", src, re.M)
          if not jobs:
              sys.exit("gate-integrity lint: found no e2e-*/rust-* job definitions; lint is broken")
          fin = re.search(r"^  finish:\n(.*?)(?=^  \S|\Z)", src, re.M | re.S)
          if not fin:
              sys.exit("gate-integrity lint: could not locate the finish job")
          body = fin.group(1)
          needs_m = re.search(r"needs:\s*\[([^\]]*)\]", body)
          if not needs_m:
              sys.exit("gate-integrity lint: finish.needs not found in inline-list form")
          needs = {n.strip() for n in needs_m.group(1).split(",")}
          missing_needs = sorted(j for j in jobs if j not in needs)
          # Search only the failure-check step, not the whole job body — a
          # comment elsewhere must not satisfy the check.
          check = re.search(
              r"- name: Check CI result\n(.*?)(?=^      - name:|\Z)", body, re.M | re.S
          )
          if not check:
              sys.exit("gate-integrity lint: could not locate the 'Check CI result' step")
          check_body = check.group(1)
          missing_check = sorted(j for j in jobs if f"needs.{j}.result" not in check_body)
          if missing_needs or missing_check:
              if missing_needs:
                  print(f"e2e/rust jobs missing from finish.needs: {missing_needs}")
              if missing_check:
                  print(f"e2e/rust jobs missing from the finish failure check: {missing_check}")
              sys.exit(1)
          print(f"OK: all {len(jobs)} e2e-*/rust-* jobs gate merge: {sorted(jobs)}")
          EOF

      - name: Check CI result
        run: |
          # A job that runs into its timeout-minutes ends "cancelled", not
          # "failure", and fails this gate the same way (smg-project/smg-lab#171).
          # A run cancelled as a whole ends with this gate failed too: it did
          # not pass, and finish stays a verdict on every head.
          bad='^(failure|cancelled)$'
          # detect-changes selects the lanes: when it fails or is cancelled, the
          # Rust lint and test jobs, the benchmarks and the EPD lane skip on every event
          # (and, on a pull request, every e2e lane); a skipped job passes this
          # check, so its own result gates here (smg-project/smg-lab#172).
          if [[ "${{ needs.detect-changes.result }}" =~ $bad || \
                "${{ needs.pre-commit.result }}" =~ $bad || \
                "${{ needs.python-lint.result }}" =~ $bad || \
                "${{ needs.grpc-proto-build-check.result }}" =~ $bad || \
                "${{ needs.build-wheel.result }}" =~ $bad || \
