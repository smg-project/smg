name: AMD SGLang native API preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: amd-sglang-native-preflight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sglang-native-preflight:
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
    timeout-minutes: 3
    container:
      image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MAX_JOBS: '2'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Verify runner placement and device isolation
        run: |
          case "$RUNNER_NAME" in amd-mi300x-1|amd-mi300x-2) ;; *) exit 1 ;; esac
          test ! -e /dev/kfd
          test ! -e /dev/dri
      - uses: actions/checkout@v7
      - name: Inspect installed native API and CPU DLPack
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir native-preflight
          timeout --signal=INT --kill-after=5s 85s python3 -B \
            .github/amd-sg-native/probe_native_api.py --output native-preflight \
            2>&1 | tee native-preflight/command.log
      - name: Preserve preflight evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: sglang-native-api-preflight
          path: native-preflight/
          if-no-files-found: error
          retention-days: 7
