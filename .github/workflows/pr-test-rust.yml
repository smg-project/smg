name: PR Test (SMG)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# One group per PR and one for main: a newer push cancels the superseded run.
# On main this tests HEAD rather than every intermediate commit: back-to-back
# merges otherwise stack full GPU matrices on one runner pool and time each
# other out. Re-run an intermediate commit via workflow_dispatch if needed.
concurrency:
  group: gateway-tests-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  GENAI_BENCH_IMAGE: ghcr.io/moirai-internal/genai-bench:0.0.4

jobs:
  pre-commit:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The cluster runners share one NAT egress IP and GitHub intermittently
      # 401s anonymous git from it, even for public repos — pre-commit's
      # hook-repo fetches die on "could not read Username". Carry the workflow
      # token on every github.com git operation instead.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit checks
        env:
          SKIP: rustfmt,clippy,no-commit-to-branch,branch-name-check,dco-check,no-ai-co-author
        run: pre-commit run --all-files --show-diff-on-failure

  python-lint:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff check
        run: ruff check e2e_test/ bindings/python/ scripts/

      - name: Ruff format check
        run: ruff format --check e2e_test/ bindings/python/ scripts/

      - name: Mypy (e2e_test)
        run: mypy e2e_test/ --config-file mypy.ini

      - name: Mypy (bindings/python)
        run: mypy bindings/python/ --config-file mypy.ini

  grpc-proto-build-check:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Copy protos and build
        run: |
          rm -f crates/grpc_client/python/smg_grpc_proto/proto
          mkdir -p crates/grpc_client/python/smg_grpc_proto/proto
          cp crates/grpc_client/proto/*.proto crates/grpc_client/python/smg_grpc_proto/proto/
          pip install build grpcio-tools
          rm -rf crates/grpc_client/python/dist/
          cd crates/grpc_client/python && python -m build

      - name: Test import
        run: |
          pip install crates/grpc_client/python/dist/*.whl
          python - <<'PY'
          from smg_grpc_proto import sglang_scheduler_pb2, tokenspeed_scheduler_pb2

          fields = tokenspeed_scheduler_pb2.TensorData.DESCRIPTOR.fields_by_name
          assert "data" not in fields
          assert fields["shape"].number == 1
          assert fields["dtype"].number == 2
          assert fields["inline"].number == 3
          assert fields["shm"].number == 4
          assert fields["remote"].number == 5

          print("OK")
          PY

  build-wheel:
    # CPU-only Rust/wheel/Go-FFI/WASM compile — no GPU needed. Runs on the CPU
    # runner pool (which also tolerates the nvidia.com/gpu taint, so it can use
    # the abundant stranded CPU on GPU nodes) instead of competing for scarce
    # GPU runners.
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # No wheel-output cache here. It was keyed on a hash of every crate's
      # source, so it missed on essentially every code PR (all-or-nothing), and
      # on a miss it *masked* the incremental compilation cache by skipping the
      # build entirely — which also meant rust-cache rarely got populated. The
      # build now always runs and leans on rust-cache + sccache (set up in
      # ./.github/actions/setup-rust), which degrade gracefully: with the
      # dependency graph cached, only changed crates recompile.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Build Python wheel and Go FFI library
        run: |
          rm -rf bindings/python/dist/
          bash scripts/ci_setup_python_venv.sh
          bash scripts/ci_build_wheel.sh

      - name: Generate Python client types
        run: |
          source "$HOME/.cargo/env"
          mkdir -p clients/openapi
          cargo run -p openapi-gen -- clients/openapi/smg-openapi.yaml
          pip install 'datamodel-code-generator==0.54.0'
          datamodel-codegen \
            --input clients/openapi/smg-openapi.yaml \
            --input-file-type openapi \
            --output clients/python/smg_client/types/_generated.py \
            --output-model-type pydantic_v2.BaseModel \
            --use-annotated \
            --field-constraints \
            --target-python-version 3.10 \
            --collapse-root-models \
            --use-standard-collections \
            --use-union-operator
          sed -i 's/class \(.*\)(Enum):/class \1(str, Enum):/' clients/python/smg_client/types/_generated.py

      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: bindings/python/dist/*.whl
          retention-days: 1

      - name: Upload Go FFI library artifact
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: bindings/golang/target/release/libsmg_go.*
          retention-days: 1

      - name: Upload Python client types
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: clients/python/smg_client/types/_generated.py
          retention-days: 1

      - name: Upload WASM test fixtures
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/*.wasm
          retention-days: 1
          if-no-files-found: ignore

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test wheel install
        run: |
          pip install bindings/python/dist/*.whl
          python3 -c "import smg; print('Python package: OK')"
          python3 -c "from smg.smg_rs import Router; print('Rust extension: OK')"
          python3 -m smg.launch_router --help > /dev/null && echo "Entry point: OK"

  python-unit-tests:
    needs: build-wheel
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: dist/

      - name: Install wheel
        run: pip install dist/*.whl

      - name: Run Python unit tests
        run: |
          cd bindings/python
          python3 -m pip install pytest pytest-asyncio pytest-cov pytest-xdist
          pytest -q tests --cov=smg --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

      - name: Run grpc_servicer unit tests
        run: |
          rm -f crates/grpc_client/python/smg_grpc_proto/proto
          mkdir -p crates/grpc_client/python/smg_grpc_proto/proto
          cp crates/grpc_client/proto/*.proto crates/grpc_client/python/smg_grpc_proto/proto/
          # msgspec and pydantic gate the sidecar-protocol, fake-redis and
          # limit-options tests; numpy gates the Rust servicer's media bridge
          # tests (it lends tensor buffers as numpy views). Modules gated on
          # zmq or vllm still skip here (-rs lists them): the zmq ones import
          # engine servicers that need torch, and the vllm cases run on the
          # vLLM e2e lane.
          pip install ./crates/grpc_client/python msgspec pydantic numpy pyzmq
          pytest -q grpc_servicer/tests -rs

      - name: Run CI tooling unit tests
        run: pytest -q scripts/tests/test_ci_node_health.py scripts/tests/test_ci_prepared_backend_env.py scripts/tests/test_ci_tokenspeed_scheduler_pin.py scripts/tests/test_ci_gpu_runner_image.py scripts/tests/test_bench_gate.py scripts/tests/test_ci_reap_job_processes.py

      # CPU-only unit tests for the e2e harness itself (connection-mode parsing,
      # ZMQ/EPD command builders, ZMQ-lane collection filter). --noconftest keeps
      # e2e_test/conftest.py — which needs the generated smg_client types and a
      # live backend — out of the picture; PYTHONPATH replaces the sys.path setup
      # it would otherwise do.
      - name: Run e2e harness unit tests
        env:
          PYTHONPATH: e2e_test
        run: |
          pip install ./e2e_test
          pytest -q --noconftest e2e_test/infra e2e_test/fixtures

  unit-tests:
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.rust-ci == 'true'
      )
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Its own cache key: this job's target directory is the workspace's test
      # profile, which the Rust Cache Warmer workflow builds on main under the
      # same key (and the same action inputs and environment, which the key
      # hashes), so a pull request restores a complete, current entry and
      # compiles only what it changed. The other jobs keep the default key.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: unit-tests

      - name: Verify default multimodal build does not require OpenCV
        run: |
          source "$HOME/.cargo/env"
          cargo check -p llm-multimodal
          cargo check --manifest-path bindings/python/Cargo.toml
          cargo check --manifest-path bindings/golang/Cargo.toml

      - name: Install OpenCV build dependencies
        run: AUTO_INSTALL=1 bash scripts/install_opencv.sh

      - name: Build WASM test fixtures
        run: |
          source "$HOME/.cargo/env"
          bash crates/wasm/tests/fixtures/build_fixtures.sh

      - name: Run lint
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Lint the self-hosted-only build (no provider routers)
        # Meaningful only because the crate's self dev-dependency disables
        # default features; see model_gateway/Cargo.toml.
        run: |
          source "$HOME/.cargo/env"
          cargo clippy -p smg -p smg-external-router --no-default-features --features smg/grpc-client,smg/jemalloc-stats --all-targets -- -D warnings

      - name: Lint a single-provider build (Anthropic only)
        run: |
          source "$HOME/.cargo/env"
          cargo clippy -p smg -p smg-external-router --no-default-features --features smg/grpc-client,smg/jemalloc-stats,smg/provider-anthropic --all-targets -- -D warnings

      - name: Run fmt
        run: |
          source "$HOME/.cargo/env"
          rustup component add --toolchain nightly-x86_64-unknown-linux-gnu rustfmt
          rustup toolchain install nightly --profile minimal
          cargo +nightly fmt -- --check

      # --strict makes a fixture that fails to generate fail this step (the Rust
      # golden tests skip a missing fixture directory, so a silent skip here
      # would silently drop coverage). The step does not block the Rust tests,
      # because a transient hub or pip failure should still leave a test
      # signal; the outcome is re-raised after the tests run.
      - name: Generate vision golden fixtures
        id: vision-golden
        continue-on-error: true
        run: |
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers pillow numpy scipy
          python crates/multimodal/scripts/generate_vision_golden.py --strict

      - name: Create isolated Postgres test database
        # No continue-on-error here: the Postgres regression suite must
        # actually run in CI, not silently no-op if this step fails (see PR
        # #1935 review discussion). `check --postgres` retries on its own
        # for transient pod-restart flakiness.
        run: |
          bash scripts/ci_agentic_svc_deps.sh check --postgres postgres-db
          bash scripts/ci_agentic_svc_deps.sh create-postgres-db postgres-db

      # ffmpeg and ffprobe let the gated video sampling decode test run instead of returning early.
      - name: Install ffmpeg
        run: |
          sudo=""; command -v sudo >/dev/null 2>&1 && sudo=sudo
          export DEBIAN_FRONTEND=noninteractive
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends ffmpeg

      # The test targets are built in a step of their own: when the Rust cache
      # has nothing to restore (the usual case on this runner pool, see
      # smg-project/smg-lab#157), the whole workspace compiles in the test
      # profile here, 11 minutes on a quiet runner and 28 on a busy one, and a
      # single step would spend the test budget below on compiling. The
      # second step finds everything fresh and only runs the tests, so its
      # timeout bounds the tests, which is what a timeout here is for.
      - name: Build the Rust tests
        timeout-minutes: 45
        run: |
          source "$HOME/.cargo/env"
          cargo test --no-run
          cargo test -p llm-tokenizer --features tokenizers-v1 --no-run
          cargo test -p smg-response-template --features symphony --no-run
          cargo test -p data-connector --test postgres_integration --no-run

      - name: Run Rust tests
        timeout-minutes: 30
        run: |
          source "$HOME/.cargo/env"
          cargo test
          cargo test -p llm-tokenizer --features tokenizers-v1
          cargo test -p smg-response-template --features symphony
          cargo test -p data-connector --test postgres_integration -- --ignored --test-threads=1

      - name: Fail if vision golden fixtures did not generate
        if: steps.vision-golden.outcome == 'failure'
        run: |
          echo "::error::Vision golden fixture generation failed; see the 'Generate vision golden fixtures' step"
          exit 1

      - name: Cleanup Postgres test database
        if: always()
        run: bash scripts/ci_agentic_svc_deps.sh cleanup-postgres-db postgres-db

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  # --- Dependency audit ---

  # cargo audit of Cargo.lock against the RustSec advisory database. A pull
  # request that changes the dependency graph (the lockfile, a manifest, the
  # audit's ignore list) fails here on an advisory that .cargo/audit.toml
  # does not ignore; cargo-audit-nightly.yml runs the same script on main
  # every day, for advisories published after the last lockfile change.
  cargo-audit:
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.dependencies == 'true'
      )
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # The advisory database is a git clone from github.com; see pre-commit
      # for why the workflow token rides on every github.com git operation.
      - name: Authenticate git for github.com
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config --global \
            url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf \
            "https://github.com/"

      - name: cargo audit
        run: bash scripts/ci_cargo_audit.sh

  # --- AArch64 ---

  # The multimodal crate carries modules that compile only on AArch64 (the
  # vector paths of pixel_convert and jpeg_turbo and of the vision stages
  # orientation, rgb_runs and torch_resample), and the KV index's prefetch
  # hint has an AArch64 arm. The jobs above run on x86_64 and never compile
  # that code, so a compile error, a lint or a failing test in it surfaced
  # first in a nightly image or a release build. This job lints the crates
  # with target-specific code and runs their tests on an arm64 runner
  # (GitHub-hosted, free for a public repository), on the pull requests the
  # unit-tests job runs for. The cache key is the job's own: the action
  # already keys by the runner's architecture, but this job's target
  # directory holds another crate set and profile than the unit-tests job's,
  # and the entry fills from the runs on main (the action saves on main
  # only). sccache is off for this job (the wrapper unset, its GitHub cache
  # disabled): the repository's Actions cache is over its budget, with
  # `incremental = true` sccache would only add this architecture's
  # dependency objects on every cold run, which rust-cache restores anyway,
  # and a local sccache disk cache never outlives a hosted runner. The
  # gateway binary's own AArch64 check
  # (model_gateway/tests/allocator_artifact_test.rs: jemalloc's 64 KiB page
  # setting) is not run here: it builds the smg binary, which the hosted
  # runner cannot afford on every pull request; it stays with the nightly
  # image.
  rust-aarch64:
    needs: [detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.result == 'success'
      && (
        github.event_name != 'pull_request'
        || needs.detect-changes.outputs.rust-ci == 'true'
      )
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SCCACHE_GHA_ENABLED: "false"
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: rust-aarch64

      - name: Lint the crates with AArch64-only code
        run: |
          source "$HOME/.cargo/env"
          rustup component add clippy
          cargo clippy -p llm-multimodal -p kv-index --all-targets -- -D warnings

      - name: Test the crates with AArch64-only code
        run: |
          source "$HOME/.cargo/env"
          cargo test -p llm-multimodal -p kv-index

  # --- Benchmarks (standalone) ---

  # Advisory: the thresholds in e2e_test/benchmarks are absolute latencies on
  # a shared runner pool and sit inside its noise band, so a miss is a warning,
  # not a merge blocker: it shows up as a warning annotation and in the step
  # summary (BENCH_ENFORCE_THRESHOLDS=1 makes it fail). Results are still
  # uploaded and summarized.
  benchmarks:
    needs: [build-wheel, detect-changes]
    # Advisory (continue-on-error): the full tier, or a change to its suite
    # or to the policies it drives (smg-lab#127); every push runs it.
    if: >-
      needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && (github.event_name != 'pull_request'
          || needs.detect-changes.outputs.e2e-full == 'true'
          || needs.detect-changes.outputs.benchmarks == 'true')
    runs-on: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    continue-on-error: true
    timeout-minutes: 36
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/

      - name: Download WASM test fixtures
        uses: actions/download-artifact@v8
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/
        continue-on-error: true

      - name: Download Python client types
        uses: actions/download-artifact@v8
        with:
          name: python-client-types
          path: clients/python/smg_client/types/

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Pull genai-bench image
        run: docker pull ${{ env.GENAI_BENCH_IMAGE }}

      - name: Run benchmarks
        env:
          ROUTER_LOCAL_MODEL_PATH: /models
          E2E_LOG_DIR: benchmark-logs
          GENAI_BENCH_TEST_TIMEOUT: "600"
        run: |
          mkdir -p benchmark-logs
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 pytest e2e_test/benchmarks \
            --ignore=e2e_test/benchmarks/test_go_bindings_perf.py \
            --ignore=e2e_test/benchmarks/test_nightly_perf.py \
            -s -vv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genai-bench-results-all-policies
          path: benchmark_**/

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: bash scripts/ci_dump_worker_logs.sh benchmark-logs benchmark-worker-logs

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-worker-logs
          path: benchmark-logs/
          if-no-files-found: ignore
          retention-days: 7

  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: read
    outputs:
      # Only PRs use this shortcut; main pushes keep their existing test coverage.
      docs-only: ${{ github.event_name == 'pull_request' && steps.filter.outputs.docs == 'true' && steps.filter.outputs.non-docs == 'false' && steps.filter.outputs.tests == 'false' }}
      # The tiers of the engine e2e matrix on a pull request (smg-lab#127); a
      # push to main and a manual dispatch run every lane whatever these say.
      #   e2e-full: some changed file lies outside every narrower bucket of
      #     the filter below (the shared servicer code and the wire crates,
      #     the gateway's routers, workers and config, the harness, the CI
      #     setup, and any path no bucket names), or the pull request carries
      #     the label `ci:full`: the whole matrix, as before.
      #   e2e-core: gateway modules whose behaviour does not depend on the
      #     engine behind them: the chat suite on one representative engine
      #     (the sglang row) and the router suite on both of its engines.
      #   e2e-mm / e2e-pd / e2e-epd: that lane family and its prerequisites.
      #   completions / embeddings / realtime / agentic / go-bindings /
      #   benchmarks: that lane, as before.
      #   rust-servicer: the Rust-servicer lane.
      #   engines: the engines whose own files changed (their Python
      #     servicer, setup action and install scripts), space-separated; a
      #     lane runs its rows for those engines. `e2e-engines` says whether
      #     there is any.
      e2e-full: ${{ steps.filter.outputs.all_count != steps.filter.outputs.narrow_count || steps.labels.outputs.force-full == 'true' }}
      e2e-core: ${{ steps.filter.outputs.core }}
      e2e-mm: ${{ steps.filter.outputs.mm }}
      e2e-pd: ${{ steps.filter.outputs.pd }}
      e2e-epd: ${{ steps.filter.outputs.epd }}
      completions: ${{ steps.filter.outputs.completions }}
      agentic: ${{ steps.filter.outputs.agentic }}
      embeddings: ${{ steps.filter.outputs.embeddings }}
      realtime: ${{ steps.filter.outputs.realtime }}
      go-bindings: ${{ steps.filter.outputs.go-bindings }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      rust-servicer: ${{ steps.filter.outputs.rust-servicer }}
      engines: ${{ steps.tiers.outputs.engines }}
      e2e-engines: ${{ steps.tiers.outputs.engines != '' }}
      rust-ci: ${{ steps.filter.outputs.rust-ci }}
      dependencies: ${{ steps.filter.outputs.dependencies }}
      # A change confined to Symphony's crate and the lock file: every GPU lane below
      # skips on this flag except the Symphony lane, which runs on `symphony`.
      symphony-only: ${{ steps.filter.outputs.symphony == 'true' && steps.filter.outputs.outside-symphony == 'false' }}
      # Any change to the Symphony crate or to the compiler that builds its tables from
      # a response template, whatever else the PR touches: both rows of the Symphony
      # lane, the one lane that reads through those tables on a real engine.
      symphony: ${{ steps.filter.outputs.symphony }}
      tokenspeed-image: ${{ steps.tokenspeed-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      # Resolve today's published nightly carrier to an immutable digest.
      # A missing image falls back to installing nightly wheels on the runner.
      # Resolution must stay tolerant so detect-changes can gate other lanes.
      - name: Resolve TokenSpeed CI image
        id: tokenspeed-image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(bash scripts/ci_tokenspeed_image_tag.sh 2>/dev/null || true)"
          image=""
          if [ -n "$tag" ]; then
            candidate="ghcr.io/${{ github.repository_owner }}/smg:${tag}"
            if docker login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GH_TOKEN" > /dev/null 2>&1 \
               && manifest="$(docker manifest inspect --verbose "$candidate" 2>/dev/null)"; then
              digest="$(jq -r 'if type == "array" then .[] | select(.Descriptor.platform.os == "linux" and .Descriptor.platform.architecture == "amd64") | .Descriptor.digest else .Descriptor.digest // empty end' <<< "$manifest")"
              if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                image="${candidate}@${digest}"
              fi
            fi
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [ -n "$image" ]; then
            echo "TokenSpeed lanes use prebuilt image: ${image}"
          else
            echo "Prebuilt TokenSpeed image not available (tag: ${tag:-unresolved}); lanes install nightly wheels"
          fi
      # The label `ci:full` forces the full matrix on a pull request whatever
      # its paths say. The labels are read live, not from the event payload,
      # so adding the label and re-running the workflow is enough; a read
      # that fails forces the full matrix as well (the safe direction).
      - name: Read the pull request's labels
        id: labels
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! labels="$(gh api "repos/$REPO/issues/$NUMBER/labels" --jq '.[].name')"; then
            echo "could not read the labels: the full matrix"
            echo "force-full=true" >> "$GITHUB_OUTPUT"
          elif grep -qx 'ci:full' <<< "$labels"; then
            echo "label ci:full: the full matrix"
            echo "force-full=true" >> "$GITHUB_OUTPUT"
          else
            echo "force-full=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Lets a filter exclude paths with `!` patterns. Filters without them
          # behave exactly as before: any changed file matching any pattern.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            docs:
              - '**/*.md'
            non-docs:
              - '**'
              - '!**/*.md'
            tests:
              - 'e2e_test/**'
              - '**/tests/**'
              - '**/fixtures/**'
            # The tiers of a pull request's engine e2e matrix (smg-lab#127).
            # A changed file that no bucket below names selects the full
            # matrix: the `e2e-full` output compares the file counts of `all`
            # and `narrow`, so a new path runs everything until it is placed
            # here on purpose; the label `ci:full` forces the full matrix.
            # Buckets may overlap (a file in two buckets runs both sets of
            # lanes). Patterns are positive, with one exception noted where
            # it is used: a `!` pattern in a bucket also excludes the file
            # from `narrow`, which sends it to the full tier.
            #
            # Path -> tier -> lanes on a pull request (a push to main and a
            # manual run keep every lane):
            #
            #   grpc_servicer/<engine>/, the engine's setup action and the
            #   install scripts only it runs       -> <engine>: that engine's
            #                                         rows of every lane
            #   crates/engine_servicer/            -> rust-servicer: the
            #                                         Rust-servicer lane
            #   crates/symphony/, the to_symphony
            #   compiler                           -> core + symphony: the
            #                                         chat sglang row, the
            #                                         router suite, both
            #                                         Symphony rows
            #   model_gateway routers/, worker/,
            #   config/, workflow/, server.rs,
            #   main.rs, app_context.rs, health.rs -> full: every lane
            #   crates/protocols, grpc_client, the
            #   ZMQ crates, bindings/python, the
            #   harness, the shared servicer and
            #   CI scripts, the two e2e workflows,
            #   Cargo.lock                         -> full
            #   gateway middleware/, observability/,
            #   rate_limit/, endpoints/, mesh*/,
            #   the gateway-only crates            -> core: the chat sglang
            #                                         row, the router suite,
            #                                         the vendor rows
            #   model_gateway/src/policies/        -> core + pd + epd +
            #                                         benchmarks
            #   crates/multimodal/                 -> core + mm (the Llama-4
            #                                         files: full)
            #   crates/kv_index/                   -> core + epd
            #   e2e_test/<suite>/ and the client
            #   module of that suite               -> that suite's lane
            #   crates/tokenizer/                  -> cpu-only: the fixture
            #                                         parity gate and the
            #                                         crate's tests
            #   docs, *.md, Helm, docker, test
            #   trees, other workflows             -> cpu-only: no lane
            #   anything else                      -> full
            all:
              - '**'
            # Nothing an engine lane can observe: documentation, lint and
            # format configuration, test trees the CPU jobs run, crates no
            # binary of a lane links, suites and scripts of other workflows,
            # deployment and release files.
            cpu-only: &cpu-only
              - '**/*.md'
              - 'docs/**'
              - '**/LICENSE'
              - 'assets/**'
              - 'Makefile'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'ruff.toml'
              - 'mypy.ini'
              - '.dockerignore'
              - '.gitignore'
              - '.pre-commit-config.yaml'
              - 'bindings/python/.coveragerc'
              # the mock worker (no lane here starts it; the discovery suites
              # that do run in their own workflow), the radix tree (nothing
              # links it)
              - 'crates/mock_worker/**'
              - 'crates/radix_tree/**'
              # the tokenizer: its oracle is the fixture parity gate (the
              # render and encode of every registered model against the
              # reference fixtures, in its own workflow on every pull request
              # that touches the crate) and the crate's tests. The gateway and
              # the Rust servicer read through it on every request, but a lane
              # adds no case a fixture does not pin; a loading change an
              # author wants seen on a live engine takes the `ci:full` label,
              # and the push to main runs every lane.
              - 'crates/tokenizer/**'
              # test trees and client libraries the CPU jobs run or no lane
              # imports (crates/wasm/tests holds the storage-hook fixtures of
              # the Responses suite and is also in `agentic` below; the
              # servicer tests run in python-unit-tests, and the ones that
              # import a real engine are also in that engine's bucket below,
              # so a change to one of them runs the lane that executes it)
              - 'model_gateway/tests/**'
              - 'model_gateway/benches/**'
              - 'crates/*/tests/**'
              - 'crates/*/benches/**'
              - 'bindings/python/tests/**'
              - 'clients/python/tests/**'
              - 'clients/rust/**'
              - 'clients/java/**'
              - 'grpc_servicer/tests/**'
              - 'scripts/tests/**'
              # suites and the servicer of other workflows
              - 'e2e_test/file_discovery/**'
              - 'e2e_test/kind_discovery/**'
              - 'e2e_test/mlx/**'
              - 'grpc_servicer/smg_grpc_servicer/mlx/**'
              # other workflows and repository automation; the two e2e
              # workflows are excluded (the exception), so a change to them
              # runs everything
              - '.github/workflows/**'
              - '!.github/workflows/pr-test-rust.yml'
              - '!.github/workflows/e2e-gpu-job.yml'
              - '.github/bench-gates/**'
              - '.github/CODEOWNERS'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/actionlint.yaml'
              - '.github/dependabot.yml'
              - '.github/labeler.yml'
              - '.github/mergify.yml'
              - '.github/versions/bellwether.ref'
              # deployment, release and example files no lane builds or runs
              - 'deploy/**'
              - 'docker/**'
              - 'examples/rl/**'
              # scripts no lane runs: the CI scripts of the lanes are not
              # listed on purpose (full tier, or the engine's bucket below);
              # these run in CPU jobs, in other workflows or by hand
              - 'scripts/bench/**'
              - 'scripts/bench_gate.py'
              - 'scripts/ci_gpu_runner_image.py'
              - 'scripts/ci_node_health.py'
              - 'scripts/ci_prune_tokenspeed_images.sh'
              - 'scripts/ci_setup_sglang_rocm_image.sh'
              - 'scripts/ci_setup_vllm_rocm_image.sh'
              - 'scripts/install_opencv.sh'
              - 'scripts/bfcl/**'
              - 'scripts/tau2/**'
              - 'scripts/installation/**'
              - 'scripts/k8s-runner-resources/**'
              - 'scripts/bench_image_preprocess.py'
              - 'scripts/check_engine_versions.sh'
              - 'scripts/check_release_versions.sh'
              - 'scripts/dco-check.sh'
              - 'scripts/e2e-test.sh'
              - 'scripts/fix_java_codegen.sh'
              - 'scripts/launch-pd-workers.sh'
              - 'scripts/mesh_load_gen.py'
              - 'scripts/mesh-profile-local.sh'
              - 'scripts/mlx_bench.sh'
              - 'scripts/mlx_bench_aggregate.py'
              - 'scripts/mock_worker.py'
              - 'scripts/release_docker_notes.sh'
              - 'scripts/run_benchmarks.py'
              - 'scripts/scale_load.py'
              - 'scripts/scale_test.sh'
              - 'scripts/setup-sccache.sh'
              - 'scripts/sim_ab.sh'
              - 'scripts/sim_load.py'
              - 'scripts/update_whl_index.py'
            # Gateway code whose behaviour does not depend on the engine
            # behind it: the chat suite on one real engine and the router
            # suite see a regression here as the whole matrix would. Crates
            # only the gateway links belong here; crates the servicers or the
            # wire crates link (protocols, grpc_client, the ZMQ crates) are
            # not listed and stay in the full tier. Not listed either, on
            # purpose: the routers, the worker registry, the config, the
            # entry points, server.rs (it assembles the routes of every suite
            # and starts the ZMQ worker manager) and the worker-registration
            # workflow (it probes and classifies each engine): full tier.
            core: &core
              - 'model_gateway/src/middleware/**'
              - 'model_gateway/src/observability/**'
              - 'model_gateway/src/rate_limit/**'
              - 'model_gateway/src/policies/**'
              - 'model_gateway/src/endpoints/**'
              - 'model_gateway/src/mesh/**'
              - 'model_gateway/src/mesh_discovery/**'
              - 'model_gateway/src/service_discovery/**'
              - 'model_gateway/src/wasm/**'
              - 'model_gateway/src/tls.rs'
              - 'model_gateway/src/version.rs'
              - 'model_gateway/src/posture.rs'
              - 'model_gateway/src/tenant.rs'
              - 'model_gateway/src/rl_adapter.rs'
              - 'crates/tool_parser/**'
              - 'crates/reasoning_parser/**'
              - 'crates/response_template/**'
              # Symphony reads chat completions behind --parser symphony. The chat
              # row runs the default parser and does not reach it; the Symphony
              # lane does, on the `symphony` output. Listed here so a change to
              # the crate counts as a narrow one.
              - 'crates/symphony/**'
              - 'crates/multimodal/**'
              - 'crates/kv_index/**'
              - 'crates/auth/**'
              - 'crates/mesh/**'
              - 'crates/mm_rdma/**'
              - 'crates/rl/**'
              - 'crates/wasm/**'
              - 'crates/workflow/**'
              # the client the harness drives every lane with, and the
              # generator of its types; the module of one suite is also in
              # that suite's bucket below
              - 'clients/python/smg_client/**'
              - 'clients/python/pyproject.toml'
              - 'clients/openapi-gen/**'
              - '.cargo/**'
            # Worker-side media processing: the multimodal crate also runs
            # inside the vLLM worker's in-process processor, and the PD
            # multimodal lane keeps one family on the router-side processor.
            # The two Llama-4 files are excluded (the exception): their only
            # lane is the four-GPU chat lane, so the `!` sends them to the
            # full tier.
            mm: &mm
              - 'crates/multimodal/**'
              - '!crates/multimodal/src/registry/llama4.rs'
              - '!crates/multimodal/src/vision/processors/llama4_vision.rs'
            # The PD suites, and the policies: the registry resolves the
            # prefill, decode and encode policies and pairs the roles, so a
            # policy change runs every lane that routes through two or three
            # worker roles. The gateway's PD modules under routers/ and
            # worker/ stay in the full tier.
            pd: &pd
              - 'e2e_test/router/test_pd_*.py'
              - 'model_gateway/src/policies/**'
            # The EPD suite, the KV index, and the policies (the encode
            # policy and the cache-aware routing the suite exercises).
            epd: &epd
              - 'e2e_test/chat_completions/test_epd_multimodal.py'
              - 'crates/kv_index/**'
              - 'model_gateway/src/policies/**'
            completions: &completions
              - 'e2e_test/completions/**'
              - 'clients/python/smg_client/api/completions.py'
            embeddings: &embeddings
              - 'e2e_test/embeddings/**'
              - 'clients/python/smg_client/api/embeddings.py'
            realtime: &realtime
              - 'e2e_test/realtime/**'
            # The Responses lane and the vendor lanes: MCP, storage, the
            # provider routers, the storage-hook WASM (built from
            # examples/wasm), the Responses and conversations endpoints and
            # the client modules of the Responses and Messages suites.
            agentic: &agentic
              - 'crates/mcp/**'
              - 'crates/data_connector/**'
              - 'crates/external_router/**'
              - 'crates/wasm/**'
              - 'model_gateway/src/endpoints/responses/**'
              - 'model_gateway/src/endpoints/conversations/**'
              - 'clients/python/smg_client/api/responses.py'
              - 'clients/python/smg_client/api/messages.py'
              - 'e2e_test/responses/**'
              - 'e2e_test/messages/**'
              - 'scripts/ci_agentic_svc_deps.sh'
              - 'scripts/oracle_flyway/**'
              - 'examples/wasm/**'
            go-bindings: &go-bindings
              - 'e2e_test/bindings_go/**'
              - 'bindings/golang/**'
            # The advisory benchmark job: its suite, and the policies it drives.
            benchmarks: &benchmarks
              - 'e2e_test/benchmarks/**'
              - 'model_gateway/src/policies/**'
            # The Rust servicer crate: linked into the Python binding only
            # (the gateway links it for its own tests) and started by the
            # lane that runs the servicers as Rust, the Rust-servicer lane.
            rust-servicer: &rust-servicer
              - 'crates/engine_servicer/**'
            # One engine's own files: its Python servicer package, its setup
            # action and the install scripts only it runs. A change here runs
            # that engine's rows of every lane (the `engines` output) and no
            # other engine's. What the engines share (the servicer package's
            # common modules, the proto package, the venv, wheel, model and
            # log scripts, the install scripts several engines call) is not
            # listed: full tier.
            sglang: &sglang
              - 'grpc_servicer/smg_grpc_servicer/sglang/**'
              - '.github/actions/setup-sglang/**'
              - 'scripts/ci_install_sglang.sh'
              # the servicer tests that need the engine's own dependencies
              # (SGLang itself, or torch, which python-unit-tests does not
              # install), run by the SGLang row that passes servicer_unit_tests
              - 'grpc_servicer/tests/test_sglang_mm_tensors.py'
              - 'grpc_servicer/tests/test_sglang_zmq_msgpack.py'
              - 'grpc_servicer/tests/test_sglang_zmq_plugin.py'
              - 'grpc_servicer/tests/test_sglang_rust_servicer.py'
            vllm: &vllm
              - 'grpc_servicer/smg_grpc_servicer/vllm/**'
              - '.github/actions/setup-vllm/**'
              - 'scripts/ci_install_vllm.sh'
              # the servicer tests that need the engine's own dependencies
              # (vLLM itself, or torch, which python-unit-tests does not
              # install), run by the vLLM row that passes servicer_unit_tests;
              # the other test_vllm_* files run on CPU in python-unit-tests
              # (as do the other test_sglang_* files, see sglang)
              - 'grpc_servicer/tests/test_vllm_error_codes.py'
              - 'grpc_servicer/tests/test_vllm_kv_events.py'
              - 'grpc_servicer/tests/test_vllm_media_identity.py'
              - 'grpc_servicer/tests/test_vllm_mm_processor.py'
              - 'grpc_servicer/tests/test_vllm_mm_sidecar.py'
              - 'grpc_servicer/tests/test_vllm_mm_tensors.py'
              - 'grpc_servicer/tests/test_vllm_package_init.py'
              - 'grpc_servicer/tests/test_vllm_pd_media_identity.py'
              - 'grpc_servicer/tests/test_vllm_rust_servicer.py'
            trtllm: &trtllm
              - '.github/actions/setup-trtllm/**'
              - 'scripts/ci_install_trtllm.sh'
            tokenspeed: &tokenspeed
              - 'grpc_servicer/smg_grpc_servicer/tokenspeed/**'
              - '.github/actions/setup-tokenspeed/**'
              - 'scripts/ci_install_tokenspeed.sh'
              - 'scripts/ci_fetch_tokenspeed_prebuilt.sh'
              - 'scripts/ci_tokenspeed_scheduler_pin.py'
              - 'scripts/ci_tokenspeed_image_tag.sh'
              - 'scripts/ci_install_flashinfer.py'
              - '.github/versions/tokenspeed.ref'
            # Every file a bucket above claims. `e2e-full` is true when a
            # changed file is outside this union (its count is below `all`).
            narrow:
              - *cpu-only
              - *core
              - *mm
              - *pd
              - *epd
              - *completions
              - *embeddings
              - *realtime
              - *agentic
              - *go-bindings
              - *benchmarks
              - *rust-servicer
              - *sglang
              - *vllm
              - *trtllm
              - *tokenspeed
            # The crate, and the compiler the gateway builds its tables with at
            # runtime (`response_template::to_symphony`); the Symphony lane runs
            # both rows on either. The compiler is outside `symphony-only`: a
            # change to it also matches `outside-symphony` below.
            symphony:
              - 'crates/symphony/**'
              - 'crates/response_template/src/to_symphony.rs'
              - 'crates/response_template/src/to_symphony/**'
            # Everything that is not Symphony's crate or the lock file. A PR is Symphony-only
            # when `symphony` matched and this did not. The `!` patterns only exclude under
            # `some-with-excludes` above; with the default quantifier `**` would match every file.
            outside-symphony:
              - '**'
              - '!crates/symphony/**'
              - '!Cargo.lock'
            rust-ci:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - 'crates/**'
              - 'test_support/**'
              - 'model_gateway/**'
              - 'bindings/python/Cargo.toml'
              - 'bindings/python/build.rs'
              - 'bindings/python/src/**'
              - 'bindings/golang/Cargo.toml'
              - 'bindings/golang/src/**'
              - 'clients/rust/**'
              - 'clients/openapi-gen/**'
              - '.cargo/**'
              - '.github/actions/setup-rust/**'
              - 'scripts/ci_install_rust.sh'
              - 'scripts/ci_apt_mirror.sh'
              - '.github/workflows/pr-test-rust.yml'
              - 'examples/wasm/wasm-guest-storage-hook/**'
              - 'examples/wasm/wasm-guest-storage-hook-passthrough/**'
            # The dependency graph: the cargo-audit job runs on a pull request
            # that changes it (or the audit's ignore list and script).
            dependencies:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - '**/Cargo.toml'
              - '.cargo/audit.toml'
              - 'scripts/ci_cargo_audit.sh'
              - '.github/workflows/pr-test-rust.yml'

      # The file counts decide the full tier. A filter that stops producing them
      # fails this job, and finish fails with it (smg-project/smg-lab#172),
      # instead of every lane skipping on an empty comparison. The step also
      # lists the engines whose own files changed, for the lanes' rows.
      - name: Check the tier inputs
        id: tiers
        env:
          ALL: ${{ steps.filter.outputs.all_count }}
          NARROW: ${{ steps.filter.outputs.narrow_count }}
          FORCE_FULL: ${{ steps.labels.outputs.force-full }}
          SGLANG: ${{ steps.filter.outputs.sglang }}
          VLLM: ${{ steps.filter.outputs.vllm }}
          TRTLLM: ${{ steps.filter.outputs.trtllm }}
          TOKENSPEED: ${{ steps.filter.outputs.tokenspeed }}
        run: |
          if ! [[ "$ALL" =~ ^[0-9]+$ && "$NARROW" =~ ^[0-9]+$ ]]; then
            echo "paths-filter produced no file counts (all='$ALL', narrow='$NARROW')" >&2
            echo "the e2e tiers cannot be decided" >&2
            exit 1
          fi
          engines=""
          for engine in sglang vllm trtllm tokenspeed; do
            var="${engine^^}"
            if [ "${!var}" = "true" ]; then
              engines="${engines:+$engines }$engine"
            fi
          done
          echo "engines=$engines" >> "$GITHUB_OUTPUT"
          if [ "$FORCE_FULL" = "true" ]; then
            echo "changed files: $ALL; tier: the full matrix (label ci:full)"
          elif [ "$ALL" != "$NARROW" ]; then
            echo "changed files: $ALL, $((ALL - NARROW)) outside every narrower bucket"
            echo "tier: the full matrix"
          else
            echo "changed files: $ALL, all in narrower buckets"
            echo "tier: the lanes of the matched buckets only${engines:+; engine rows: $engines}"
          fi

  # --- GPU E2E: organized by GPU tier + API, engine as matrix axis ---

  # === 1 GPU ===

  e2e-1gpu-chat:
    name: e2e-1gpu-chat (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-core == 'true'
                  || needs.detect-changes.outputs.e2e-epd == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    # Now also runs the previously-2-GPU chat tests (gpt-oss-20b,
    # Qwen2.5-14B) since they're tp=1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 36
            test_timeout: 28
            min_selected: 204 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # 21 min end to end on a quiet host (setup ~6 min, tests ~15 min);
          # under runner contention setup alone reached 9 min and the 24 min
          # budget cut the run short. Keep ~30% headroom like the other rows.
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: trtllm
            timeout: 36
            test_timeout: 24
            min_selected: 180 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # tokenspeed builds from source (~30m cold), so keep the job
          # timeout generous even though the test step is short.
          # Admin-ops e2e (flush/profile) piggybacks here because this is
          # the only lane with tokenspeed installed — e2e-1gpu-gateway
          # installs sglang/vllm only. The engine marker filter keeps the
          # rest of e2e_test/router out of this job.
          - engine: tokenspeed
            timeout: 56
            test_timeout: 26
            test_dirs: e2e_test/chat_completions e2e_test/router/test_admin_ops.py e2e_test/router/test_loads.py
            min_selected: 114 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: ${{ matrix.test_dirs || 'e2e_test/chat_completions' }}
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      servicer_unit_tests: ${{ matrix.engine == 'vllm' }}
      # The rows (smg-project/smg-lab#127): the full tier and every push run all
      # four; the core and EPD tiers run the representative row, sglang; an
      # engine whose own files changed runs its row. A disabled row is skipped
      # by the called workflow before it takes a runner.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine)
            || (matrix.engine == 'sglang'
                && (needs.detect-changes.outputs.e2e-core == 'true'
                    || needs.detect-changes.outputs.e2e-epd == 'true')) }}
    secrets: inherit

  # The chat cases with the gateway reading through Symphony (--parser symphony):
  # the same workers and suite as e2e-1gpu-chat, the Symphony path for every
  # model its registry knows. Runs on the full and core tiers as the chat lane
  # does (its sglang row in the core tier, both rows on the full tier and on a
  # push), both rows for any change to the Symphony crate or its table
  # compiler, since this is the one lane that exercises a table against a
  # real engine, and the row of an engine whose own files changed.
  e2e-1gpu-chat-symphony:
    name: e2e-1gpu-chat-symphony (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-core == 'true'
                  || needs.detect-changes.outputs.symphony == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 36
            test_timeout: 28
            min_selected: 204
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/chat_completions
      min_selected: ${{ matrix.min_selected }}
      parser: symphony
      # The rows, as in e2e-1gpu-chat: the core tier runs the sglang row only;
      # the full tier, a push, any change to the Symphony crate or its table
      # compiler (`symphony`, not `symphony-only`: a Symphony change beside
      # another narrow-bucket file still gets both rows) and an engine whose
      # own files changed run that engine's row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.symphony == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine)
            || (matrix.engine == 'sglang'
                && needs.detect-changes.outputs.e2e-core == 'true') }}
    secrets: inherit

  # The chat cases against the Rust gRPC servicer (SMG_SGLANG_SERVICER_IMPL=rust,
  # SMG_VLLM_SERVICER_IMPL=rust): the same workers, the Rust request path. A
  # row for SGLang and one for vLLM (the TokenSpeed Rust servicer has no
  # PR-time row yet, so this lane says nothing about it): every other lane of
  # those engines runs the Python servicer, so a launcher or binding change
  # that breaks the Rust servicer's start fails here and nowhere else.
  e2e-1gpu-chat-rust-servicer:
    name: e2e-1gpu-chat-rust-servicer (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.rust-servicer == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    # Now also runs the previously-2-GPU chat tests (gpt-oss-20b,
    # Qwen2.5-14B) since they're tp=1.
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 40
            test_timeout: 32
            # Chat lane plus the admin ops the Rust servicer serves through
            # the wire's control calls.
            test_dirs: e2e_test/chat_completions e2e_test/router/test_admin_ops.py e2e_test/router/test_decisions.py
            min_selected: 204 # floor ≈ 95% of the chat lane's measured effective (215 of 223 ran on the Rust servicer; audit 2026-10-04)
          # The vLLM chat suite on the Rust servicer: the suite, floor and
          # budgets of e2e-1gpu-chat's vllm row (the harness deselects nothing
          # for this servicer), so the two rows differ by the servicer only.
          - engine: vllm
            timeout: 32
            test_timeout: 24
            min_selected: 202 # the vllm chat row's floor: the same selection
          # The TokenSpeed chat suite on the Rust servicer: the suite, floor
          # and budgets of e2e-1gpu-chat's tokenspeed row (its prebuilt engine
          # image, or the source build on a cold path, hence the budget), so
          # the two rows differ by the servicer only. The admin-op and loads
          # cases of that row stay on the Python servicer's row.
          - engine: tokenspeed
            timeout: 56
            test_timeout: 26
            min_selected: 114 # the tokenspeed chat row's floor: the same selection
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: ${{ matrix.test_dirs || 'e2e_test/chat_completions' }}
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      servicer_impl: rust
      # The rows: the full tier, a push and a change to the Rust servicer crate
      # run all three; an engine whose own files changed (its launcher lives
      # in its servicer package) runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.rust-servicer == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  # Worker-side media processing: the vLLM gRPC worker fetches and
  # preprocesses media itself (SMG_VLLM_MM_PROCESSOR=inprocess) and the
  # gateway, left in auto mode, forwards media references. Same multimodal
  # cases as the chat lane plus the processing-location assertion.
  e2e-1gpu-chat-mm-worker:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-mm == 'true'
                  || needs.detect-changes.outputs.e2e-pd == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'vllm'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 28
      test_timeout: 20
      test_dirs: e2e_test/chat_completions/test_multimodal.py
      mm_processing: worker
      min_selected: 5 # the 6 Qwen3-VL cases on 1 GPU (Llama-4 Scout is a 4-GPU class)
    secrets: inherit

  e2e-1gpu-chat-zmq:
    name: e2e-1gpu-chat-zmq (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    # Same single-worker chat suite as e2e-1gpu-chat, driven over the ZMQ
    # direct-backend wire. The collection hook deselects the gRPC-only
    # families (PD, EPD, multi-worker) for a ZMQ lane, so this covers the
    # local cases only.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The ZMQ lane restarts the engine per model group (66-90s of
          # load+warmup each); the suite needs more headroom than the gRPC
          # lane, whose pool amortizes worker bring-up.
          - engine: vllm
            timeout: 46
            test_timeout: 40
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: tokenspeed
            timeout: 60
            test_timeout: 48
            min_selected: 109 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: sglang
            timeout: 60
            test_timeout: 48
            min_selected: 204 # floor ≈ 95% of measured effective (215 of 223 selected ran; audit 2026-10-03)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/chat_completions
      connection_mode: zmq
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      # The SGLang wire pins (grpc_servicer/tests/test_sglang_zmq_*) need a
      # real SGLang plus pyzmq and msgspec; this is the lane that has them.
      servicer_unit_tests: ${{ matrix.engine == 'sglang' }}
      # The rows: the full tier and a push run all three; an engine whose own
      # files changed runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  e2e-2gpu-chat-zmq-dp:
    name: e2e-2gpu-chat-zmq-dp (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    # The 1-GPU ZMQ suite with grouped workers: each ZMQ worker launches two
    # DP engines on one socket set (tp=1 models, one GPU per engine), so the
    # gateway's handshake, the connector's least-loaded selection, and
    # per-rank output attribution all run against a real dp=2 group. The wave
    # protocol is vLLM-only (TokenSpeed ranks run independently).
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: vllm
            timeout: 46
            min_selected: 202 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # The TokenSpeed ZMQ lane restarts the engine per model group, and
          # DP doubles model load + warmup. The ~22-minute TokenSpeed source
          # build eats the front of the budget, and at 50 the first dp run was
          # killed mid-suite while progressing (28 minutes of test time); 60
          # leaves the tests the same ~40 minutes the test_timeout allows.
          - engine: tokenspeed
            timeout: 60
            min_selected: 82 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      # Tier selects the TEST SET (and model downloads): this lane runs the
      # tier-1 chat suite; the second GPU serves the second engine of the
      # group, not 2-GPU-marked tests.
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: 40
      test_dirs: e2e_test/chat_completions
      connection_mode: zmq
      zmq_engine_count: "2"
      min_selected: ${{ matrix.min_selected }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      # The rows: the full tier and a push run both; an engine whose own files
      # changed runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  e2e-1gpu-completions:
    name: e2e-1gpu-completions (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.completions == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 20
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 20
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/completions
      min_selected: ${{ matrix.min_selected }}
      # The rows: the full tier, a push and a change to the suite run both; an
      # engine whose own files changed runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.completions == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  e2e-1gpu-embeddings:
    name: e2e-1gpu-embeddings (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.embeddings == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 20
            min_selected: 18 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 20
            min_selected: 20 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/embeddings
      extra_deps: "sentence-transformers"
      min_selected: ${{ matrix.min_selected }}
      # The rows: the full tier, a push and a change to the suite run both; an
      # engine whose own files changed runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.embeddings == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  e2e-1gpu-realtime:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.realtime == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'vllm'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 25
      test_timeout: 20
      test_dirs: e2e_test/realtime
      min_selected: 3 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    secrets: inherit

  e2e-1gpu-gateway:
    name: e2e-1gpu-gateway (${{ matrix.engine }})
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-core == 'true'
                  || needs.detect-changes.outputs.e2e-pd == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          # The router suite grew (load reports, overload, restart); the sglang
          # lane also switches models between classes, which restarts a worker.
          - engine: sglang
            timeout: 30
            min_selected: 23 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 30
            min_selected: 3 # vllm gateway lane selects only 3 tests; floor covers all of them (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/router
      min_selected: ${{ matrix.min_selected }}
      # The rows: the full, core and PD tiers and a push run both (the router
      # suite is cheap on either engine); an engine whose own files changed
      # runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.e2e-core == 'true'
            || needs.detect-changes.outputs.e2e-pd == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  # === 2 GPU ===

  # e2e-2gpu-chat was retired: all chat_completions tests are tp=1 now
  # and run under e2e-1gpu-chat above.

  e2e-1gpu-responses:
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.agentic == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'sglang'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "1"
      runner: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
      timeout: 32
      test_timeout: 24
      test_dirs: e2e_test/responses
      setup_agentic_deps: true
      min_selected: 92 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    secrets: inherit

  e2e-2gpu-pd:
    name: e2e-2gpu-pd (${{ matrix.engine }}${{ matrix.kv_backend && format('-{0}', matrix.kv_backend) || '' }})
    needs: [build-wheel, e2e-1gpu-gateway, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.build-wheel.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-1gpu-gateway.result)
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-pd == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 40
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # The vLLM rows' job budget sits above the sum of their steps: the
          # engine setup takes 3 to 9 minutes (its packages come from the
          # network), the test step has 34, checkout, downloads, diagnostics
          # and the log upload about 4. At 40 the job budget cancelled a long
          # test step minutes before the step's own timeout would have failed
          # it, and the leg ended "cancelled" with its cases passing instead
          # of failing in the step that ran long (smg-project/smg-lab#170).
          - engine: vllm
            timeout: 50
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            kv_backend: mooncake
            timeout: 50
            min_selected: 15 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          # TokenSpeed prefill/decode over its Mooncake transfer, on the model
          # its disaggregation path is proven on (Qwen3.5-9B, fetched by id).
          # First run (34173426995): sequential PD passed; 32 concurrent
          # requests deadlocked both legs because the spec's engine window was
          # 4 (prefill waits for a decode that is never admitted). The window
          # now covers the suite's bursts; the over-window deadlock itself is
          # pinned by the topology suite. The prebuilt image is extracted, but
          # a cold path builds from source, hence the larger budgets.
          - engine: tokenspeed
            timeout: 75
            test_timeout: 50
            min_selected: 10 # floor ≈ 95% of the 11 gRPC PD cases marked for tokenspeed
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "2"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout || 34 }}
      test_dirs: e2e_test/router
      vllm_kv_backend: ${{ matrix.kv_backend || 'nixl' }}
      min_selected: ${{ matrix.min_selected }}
      extra_models: ${{ matrix.engine == 'tokenspeed' && 'Qwen/Qwen3.5-9B' || '' }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      # The rows: the full and PD tiers and a push run all four; an engine
      # whose own files changed runs its rows.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.e2e-pd == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  # PD legs both advertise worker-side processing; the M-RoPE class takes the
  # worker path and the Phi-3.5 class must stay on the router path.
  e2e-2gpu-pd-mm-worker:
    needs: [build-wheel, e2e-1gpu-chat-mm-worker, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && needs.e2e-1gpu-chat-mm-worker.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-pd == 'true'
                  || needs.detect-changes.outputs.e2e-mm == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'vllm'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: vllm
      gpu_tier: "2"
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: 40
      test_timeout: 34
      test_dirs: e2e_test/router/test_pd_multimodal.py
      mm_processing: worker
      min_selected: 4 # the 4 PD multimodal cases
    secrets: inherit

  # === 4 GPU ===

  e2e-4gpu-chat:
    name: e2e-4gpu-chat (${{ matrix.engine }})
    needs: [build-wheel, e2e-1gpu-chat, detect-changes]
    # The full tier and the rows of the engines whose own files changed, after
    # the one-engine chat job (the gating this job inherited through needs,
    # now spelled out). In an engine tier that job runs some rows and skips
    # the others, so its result is accepted unless a row failed or was
    # cancelled.
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.build-wheel.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-1gpu-chat.result)
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 30
            min_selected: 32 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: vllm
            timeout: 30
            min_selected: 32 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
          - engine: trtllm
            timeout: 45
            min_selected: 24 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_dirs: e2e_test/chat_completions
      min_selected: ${{ matrix.min_selected }}
      # The rows: the full tier and a push run all three; an engine whose own
      # files changed runs its row.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  e2e-4gpu-gateway:
    name: e2e-4gpu-gateway
    needs: [build-wheel, e2e-1gpu-gateway, detect-changes]
    # The full tier and an sglang change, after the one-engine router job; in
    # an engine tier that job runs one row, so its result is accepted unless
    # a row failed or was cancelled.
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.build-wheel.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-1gpu-gateway.result)
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'sglang'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: 25
      test_dirs: e2e_test/router
      test_filter: "-k TestIGWMixedWorkerClassification"
    secrets: inherit

  e2e-4gpu-epd:
    name: e2e-4gpu-epd (tokenspeed)
    needs: [build-wheel, e2e-1gpu-chat, detect-changes]
    # The full and EPD tiers and a TokenSpeed change. The one-engine chat job
    # stays the prerequisite; in the EPD tier only its sglang row runs and the
    # other rows are skipped, so its result is accepted unless a row failed or
    # was cancelled.
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-1gpu-chat.result)
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-epd == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'tokenspeed'))))
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: tokenspeed
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: 75
      test_timeout: 65
      test_dirs: e2e_test/chat_completions/test_epd_multimodal.py
      extra_models: "Qwen/Qwen3.5-9B"
      min_selected: 6 # floor ≈ 95% of measured effective (e2e audit 2026-08-21)
      tokenspeed_prebuilt_image: ${{ needs.detect-changes.outputs.tokenspeed-image }}
    secrets: inherit

  # PD disaggregation under one 4-GPU topology (2 prefill + 2 decode) plus a
  # fleet assembled at runtime through the worker API, per engine. The full
  # topology sweep (1p1d .. 3p1d) runs in nightly-pd.yml; this lane guards
  # every PR with the topology that exercises both legs' load balancing.
  e2e-4gpu-pd:
    name: e2e-4gpu-pd (${{ matrix.engine }}${{ matrix.kv_backend && format('-{0}', matrix.kv_backend) || '' }})
    needs: [build-wheel, e2e-1gpu-gateway, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.build-wheel.result == 'success'
      && !contains(fromJSON('["failure", "cancelled"]'), needs.e2e-1gpu-gateway.result)
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-pd == 'true'
                  || needs.detect-changes.outputs.e2e-engines == 'true')))
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: sglang
            timeout: 50
            test_timeout: 42
          - engine: vllm
            timeout: 50
            test_timeout: 42
          # Qwen3.5-9B loads slower and the prebuilt image is extracted first;
          # a cold path builds the engine from source.
          - engine: tokenspeed
            timeout: 85
            test_timeout: 60
          # The other KV transport of each engine (TokenSpeed only has
          # Mooncake): the same slice on vLLM over Mooncake, and a 1p1d
          # smoke of SGLang over NIXL (its venv gets NIXL only on this row,
          # #2498). The peer-restart test stays out of the NIXL smoke: the
          # SGLang prefill segfaults when its decode comes back on the same
          # address (#2503). The full sweeps run in nightly-pd.
          - engine: vllm
            kv_backend: mooncake
            timeout: 50
            test_timeout: 42
          - engine: sglang
            kv_backend: nixl
            timeout: 60
            test_timeout: 50
            test_filter: -k "1p1d and not http and not sole_leg_outage"
            min_selected: 11
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: ${{ matrix.engine }}
      gpu_tier: "4"
      runner: ${{ vars.SMG_RUNNER_GPU_4 || '4-gpu-h100' }}
      timeout: ${{ matrix.timeout }}
      test_timeout: ${{ matrix.test_timeout }}
      test_dirs: e2e_test/router/test_pd_topologies.py
      # The 2p2d slice (which carries the mixed-transport fleet on vLLM), the
      # runtime-assembled fleet, the over-window burst, and the two fleets
      # placement must refuse (mismatched transports, mismatched explicit
      # protocols); the full sweep runs in nightly-pd.
      # Run 34440725835: 9-16 min of tests per row against the 42/60 budgets.
      test_filter: ${{ matrix.test_filter || '-k "(2p2d and not http) or AssembledAtRuntime or SmallWindow or MismatchedTransport or MismatchedProtocol"' }}
      extra_models: ${{ matrix.engine == 'tokenspeed' && 'Qwen/Qwen3.5-9B' || '' }}
      # floor ≈ 93% of the slice: 15 cases on sglang/tokenspeed, 17 on vllm
      # (its two transport classes); the 1p1d smoke selects 13, floor 11
      min_selected: ${{ matrix.min_selected || 14 }}
      kv_backend: ${{ matrix.kv_backend || '' }}
      vllm_kv_backend: ${{ matrix.kv_backend || 'nixl' }}
      # The mixed-transport fleet needs both vLLM backends installed whatever the lane's own
      vllm_extra_kv_backends: ${{ matrix.engine == 'vllm' && 'mooncake' || '' }}
      tokenspeed_prebuilt_image: ${{ matrix.engine == 'tokenspeed' && needs.detect-changes.outputs.tokenspeed-image || '' }}
      # The rows: the full and PD tiers and a push run all five; an engine
      # whose own files changed runs its rows.
      enabled: >-
        ${{ github.event_name != 'pull_request'
            || needs.detect-changes.outputs.e2e-full == 'true'
            || needs.detect-changes.outputs.e2e-pd == 'true'
            || contains(needs.detect-changes.outputs.engines, matrix.engine) }}
    secrets: inherit

  # --- Vendor E2E: CPU-only cloud backend tests ---

  e2e-vendor:
    name: ${{ matrix.name }}
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.e2e-core == 'true'
                  || needs.detect-changes.outputs.agentic == 'true'
                  || needs.detect-changes.outputs.realtime == 'true')))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: anthropic-messages
            vendor: anthropic
            test_path: e2e_test/messages
            timeout: 20
            setup_agentic_deps: true
            external_tests: true

          - name: openai-responses
            vendor: openai
            test_path: e2e_test/responses
            timeout: 30
            setup_agentic_deps: true
            external_tests: true

          - name: openai-realtime
            vendor: openai
            test_path: e2e_test/realtime
            timeout: 20

          - name: xai-responses
            vendor: xai
            test_path: e2e_test/responses
            timeout: 15
            setup_agentic_deps: true

    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      E2E_VENDOR: ${{ matrix.vendor }}
      E2E_GPU_TIER: "0"
      SHOW_ROUTER_LOGS: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Check shared services
        if: matrix.setup_agentic_deps
        run: bash scripts/ci_agentic_svc_deps.sh check --oracle oracle-db --brave brave-search-mcp

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/

      - name: Download WASM test fixtures
        uses: actions/download-artifact@v8
        with:
          name: wasm-test-fixtures
          path: crates/wasm/tests/fixtures/
        continue-on-error: true

      - name: Download Python client types
        uses: actions/download-artifact@v8
        with:
          name: python-client-types
          path: clients/python/smg_client/types/

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Setup Oracle
        if: matrix.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh setup-oracle-client
          bash scripts/ci_agentic_svc_deps.sh create-oracle-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh create-oracle-flyway-user oracle-db

      - name: Run E2E tests
        env:
          BRAVE_MCP_HOST: ${{ matrix.setup_agentic_deps && 'brave-search-mcp' || '' }}
        run: |
          ROUTER_LOCAL_MODEL_PATH="/models" pytest ${{ matrix.test_path }} \
            -m "not external" \
            --reruns 2 --reruns-delay 5 \
            -s -vv

      # Tests that depend on services beyond the vendor API itself (hosted
      # tool execution, web search) fail for reasons this repo cannot fix, so
      # they report but never gate.
      - name: Run external-service E2E tests (advisory)
        if: matrix.external_tests
        continue-on-error: true
        env:
          BRAVE_MCP_HOST: brave-search-mcp
        run: |
          ROUTER_LOCAL_MODEL_PATH="/models" pytest ${{ matrix.test_path }} \
            -m external \
            --reruns 2 --reruns-delay 5 \
            -s -vv

      - name: Cleanup Oracle test users
        if: always() && matrix.setup_agentic_deps
        run: |
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-flyway-user oracle-db
          bash scripts/ci_agentic_svc_deps.sh cleanup-oracle-user oracle-db

  go-unit-tests:
    name: go-unit-tests
    needs: build-wheel
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Install build tools
        run: |
          bash scripts/ci_apt_mirror.sh
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Download Go FFI library
        uses: actions/download-artifact@v8
        with:
          name: go-ffi-library
          path: bindings/golang/target/release/

      - name: Verify Go FFI library
        run: ls -la bindings/golang/target/release/libsmg_go.*

      - name: Run Go unit tests
        run: |
          cd bindings/golang
          export CGO_ENABLED=1
          export CGO_LDFLAGS="-L$(pwd)/target/release"
          export LD_LIBRARY_PATH="$(pwd)/target/release:$LD_LIBRARY_PATH"
          go test -v ./...

  go-bindings-e2e:
    name: go-bindings-e2e
    needs: [build-wheel, detect-changes]
    if: >-
      always()
      && !cancelled()
      && needs.detect-changes.outputs.docs-only != 'true'
      && needs.detect-changes.outputs.symphony-only != 'true'
      && needs.build-wheel.result == 'success'
      && (github.event_name != 'pull_request'
          || (needs.detect-changes.result == 'success'
              && (needs.detect-changes.outputs.e2e-full == 'true'
                  || needs.detect-changes.outputs.go-bindings == 'true'
                  || contains(needs.detect-changes.outputs.engines, 'sglang'))))
    runs-on: ${{ vars.SMG_RUNNER_GPU_1 || '1-gpu-h100' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    # 19 min on a quiet host (SGLang setup ~6.5 min, Go ~4 min, tests ~6.5
    # min); under runner contention the setup step reached 10 min and the
    # job was cancelled as the last test passed. Keep ~35% headroom.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Download Go FFI library
        uses: actions/download-artifact@v8
        with:
          name: go-ffi-library
          path: bindings/golang/target/release/

      - name: Verify Go FFI library
        run: ls -la bindings/golang/target/release/libsmg_go.*

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/

      - name: Download Python client types
        uses: actions/download-artifact@v8
        with:
          name: python-client-types
          path: clients/python/smg_client/types/

      - name: Install wheel and test dependencies
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          bash scripts/ci_install_e2e_deps.sh

      - name: Run Go OAI server E2E tests
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          export CGO_LDFLAGS="-L$(pwd)/bindings/golang/target/release"
          export LD_LIBRARY_PATH="$(pwd)/bindings/golang/target/release:$LD_LIBRARY_PATH"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 ROUTER_LOCAL_MODEL_PATH="/models" \
          E2E_LOG_DIR=e2e-logs \
            pytest --reruns 2 --reruns-delay 5 e2e_test/bindings_go -s -vv

      - name: Worker failure diagnostics
        if: failure() || cancelled()
        run: bash scripts/ci_dump_worker_logs.sh e2e-logs "e2e-worker-logs-go-bindings"

      - name: Upload worker logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-worker-logs-go-bindings
          path: e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  go-bindings-benchmark:
    name: go-bindings-benchmark
    needs: build-wheel
    if: false  # Disabled
    runs-on: ${{ vars.SMG_RUNNER_GPU || 'k8s-runner-gpu' }}
    container: ${{ vars.SMG_CI_GPU_CONTAINER_IMAGE }}
    timeout-minutes: 32
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup SGLang backend
        uses: ./.github/actions/setup-sglang

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: bindings/golang/go.sum

      - name: Download Go FFI library
        uses: actions/download-artifact@v8
        with:
          name: go-ffi-library
          path: bindings/golang/target/release/

      - name: Verify Go FFI library
        run: ls -la bindings/golang/target/release/libsmg_go.*

      - name: Download wheel artifact
        uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel/

      - name: Install wheel
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl

      - name: Install test dependencies
        run: |
          python3 -m pip install pytest pytest-rerunfailures httpx openai grpcio grpcio-health-checking numpy

      - name: Pull genai-bench image
        run: docker pull ${{ env.GENAI_BENCH_IMAGE }}

      - name: Run Go bindings benchmark
        run: |
          bash scripts/ci_killall_sglang.sh "nuke_gpus"
          export CGO_LDFLAGS="-L$(pwd)/bindings/golang/target/release"
          export LD_LIBRARY_PATH="$(pwd)/bindings/golang/target/release:$LD_LIBRARY_PATH"
          SHOW_WORKER_LOGS=0 SHOW_ROUTER_LOGS=1 ROUTER_LOCAL_MODEL_PATH="/models" \
            pytest e2e_test/benchmarks/test_go_bindings_perf.py -s -vv

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: genai-bench-results-go-bindings
          path: benchmark_go_bindings/

  finish:
    needs: [detect-changes, pre-commit, python-lint, grpc-proto-build-check, build-wheel, python-unit-tests, cargo-audit, unit-tests, rust-aarch64, benchmarks, e2e-1gpu-chat, e2e-1gpu-chat-symphony, e2e-1gpu-chat-rust-servicer, e2e-1gpu-chat-mm-worker, e2e-1gpu-chat-zmq, e2e-2gpu-chat-zmq-dp, e2e-1gpu-completions, e2e-1gpu-embeddings, e2e-1gpu-realtime, e2e-1gpu-gateway, e2e-1gpu-responses, e2e-2gpu-pd, e2e-2gpu-pd-mm-worker, e2e-4gpu-chat, e2e-4gpu-gateway, e2e-4gpu-epd, e2e-4gpu-pd, e2e-vendor, go-unit-tests, go-bindings-e2e]
    if: always()
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Self-check: every e2e-* job defined in this workflow must gate merge
      # via finish.needs AND the failure check below. Keeps a new (or
      # forgotten) lane from silently becoming non-blocking.
      - name: Gate-integrity lint
        run: |
          python3 - <<'EOF'
          import re, sys

          path = ".github/workflows/pr-test-rust.yml"
          src = open(path).read()
          jobs = re.findall(r"^  (e2e-[a-z0-9_-]*):", src, re.M)
          if not jobs:
              sys.exit("gate-integrity lint: found no e2e-* job definitions; lint is broken")
          fin = re.search(r"^  finish:\n(.*?)(?=^  \S|\Z)", src, re.M | re.S)
          if not fin:
              sys.exit("gate-integrity lint: could not locate the finish job")
          body = fin.group(1)
          needs_m = re.search(r"needs:\s*\[([^\]]*)\]", body)
          if not needs_m:
              sys.exit("gate-integrity lint: finish.needs not found in inline-list form")
          needs = {n.strip() for n in needs_m.group(1).split(",")}
          missing_needs = sorted(j for j in jobs if j not in needs)
          # Search only the failure-check step, not the whole job body — a
          # comment elsewhere must not satisfy the check.
          check = re.search(
              r"- name: Check CI result\n(.*?)(?=^      - name:|\Z)", body, re.M | re.S
          )
          if not check:
              sys.exit("gate-integrity lint: could not locate the 'Check CI result' step")
          check_body = check.group(1)
          missing_check = sorted(j for j in jobs if f"needs.{j}.result" not in check_body)
          # Every e2e-* lane runs on a push to main and in the full tier of a
          # pull request (smg-project/smg-lab#127): a condition that forgets
          # either could skip a lane for an engine-facing change.
          # The same holds for a matrix row's `enabled`: a row that forgets
          # either would skip on a push or in the full tier.
          missing_tier = []
          for j in jobs:
              sec = re.search(rf"^  {re.escape(j)}:\n(.*?)(?=^  \S|\Z)", src, re.M | re.S).group(1)
              cond = re.search(r"^    if: >-\n((?:      .*\n)+)", sec, re.M)
              rows = re.search(r"^      enabled: >-\n((?:        .*\n)+)", sec, re.M)
              for text in (cond.group(1) if cond else "", rows.group(1) if rows else None):
                  if text is None:
                      continue
                  if ("github.event_name != 'pull_request'" not in text
                          or "needs.detect-changes.outputs.e2e-full == 'true'" not in text):
                      missing_tier.append(j)
                      break
          # Every e2e-* lane needs the wheel: a lane that reads its prerequisite's
          # result as "not failed or cancelled" (an engine tier skips rows) no
          # longer inherits the wheel check through it, and a compile-error pull
          # request would run the lane to fail on the missing artifact.
          missing_wheel = []
          for j in jobs:
              sec = re.search(rf"^  {re.escape(j)}:\n(.*?)(?=^  \S|\Z)", src, re.M | re.S).group(1)
              cond = re.search(r"^    if: >-\n((?:      .*\n)+)", sec, re.M)
              needs_j = re.search(r"^    needs:\s*\[([^\]]*)\]", sec, re.M)
              if (not cond or "needs.build-wheel.result == 'success'" not in cond.group(1)
                      or not needs_j or "build-wheel" not in {n.strip() for n in needs_j.group(1).split(",")}):
                  missing_wheel.append(j)
          if missing_needs or missing_check or missing_tier or missing_wheel:
              if missing_needs:
                  print(f"e2e jobs missing from finish.needs: {missing_needs}")
              if missing_check:
                  print(f"e2e jobs missing from the finish failure check: {missing_check}")
              if missing_tier:
                  print(f"e2e jobs whose condition or row enabling lacks the main-push rule or the full tier: {missing_tier}")
              if missing_wheel:
                  print(f"e2e jobs that do not need build-wheel and check its result: {missing_wheel}")
              sys.exit(1)
          print(f"OK: all {len(jobs)} e2e-* jobs gate merge, need the wheel and run in the full tier: {sorted(jobs)}")
          EOF

      - name: Check CI result
        run: |
          # A job that runs into its timeout-minutes ends "cancelled", not
          # "failure", and fails this gate the same way (smg-project/smg-lab#171).
          # A run cancelled as a whole ends with this gate failed too: it did
          # not pass, and finish stays a verdict on every head.
          bad='^(failure|cancelled)$'
          # detect-changes selects the lanes: when it fails or is cancelled, the
          # Rust unit tests and the benchmarks skip on every event and every
          # e2e lane skips on a pull request (on a push the lanes run: their
          # conditions carry always() and the push rule); a skipped job passes
          # this check, so its own result gates here (smg-project/smg-lab#172).
          if [[ "${{ needs.detect-changes.result }}" =~ $bad || \
                "${{ needs.pre-commit.result }}" =~ $bad || \
                "${{ needs.python-lint.result }}" =~ $bad || \
                "${{ needs.grpc-proto-build-check.result }}" =~ $bad || \
                "${{ needs.build-wheel.result }}" =~ $bad || \
                "${{ needs.python-unit-tests.result }}" =~ $bad || \
                "${{ needs.unit-tests.result }}" =~ $bad || \
                "${{ needs.cargo-audit.result }}" =~ $bad || \
                "${{ needs.rust-aarch64.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-symphony.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-rust-servicer.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-mm-worker.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-chat-zmq.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-chat-zmq-dp.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-completions.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-embeddings.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-realtime.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-gateway.result }}" =~ $bad || \
                "${{ needs.e2e-1gpu-responses.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-pd.result }}" =~ $bad || \
                "${{ needs.e2e-2gpu-pd-mm-worker.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-chat.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-gateway.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-epd.result }}" =~ $bad || \
                "${{ needs.e2e-4gpu-pd.result }}" =~ $bad || \
                "${{ needs.e2e-vendor.result }}" =~ $bad || \
                "${{ needs.go-unit-tests.result }}" =~ $bad || \
                "${{ needs.go-bindings-e2e.result }}" =~ $bad ]]; then
            echo "One or more jobs failed or were cancelled"
            exit 1
          else
            echo "All jobs completed successfully"
          fi

  summarize-benchmarks:
    needs: [benchmarks]
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    if: always() && contains(fromJSON('["success", "failure"]'), needs.benchmarks.result)
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.13"

    - name: Download gateway benchmark results
      uses: actions/download-artifact@v8
      with:
        name: genai-bench-results-all-policies

    - name: Create benchmark summary
      run: python3 e2e_test/benchmarks/summarize.py .
