name: AMD shared product SGLang two-GPU Mooncake PD validation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-shared-product-sglang-mooncake2
  cancel-in-progress: false
jobs:
  artifact-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require the original SG2 collection and source admission
        run: python3 .github/amd-shared-product/recipe.py
      - name: Verify external producer and relay payloads
        id: relay
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DIRECTORY="$RUNNER_TEMP/shared-relay-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "directory=$DIRECTORY" >> "$GITHUB_OUTPUT"
          python3 .github/amd-shared-product/relay.py --out "$DIRECTORY"
      - name: Relay wheel without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ steps.relay.outputs.directory }}/smg-wheel/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Go FFI without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ steps.relay.outputs.directory }}/go-ffi-library/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay WASM without changing its bytes
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ steps.relay.outputs.directory }}/wasm-test-fixtures/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Relay Python types without changing their bytes
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ steps.relay.outputs.directory }}/python-client-types/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
      - name: Preserve external producer identity and verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: external-producer-relay-evidence
          path: ${{ steps.relay.outputs.directory }}/evidence/
          if-no-files-found: ignore
          retention-days: 7
  amd-sglang-mooncake2:
    needs: artifact-relay
    uses: ./.github/workflows/e2e-gpu-job.yml
    with:
      engine: sglang
      gpu_tier: '2'
      runner: 1-gpu-mi300x
      timeout: 40
      test_timeout: 34
      test_dirs: e2e_test/router
      test_filter: ''
      min_selected: 15
      extra_deps: ./.github/amd-shared-product
      servicer_unit_tests: false
      gpu_vendor: amd
      container_image: lmsysorg/sglang:v0.5.21-rocm10-mi30x@sha256:4420a7e492fce623285c635b9a6a7e09ccf77a3c812006494e4414655d46662d
      container_options: --device=/dev/kfd --device=/dev/dri --device=/dev/infiniband --ulimit memlock=-1:-1 --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN --env SPT_NOENV=1 --env SMG_SGLANG_PD_PROOF=1 --env SMG_SGLANG_PD_REGISTRATION_FAILFAST=1 --env E2E_SGLANG_TRANSFER_BACKEND=mooncake
    secrets: inherit
  finish:
    if: always()
    needs: [artifact-relay, amd-sglang-mooncake2]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require the actual shared workflow to finish successfully
        env:
          RELAY: ${{ needs.artifact-relay.result }}
          CHAT: ${{ needs.amd-sglang-mooncake2.result }}
        run: test "$RELAY" = success && test "$CHAT" = success
