name: AMD vLLM ZMQ full chat verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-vllm-zmq-current-20261023
  cancel-in-progress: false
jobs:
  vllm-zmq:
    name: vllm-zmq
    if: vars.SMG_RUN_AMD_LEGS == 'true'
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_1 || '1-gpu-mi300x' }}
    timeout-minutes: 46
    container:
      image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models
    env:
      E2E_ENGINE: vllm
      E2E_RUNTIME: vllm
      E2E_GPU_TIER: '1'
      E2E_GPU_VENDOR: amd
      E2E_MIN_SELECTED: '202'
      E2E_MM_PROCESSING: ''
      E2E_VLLM_MM_PROCESSOR: ''
      E2E_VLLM_KV_BACKEND: nixl
      E2E_CONNECTION_MODE: zmq
      E2E_ZMQ_ENGINE_COUNT: '1'
      E2E_PARSER: ''
      E2E_SGLANG_SERVICER_IMPL: ''
      E2E_VLLM_SERVICER_IMPL: ''
      SMG_VLLM_SERVICER_WARMUP: fast
      BRAVE_MCP_HOST: ''
      HF_HOME: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ROUTER_LOCAL_MODEL_PATH: /models
      PYTHONPATH: e2e_test
      SHOW_WORKER_LOGS: '0'
      SHOW_ROUTER_LOGS: '0'
      RUST_LOG: warn,engine_zmq_adapter::client=info,engine_zmq_client::transport=info
      E2E_LOG_DIR: e2e-logs
      PYTEST_ADDOPTS: ''
      PIP_RETRIES: '0'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      SMG_QA_IMAGE: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
    steps:
      - uses: actions/checkout@v7
      - name: Mark only this job's processes
        run: echo "E2E_JOB_MARKER=vllm-zmq-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"
      - name: Reuse, install and test within one absolute job budget
        timeout-minutes: 41
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/amd-vllm-zmq/budget.py
      - name: Clean owned processes and record final dependency state
        shell: bash
        if: always() && env.E2E_JOB_MARKER != ''
        timeout-minutes: 3
        run: |
          status=0
          python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER" || status=1
          if test -f .venv/bin/activate; then source .venv/bin/activate; fi
          if test -f diagnostic-results/install-complete; then
            if test -s diagnostic-results/runtime-pins.txt; then
              export PIP_CONSTRAINT="${PIP_CONSTRAINT:+$PIP_CONSTRAINT }$PWD/diagnostic-results/runtime-pins.txt"
            else
              status=1
            fi
            python3 -m pip check > diagnostic-results/pipcheck-after.txt 2>&1 || status=1
            python3 .github/amd-qa/closure_audit.py snapshot diagnostic-results/final.json || status=1
            python3 .github/amd-vllm-zmq/environment.py final || status=1
          fi
          exit "$status"
      - name: Preserve evidence even on failure
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: amd-vllm-zmq-${{ github.run_id }}
          path: |
            diagnostic-results/
            e2e-logs/
          if-no-files-found: error
          retention-days: 7
