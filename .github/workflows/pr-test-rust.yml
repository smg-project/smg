name: Full vLLM PD Completion (temporary)

on:
  workflow_dispatch:
    inputs:
      lane:
        description: 'Frozen original PR-source lane; publish from its matching actual checkout'
        required: true
        type: choice
        options: [reuse, prepared]

permissions:
  contents: read
  actions: read

concurrency:
  group: smg-vllm-pd-completion
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 10
    env:
      SOURCE_LANE: ${{ inputs.lane }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify frozen PR-source CPU artifacts
        id: verify
        uses: actions/github-script@v8
        with:
          script: |
            const approved = {
              "reuse": {
                "run": 38014296288,
                "checkout": "920f469fe9a20964acabfb87577d583d86b06696",
                "head": "0d9da2cb516c515d89efada15c7a18c76a47ac56",
                "pr": 3043,
                "wheel_id": 11656245824,
                "wheel_digest": "sha256:737ca339613d9ad2980757d221a27a751c1fd78750f68fc6662880b1b8892c16",
                "types_id": 11656020958,
                "types_digest": "sha256:b8b22fa3bce796145b3b35beb5878e159b3e038b1c0b34ace6d0801768a7676b",
                "build_job": 114101164528,
                "branch": "ai-jz/smg-gpu-ci-serving-reuse"
              },
              "prepared": {
                "run": 38009512539,
                "checkout": "69ee99781d7dfb230efd3e7a8534144303755516",
                "head": "2d170ac32bf0c3a560d4cbd418a7f80306b92b4a",
                "pr": 3047,
                "wheel_id": 11653550603,
                "wheel_digest": "sha256:150be70c8dd9d6c708733bc198fa091e7694245ed767395479fdcfe8f8bde9cf",
                "types_id": 11653685095,
                "types_digest": "sha256:6ab76055b42d612af668eef8a6db42cce41556d0173d562cc986076e4849c68d",
                "build_job": 114087260084,
                "branch": "ai-jz/smg-gpu-ci-prepared-env"
              }
            };
            const expected = approved[process.env.SOURCE_LANE];
            if (!expected) throw new Error('Only the frozen reuse or prepared PR-source run is allowed');
            const {data: source} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: expected.run});
            if (source.event !== 'pull_request' || source.path !== '.github/workflows/pr-test-rust.yml' || source.head_sha !== expected.head || source.head_branch !== expected.branch || !source.pull_requests.some(pr => pr.number === expected.pr && pr.head.sha === expected.head)) throw new Error('Frozen PR source/workflow/head mismatch');
            const {data: build} = await github.rest.actions.getJobForWorkflowRun({...context.repo, job_id: expected.build_job});
            if (build.run_id !== expected.run || build.name !== 'build-wheel' || build.status !== 'completed' || build.conclusion !== 'success' || build.head_sha !== expected.head) throw new Error('Exact successful source build-wheel job missing');
            const artifacts = [];
            for (const [id, name, digest] of [[expected.wheel_id, 'smg-wheel', expected.wheel_digest], [expected.types_id, 'python-client-types', expected.types_digest]]) {
              const {data: artifact} = await github.rest.actions.getArtifact({...context.repo, artifact_id: id});
              if (artifact.name !== name || artifact.digest !== digest || artifact.expired || Date.parse(artifact.expires_at) <= Date.now() || artifact.workflow_run.id !== expected.run) throw new Error(`Immutable source artifact missing/changed/expired: ${id}`);
              artifacts.push({id, name, digest, expires: artifact.expires_at});
            }
            const fs = require('fs');
            fs.writeFileSync('pd-completion-source.json', JSON.stringify({...expected, workflow_id: source.workflow_id, build_wheel_job: build.id, artifacts}, null, 2));
            for (const [key, value] of Object.entries({source_run: expected.run, source_sha: expected.checkout, wheel_id: expected.wheel_id, types_id: expected.types_id})) core.setOutput(key, String(value));
      - name: Require the original application source
        env:
          SOURCE_SHA: ${{ steps.verify.outputs.source_sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git diff --name-only "$SOURCE_SHA" HEAD > pd-completion-source-diff.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          allowed = {'.github/workflows/pr-test-rust.yml', '.github/workflows/e2e-gpu-job.yml'}
          changed = set(Path('pd-completion-source-diff.txt').read_text().splitlines())
          assert changed and changed <= allowed, f'Unexpected application changes: {changed - allowed}'
          PYTHON
      - name: Download frozen native wheel
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.verify.outputs.wheel_id }}
          path: wheel/
          run-id: ${{ steps.verify.outputs.source_run }}
          github-token: ${{ github.token }}
      - name: Download frozen client types
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.verify.outputs.types_id }}
          path: clients/python/smg_client/types/
          run-id: ${{ steps.verify.outputs.source_run }}
          github-token: ${{ github.token }}
      - name: Record and upload provenance
        run: sha256sum wheel/*.whl clients/python/smg_client/types/_generated.py > pd-completion-file-sha256.txt
      - uses: actions/upload-artifact@v7
        with:
          name: pd-completion-provenance
          path: |
            pd-completion-source.json
            pd-completion-source-diff.txt
            pd-completion-file-sha256.txt
          if-no-files-found: error
          retention-days: 7
      - name: Seed wheel into this run
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: wheel/*.whl
          if-no-files-found: error
          retention-days: 1
      - name: Seed client types into this run
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: clients/python/smg_client/types/_generated.py
          if-no-files-found: error
          retention-days: 1

  pd:
    needs: seed
    uses: ./.github/workflows/e2e-gpu-job.yml
    secrets: inherit
    with:
      engine: vllm
      gpu_tier: '2'
      runner: ${{ vars.SMG_RUNNER_GPU_2 || '2-gpu-h100' }}
      timeout: 55
      test_timeout: 48
      test_dirs: e2e_test/router
      vllm_kv_backend: nixl
      min_selected: 15
