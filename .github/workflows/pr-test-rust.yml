name: AMD NIXL local KV lifecycle diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-pd-nixl-local-kv-e915
  cancel-in-progress: false
jobs:
  pd-nixl-local-kv-close:
    name: pd-nixl-local-kv-close
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_8 || '8-gpu-mi300x' }}
    timeout-minutes: 15
    container:
      image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models
    env:
      E2E_ENGINE: vllm
      E2E_RUNTIME: vllm
      E2E_GPU_TIER: '4'
      E2E_MIN_SELECTED: '1'
      E2E_VLLM_KV_BACKEND: nixl
      E2E_KV_BACKEND: nixl
      SMG_PD_TRACE_LOCAL_KV: '1'
      E2E_LOG_DIR: e2e-logs
      PYTHONPATH: e2e_test
      PYTEST_ADDOPTS: ''
      PIP_RETRIES: '0'
      HF_HOME: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ROUTER_LOCAL_MODEL_PATH: /models
      SHOW_WORKER_LOGS: '0'
      SHOW_ROUTER_LOGS: '1'
      SMG_QA_IMAGE: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Require owned AMD runner
        run: |
          case "$RUNNER_NAME" in
            amd-mi300x-1|amd-mi300x-2) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - name: Mark owned processes
        run: echo "E2E_JOB_MARKER=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"
      - name: Reuse, setup and probe within absolute ten-minute activity budget
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/amd-pd-env/diagnostic_budget.py
      - name: Reap owned processes and preserve final environment state
        shell: bash
        if: always() && env.E2E_JOB_MARKER != ''
        timeout-minutes: 3
        run: |
          status=0
          python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER" || status=1
          if test -f .venv/bin/activate; then source .venv/bin/activate; fi
          if test -f diagnostic-results/install-complete; then
            if test -f diagnostic-results/runtime-pins.txt; then
              export PIP_CONSTRAINT="${PIP_CONSTRAINT:+$PIP_CONSTRAINT }$PWD/diagnostic-results/runtime-pins.txt"
            else
              echo "Missing runtime constraints during final checks" >&2
              status=1
            fi
            python3 -m pip check > diagnostic-results/pip-check-final.txt 2>&1 || status=1
            python3 .github/amd-qa/closure_audit.py snapshot diagnostic-results/final-packages.json || status=1
            python3 .github/amd-pd-env/runtime_environment.py final || status=1
          fi
          exit "$status"
      - name: Upload diagnostic evidence including failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: amd-pd-nixl-local-kv-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-results/
            e2e-logs/
          if-no-files-found: error
          retention-days: 7
