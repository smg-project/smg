name: Exact d5 artifact upload-only renewal

on:
  workflow_dispatch:
    inputs:
      root_manual_upload_only:
        description: Root separately reviewed CPU-only copy admission
        type: boolean
        default: false
      admission_nonce:
        description: Exact independently admitted CPU-only nonce
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: smg-d5-artifact-renewal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  renew-d5-artifacts-only:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.root_manual_upload_only == true }}
    name: renew-d5-artifacts-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ''
      HIP_VISIBLE_DEVICES: ''
      ROCR_VISIBLE_DEVICES: ''
      NVIDIA_VISIBLE_DEVICES: void
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact isolated copy source
        uses: actions/checkout@v7
        timeout-minutes: 1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify actual old producer and immutable payload bytes only
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMG_RENEWAL_NONCE: ${{ inputs.admission_nonce }}
        run: >-
          python3 -I -B .github/amd-shared-product/artifact-renewal/renew.py
          --out "$RUNNER_TEMP/smg-renewal-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Copy-upload original wheel payload
        id: wheel
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: ${{ runner.temp }}/smg-renewal-${{ github.run_id }}-${{ github.run_attempt }}/smg-wheel/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Copy-upload original Go payloads
        id: go
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: go-ffi-library
          path: ${{ runner.temp }}/smg-renewal-${{ github.run_id }}-${{ github.run_attempt }}/go-ffi-library/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Copy-upload original generated client types
        id: types
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: python-client-types
          path: ${{ runner.temp }}/smg-renewal-${{ github.run_id }}-${{ github.run_attempt }}/python-client-types/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Copy-upload original WASM payloads
        id: wasm
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: wasm-test-fixtures
          path: ${{ runner.temp }}/smg-renewal-${{ github.run_id }}-${{ github.run_attempt }}/wasm-test-fixtures/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Preserve origin verification evidence
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/upload-artifact@v7
        with:
          name: d5-artifact-renewal-origin-evidence
          path: ${{ runner.temp }}/smg-renewal-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
