name: AMD NIXL controlled close diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: amd-pd-nixl-env-close-e915
  cancel-in-progress: false
jobs:
  pd-nixl-env-close:
    name: pd-nixl-env-close
    runs-on: ${{ vars.SMG_RUNNER_AMD_GPU_8 || '8-gpu-mi300x' }}
    timeout-minutes: 15
    container:
      image: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      options: --device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models
    env:
      E2E_ENGINE: vllm
      E2E_RUNTIME: vllm
      E2E_GPU_TIER: '4'
      E2E_MIN_SELECTED: '1'
      E2E_VLLM_KV_BACKEND: nixl
      E2E_KV_BACKEND: nixl
      E2E_LOG_DIR: e2e-logs
      PYTHONPATH: e2e_test
      PYTEST_ADDOPTS: ''
      HF_HOME: /models
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ROUTER_LOCAL_MODEL_PATH: /models
      SHOW_WORKER_LOGS: '0'
      SHOW_ROUTER_LOGS: '1'
      SMG_QA_IMAGE: vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Require owned AMD runner
        run: |
          case "$RUNNER_NAME" in
            amd-mi300x-1|amd-mi300x-2) ;;
            *) echo "Unexpected runner: $RUNNER_NAME" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v7
      - name: Mark owned processes
        run: echo "E2E_JOB_MARKER=e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}" >> "$GITHUB_ENV"
      - name: Reuse, setup and probe within absolute ten-minute activity budget
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/amd-pd-env/diagnostic_budget.py
      - name: Reap only processes from this job
        if: always() && env.E2E_JOB_MARKER != ''
        timeout-minutes: 2
        run: python3 scripts/ci_reap_job_processes.py "$E2E_JOB_MARKER"
      - name: Upload diagnostic evidence including failures
        if: always()
        timeout-minutes: 2
        uses: actions/upload-artifact@v7
        with:
          name: amd-pd-nixl-close-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            diagnostic-results/
            e2e-logs/
          if-no-files-found: error
          retention-days: 7
