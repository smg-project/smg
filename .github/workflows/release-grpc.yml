name: Release gRPC packages to PyPI

# Published only on a maintainer's dispatch against a release tag or branch
# (scripts/release/README.md): no push publishes.
on:
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          auto: the packages whose version at this ref is not complete on PyPI (wheel and sdist);
          proto, servicer or both: named outright, for a retry
        type: choice
        options: [auto, proto, servicer, both]
        default: auto

permissions:
  contents: read

jobs:
  # ── The packages whose version at the dispatched ref is not complete on PyPI (or the ones named) build and upload; --skip-existing passes the files PyPI has ──
  detect:
    name: Select packages
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.changes.outputs.proto }}
      servicer: ${{ steps.changes.outputs.servicer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select packages
        id: changes
        run: |
          # A package is selected when the version its pyproject.toml carries at this ref is not complete on PyPI yet:
          # both files there, the wheel and the sdist. A servicer-only release never runs the proto upload (a proto
          # token failure cannot hold it up), and a run that failed after one of the two files uploaded is retried
          # as it is (--skip-existing passes the file PyPI has). The packages input names them outright.
          selected() {
            local name=$1 file=$2 package=$3 version
            case "${PACKAGES:-auto}" in
              auto) ;;
              both | "$package") echo "${name}: selected by the packages input (${PACKAGES})" >&2; echo true; return ;;
              *) echo "${name}: not selected (packages=${PACKAGES})" >&2; echo false; return ;;
            esac
            version=$(grep -m1 '^version = ' "$file" | sed 's/version = "\(.*\)"/\1/; s/-rc\./rc/')
            if curl -fsS "https://pypi.org/pypi/${name}/${version}/json" 2>/dev/null | python3 -c '
          import json, sys
          kinds = {file["packagetype"] for file in json.load(sys.stdin)["urls"]}
          sys.exit(0 if {"bdist_wheel", "sdist"} <= kinds else 1)
          ' 2>/dev/null; then
              echo "${name} ${version} is complete on PyPI (wheel and sdist): not selected" >&2
              echo false
            else
              echo "${name} ${version} is not complete on PyPI: selected" >&2
              echo true
            fi
          }
          echo "proto=$(selected smg-grpc-proto crates/grpc_client/python/pyproject.toml proto)" >> "$GITHUB_OUTPUT"
          echo "servicer=$(selected smg-grpc-servicer grpc_servicer/pyproject.toml servicer)" >> "$GITHUB_OUTPUT"
        env:
          PACKAGES: ${{ inputs.packages }}

  # ── Tier 1: Proto (no dependencies) ──
  build-proto:
    name: Build smg-grpc-proto
    needs: [detect]
    if: needs.detect.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install build twine grpcio-tools

      - name: Copy proto files (replace symlink with real files)
        run: |
          rm -f crates/grpc_client/python/smg_grpc_proto/proto
          mkdir -p crates/grpc_client/python/smg_grpc_proto/proto
          cp crates/grpc_client/proto/*.proto crates/grpc_client/python/smg_grpc_proto/proto/

      - name: Build package
        run: cd crates/grpc_client/python && python -m build

      - name: Check package
        run: twine check --strict crates/grpc_client/python/dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: grpc-proto-dist
          path: crates/grpc_client/python/dist/

  upload-proto:
    name: Upload proto to PyPI
    if: github.repository == 'smg-project/smg'
    needs: [build-proto]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: grpc-proto-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_GRPC_PROTO }}
        run: |
          pip install twine
          twine upload dist/* --verbose --skip-existing

  # ── Tier 2: Servicer (waits for Tier 1 if proto changed) ──
  build-servicer:
    name: Build smg-grpc-servicer
    needs: [detect, build-proto, upload-proto]
    # Run if: proto wasn't needed (skipped) OR proto built and uploaded successfully
    if: >-
      always()
      && needs.detect.outputs.servicer == 'true'
      && (
        needs.detect.outputs.proto != 'true'
        || (
          needs.build-proto.result == 'success'
          && needs.upload-proto.result != 'failure'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build deps
        run: pip install build twine

      - name: Build package
        run: cd grpc_servicer && python -m build

      - name: Check package
        run: twine check --strict grpc_servicer/dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: grpc-servicer-dist
          path: grpc_servicer/dist/

  upload-servicer:
    name: Upload servicer to PyPI
    needs: [build-servicer]
    if: >-
      always()
      && github.repository == 'smg-project/smg'
      && needs.build-servicer.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: grpc-servicer-dist
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_GRPC_SERVICER }}
        run: |
          pip install twine
          twine upload dist/* --verbose --skip-existing
