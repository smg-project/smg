name: Benchmark - Tokenizer

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-tokenizer.yml'
      - '.github/bench-gates/tokenizer-blocks.toml'
      - '.github/bench-gates/tokenizer.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/Cargo.toml'
      - 'Cargo.toml'
      - 'model_gateway/benches/tokenizer_benchmark.rs'
      - 'crates/tokenizer/**'
      - '!crates/tokenizer/**/tests/**'
      - '!crates/tokenizer/**/*_test.rs'
      - '!crates/tokenizer/**/test_*.rs'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-tokenizer.yml'
      - '.github/bench-gates/tokenizer-blocks.toml'
      - '.github/bench-gates/tokenizer.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/Cargo.toml'
      - 'Cargo.toml'
      - 'model_gateway/benches/tokenizer_benchmark.rs'
      - 'crates/tokenizer/**'
      - '!crates/tokenizer/**/tests/**'
      - '!crates/tokenizer/**/*_test.rs'
      - '!crates/tokenizer/**/test_*.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-tokenizer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Tokenizer (${{ matrix.bench }})
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    strategy:
      # One row a bench binary, with its own gate file and its own runner: a
      # failure or a lost runner on one row never takes the other row's
      # verdict. A new row is a bench target of its own
      # (.github/bench-gates/tokenizer.toml records why).
      fail-fast: false
      matrix:
        include:
          - bench: tokenizer_benchmark
            package: smg
            features: tokenizers-v1
            gates: tokenizer.toml
            cwd: model_gateway
            artifact: tokenizer-results
          - bench: encode_blocks
            package: llm-tokenizer
            features: ''
            gates: tokenizer-blocks.toml
            cwd: crates/tokenizer
            artifact: tokenizer-blocks-results
    env:
      BENCH: ${{ matrix.bench }}
      PACKAGE: ${{ matrix.package }}
      FEATURES: ${{ matrix.features }}
      GATES: ${{ matrix.gates }}
      BENCH_CWD: ${{ matrix.cwd }}
      # Every bench binary of this job, the gate's pair and the summary run's,
      # places every function on a 64-byte boundary, so a pull request's code
      # size does not move the unchanged hot functions into another placement
      # class (the two speed states of identical code described in
      # .github/bench-gates/tokenizer.toml). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          # No Rust cache: the bench-profile entry took 1.4 GB of the
          # repository's 10 GB cache, and the job ran about sixty minutes
          # with it restored as without.
          cache: 'false'

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in the row's gate file under .github/bench-gates; the job fails on a gated
      # regression.
      # A push to main keeps the single full run.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py ".github/bench-gates/$GATES" "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates ".github/bench-gates/$GATES" \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p "$PACKAGE" --features "$FEATURES" --bench "$BENCH" --no-run

      - name: Build the base branch's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 60
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/$GATES" \
            --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
            cargo bench -p "$PACKAGE" --features "$FEATURES" --bench "$BENCH" --no-run
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 45
        run: |
          set -o pipefail
          lscpu | grep -m1 'Model name' | tee benchmark_output.txt || true
          python3 scripts/bench_gate.py run --gates ".github/bench-gates/$GATES" \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd "$BENCH_CWD" --out bench-gate 2>&1 | tee -a benchmark_output.txt

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 60
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          lscpu | grep -m1 'Model name' | tee benchmark_output.txt || true
          cargo bench -p "$PACKAGE" --features "$FEATURES" --bench "$BENCH" 2>&1 | tee -a benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: |
            target/criterion/tokenizer*/
            target/criterion/encode_blocks*/
            benchmark_output.txt
            bench-gate/
          retention-days: 30

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "## Tokenizer Benchmark ($BENCH)" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 benchmark_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
