name: E2E MCP mock

on:
  pull_request:
    paths:
      - e2e_test/infra/mock_mcp_server.py
      - e2e_test/infra/test_mock_mcp_server.py
      - e2e_test/pyproject.toml
      - .github/workflows/e2e-mcp-mock.yml

permissions:
  contents: read

concurrency:
  group: e2e-mcp-mock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'mcp==2.3.0' 'fastmcp-slim[server]==4.1.3' ./e2e_test
      - run: python -m pip check
      - run: python -m pytest -q --noconftest e2e_test/infra/test_mock_mcp_server.py
        env:
          PYTHONPATH: e2e_test
