name: CI Tooling CPU Tests

on:
  pull_request:
    paths:
      - .github/workflows/ci-tooling-tests.yml
      - .github/workflows/pr-test-rust.yml
      - .github/workflows/e2e-gpu-job.yml
      - scripts/**
      - e2e_test/**
      - grpc_servicer/**
      - crates/grpc_client/**
  workflow_dispatch:
    inputs:
      verify_brave_search_auth:
        description: "Verify Brave Search authentication once (no SMG or GPU tests)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-tooling-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.verify_brave_search_auth && '-brave-auth' || '' }}
  cancel-in-progress: true

jobs:
  tooling:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.verify_brave_search_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTHONPATH: e2e_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: python -m pip install pytest pyyaml ./e2e_test
      # Unlike the main GPU workflow, this accepts PRs against stacked branches.
      # Only the explicitly selected CPU fixtures run; no engine is installed.
      - name: Run available CI tooling contracts
        run: python scripts/ci_run_tooling_tests.py
      - name: Upload CPU test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-tooling-results
          path: ci-tooling-results.xml
          if-no-files-found: error
          retention-days: 7

  brave-auth:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_brave_search_auth }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify Brave Search authentication once
        env:
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python3 scripts/check_brave_search_auth.py
      - name: Upload safe Brave authentication result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brave-search-auth-${{ github.run_id }}-${{ github.run_attempt }}
          path: brave-search-auth-result.json
          if-no-files-found: error
          retention-days: 7
