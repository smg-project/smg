name: CI Tooling CPU Tests

on:
  pull_request:
    paths:
      - .github/workflows/ci-tooling-tests.yml
      - .github/workflows/pr-test-rust.yml
      - .github/workflows/e2e-gpu-job.yml
      - .github/workflows/nightly-pd.yml
      - .github/workflows/nightly-bfcl.yml
      - .github/workflows/pr-naming-check.yml
      - .pre-commit-config.yaml
      - scripts/**
      - e2e_test/**
      - grpc_servicer/**
      - crates/grpc_client/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-tooling-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CUDA_VISIBLE_DEVICES: ""
      HIP_VISIBLE_DEVICES: ""
      ROCR_VISIBLE_DEVICES: ""
      PYTHONPATH: e2e_test
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: python -m pip install pytest pyyaml ./e2e_test ./crates/grpc_client/python
      # Unlike the main GPU workflow, this accepts PRs against stacked branches.
      # Only the explicitly selected CPU fixtures run; no engine is installed.
      - name: Run available CI tooling contracts
        run: python scripts/ci_run_tooling_tests.py
      - name: Run MoRI topology selection and producer command contracts
        run: |
          python -m pytest -q --confcutdir=e2e_test/infra \
            e2e_test/infra/test_pd_topology_restart_skips.py \
            e2e_test/infra/test_moriio_cmd_builders.py \
            --junitxml=ci-moriio-topology-results.xml
      - name: Upload CPU test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-tooling-results
          path: |
            ci-tooling-results.xml
            ci-moriio-topology-results.xml
          if-no-files-found: error
          retention-days: 7
