name: Benchmark - Policy Store

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-policy-store.yml'
      - '.github/bench-gates/policy-store.toml'
      - 'scripts/bench_gate.py'
      - 'crates/policy_controller/Cargo.toml'
      - 'crates/policy_controller/benches/store_view.rs'
      - 'crates/policy_controller/benches/common/placed.rs'
      - 'crates/policy_controller/src/**'
      - '!crates/policy_controller/src/**/tests/**'
      - '!crates/policy_controller/src/**/*_test.rs'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-policy-store.yml'
      - '.github/bench-gates/policy-store.toml'
      - 'scripts/bench_gate.py'
      - 'crates/policy_controller/Cargo.toml'
      - 'crates/policy_controller/benches/store_view.rs'
      - 'crates/policy_controller/benches/common/placed.rs'
      - 'crates/policy_controller/src/**'
      - '!crates/policy_controller/src/**/tests/**'
      - '!crates/policy_controller/src/**/*_test.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-policy-store-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Policy Store (view build)
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    env:
      # Both bench binaries of this job place every function on a 64-byte
      # boundary, as the decision gate's do and for its reason
      # (.github/bench-gates/policy-engine.toml). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in .github/bench-gates/policy-store.toml; the job fails on a gated regression.
      # A push to main keeps the single summary run, the two-core rows included.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py .github/bench-gates/policy-store.toml "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates .github/bench-gates/policy-store.toml \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg-policy-controller --bench store_view --no-run

      # A base without the bench source (the pull request that adds it, a release
      # branch it was not backported to) has nothing to gate against: the base
      # build and the gate are skipped, the step says so, and the pull request's
      # binary runs once on its own as a smoke run of its rows.
      - name: Build the base branch's benchmark
        id: base
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          if [ -f crates/policy_controller/benches/store_view.rs ]; then
            python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/policy-store.toml" \
              --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
              cargo bench -p smg-policy-controller --bench store_view --no-run
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base has no store_view bench; nothing to gate against."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        timeout-minutes: 40
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates .github/bench-gates/policy-store.toml \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd crates/policy_controller --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run the pull request's benchmark (no base to gate against)
        if: github.event_name == 'pull_request' && steps.base.outputs.present != 'true'
        timeout-minutes: 40
        working-directory: crates/policy_controller
        run: |
          set -o pipefail
          CRITERION_HOME="$GITHUB_WORKSPACE/target/criterion" "$RUNNER_TEMP/bench-gate/pr" --bench --noplot 2>&1 | tee "$GITHUB_WORKSPACE/benchmark_output.txt"

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench -p smg-policy-controller --bench store_view 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-store-results-${{ github.sha }}
          path: |
            target/criterion/policy_store*/
            benchmark_output.txt
            bench-gate/
          retention-days: 30

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "## Policy Store Benchmark (view build)" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 benchmark_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
