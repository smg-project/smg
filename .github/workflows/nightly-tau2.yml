# Nightly τ²-bench A/B — multi-turn agentic benchmark comparing SMG's parsing
# frontend (SMG -> vLLM gRPC) against pure vLLM, same model/engine/checkpoint/
# sampling. Mirrors nightly-bfcl.yml's model matrix. Informational/non-blocking —
# never a merge gate.
#
# User-sim is the fixed gpt-5.2 model via the OpenAI API; agent arms expose an
# identical OpenAI /v1 endpoint so the τ²-bench harness can point at either and
# the ONLY variable is the frontend (tokenization + tool/reasoning parsing).
#
# Runs weekly (Thursdays 07:17 UTC) across retail, airline, and telecom domains over
# a 5-model matrix (qwen3.8 + gpt-oss on H100; deepseek-v4.1, minimax-m3,
# glm-5.3-flash on Blackwell, skipped on the schedule while the `blackwell` runner is
# offline). The Blackwell legs are num_tasks-capped to bound GPU time and
# gpt-5.2 spend (tau2 is far heavier per-leg than bfcl: multi-turn + per-turn API
# spend). On PRs that touch this pipeline ALL legs run on a tiny retail / 1-trial /
# few-task subset — a quick "does each leg launch + parse + score" smoke. The heavy
# Blackwell legs are dominated by model-load time and serialized by a host lock, so
# a PR run is not fast, but it confirms every leg works end-to-end before merge.
name: Nightly tau2

on:
  schedule:
    - cron: "17 7 * * 4" # Thursdays 07:17 UTC = 00:17 PDT; nightly-bfcl takes Mondays so the two never share the 4-gpu-h100 pool
  # PR sanity (disabled, like nightly-bfcl): when the tau2 pipeline itself changes
  # this would run ALL legs on a tiny retail / 1-trial / few-task subset — but the
  # 6-leg run (incl. the ~7h Blackwell legs) is too heavy for every pipeline PR.
  # Re-enable temporarily to smoke a pipeline change, or use workflow_dispatch.
  # pull_request:
  #   paths:
  #     - "scripts/tau2/**"
  #     - ".github/workflows/nightly-tau2.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this matrix leg (qwen3.8|gpt-oss|deepseek-v4.1|minimax-m3|glm-5.3-flash|qwen3.8-amd when opted in); empty = all"
        required: false
        default: ""
      model:
        description: "Override HF model id for the selected leg; empty = matrix default"
        required: false
        default: ""
      domains:
        description: "Comma-separated tau2 domains"
        required: false
        default: "retail,airline,telecom"
      num_trials:
        description: "Trials per task (pass^k k value)"
        required: false
        default: "2"
      num_tasks:
        description: "Max tasks per domain (0 = all); empty = matrix per-leg default"
        required: false
        default: ""
      max_concurrency:
        description: "Concurrent tau2 simulations per arm"
        required: false
        default: "16"
      request_timeout:
        description: "Per-LiteLLM-request timeout (s) for the agent; 0 = off"
        required: false
        default: "300"
      run_timeout:
        description: "Override per-domain `tau2 run` wall-clock cap (s), 0 = off; empty = matrix default"
        required: false
        default: ""
      vllm_tool_parser:
        description: "Override pure-vLLM --tool-call-parser; empty = matrix default"
        required: false
        default: ""
      smg_tool_parser:
        description: "Override SMG --tool-call-parser; empty = matrix default (empty also = SMG auto-detect)"
        required: false
        default: ""
      reasoning_parser:
        description: "Override reasoning parser for BOTH arms; empty = matrix defaults"
        required: false
        default: ""

concurrency:
  group: nightly-tau2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Build the smg wheel once (CPU-only Rust/maturin compile — no GPU needed).
  build-wheel:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Cache wheel artifacts
        id: cache-wheel
        uses: actions/cache@v6
        with:
          path: |
            bindings/python/dist/*.whl
          key: nightly-wheel-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'crates/**/src/**', 'model_gateway/src/**', 'bindings/python/src/**') }}
          restore-keys: |
            nightly-wheel-${{ runner.os }}-
      - name: Setup Rust
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-rust
      - name: Setup Python venv
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: bash scripts/ci_setup_python_venv.sh
      - name: Build Python wheel
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        run: bash scripts/ci_build_wheel.sh
      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: smg-wheel
          path: bindings/python/dist/*.whl
          retention-days: 7

  # Compute the model matrix as JSON so the dispatch `only` filter (and the
  # PR-sanity H100-only subset) can depend on inputs — `matrix` is not available
  # in a job-level `if`.
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - id: build
        env:
          ONLY: ${{ github.event.inputs.only }}
          EVENT_NAME: ${{ github.event_name }}
          AMD_ENABLED: ${{ vars.SMG_RUN_AMD_TAU2 }}
          AMD_RUNNER: ${{ vars.SMG_RUNNER_AMD_GPU_4 || '4-gpu-mi300x' }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          # max_model_len "auto": largest window that fits GPU memory (vLLM 0.24+),
          # capped at native max — multi-turn tau2 prompts can exceed a fixed 16k.
          # num_tasks: 0 = all (cheap H100 legs); 30/domain caps the heavy Blackwell
          # legs to bound GPU time + gpt-5.2 spend.
          #
          # run_timeout: per-DOMAIN `tau2 run` cap (s), so an arm's worst case is
          # run_timeout x len(domains). 5400 is the default.
          legs = [
              # H100 legs (TP=2 per arm, both arms concurrent: GPUs 0,1 + 2,3).
              {"name": "qwen3.8", "runner": "4-gpu-h100", "tp": 2,
               "gpu_a": "0,1", "gpu_b": "2,3",
               "model": "Qwen/Qwen3.8-27B",
               "vllm_tool": "qwen3_xml", "vllm_reason": "qwen3",
               "smg_tool": "qwen_xml", "smg_reason": "qwen3",
               "vllm_extra": "", "gpu_mem": "0.85", "startup_timeout": "600",
               "model_cache": "/models", "arm_mode": "concurrent",
               "max_model_len": "auto", "num_tasks": 30, "run_timeout": "5400"},  # cap like Blackwell legs — dense 27B is slow; bounds runtime + skips the airline task-44 straggler
              # gpt-oss SMG arm passes NO tool parser (smg_tool empty) -> harmony auto-detect.
              {"name": "gpt-oss", "runner": "4-gpu-h100", "tp": 2,
               "gpu_a": "0,1", "gpu_b": "2,3",
               "model": "openai/gpt-oss-120b",
               "vllm_tool": "openai", "vllm_reason": "",
               "smg_tool": "", "smg_reason": "",
               "vllm_extra": "", "gpu_mem": "0.85", "startup_timeout": "600",
               "model_cache": "/models", "arm_mode": "concurrent",
               "max_model_len": "auto", "num_tasks": 0, "run_timeout": "5400"},
              # Blackwell legs (B200). Models pre-staged on NVMe at /raid/models/<id>.
              # Concurrent TP=4 per arm (0-3 + 4-7); num_tasks-capped.
              # DeepSeek-V4.1-Flash is ~765GB on disk (552B backbone + 196B int8 Engram,
              # all GPU-resident), so it outgrows a TP=4 half-node and runs SEQUENTIAL
              # on the whole node (the only such leg). SMG: deepseek_v41 tool/reasoning parsers
              # + native renderer (#2524/#2525/#2527). vLLM: V4.1 landed in 0.30.0
              # (vllm-project/vllm#56208 + #56228 + #56214, 2026-09-10/11), so the CI
              # pin now has it. This leg still installs the per-commit main wheel it
              # was validated on (vllm_commit below); moving it onto the release pin
              # is a separate change that needs a run on this leg.
              {"name": "deepseek-v4.1", "runner": "blackwell", "tp": 8,
               "gpu_a": "0,1,2,3,4,5,6,7", "gpu_b": "",  # sequential: arm B reuses GPU_A (whole node)
               "model": "deepseek-ai/DeepSeek-V4.1-Flash-1017",
               "vllm_tool": "deepseek_v41", "vllm_reason": "deepseek_v41",
               "smg_tool": "deepseek_v41", "smg_reason": "deepseek_v41",
               # No kv-cache/block-size flags: vLLM's V4.1 path resolves both itself
               # (see nightly-bfcl.yml).
               "vllm_extra": "--tokenizer-mode deepseek_v41 --trust-remote-code",
               # Per-commit vLLM main wheel; see nightly-bfcl.yml for why.
               "vllm_commit": "a31ec3a68bbbedd4b5d59490c762bcf32abf1a17",
               "vllm_version": "0.29.1rc1.dev185+ga31ec3a68",
               "gpu_mem": "0.90", "startup_timeout": "3600", "model_cache": "/raid/models",
               "arm_mode": "sequential", "max_model_len": "auto", "num_tasks": 30,
               # 20m/domain = ~1h/arm, arms serial; the V4 leg hung here before.
               "run_timeout": "1200"},
              # MiniMax-M3 official MXFP8 checkpoint (~444GB, TP=4 half-node) on the stock
              # CI vLLM pin; flags per the vLLM recipe (see nightly-bfcl.yml).
              {"name": "minimax-m3", "runner": "blackwell", "tp": 4,
               "gpu_a": "0,1,2,3", "gpu_b": "4,5,6,7",
               "model": "MiniMaxAI/MiniMax-M3-MXFP8",
               "vllm_tool": "minimax_m3", "vllm_reason": "minimax_m3",
               "smg_tool": "minimax_m3", "smg_reason": "minimax_m3",
               "vllm_extra": "--trust-remote-code --block-size 128 --attention_config.indexer_kv_dtype fp8",
               "gpu_mem": "0.90", "startup_timeout": "3000",
               "model_cache": "/raid/models", "arm_mode": "concurrent",
               "max_model_len": "auto", "num_tasks": 30, "run_timeout": "5400"},
              # GLM-5.3-Flash (~306GiB FP8) fits a TP=4 half-node, so it runs concurrent,
              # unlike the whole-node GLM-5.2-FP8 leg it replaces. Flags per the vLLM
              # recipe; per-commit main wheel shared with deepseek-v4.1 (see nightly-bfcl.yml).
              {"name": "glm-5.3-flash", "runner": "blackwell", "tp": 4,
               "gpu_a": "0,1,2,3", "gpu_b": "4,5,6,7",
               "model": "zai-org/GLM-5.3-Flash",
               "vllm_tool": "glm47", "vllm_reason": "glm45",
               "smg_tool": "glm47_moe", "smg_reason": "glm45",
               "vllm_extra": "--trust-remote-code --kv-cache-dtype fp8",
               "vllm_commit": "a31ec3a68bbbedd4b5d59490c762bcf32abf1a17",
               "vllm_version": "0.29.1rc1.dev185+ga31ec3a68",
               "gpu_mem": "0.90", "startup_timeout": "3600", "model_cache": "/raid/models",
               "arm_mode": "concurrent", "max_model_len": "auto", "num_tasks": 30,
               # Concurrent arms: full per-domain budget like the other half-node legs.
               "run_timeout": "5400"},
          ]
          # Separate opt-in: enabling ordinary AMD PRs never enables paid tau2.
          # Original model/workload remains; native ROCm capability is a later gate.
          if os.environ.get("AMD_ENABLED") == "true":
              amd = dict(legs[0])
              amd.update(name="qwen3.8-amd", runner=os.environ["AMD_RUNNER"], vendor="amd",
                         container={"image": "vllm/vllm-openai-rocm:v0.31.0@sha256:749f6f3f944f12af49966ac523c1f8573e4b229594b541954bd5f879b4496b1f",
                                    "options": "--device=/dev/kfd --device=/dev/dri --group-add video --ipc=host --shm-size=32g --volume /models:/models --env HF_HOME=/models --env HF_TOKEN"})
              legs.append(amd)
          only = os.environ.get("ONLY", "")
          valid = [l["name"] for l in legs]
          if only:
              legs = [l for l in legs if l["name"] == only]
              if not legs:
                  raise SystemExit(f"unknown leg {only!r}; valid: {valid}")
          # Scheduled runs take the H100 legs only: the `blackwell` runner has served
          # no job since 2026-09-18, and a leg queued against an offline label sits in
          # GitHub's queue for its 24h maximum and is cancelled, which marks the whole
          # run cancelled and trips the node-health "queued over 24h" alert. A
          # dispatch (with or without `only`) still runs every leg, so the Blackwell
          # legs stay one click away once the runner is back.
          if os.environ.get("EVENT_NAME") == "schedule":
              legs = [l for l in legs if l["runner"] != "blackwell"]
          # All legs (incl. Blackwell) run on PRs too — the PR env below forces a
          # tiny retail / 1-trial / few-task subset, so each leg is just a quick
          # "does it launch + parse + score" smoke (model load dominates its time).
          print("matrix=" + json.dumps({"include": legs}))
          PY

  tau2-ab:
    name: tau2-ab ${{ matrix.model }} (${{ matrix.runner }} TP${{ matrix.tp }})
    needs: [build-wheel, setup]
    if: ${{ !cancelled() && needs.build-wheel.result == 'success' && needs.setup.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    # Empty on NV: preserve its bare-metal execution. AMD uses the existing pin.
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    # Generous ceiling: multi-turn state simulation is slow, and the sequential
    # deepseek-v4.1 leg scores two whole-node arms serially. Ceiling only; fast legs
    # finish early. --max-concurrency keeps the full run within budget.
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Per-runner model store: /models on h100, /raid/models (NVMe) on blackwell.
      ROUTER_LOCAL_MODEL_PATH: ${{ matrix.model_cache }}
      HF_HOME: ${{ matrix.model_cache }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODEL: ${{ github.event.inputs.model || matrix.model }}
      # PR = quick sanity subset; schedule/dispatch = full domain set.
      DOMAINS: ${{ github.event.inputs.domains || (github.event_name == 'pull_request' && 'retail' || 'retail,airline,telecom') }}
      # PR = single trial (fast); schedule/dispatch = 2 trials (pass^2).
      NUM_TRIALS: ${{ github.event.inputs.num_trials || (github.event_name == 'pull_request' && '1' || '2') }}
      # PR = 3 tasks (smoke); schedule/dispatch = the leg's matrix cap (0=all on H100,
      # 30 on the heavy Blackwell legs). Dispatch `num_tasks` overrides all legs.
      NUM_TASKS: ${{ github.event.inputs.num_tasks || (github.event_name == 'pull_request' && '3' || matrix.num_tasks) }}
      MAX_CONCURRENCY: ${{ github.event.inputs.max_concurrency || '16' }}
      # Fail-fast bounds (see COMMON below). Per-request cap 300s catches a single
      # degenerate generation; the leg's per-domain cap bounds a wedged `tau2 run`.
      REQUEST_TIMEOUT: ${{ github.event.inputs.request_timeout || '300' }}
      RUN_TIMEOUT: ${{ github.event.inputs.run_timeout || matrix.run_timeout }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: smg-wheel
          path: wheel
      - name: Validate original AMD comparison and host admission contract
        if: matrix.vendor == 'amd'
        env:
          MODEL_OVERRIDE: ${{ github.event.inputs.model }}
          VLLM_OVERRIDE: ${{ github.event.inputs.vllm_tool_parser }}
          SMG_OVERRIDE: ${{ github.event.inputs.smg_tool_parser }}
          REASON_OVERRIDE: ${{ github.event.inputs.reasoning_parser }}
          RUN_OVERRIDE: ${{ github.event.inputs.run_timeout }}
          REQUEST_OVERRIDE: ${{ github.event.inputs.request_timeout }}
          TASK_OVERRIDE: ${{ github.event.inputs.num_tasks }}
        run: |
          set -euo pipefail
          # This job must route only to our installed full390 preclaim profile.
          # Opt-in itself grants neither host maintenance nor provider budget.
          test -z "$MODEL_OVERRIDE$VLLM_OVERRIDE$SMG_OVERRIDE$REASON_OVERRIDE$RUN_OVERRIDE$TASK_OVERRIDE"
          test "$DOMAINS" = retail,airline,telecom
          test "$NUM_TRIALS" = 2
          test "$NUM_TASKS" = 30
          test "$REQUEST_TIMEOUT" = 300
          test "$RUN_TIMEOUT" = 5400
          test "${REQUEST_OVERRIDE:-300}" = 300
      - name: Setup vLLM env (provides vllm + grpc servicer + smg)
        if: matrix.vendor != 'amd'
        uses: ./.github/actions/setup-vllm
      - name: Setup vLLM ROCm image environment
        if: matrix.vendor == 'amd'
        run: bash scripts/ci_setup_vllm_rocm_image.sh
      - name: Override vLLM with a per-commit main wheel (legs newer than the CI pin)
        # See nightly-bfcl.yml: legs the pinned vLLM release cannot serve set
        # vllm_commit + vllm_version. Skipped (matrix key absent) otherwise.
        if: matrix.vendor != 'amd' && matrix.vllm_commit != ''
        env:
          VLLM_COMMIT: ${{ matrix.vllm_commit }}
          VLLM_VERSION: ${{ matrix.vllm_version }}
        run: |
          set -euo pipefail
          command -v uv >/dev/null || export PATH="$HOME/.local/bin:$PATH"
          uv pip install "vllm==${VLLM_VERSION}" --torch-backend=auto \
            --extra-index-url "https://wheels.vllm.ai/${VLLM_COMMIT}"
          # The main wheel pulls a newer flashinfer-python; flashinfer refuses to
          # import unless flashinfer-jit-cache matches it exactly, so re-sync the
          # cache (the script's import canary fails here, not at engine start).
          bash scripts/ci_install_flashinfer_jit_cache.sh
          python -c "import torch, torchcodec, flashinfer, vllm; print('vllm', vllm.__version__)"
      - name: Install smg wheel + ninja (for vLLM torch.compile)
        run: |
          pip uninstall -y smg || true
          pip install wheel/*.whl
          pip install ninja
      - name: Install tau2-bench
        run: |
          # uv for fast venv management, then clone + sync tau2-bench (its own .venv).
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          # Pinned: an unpinned clone broke every run from 2026-09-11, when upstream's
          # voice work made the `tau2` CLI import `websockets`, which upstream declares
          # only in its `voice` extra. The smoke below fails the job at install time
          # instead of after the arms are up. Bump the pin deliberately.
          TAU2_BENCH_REF=5bfa7e37b36656b37dc6d022156be6563c1007f3
          git clone https://github.com/sierra-research/tau2-bench
          (cd tau2-bench && git checkout --quiet "$TAU2_BENCH_REF" && uv sync --frozen --python 3.12 \
            && uv pip install --python .venv/bin/python websockets==15.0.1 pydub==0.25.1 httpx==0.28.1 \
            && .venv/bin/tau2 run --help >/dev/null)
      # No policy means no paid run. Exact-job or explicit standing per-job approval only.
      - name: Validate approved paid request policy
        env:
          POLICY_JSON: ${{ vars.TAU2_BUDGET_POLICY_JSON }}
          CONTEXTS_JSON: ${{ vars.TAU2_PROVIDER_CONTEXTS_JSON }}
          CONTEXTS_SHA: ${{ vars.TAU2_PROVIDER_CONTEXTS_SHA256 }}
          JOB_RUN_ID: ${{ github.run_id }}
          JOB_RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_MATRIX_NAME: ${{ matrix.name }}
          JOB_WORKFLOW_REF: ${{ github.workflow_ref }}
          JOB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts/tau2').absolute()))
          from guarded_cli import resolve_approval
          policy = resolve_approval(json.loads(os.environ['POLICY_JSON']), {
              'run_id': os.environ['JOB_RUN_ID'], 'run_attempt': os.environ['JOB_RUN_ATTEMPT'],
              'matrix_name': os.environ['JOB_MATRIX_NAME'], 'workflow_ref': os.environ['JOB_WORKFLOW_REF'],
              'event_name': os.environ['JOB_EVENT_NAME'],
          })
          scope = policy['scope_id']
          root = Path(os.environ['RUNNER_TEMP']) / ('tau2-paid-' + hashlib.sha256(scope.encode()).hexdigest())
          root.mkdir(mode=0o700, exist_ok=False)
          (root / 'policy.json').write_text(json.dumps(policy))
          (root / 'contexts.json').write_text(os.environ['CONTEXTS_JSON'])
          values = {
              'TAU2_BUDGET_POLICY': root / 'policy.json',
              'TAU2_BUDGET_CONTEXTS': root / 'contexts.json',
              'TAU2_BUDGET_CONTEXTS_SHA256': os.environ['CONTEXTS_SHA'],
              'TAU2_BUDGET_LEDGER': root / 'ledger.db',
              'TAU2_BUDGET_SCOPE': scope,
          }
          subprocess.run([
              str(Path('tau2-bench/.venv/bin/python').absolute()), '-I', 'scripts/tau2/guarded_cli.py',
              '--policy', str(values['TAU2_BUDGET_POLICY']), '--contexts', str(values['TAU2_BUDGET_CONTEXTS']),
              '--contexts-sha256', os.environ['CONTEXTS_SHA'], '--scope', scope,
              '--ledger', str(values['TAU2_BUDGET_LEDGER']), '--initialize',
          ], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key, value in values.items():
                  env.write(f'{key}={value}\n')
          PYCODE
      # Exact task selection is resolved offline through the pinned tau2 loader,
      # before serving or paid simulator calls. Cap=0 means all actual split tasks.
      - name: Prepare expected task coverage
        run: |
          tau2-bench/.venv/bin/python scripts/tau2/run_ab.py \
            --prepare-expected-tasks "$RUNNER_TEMP/tau2_expected_tasks.json" \
            --data-dir tau2-bench/data --domains "$DOMAINS" \
            --num-tasks "$NUM_TASKS" --num-trials "$NUM_TRIALS" --seed 300
      - name: Stage model weights
        # Skip if pre-staged locally at <cache>/<id> (e.g. blackwell NVMe); else
        # download just this leg's model (not the whole GPU tier).
        run: |
          if [ -d "$ROUTER_LOCAL_MODEL_PATH/$MODEL" ]; then
            echo "model present at $ROUTER_LOCAL_MODEL_PATH/$MODEL — skipping download"
          else
            bash scripts/ci_download_model.sh "$MODEL"
          fi
      - name: Launch arms + run τ²-bench A/B
        env:
          VLLM_BIN: vllm
          VLLM_PYTHON: python
          SMG_LAUNCH: "python -m smg.launch_router"
          TAU2_MODEL: ${{ env.MODEL }}
          TAU2_TP: ${{ matrix.tp }}
          TAU2_MAX_MODEL_LEN: ${{ matrix.max_model_len }}
          TAU2_GPU_MEM_UTIL: ${{ matrix.gpu_mem }}
          TAU2_VLLM_TOOL_PARSER: ${{ github.event.inputs.vllm_tool_parser || matrix.vllm_tool }}
          TAU2_SMG_TOOL_PARSER: ${{ github.event.inputs.smg_tool_parser || matrix.smg_tool }}
          TAU2_VLLM_REASONING_PARSER: ${{ github.event.inputs.reasoning_parser || matrix.vllm_reason }}
          TAU2_SMG_REASONING_PARSER: ${{ github.event.inputs.reasoning_parser || matrix.smg_reason }}
          TAU2_VLLM_EXTRA: ${{ matrix.vllm_extra }}
          TAU2_STARTUP_TIMEOUT: ${{ matrix.startup_timeout }}
          TAU2_RUN_DIR: ${{ runner.temp }}/tau2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          TAU2_SCOPE: tau2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          TAU2_GPU_VENDOR: ${{ matrix.vendor || 'nvidia' }}
          TAU2_GPU_A: ${{ matrix.gpu_a }}
          TAU2_GPU_B: ${{ matrix.gpu_b }}
          ARM_MODE: ${{ matrix.arm_mode }}
          GPU_A: ${{ matrix.gpu_a }}
          GPU_B: ${{ matrix.gpu_b }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          # The isolated guarded child registers only the local agent at $0,
          # after installing its hard paid-request boundary. No sitecustomize bypass.
          # Serialize the launch->serve->teardown phase PER HOST. Blackwell runner
          # agents share one bare-metal machine (host network + the same 8 GPUs), so
          # two legs at once collide on ports and GPU memory. A host-wide flock runs
          # them one at a time; the lock releases when this step's shell exits.
          #
          # CRITICAL: every launch_arms.sh call is invoked with `9>&-` so the
          # setsid-detached vLLM/SMG servers do NOT inherit lock FD 9 (a leaked
          # server would hold the lock forever and deadlock future jobs). With 9>&-,
          # only this step shell holds the lock; it always releases on step exit.
          if [ "$TAU2_GPU_VENDOR" = amd ]; then
            # Installed host preclaim owns the EXISTING amd-ci-gpu.lock through
            # Worker and cleanup. Its full envelope is 390min (job360 + prep15 +
            # cleanup10 + margin5), including window/expiry admission. No second
            # container lock, GPU nuke or unknown-PID cleanup on shared AMD.
            exec 9>/dev/null
          elif [ "$TAU2_GPU_VENDOR" = nvidia ]; then
          exec 9>/tmp/tau2-host.lock
          echo "waiting for host lock..."
          flock -w 9000 9 || { echo "::error::host lock not acquired within 9000s"; exit 1; }
          echo "acquired host lock"
          # Pre-flight GPU nuke: clear leftovers from a prior cancelled leg whose
          # teardown was skipped. Safe: we hold the host lock, so no other tau2 leg runs.
          bash scripts/ci_killall_sglang.sh nuke_gpus 9>&- || true
          else
            echo "::error::unsupported TAU2_GPU_VENDOR"
            exit 2
          fi
          cleanup() {
            local rc=0
            bash scripts/tau2/launch_arms.sh stop 9>&- || rc=2
            # the verdict is discarded here: one reading, no wait for a draining card
            # NV uses its original launcher and existing host-locked recovery.
            # AMD ownership refusal must never enter that recovery branch.
            if [ "$TAU2_GPU_VENDOR" = nvidia ]; then
              CI_GPU_GUARD_WAIT_SECS=0 bash scripts/ci_killall_sglang.sh nuke_gpus 9>&- || true
            fi
            return "$rc"
          }
          trap 'rc=$?; cleanup || rc=2; exit "$rc"' EXIT
          trap 'exit 143' INT TERM

          TAU2_BIN="tau2-bench/.venv/bin/tau2"
          DATA_DIR="tau2-bench/data"
          COMMON=(
            --agent-model "$MODEL" --user-llm gpt-5.2
            --expected-tasks "$RUNNER_TEMP/tau2_expected_tasks.json" --seed 300
            --tau2 "$TAU2_BIN" --tau2-python "$PWD/tau2-bench/.venv/bin/python" --data-dir "$DATA_DIR"
            --domains "$DOMAINS" --num-trials "$NUM_TRIALS" --num-tasks "$NUM_TASKS"
            --max-concurrency "$MAX_CONCURRENCY"
            # Fail-fast bounds so one wedged simulation can't burn the whole 6h job
            # (a Qwen3.6-27B airline sim once hung ~5h on a single 77-min request).
            # --request-timeout caps each LiteLLM call; --run-timeout caps a whole
            # domain (worst case 3 domains/arm x 90m = 270m, under timeout-minutes:360).
            --request-timeout "$REQUEST_TIMEOUT" --run-timeout "$RUN_TIMEOUT"
          )
          # run_ab.py exit codes: 0 clean, 1 score regression (informational — this
          # A/B is never a merge gate), 2 an arm timed out or scored nothing. Only 2
          # fails the job: a "—" column is a broken run, not a passing one.
          AB_RC=0
          gate() {
            local rc=0
            "$@" || rc=$?
            case "$rc" in
              0) ;;
              1) echo "::warning::tau2 A/B score regression beyond tolerance — see job summary" ;;
              *) echo "::error::tau2 A/B incomplete (run_ab exit $rc): an arm timed out or produced no scores"
                 AB_RC=$rc ;;
            esac
          }
          if [ "$ARM_MODE" = sequential ]; then
            # Whole node per arm (TP=8), one at a time: score arm A, tear it down to
            # free the GPUs, score arm B, then diff the two saved score files.
            A_URL=$(TAU2_GPU="$GPU_A" bash scripts/tau2/launch_arms.sh a 9>&-)
            echo "arm A (vllm): $A_URL"
            python scripts/tau2/run_ab.py --score-arm "vllm=$A_URL" \
              --scores-out "$RUNNER_TEMP/scores_vllm.json" "${COMMON[@]}"
            bash scripts/tau2/launch_arms.sh stop 9>&-
            B_URL=$(TAU2_GPU="$GPU_A" bash scripts/tau2/launch_arms.sh b 9>&-)
            echo "arm B (smg): $B_URL"
            python scripts/tau2/run_ab.py --score-arm "smg=$B_URL" \
              --scores-out "$RUNNER_TEMP/scores_smg.json" "${COMMON[@]}"
            bash scripts/tau2/launch_arms.sh stop 9>&-
            # --domains is required here too: it is the expected set the completeness
            # gate checks against, so a domain neither arm scored is still caught.
            gate python scripts/tau2/run_ab.py \
              --diff-baseline "$RUNNER_TEMP/scores_vllm.json" \
              --diff-candidate "$RUNNER_TEMP/scores_smg.json" \
              --domains "$DOMAINS" \
              --num-trials "$NUM_TRIALS" --tolerance 0.02 \
              --expected-tasks "$RUNNER_TEMP/tau2_expected_tasks.json" --seed 300 \
              --out "$RUNNER_TEMP/tau2_ab.md" --json-out "$RUNNER_TEMP/tau2_ab.json"
          else
            # Concurrent: arm A (pure vLLM) on the first GPU half, arm B (SMG ->
            # vLLM gRPC) on the second; ports left unset so launch_arms.sh picks free.
            A_URL=$(TAU2_GPU="$GPU_A" bash scripts/tau2/launch_arms.sh a 9>&-)
            B_URL=$(TAU2_GPU="$GPU_B" bash scripts/tau2/launch_arms.sh b 9>&-)
            echo "arm A: $A_URL   arm B: $B_URL"
            gate python scripts/tau2/run_ab.py \
              --baseline "vllm=$A_URL" --candidate "smg=$B_URL" "${COMMON[@]}" \
              --tolerance 0.02 \
              --out "$RUNNER_TEMP/tau2_ab.md" --json-out "$RUNNER_TEMP/tau2_ab.json"
          fi
          # Fail after the report is written, so Render summary / Upload results
          # (both always()) still publish the partial table and transcripts.
          [ "$AB_RC" -eq 0 ] || exit "$AB_RC"
      - name: Render summary
        if: always()
        run: |
          {
            # Job name already shows the model + runner; keep this heading lean.
            echo "## τ²-bench A/B (domains: $DOMAINS)"
            cat "$RUNNER_TEMP/tau2_ab.md"
          } >> "$GITHUB_STEP_SUMMARY" || echo "no report produced for ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Collect tau2 transcripts
        if: always()
        run: |
          set -uo pipefail
          ROOT="tau2-bench/data/simulations"
          OUT="$RUNNER_TEMP/tau2_transcripts.tgz"
          if [ -d "$ROOT" ]; then
            if tar -czf "$OUT" -C "$ROOT" .; then
              echo "transcript tarball: $(du -h "$OUT" | cut -f1)"
              echo "contents (head):"; tar tzf "$OUT" | head -40 || true
            else
              echo "::warning::failed to create $OUT"
            fi
          else
            echo "no $ROOT"
          fi
      # Like BFCL, stage within the container/workspace before a single-path
      # upload. Runner path translation does not map every line of a list.
      - name: Stage results for upload
        if: always()
        run: |
          set -euo pipefail
          OUT=tau2_artifact
          # This directory contains only this workflow's staged output.
          rm -rf -- "$OUT"
          mkdir -p "$OUT"
          for name in tau2_ab.md tau2_ab.json tau2_expected_tasks.json tau2_transcripts.tgz; do
            if [ -f "$RUNNER_TEMP/$name" ]; then
              cp -- "$RUNNER_TEMP/$name" "$OUT/"
            fi
          done
          for variable in TAU2_BUDGET_LEDGER TAU2_BUDGET_POLICY TAU2_BUDGET_CONTEXTS; do
            source="${!variable:-}"
            if [ -n "$source" ] && [ -f "$source" ]; then
              cp -- "$source" "$OUT/"
            fi
          done
      - name: Upload results (summary + scores + transcripts)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tau2-ab-${{ matrix.name }}-${{ github.run_id }}
          path: tau2_artifact/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload arm logs (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tau2-ab-${{ matrix.name }}-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/tau2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}/*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Teardown arms (leg-scoped backstop)
        if: always()
        env:
          TAU2_RUN_DIR: ${{ runner.temp }}/tau2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          TAU2_SCOPE: tau2-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          TAU2_GPU_VENDOR: ${{ matrix.vendor || 'nvidia' }}
          TAU2_GPU_A: ${{ matrix.gpu_a }}
          TAU2_GPU_B: ${{ matrix.gpu_b }}
        run: bash scripts/tau2/launch_arms.sh stop
