name: Release SMG to PyPI

on:
  push:
    branches:
      - main
    paths:
      - bindings/python/pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build on ${{ matrix.platform || matrix.os }} (${{ matrix.target }} - ${{ matrix.manylinux || 'auto' }})
    runs-on: ${{ matrix.os }}-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        # aarch64 is added via the `include` entries below so the linux build can
        # pin a newer manylinux image; the base manylinux2014 toolchain is too old
        # to compile aws-lc-sys for aarch64 (no stdatomic.h / no armv8.4 -march).
        target: [x86_64]
        manylinux: [auto]
        include:
          - os: ubuntu
            platform: linux
          - os: windows
            ls: dir
            target: x86_64
            python-architecture: x64
            interpreter: 3.13
          - os: macos
            target: x86_64
            interpreter: 3.13
          - os: macos
            target: aarch64
            interpreter: 3.13
          - os: ubuntu
            platform: linux
            target: aarch64
            # manylinux2014's aarch64 cross-gcc is too old for aws-lc-sys 0.41;
            # 2_28 (AlmaLinux 8) has stdatomic.h + armv8.4 support.
            manylinux: "2_28"
          # musllinux
          - os: ubuntu
            platform: linux
            target: x86_64
            manylinux: musllinux_1_1
          - os: ubuntu
            platform: linux
            target: aarch64
            manylinux: musllinux_1_1
        exclude:
          - os: windows
            target: aarch64

    steps:
      - uses: actions/checkout@v7
        with:
          path: smg-repo

      - name: Set up QEMU for aarch64 verification
        if: matrix.platform == 'linux' && matrix.target == 'aarch64' && matrix.manylinux == '2_28'
        uses: docker/setup-qemu-action@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture || 'x64' }}

      - name: Install twine
        run: pip install -U twine

      - name: Install protoc (macOS)
        if: matrix.os == 'macos'
        run: brew install protobuf

      - name: Install protoc (Windows)
        if: matrix.os == 'windows'
        run: choco install protoc -y

      - name: Pin jemalloc page size for cross-built aarch64 wheels
        if: matrix.platform == 'linux' && matrix.target == 'aarch64' && matrix.manylinux == '2_28'
        run: echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: smg-repo/bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --features vendored-openssl --interpreter ${{ matrix.interpreter || '3.9 3.10 3.11 3.12 3.13 3.14' }}
          rust-toolchain: 1.98.0
          docker-options: -e CI -e JEMALLOC_SYS_WITH_LG_PAGE -e CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc -e CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          before-script-linux: |
            # Install build dependencies (perl/make for vendored OpenSSL, protoc for gRPC)
            if command -v yum &> /dev/null; then
              yum update -y && yum install -y wget unzip gcc gcc-c++ perl-core make
              # Install cross-compilation toolchain for aarch64 if needed
              if [ "${{ matrix.target }}" = "aarch64" ]; then
                yum install -y gcc-aarch64-linux-gnu gcc-c++-aarch64-linux-gnu || true
              fi
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y wget unzip gcc g++ perl make
              # Install cross-compilation toolchain for aarch64 if needed
              if [ "${{ matrix.target }}" = "aarch64" ]; then
                apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu || true
              fi
            fi
            (cd /tmp && \
             wget https://github.com/protocolbuffers/protobuf/releases/download/v32.0/protoc-32.0-linux-x86_64.zip && \
             unzip protoc-32.0-linux-x86_64.zip -d /usr/local && \
             rm protoc-32.0-linux-x86_64.zip)
            protoc --version

      - name: List built packages
        run: ${{ matrix.ls || 'ls -lh' }} smg-repo/bindings/python/dist/

      - name: Verify aarch64 wheel allocator
        if: matrix.platform == 'linux' && matrix.target == 'aarch64' && matrix.manylinux == '2_28'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD/smg-repo/bindings/python/dist:/dist:ro" \
            -e '_RJEM_MALLOC_CONF=stats_print:true,stats_print_opts:J' \
            python:3.13-slim \
            sh -c 'set -eu
              wheel=$(find /dist -name "*.whl" -print -quit)
              test -n "$wheel"
              pip install --no-deps "$wheel" >/dev/null
              python3 -c "from smg import smg_rs" 2>/tmp/jemalloc-stats
              grep -F \"page\":65536 /tmp/jemalloc-stats'

      - name: Check packages
        run: twine check --strict smg-repo/bindings/python/dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'auto' }}
          path: smg-repo/bindings/python/dist/

  build-sdist:
    name: Build SDist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          path: smg-repo

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build SDist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: smg-repo/bindings/python
          command: sdist
          args: --out dist
          rust-toolchain: 1.98.0

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: smg-repo/bindings/python/dist/*.tar.gz

  upload:
    name: Upload to PyPI
    if: github.repository == 'smg-project/smg'  # Ensure this job only runs for the smg-project/smg repository
    needs: [build, build-sdist]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # Hermetic Python so twine pulls a modern `packaging` (>= 24.2); the
      # runner's system packaging can't parse Metadata 2.4 (PEP 639
      # License-Expression/License-File) and rejects the wheels.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN_ROUTER }}
        run: |
          pip install -U twine
          twine upload dist/* --verbose
