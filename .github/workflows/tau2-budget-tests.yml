name: Tau2 Budget Tests

on:
  pull_request:
    paths:
      - scripts/tau2/budget.py
      - scripts/tests/test_tau2_budget.py
      - .github/workflows/tau2-budget-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest ruff==0.15.0
      - run: ruff check scripts/tau2/budget.py scripts/tests/test_tau2_budget.py
      - run: ruff format --check scripts/tau2/budget.py scripts/tests/test_tau2_budget.py
      - run: python -m pytest -q --confcutdir=scripts/tests scripts/tests/test_tau2_budget.py
