name: E2E Kind Discovery

# Run automatically for service-discovery code and test-infrastructure
# changes, and weekly: the Slurm lane installs Slurm from Ubuntu's archive,
# whose updates can change it with no change here. GitHub-hosted ubuntu-24.04
# provides Docker for the kind node and the Slurm cluster. It is pinned, not
# ubuntu-latest: the binaries built here run in Ubuntu 24.04 images (the
# Slurm one for its Slurm 23.11), so they need its glibc or an older one.
# Manual dispatch keeps the runner selectable for ad-hoc validation.
on:
  pull_request:
    paths:
      - model_gateway/src/service_discovery/**
      - model_gateway/src/mesh_discovery/**
      # The start/skip gating for both discoveries now lives in `startup`,
      # and `main` owns the CLI -> discovery-config conversion feeding it.
      - model_gateway/src/server.rs
      - model_gateway/src/main.rs
      - model_gateway/tests/k8s_discovery_test.rs
      - e2e_test/discovery/kind/**
      - e2e_test/discovery/file/**
      - e2e_test/discovery/slurm/**
      - e2e_test/discovery/common.py
      - .github/workflows/e2e-kind-discovery.yml
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (needs Docker, and glibc no newer than Ubuntu 24.04's)
        required: false
        default: ubuntu-24.04

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  kind-discovery:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          sccache-version: 'v0.10.0'

      - name: Install kind and kubectl
        run: |
          curl -Lo kind "https://kind.sigs.k8s.io/dl/v0.29.0/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/
          curl -Lo kubectl "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Build smg and mock-worker
        run: |
          source "$HOME/.cargo/env"
          cargo build -p smg -p mock-worker

      - name: Build mock-worker and gateway images
        run: |
          docker build -t smg-mock-worker:e2e \
            -f e2e_test/discovery/kind/Dockerfile.mock-worker target/debug
          docker build -t smg-gateway:e2e \
            -f e2e_test/discovery/kind/Dockerfile.smg target/debug
          # Fail here (not as CrashLoopBackOff later) on any linkage problem.
          docker run --rm smg-mock-worker:e2e --help >/dev/null 2>&1 || true
          docker run --rm --entrypoint /usr/local/bin/smg smg-gateway:e2e --help >/dev/null

      - name: Run discovery e2e
        timeout-minutes: 30
        run: |
          pip install pytest requests
          SMG_KIND_E2E=1 SMG_MOCK_IMAGE=smg-mock-worker:e2e \
            SMG_GATEWAY_IMAGE=smg-gateway:e2e \
            pytest e2e_test/discovery/kind \
            --confcutdir e2e_test/discovery/kind -m kind -v

      # Host processes only (the smg and mock-worker binaries built above),
      # so it runs even when the kind lane failed.
      - name: Run file discovery e2e
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          pip install pytest requests
          SMG_FILE_E2E=1 pytest e2e_test/discovery/file \
            --confcutdir e2e_test/discovery/file -v

      # A real Slurm 23.11 cluster in containers (a controller and six
      # nodes), with the gateway on the controller polling squeue and scontrol.
      - name: Run Slurm discovery e2e
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: |
          pip install pytest requests
          stage=$(mktemp -d)
          cp e2e_test/discovery/slurm/Dockerfile e2e_test/discovery/slurm/slurm.conf \
            e2e_test/discovery/slurm/cgroup.conf e2e_test/discovery/slurm/entrypoint.sh \
            target/debug/smg target/debug/mock-worker "$stage"
          docker build -t smg-slurm:e2e "$stage"
          # Fail here, before the cluster starts, if the binaries built above
          # need a newer glibc than the image's (smg checks for both).
          docker run --rm --entrypoint smg smg-slurm:e2e --help >/dev/null
          SMG_SLURM_E2E=1 SMG_SLURM_IMAGE=smg-slurm:e2e \
            SMG_SLURM_LOGS="$RUNNER_TEMP/slurm-logs" \
            pytest e2e_test/discovery/slurm --confcutdir e2e_test/discovery/slurm -v

      - name: Upload the Slurm, gateway and job logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: slurm-discovery-logs
          path: ${{ runner.temp }}/slurm-logs
          if-no-files-found: warn
