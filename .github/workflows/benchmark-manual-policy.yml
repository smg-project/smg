name: Benchmark - Manual Policy

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/benchmark-manual-policy.yml'
      - '.github/bench-gates/manual-policy.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/manual_policy_benchmark.rs'
      - 'model_gateway/src/policies/**'
      - '!model_gateway/src/policies/**/tests/**'
      - '!model_gateway/src/policies/**/*_test.rs'
      - '!model_gateway/src/policies/**/test_*.rs'
  pull_request:
    branches: [ main, release/** ]
    paths:
      - '.github/workflows/benchmark-manual-policy.yml'
      - '.github/bench-gates/manual-policy.toml'
      - 'scripts/bench_gate.py'
      - 'model_gateway/benches/manual_policy_benchmark.rs'
      - 'model_gateway/src/policies/**'
      - '!model_gateway/src/policies/**/tests/**'
      - '!model_gateway/src/policies/**/*_test.rs'
      - '!model_gateway/src/policies/**/test_*.rs'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: benchmark-manual-policy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    name: Manual Policy (Sticky Sessions)
    if: github.repository == 'smg-project/smg' || vars.SMG_RUN_BENCHMARKS == 'true'
    runs-on: ubuntu-latest
    env:
      # Every bench binary of this job, the gate's pair and the summary run's,
      # places every function on a 64-byte boundary, so a pull request's code
      # size does not move the unchanged hot functions into another placement
      # class (the two speed states of identical code described in
      # .github/bench-gates/manual-policy.toml). RUSTFLAGS replaces the list in
      # .cargo/config.toml, so the outliner flag is repeated here.
      RUSTFLAGS: -C llvm-args=-enable-machine-outliner=never -C llvm-args=-align-all-functions=6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      # A pull request is gated: its bench binary and the base branch's (the merge
      # commit's first parent) are built in this checkout, run interleaved on this
      # runner and compared id by id by scripts/bench_gate.py against the thresholds
      # in .github/bench-gates/manual-policy.toml; the job fails on a gated regression.
      # A push to main keeps the single summary run.
      # The base's binary is built with the pull request's bench sources (the gate
      # file's `sources`), so the two differ in the measured code alone.
      - name: Build the pull request's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          mkdir -p "$RUNNER_TEMP/bench-gate"
          cp scripts/bench_gate.py .github/bench-gates/manual-policy.toml "$RUNNER_TEMP/bench-gate/"
          python3 scripts/bench_gate.py build --gates .github/bench-gates/manual-policy.toml \
            --out "$RUNNER_TEMP/bench-gate/pr" -- \
            cargo bench -p smg --bench manual_policy_benchmark --no-run

      - name: Build the base branch's benchmark
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          head=$(git rev-parse HEAD)
          git -c advice.detachedHead=false checkout --quiet "$(git rev-parse HEAD^1)"
          python3 "$RUNNER_TEMP/bench-gate/bench_gate.py" build --gates "$RUNNER_TEMP/bench-gate/manual-policy.toml" \
            --sources-from "$head" --out "$RUNNER_TEMP/bench-gate/base" -- \
            cargo bench -p smg --bench manual_policy_benchmark --no-run
          git checkout --quiet "$head"

      - name: Run the benchmark gate
        if: github.event_name == 'pull_request'
        timeout-minutes: 40
        run: |
          set -o pipefail
          python3 scripts/bench_gate.py run --gates .github/bench-gates/manual-policy.toml \
            --base "$RUNNER_TEMP/bench-gate/base" --pr "$RUNNER_TEMP/bench-gate/pr" \
            --cwd model_gateway --out bench-gate 2>&1 | tee benchmark_output.txt

      - name: Run benchmark
        if: github.event_name != 'pull_request'
        timeout-minutes: 40
        run: |
          source "$HOME/.cargo/env"
          set -o pipefail
          cargo bench --bench manual_policy_benchmark 2>&1 | tee benchmark_output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-policy-results-${{ github.sha }}
          path: |
            target/criterion/manual_policy*/
            benchmark_output.txt
            bench-gate/
          retention-days: 30

      - name: Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          echo "## Manual Policy Benchmark (Sticky Sessions)" >> $GITHUB_STEP_SUMMARY
          if [ -f benchmark_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -100 benchmark_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
