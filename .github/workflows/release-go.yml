name: Release gRPC goLang packages

# Published only on a maintainer's dispatch against a release tag (scripts/release/README.md):
# no push publishes, and the first step refuses a dispatch whose ref is not the version's tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.5.0): the Go module tag crates/grpc_client/go/v<version>'
        required: true


permissions:
  contents: read

jobs:
  release:
    name: Tag Release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a dispatch that is not against the version's release tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The module tag names the code at the release tag: a branch moves between a dispatch and a retry, and
          # another release's tag would give the module tag that release's code (the proxies keep what they fetched
          # first). release.sh pairs `--ref v<version>` with `-f version=<version>`; the step holds the pairing.
          if [ "${GITHUB_REF_TYPE:-}" != tag ]; then
            echo "dispatch this workflow against a release tag, not a branch (${GITHUB_REF_NAME:-the ref} is a ${GITHUB_REF_TYPE:-?})" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_NAME:-}" != "v$VERSION" ]; then
            echo "dispatch this workflow against v$VERSION, the tag of the version it publishes (${GITHUB_REF_NAME:-the ref} is another tag)" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ github.token }}

      - name: Install protoc-gen-go
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Generate Code
        run: bash crates/grpc_client/go/generate.sh

      - name: Commit Generated Code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f crates/grpc_client/go/generated
          if [ -d "crates/grpc_client/go/proto" ]; then
            git add -f crates/grpc_client/go/proto
          fi
          if ! git diff --cached --quiet; then
            git commit -m "chore: include generated code for release [skip ci]"
          fi

      - name: Read Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "Error: Version input is missing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          TAG="crates/grpc_client/go/v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and Push Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          TAG="crates/grpc_client/go/v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
