name: Bellwether Fixtures

# bellwether (smg-project/bellwether) records, for each model at a pinned
# Hugging Face revision, what the checkpoint's own template and tokenizer give:
# the prompt token ids of a request, and the text of an output token by token.
# The tests named bellwether_* read those fixtures and skip without them: the
# gateway's chat request path, Symphony's parsers, and the tokenizer crate's
# encode and incremental decode. This workflow runs them on every change to
# the code they judge (the protocol crate, the tokenizer crate, the gRPC
# router, Symphony) and to the dependencies, so a difference shows on the pull
# request that makes it.
#
# The fixtures come from the bellwether commit in
# .github/versions/bellwether.ref. To move to newer fixtures, change that hash:
# the pull request that does it runs against the new commit. bellwether keeps
# its benchmark sets compressed, so the job unpacks the fixture tree with
# bellwether's own command and the tests read the plain copy. A set that is
# compressed is fetched from bellwether's LFS store by that command.
#
# bellwether is public, so the checkout and the LFS fetch need no token, and
# the job runs the same way for every pull request, forks and Dependabot
# included.
on:
  push:
    branches: [ main ]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request and one per branch: a newer push cancels the
# superseded run. Keep the pull request form in sync with
# cancel-pr-workflows.yml.
concurrency:
  group: bellwether-fixtures-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fixture-tests:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 140
    permissions:
      contents: read
    steps:
      # The tests below run this pull request's code, so the workflow token is
      # not left in the checkout's git configuration.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pinned bellwether commit
        id: pin
        run: |
          ref="$(tr -d '[:space:]' < .github/versions/bellwether.ref)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/versions/bellwether.ref::expected one 40-character commit hash"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      # `bellwether unpack` fetches the compressed sets through `git lfs`, and
      # the CPU runner image carries no git-lfs, so the job brings its own: the
      # release binary for the runner's architecture, checked against the
      # checksum pinned here, on PATH for the rest of the job. No root needed.
      - name: Install git-lfs
        env:
          GIT_LFS_VERSION: "3.8.0"
          GIT_LFS_SHA256_AMD64: e455e00f15d9b95661b8d53498ffb0c3367962cf1ec73c31ab7369516cd6ab8d
          GIT_LFS_SHA256_ARM64: ac9c8efac980bb0505ead384d087e2acb6486fd8498691a2165fa174ec6118c2
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  arch=amd64; sha="$GIT_LFS_SHA256_AMD64" ;;
            aarch64) arch=arm64; sha="$GIT_LFS_SHA256_ARM64" ;;
            *) echo "::error::no git-lfs build pinned for $(uname -m)"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/git-lfs"
          mkdir -p "$dir"
          tarball="git-lfs-linux-${arch}-v${GIT_LFS_VERSION}.tar.gz"
          curl -fsSL --retry 3 -o "$dir/$tarball" \
            "https://github.com/git-lfs/git-lfs/releases/download/v${GIT_LFS_VERSION}/${tarball}"
          echo "${sha}  $dir/$tarball" | sha256sum -c -
          tar -xzf "$dir/$tarball" -C "$dir"
          install -m 0755 "$dir/git-lfs-${GIT_LFS_VERSION}/git-lfs" "$dir/git-lfs"
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/git-lfs" version
          # `git lfs pull` (what `bellwether unpack` runs) refuses to work until
          # the LFS filters are in the git configuration; set them for the
          # runner user, outside any repository.
          "$dir/git-lfs" install --skip-repo

      - name: Check out bellwether
        uses: actions/checkout@v7
        with:
          repository: smg-project/bellwether
          ref: ${{ steps.pin.outputs.ref }}
          path: .bellwether
          persist-credentials: false

      # The plain fixture tree, as the tests read it: each model's manifest,
      # its table of sets, and the sets as JSON Lines. `--locked` runs the
      # command on the package versions bellwether locked at the pinned
      # commit, and fails if its lock file is out of date, instead of
      # resolving anew against PyPI.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .bellwether/uv.lock

      - name: Unpack the fixtures
        run: uv run --locked --project .bellwether bellwether unpack --fixtures .bellwether/fixtures --out .bellwether/fixtures-plain

      # This job builds three test targets and nothing else, so it keeps its
      # own cache entry instead of racing the full builds for theirs.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: bellwether-fixtures

      # The tests fetch each model's tokenizer files from Hugging Face once, at
      # the revision its manifest pins, into these directories. Which files
      # are there depends on the manifests the tests read (the unpacked copy)
      # and on the list each test asks for, so the key is the hash of both:
      # moving the pin to a commit with the same models stores nothing new,
      # and a test that asks for one more file gets a new entry that starts
      # from the old one.
      - name: Cache tokenizer files
        uses: actions/cache@v6
        with:
          path: |
            crates/tokenizer/.tokenizer_cache/bellwether
            model_gateway/.tokenizer_cache/bellwether
          key: bellwether-tokenizers-${{ hashFiles('.bellwether/fixtures-plain/*/manifest.toml', 'model_gateway/tests/bellwether_*.rs', 'crates/tokenizer/tests/bellwether_*.rs') }}
          restore-keys: |
            bellwether-tokenizers-

      # One build for the test targets, so they build with the same features
      # (the tokenizer files are downloaded over the TLS backend the gateway
      # enables), and the pattern takes in every test file named bellwether_*
      # in these crates. Then each target runs on its own, all at once: each
      # is one thread comparing its sets, the runner has 8 CPUs, so the step
      # takes as long as the longest target, not their sum. The pinned commit
      # records 78 models: the tokenizer harness takes about an hour on the
      # CPU runner and the gateway's render parity about as long, so the step
      # has twice the time of the longest and the build; Symphony's replay
      # runs on 1 case in 200 of each benchmark set (its SYMPHONY_SAMPLE_EVERY
      # switch, the hand-written sets whole), as the whole replay of every
      # recorded model takes hours. Each target's output is its own group in
      # the log, written as the target ends, and a target that failed fails
      # the step once the others have ended.
      - name: Run the tests that read bellwether
        timeout-minutes: 120
        env:
          BELLWETHER_FIXTURES: ${{ github.workspace }}/.bellwether/fixtures-plain
          SYMPHONY_SAMPLE_EVERY: "200"
          # Two of the recorded templates (Apertus, Muse Glimmer) write the day
          # of the render into the prompt with strftime_now, so their references
          # carry the day they were recorded: 2026-10-07, in every case of both.
          # The gateway's strftime_now takes its instant from SOURCE_DATE_EPOCH
          # when it is set, so the harness renders that day too; noon UTC of it,
          # so the day is the same in whichever zone the runner formats it. The
          # value belongs with the pin: when .github/versions/bellwether.ref
          # moves to a commit that re-recorded those sets, set it to the day
          # their references carry (neither the pin's commit date nor the sets'
          # commit date is that day).
          SOURCE_DATE_EPOCH: "1791374400"
        run: |
          source "$HOME/.cargo/env"
          cargo test -p llm-tokenizer -p smg -p smg-symphony --test 'bellwether_*' --no-run
          targets=()
          for file in crates/symphony/tests/bellwether_*.rs model_gateway/tests/bellwether_*.rs crates/tokenizer/tests/bellwether_*.rs; do
            targets+=("$(basename "$file" .rs)")
          done
          declare -A pid
          for target in "${targets[@]}"; do
            cargo test -p llm-tokenizer -p smg -p smg-symphony --test "$target" -- --nocapture \
              > "$RUNNER_TEMP/$target.log" 2>&1 &
            pid[$target]=$!
          done
          failed=()
          for target in "${targets[@]}"; do
            wait "${pid[$target]}" || failed+=("$target")
            echo "::group::$target"
            cat "$RUNNER_TEMP/$target.log"
            echo "::endgroup::"
          done
          if (( ${#failed[@]} > 0 )); then
            echo "::error::tests that read bellwether failed: ${failed[*]}"
            exit 1
          fi

      # The stats are for reading, not a verdict. When the job ends before the
      # Rust setup put sccache on PATH (the unpack failed, say), the step says
      # so and passes, instead of failing in its turn and hiding the step that
      # did.
      - name: Show sccache stats
        if: always()
        run: |
          if command -v sccache >/dev/null 2>&1; then
            sccache --show-stats
          else
            echo "::notice::sccache is not on PATH, the Rust setup did not run: no stats to show"
          fi
