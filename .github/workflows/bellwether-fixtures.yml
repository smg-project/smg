name: Bellwether Fixtures

# bellwether (smg-project/bellwether) records, for each model at a pinned
# Hugging Face revision, what the checkpoint's own template and tokenizer give:
# the prompt token ids of a request, and the text of an output token by token.
# The tests named bellwether_* read those fixtures and skip without them: the
# gateway's chat request path, Symphony's parsers, and the tokenizer crate's
# encode and incremental decode. This workflow runs them on every change to
# the code they judge (the protocol crate, the tokenizer crate, the gRPC
# router, Symphony) and to the dependencies, so a difference shows on the pull
# request that makes it.
#
# The fixtures come from the bellwether commit in
# .github/versions/bellwether.ref. To move to newer fixtures, change that hash:
# the pull request that does it runs against the new commit. bellwether keeps
# its benchmark sets compressed, so the job unpacks the fixture tree with
# bellwether's own command and the tests read the plain copy. A set that is
# compressed is fetched from bellwether's LFS store by that command.
#
# bellwether is public, so the checkout and the LFS fetch need no token, and
# the job runs the same way for every pull request, forks and Dependabot
# included.
on:
  push:
    branches: [ main ]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]
    paths:
      - crates/protocols/**
      - crates/tokenizer/**
      - crates/symphony/**
      - model_gateway/src/routers/grpc/**
      - model_gateway/tests/bellwether_*.rs
      - model_gateway/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/versions/bellwether.ref
      - .github/workflows/bellwether-fixtures.yml
      - .github/actions/setup-rust/**
      - scripts/ci_install_rust.sh
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request and one per branch: a newer push cancels the
# superseded run. Keep the pull request form in sync with
# cancel-pr-workflows.yml.
concurrency:
  group: bellwether-fixtures-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

env:
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  fixture-tests:
    runs-on: ${{ vars.SMG_RUNNER_CPU || 'k8s-runner-cpu' }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # The tests below run this pull request's code, so the workflow token is
      # not left in the checkout's git configuration.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the pinned bellwether commit
        id: pin
        run: |
          ref="$(tr -d '[:space:]' < .github/versions/bellwether.ref)"
          if ! [[ "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=.github/versions/bellwether.ref::expected one 40-character commit hash"
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out bellwether
        uses: actions/checkout@v7
        with:
          repository: smg-project/bellwether
          ref: ${{ steps.pin.outputs.ref }}
          path: .bellwether
          persist-credentials: false

      # The plain fixture tree, as the tests read it: each model's manifest,
      # its table of sets, and the sets as JSON Lines. `--locked` runs the
      # command on the package versions bellwether locked at the pinned
      # commit, and fails if its lock file is out of date, instead of
      # resolving anew against PyPI.
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: .bellwether/uv.lock

      - name: Unpack the fixtures
        run: uv run --locked --project .bellwether bellwether unpack --fixtures .bellwether/fixtures --out .bellwether/fixtures-plain

      # This job builds three test targets and nothing else, so it keeps its
      # own cache entry instead of racing the full builds for theirs.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-key: bellwether-fixtures

      # The tests fetch each model's tokenizer files from Hugging Face once, at
      # the revision its manifest pins, into these directories. Which files
      # are there depends on the manifests the tests read (the unpacked copy)
      # and on the list each test asks for, so the key is the hash of both:
      # moving the pin to a commit with the same models stores nothing new,
      # and a test that asks for one more file gets a new entry that starts
      # from the old one.
      - name: Cache tokenizer files
        uses: actions/cache@v6
        with:
          path: |
            crates/tokenizer/.tokenizer_cache/bellwether
            model_gateway/.tokenizer_cache/bellwether
          key: bellwether-tokenizers-${{ hashFiles('.bellwether/fixtures-plain/*/manifest.toml', 'model_gateway/tests/bellwether_*.rs', 'crates/tokenizer/tests/bellwether_*.rs') }}
          restore-keys: |
            bellwether-tokenizers-

      # One invocation, so the test targets build with the same features (the
      # tokenizer files are downloaded over the TLS backend the gateway
      # enables), and the pattern takes in every test file named bellwether_*
      # in these crates.
      - name: Run the tests that read bellwether
        timeout-minutes: 45
        env:
          BELLWETHER_FIXTURES: ${{ github.workspace }}/.bellwether/fixtures-plain
        run: |
          source "$HOME/.cargo/env"
          cargo test -p llm-tokenizer -p smg -p smg-symphony --test 'bellwether_*' -- --nocapture

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
