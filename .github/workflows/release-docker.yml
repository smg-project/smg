name: Release Docker Image

# A push builds the image to validate the Dockerfile and pushes nothing; the images are published
# only on a maintainer's dispatch against a release tag or branch (scripts/release/README.md).
on:
  push:
    branches:
      - main
      - release/**
    paths:
      - .cargo/config.toml
      - docker/Dockerfile
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. v1.0.1). Leave empty to use version from pyproject.toml'
        required: false
        type: string
      mirror_existing:
        description: 'Mirror the existing Docker Hub release to GHCR without rebuilding'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Always runs: validates the Dockerfile builds successfully.
  # Pushes only on a manual dispatch.
  build-and-push:
    name: Build and push Docker image
    if: github.repository == 'smg-project/smg'
    runs-on: ${{ vars.SMG_RUNNER_DOCKER || 'cpu-e5' }}
    permissions:
      contents: read
      packages: write
    env:
      MIRROR_EXISTING: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_existing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine version tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            VERSION="${INPUT_TAG}"
          else
            VERSION=$(grep -m1 '^version = ' bindings/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION}"

      - name: Check if this is a release (should push)
        id: should-push
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Only a manual dispatch publishes; a push run validates the build.
          PUSH="false"
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            PUSH="true"
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "Will push: ${PUSH}"

      - name: Image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # A candidate (a pre-release suffix such as 1.14.0-rc.1) never moves `latest`.
          TAGS="lightseekorg/smg:${VERSION}"$'\n'"ghcr.io/${OWNER}/smg:${VERSION}"
          LATEST="false"
          if [[ "${VERSION}" != *-* ]]; then
            TAGS+=$'\n'"lightseekorg/smg:latest"$'\n'"ghcr.io/${OWNER}/smg:latest"
            LATEST="true"
          fi
          {
            echo "tags<<EOF"
            echo "${TAGS}"
            echo "EOF"
            echo "latest=${LATEST}"
          } >> "$GITHUB_OUTPUT"
          echo "Tags: ${TAGS//$'\n'/ } (latest moves: ${LATEST})"

      - name: Set up QEMU
        if: env.MIRROR_EXISTING != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.should-push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: steps.should-push.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        if: env.MIRROR_EXISTING != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ steps.should-push.outputs.push }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Mirror existing release image
        id: mirror
        if: env.MIRROR_EXISTING == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          CURRENT_VERSION=$(grep -m1 '^version = ' bindings/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          if [[ "${VERSION}" != "${CURRENT_VERSION}" ]]; then
            echo "::error::Mirror mode only supports the current release (${CURRENT_VERSION})."
            exit 1
          fi
          SOURCE="lightseekorg/smg:${VERSION}"
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smg:${VERSION}"
          GHCR_LATEST="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smg:latest"
          TAG_ARGS=(--tag "${GHCR_IMAGE}")
          if [[ "${LATEST}" == "true" ]]; then
            TAG_ARGS+=(--tag "${GHCR_LATEST}")
          fi
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCE}"
          DIGEST=$(docker buildx imagetools inspect "${GHCR_IMAGE}" --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          PUSH: ${{ steps.should-push.outputs.push }}
          PUBLISH_OUTCOME: ${{ env.MIRROR_EXISTING == 'true' && steps.mirror.outcome || steps.build.outcome }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.tags.outputs.latest }}
          DIGEST: ${{ env.MIRROR_EXISTING == 'true' && steps.mirror.outputs.digest || steps.build.outputs.digest }}
        run: |
          IMAGE="lightseekorg/smg:${VERSION}"
          LATEST_IMAGE="lightseekorg/smg:latest"
          GHCR_IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smg:${VERSION}"
          GHCR_LATEST="ghcr.io/${GITHUB_REPOSITORY_OWNER}/smg:latest"
          if [[ "${PUBLISH_OUTCOME}" == "success" && "${PUSH}" == "true" ]]; then
            {
              echo "### ✅ Release images available"
              echo ""
              echo "| Registry | Tag | Reference |"
              echo "| --- | --- | --- |"
              echo "| Docker Hub | \`${VERSION}\` | \`${IMAGE}\` |"
              echo "| GHCR | \`${VERSION}\` | \`${GHCR_IMAGE}\` |"
              if [[ "${LATEST}" == "true" ]]; then
                echo "| Docker Hub | \`latest\` | \`${LATEST_IMAGE}\` |"
                echo "| GHCR | \`latest\` | \`${GHCR_LATEST}\` |"
              fi
              if [[ -n "${DIGEST}" ]]; then
                echo ""
                echo "Digest: \`${DIGEST}\`"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${PUBLISH_OUTCOME}" == "success" ]]; then
            {
              echo "### ⚠️ Docker image built but NOT pushed"
              echo ""
              echo "\`${IMAGE}\` was built and validated, but not published — the images are published on a manual dispatch only."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Docker image ${IMAGE} was built but not pushed."
          else
            if [[ "${MIRROR_EXISTING}" == "true" ]]; then
              {
                echo "### ❌ GitHub Container Registry mirror failed"
                echo ""
                echo "\`${GHCR_IMAGE}\` was **not** published (outcome: \`${PUBLISH_OUTCOME}\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::GitHub Container Registry mirror failed for ${GHCR_IMAGE} (outcome: ${PUBLISH_OUTCOME})."
            else
              {
                echo "### ❌ Release image publishing failed"
                echo ""
                echo "Release images were **not** published (outcome: \`${PUBLISH_OUTCOME}\`)."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::warning::Release images were not published (outcome: ${PUBLISH_OUTCOME})."
            fi
          fi
