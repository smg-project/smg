target-version = "py312"
line-length = 100
# The vendored DeepSeek-V4.1 reference encoder (fixture oracle) stays byte-identical to
# upstream for diffing; force-exclude keeps it excluded when pre-commit passes paths
# explicitly.
extend-exclude = ["crates/tokenizer/scripts/oracle"]
force-exclude = true

[lint]
select = ["E", "F", "I", "W", "UP"]

[lint.pycodestyle]
# More lenient limit for comments, docstrings, and help strings
max-line-length = 120

[lint.per-file-ignores]
"e2e_test/**" = ["F841", "E402"]
"bindings/python/tests/**" = ["F841", "E402"]
# grpc_servicer supports Python 3.10+ — don't upgrade to 3.11+ syntax (e.g. datetime.UTC)
"grpc_servicer/**" = ["UP017"]

[format]
# Black-compatible defaults
