[package]
name = "tt-tok"
version = "0.1.0"
edition = "2021"
publish = false

# A workspace of its own: every adapter builds one implementation with that implementation's own
# dependency graph and profile, which the repository's workspace does not carry.
[workspace]

# The tiktoken Rust crate, at the version this crate's own lock pins.
[dependencies]
tiktoken-rs = { version = "=0.12.1" }
base64 = "0.22"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

# The repository's release profile: opt-level 3, fat LTO, one codegen unit.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = false
debug = 0
