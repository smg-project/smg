[package]
name = "fastokens-tok"
version = "0.1.0"
edition = "2021"
publish = false

# A workspace of its own: every adapter builds one implementation with that implementation's own
# dependency graph and profile, which the repository's workspace does not carry.
[workspace]

# The fastokens stack: one open-source Rust tokenizer crate over `fastokens`, `riptoken`, `tekken` and
# `tokenizers`. `../../references.json` names its repository and the commit; `run.py prepare` builds a
# copy of this package with the path below pointed at a checkout of that commit.
[dependencies]
fastokens_stack = { package = "vllm-tokenizer", path = "../reference/rust/src/tokenizer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

# The release profile of the reference's own workspace: thin LTO, panic abort.
[profile.release]
lto = "thin"
panic = "abort"

# The same profile with unwinding, for the cells that count a panic instead of ending the process.
[profile.robust]
inherits = "release"
panic = "unwind"
