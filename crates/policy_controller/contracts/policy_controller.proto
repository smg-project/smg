// smg.policy.v1: the policy controller's gateway, ingestion, control and
// replication protocol (design 5.2 and appendix A). The view and decision
// vocabulary is in policy_plugin.proto; the relay frames carry the engine
// wire's own messages (smg.grpc.common) unchanged.
//
// Versioning: design appendix A (additive within v1). The package is
// pre-release until the first shipped release that carries it; the rule
// binds from then on. Hello carries the range of protocol versions the
// gateway speaks and Welcome the one the controller picked; a range that
// holds no version the controller speaks is refused with
// FAILED_PRECONDITION, the status message naming the range and the
// controller's version.
//
// Scopes and principals: design 5.2. Four credentialed scopes, each
// mountable on its own listener; the verified principal is transport
// metadata, never a field a peer fills in. Gateway: Session, Decide,
// WatchWorkers and Leader; a Hello whose gateway_id is not the verified
// subject is refused with UNAUTHENTICATED and the stream closes. Ingestion:
// PushLoad and PushKvEvents; the relay's subject is the RELAY origin.
// Control: `user` reads (GetSnapshot, Explain, GetPolicySpec, Leader,
// WatchRegime), `admin` writes the rest; every call writes an audit event.
// Replication: Replicate, whose stream carries a re-sync's snapshot in parts;
// ReplicaHello.replica_id must equal the subject. Leader is served to every
// scope; a standby serves Leader, WatchWorkers, GetSnapshot and GetPolicySpec
// and answers Session and Decide with NotLeader / Busy { NOT_LEADER }.
// A listener its operator names takes a caller's identity as told: the
// caller states its name in the `x-smg-principal` metadata entry of every
// call, once (one token of visible ASCII, 0x21 to 0x7E, with no comma, 1
// to 253 bytes: entries a hop joined with a comma are two names), nothing
// is verified, and the principal reads METHOD_AS_TOLD. Such a listener has
// no other credential rule, and the stated name stands there wherever
// this contract says the verified subject. Leader needs no principal: it
// tells a caller where to go before the caller holds a session.
// Fencing: design 5.3. Every ControllerFrame and DecideAnswer carries the
// leader's term, every GatewayFrame the gateway's term floor. A gateway
// raises its floor from Leader and rejects frames below it; the controller
// refuses a floor above its own term with FAILED_PRECONDITION, and its
// leader gives the lease up so that the next take is above the floor (a
// floor more than 65,536 above the term, or one that leaves no term to
// take, is not believed: INVALID_ARGUMENT by the field's name, and the
// lease stands; one controller process moves the lease 1,048,576 terms on
// such floors at most and no floor moves it past term 8,388,608, and past
// either a floor above the term is refused the same and moves nothing); a
// leader past its renew deadline sends NotLeader with an empty address and
// releases nothing.
// Flow: design 5.2. Budgets are relative to receipt, never absolute; credits
// ride the Decide stream as deltas (Credit) and are never taken back; with
// no credit the gateway decides locally, and a DecideRequest sent with none
// is answered Busy { NO_CREDIT } and spends none; a Decide whose budget is
// gone on arrival, or ends while it is decided, is answered
// Busy { BUDGET_GONE_ON_ARRIVAL } without a lease, and so is a pick whose
// lease has under a millisecond of its dispatch span left once it is
// decided, or once it is sent to a gateway that read nothing meanwhile:
// the span counts from the request's take, and a lease tells what is left
// of it as it is sent. The controller counts the two that end while they
// are decided apart from the rest; a Decision that arrives after a
// fallback is answered with Released.
// A DecideRequest the controller has no decision for is answered Busy with
// no reason, and the gateway decides it locally.
// Where the controller leads, a Decide stream is a present gateway's: one
// whose Session stands or ended within Welcome.grace_period_ms. A replica
// that does not lead opens the stream and answers each DecideRequest
// Busy { NOT_LEADER }; the stream is asked for its gateway's presence at
// the first request under each term the replica leads.
// Errors (gRPC status): UNAUTHENTICATED no principal, or Hello's id is not
// the subject (the stream closes); PERMISSION_DENIED the scope or
// role does not cover the RPC, or a membership write names a row its
// caller did not make (WorkerRow.maker); FAILED_PRECONDITION a write or a
// Session off the leader (a NotLeader in the status details, which are a
// google.rpc.Status that holds it as an Any, its address the leader's
// gateway listener as Leader tells it; on Session, the NotLeader frame
// ahead of the status), a first frame that is not Hello or a second
// Hello, no
// protocol version in common, a floor above the term, a revision or
// digest guard, a Decide stream of a gateway that is not present where the
// controller leads (at its open, at its first request under a term, and an
// open one when the presence ends), or a replication call on a controller
// whose lease lives in its own process (it has no standby); INVALID_ARGUMENT
// a spec,
// registration or patch rejected (the field path in ApplyResult.issues, and
// at the head of a refused registration's or patch's status message), a
// Dispatched, Completed or Released whose side, class, reason or number
// reads wrong, a Released that names neither a lease nor a ticket (the
// field's name in the message), a term floor that is not believed (the
// same), a veto of no kind, a Hello whose veto_count is not its list's
// length, or a DecideRequest field out of its range in this protocol version
// (the status message names the field, and the stream closes);
// RESOURCE_EXHAUSTED a relay over its per-subscriber budget, a WatchWorkers
// past its principal's ceiling of 4 open watches or past the replica's
// ceiling of watching principals, a
// Decide stream past its gateway's Welcome.max_decide_streams, a Session
// frame over the transport's limit of 4 MiB a message, a Decide frame over
// 64 KiB as encoded, or a ceiling of the controller's: a Hello past 4,096
// present gateways, a Hello that lists more than 4,096 vetoes or more than
// eight kinds for one worker, a ninth kind of veto on one worker, a veto
// past the 4,096 one gateway holds; ALREADY_EXISTS a Hello whose id collides
// with another present gateway's, refused while that one stands, or an add
// of a registered URL; NOT_FOUND a replace of an absent URL, or no worker
// under the id; DEADLINE_EXCEEDED a Session stream that said no Hello within
// 5 s of its open, or a Replicate stream whose standby took no part of its
// snapshot for 60 s; UNAVAILABLE a standby not yet synced, a read a standby
// cannot serve yet (WatchWorkers until its replica follows the leader's log,
// a NotLeader in the status details), a leader whose store does not lead its
// term, on a membership write, a spec write, its dry run and a rollback,
// Replicate and the open of a WatchWorkers (the moment after
// its take, until its store is told the term, and a call admitted under a
// take its store has since passed: retry; or its whole lead, until a later
// take, where its log followed a term at or above the one it took), or a
// Decide stream open when the controller closes its listeners at its
// shutdown (its gateway opens the next one on the leader);
// ABORTED fenced mid-stream, reconnect through Leader, a Hello read
// under a term the election left before its seat was taken, or a session
// a newer one of its gateway replaced, or a worker row that moved under a
// membership call (a second writer: read the row again); UNIMPLEMENTED a
// call, a frame kind or a mode this build does not serve, or a spec call
// of a controller given no spec source, by its name;
// OUT_OF_RANGE and
// DATA_LOSS raised by no handler, forwarded as RelayResync. The
// transport answers OUT_OF_RANGE itself to a request over its limit of
// 4 MiB on a call of one request message; on a Session or Decide stream
// the reader answers that finding RESOURCE_EXHAUSTED. Any other read of
// a Session or Decide frame that the transport fails ends the stream
// under the transport's own status. A dry run past the 32 that may wait
// their turn is answered RESOURCE_EXHAUSTED. In-band within a stream:
// Busy, NotLeader, SpecAck { accepted: false }, Decline.

syntax = "proto3";
package smg.policy.v1;

import "policy_plugin.proto";
import "common.proto";

service PolicyController {
  // Gateway scope, one bidirectional stream per gateway: identity, leases,
  // pins, vetoes and acks in; welcome, terms, spec pushes, pre-emptions out.
  rpc Session(stream GatewayFrame) returns (stream ControllerFrame);
  // Gateway scope, one bidirectional stream per gateway runtime thread.
  rpc Decide(stream DecideRequest) returns (stream DecideAnswer);
  // Gateway scope, server stream: a snapshot then the tail, resumable by seq
  // and term. The stream ends ABORTED when its replica stops leading, and
  // with no error when its watcher takes nothing for 30 s: the watcher
  // resumes after the last event it took. A principal holds at most 4
  // watches open at a replica: one more is refused RESOURCE_EXHAUSTED.
  rpc WatchWorkers(WatchWorkersRequest) returns (stream WorkerEvent);
  // Ingestion scope (relays only), client streams answered once at the end.
  rpc PushLoad(stream LoadReport) returns (Ack);
  rpc PushKvEvents(stream RelayKvFrame) returns (Ack);
  // Control scope, unary. An answer says the row as written. A registration,
  // its refresh and a patch owe a build of the pools: it starts within one
  // publication window (20 ms) of their answer, and they are in force for
  // decisions when it ends. A deregistration and a new incarnation's
  // replacing of the old are in force at their answer: no decision made
  // after it names the worker that left. So is a refresh that takes its
  // worker off a model, for the pools it leaves.
  rpc RegisterWorker(RegisterWorkerRequest) returns (WorkerEvent);
  rpc PatchWorker(PatchWorkerRequest) returns (WorkerEvent);
  rpc DeregisterWorker(DeregisterWorkerRequest) returns (WorkerEvent);
  rpc GetSnapshot(SnapshotRequest) returns (Snapshot);
  rpc Explain(ExplainRequest) returns (DecisionRecord);
  rpc ApplyPolicySpec(ApplyRequest) returns (ApplyResult);
  rpc GetPolicySpec(GetPolicySpecRequest) returns (PolicySpecDocument);
  rpc RollbackPolicySpec(RollbackRequest) returns (ApplyResult);
  // Every scope, unary, served by every replica: a gateway polls it for its
  // term floor.
  rpc Leader(LeaderRequest) returns (LeaderInfo);
  // Control scope, unary.
  rpc StepDown(StepDownRequest) returns (Ack);
  // Control scope, server stream.
  rpc WatchRegime(RegimeRequest) returns (stream Regime);
  // Replication scope, one bidirectional stream per standby: the leader's
  // ordered log, acknowledged per batch, cut past a bounded backlog. A
  // leader sends 4 snapshots at once: a standby past them is told to
  // re-sync, and told again each second, until one of them ends and its
  // own snapshot's first part follows.
  rpc Replicate(stream ReplicaFrame) returns (stream ReplicationBatch);
  // Liveness and readiness are grpc.health.v1, not here.
}

// --- Session: gateway to controller -----------------------------------------

message GatewayFrame {
  uint64 seq = 1;
  uint64 term_floor = 2;
  oneof frame {
    Hello hello = 3;
    HelloPage hello_page = 4;
    Dispatched dispatched = 5;
    Completed completed = 6;
    Released released = 7;
    GatewayVeto veto = 8;
    SpecAck spec_ack = 9;
  }
}

// What the gateway holds. Its standing vetoes ride this frame. No HelloPage
// is sent (design 5.2): the page's case stays unsent in the oneof, and the
// lease and pin counts size no restore.
message Hello {
  // Must equal the principal's subject.
  string gateway_id = 1;
  uint32 protocol_min = 2;
  uint32 protocol_max = 3;
  uint64 term_seen = 4;
  Locality locality = 5;
  uint32 decide_streams = 6;
  // The spec generation its fallback engine runs.
  uint64 generation = 7;
  uint32 lease_count = 8;
  uint32 pin_count = 9;
  // The length of `vetoes`: a Hello that counts otherwise is refused.
  uint32 veto_count = 10;
  // A reconnect inside the grace period: restore exactly what the pages list
  // and release at once what they omit (the inverse rule, design 4.3). The
  // vetoes are no page's: `vetoes` below lists them whole.
  bool resume = 11;
  // The gateway's release string, for the audit log.
  string version = 16;
  // The gateway's standing vetoes, whole, held before the Welcome leaves: a
  // veto the list omits is lifted, whether or not the Hello says `resume`.
  // An entry with nothing remaining is no veto; of two entries of one
  // worker and kind the later end stands. A list holds at most 4,096
  // vetoes and, of those with time remaining, at most eight kinds for one
  // worker: a Hello past either is refused RESOURCE_EXHAUSTED and makes no
  // session.
  repeated VetoAssertion vetoes = 17;
  // Never assigned; kept out of use so a later field takes a fresh number.
  reserved 12 to 15;
}

message Locality {
  string zone = 1;
  // Topology keys as `key=value`, for the placement stages.
  repeated string topology = 2;
}

// At most 64 KB a page (about 900 leases); the lease and pin counts in Hello
// size the whole. Vetoes ride Hello.vetoes and never a page: no build reads
// `vetoes` here.
message HelloPage {
  repeated LeaseAssertion leases = 1;
  repeated Pin pins = 2;
  repeated VetoAssertion vetoes = 3;
  bool last = 4;
}

// A lease the gateway still holds, controller-minted or local (LeaseOrigin).
message LeaseAssertion {
  Lease lease = 1;
  bytes request_id = 2;
  fixed64 worker_id = 3;
  uint32 dp_rank = 4;
  bool dispatched = 5;
  uint32 age_ms = 6;
}

// A session pin the gateway holds.
message Pin {
  // The session's value (Identity in policy_plugin.proto: the key within
  // `model` and its phase), never the key's own fingerprint.
  fixed64 key = 1;
  fixed64 worker_id = 2;
  uint32 dp_rank = 3;
  uint32 idle_ms = 4;
  string model = 5;
}

// A standing veto re-asserted at reconnect, so the new leader learns it
// before its next transition.
message VetoAssertion {
  fixed64 worker_id = 1;
  GatewayVeto.Kind kind = 2;
  uint32 remaining_micros = 3;
}

// A gateway's veto on a worker, by kind: each kind stands and clears apart,
// and the worker is vetoed for the gateway while one kind stands. A veto on
// a worker the controller holds no row for is not kept: a veto leaves with
// its worker's row, and the gateway states it again when it sees the worker.
message GatewayVeto {
  fixed64 worker_id = 1;
  // A veto is kept by its kind's number: a number this build has no name
  // for stands and clears like the named ones. KIND_UNSPECIFIED is no kind:
  // the session ends with INVALID_ARGUMENT, and a Hello that lists it is
  // refused the same way. A worker holds at most eight kinds for one
  // gateway, and a gateway at most 4,096 vetoes, what its Hello lists
  // whole: a frame that would set a ninth kind, or one veto more, ends the
  // session with RESOURCE_EXHAUSTED, and what stands stays. A clear, and a
  // frame of a kind that stands, are always taken.
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_BREAKER = 1;
    KIND_LIVENESS = 2;
  }
  Kind kind = 2;
  // How long the veto stands from the frame's arrival. `clear`, or a
  // duration of 0, lifts this kind's veto.
  uint32 for_micros = 3;
  bool clear = 4;
}

// The gateway's answer to a SpecPush.
message SpecAck {
  uint64 generation = 1;
  bool accepted = 2;
  string error = 3;
}

// --- Session: controller to gateway -----------------------------------------

message ControllerFrame {
  uint64 seq = 1;
  uint64 term = 2;
  oneof frame {
    Welcome welcome = 3;
    NotLeader not_leader = 4;
    Preempt preempt = 5;
    SpecPush spec = 6;
  }
}

// The answer to Hello; `principal` echoes the session's principal.
message Welcome {
  uint32 protocol = 1;
  uint64 generation = 2;
  string controller_id = 3;
  Principal principal = 4;
  NeedsSummary needs = 5;
  // Block size and seed rule per model, for the host's hashing step.
  repeated ModelHashing hashing = 6;
  // Initial credit per Decide stream; a new Decide stream starts here again.
  uint32 decide_window = 7;
  // The Decide streams the gateway holds open at most.
  uint32 max_decide_streams = 8;
  // The stream rule's grace period and the default dispatch TTL. A gateway
  // is let go one grace period after its last session ended, and one period
  // more at most while a session that a newer one replaced still runs.
  uint32 grace_period_ms = 9;
  uint32 dispatch_ttl_ms = 10;
  // How often the gateway polls Leader for its term floor.
  uint32 leader_poll_ms = 11;
  uint32 leases_restored = 12;
  uint32 pins_restored = 13;
  // How many of the Hello's vetoes the controller holds: fewer than listed
  // when an entry had nothing remaining, repeated another, or named a worker
  // the controller holds no row for.
  uint32 vetoes_restored = 14;
}

// What the transport verified, or what the caller stated on a listener that
// takes identities as told (METHOD_AS_TOLD).
message Principal {
  string subject = 1;
  enum Scope {
    SCOPE_UNSPECIFIED = 0;
    SCOPE_GATEWAY = 1;
    SCOPE_INGESTION = 2;
    SCOPE_CONTROL = 3;
    SCOPE_REPLICATION = 4;
  }
  Scope scope = 2;
  enum Method {
    METHOD_UNSPECIFIED = 0;
    METHOD_MTLS = 1;
    METHOD_BEARER = 2;
    METHOD_PEER_CREDENTIAL = 3;
    // The subject is the name the caller stated; nothing was verified.
    METHOD_AS_TOLD = 4;
  }
  Method method = 3;
  // Control scope only: `user` or `admin`.
  string role = 4;
}

// What the host must feed per model and role, from the spec's validation.
// A row is an obligation: a host feeds, for a model and a role, the union
// of the rows whose model matches, and a model and role with no row need
// nothing. A row's model is a binding's pattern as the spec writes it:
// `*`, `prefix*`, `*suffix` or a model's id. The rows keep the bindings'
// order, and two bindings of one pattern write one row a role.
message NeedsSummary {
  repeated ModelNeeds models = 1;
}

message ModelNeeds {
  string model = 1;
  Role role = 2;
  bool text = 3;
  bool token_hashes = 4;
  bool text_hashes = 5;
  bool loads = 6;
  bool events = 7;
  bool ring = 8;
  bool headers = 9;
  bool media = 10;
}

message ModelHashing {
  string model = 1;
  uint32 block_size = 2;
  HashKind kind = 3;
  // How the namespace seed is derived (salt, adapter, extra key order).
  string seed_rule = 4;
}

// An empty address means fenced, no leader known: re-resolve through Leader.
message NotLeader {
  string leader_address = 1;
  string successor_id = 2;
}

// Reserved: abort the named lease (off unless admission.eviction).
message Preempt {
  fixed64 lease_id = 1;
  string reason = 2;
}

// The generation's document for every fallback engine; answered by SpecAck.
message SpecPush {
  uint64 generation = 1;
  string digest = 2;
  bytes document = 3;
  // `yaml` or `json`.
  string format = 4;
  NeedsSummary needs = 5;
}

// --- Decide: one stream per gateway runtime thread --------------------------

// One lease stands for one request. A gateway that sends a request again,
// because the stream that carried it ended before its answer arrived, says
// so (`again`): the lease its earlier decision was issued ends there, where
// no Dispatched named it, and the request is decided anew. The word reaches
// the asking gateway's own waiting leases alone, and of a pair's lease each
// side that waits ends. A request sent twice without the word is two
// requests. A frame is at most 64 KiB as encoded, and one over it is refused
// whole: a sender cuts its block hashes at the tail until its frame fits,
// and counts the cut on its own side.
message DecideRequest {
  // 1 to 256 bytes: the gateway's own key of one request among those it has
  // standing, carried back on every answer. A longer id is sent as a digest
  // of it, never cut: a cut key can be two requests'.
  bytes request_id = 1;
  // At most 256 headers, as many as a view names: a longer list repeats a
  // name and is out of its range.
  RequestFacts facts = 2;
  Constraints constraints = 3;
  // The gateway sent this request before under this id and holds no answer
  // to it, and the stream that carried it has ended: the gateway reads
  // nothing more from that stream. The word is not said while that stream
  // is open: an answer on its way is not held back, and it would carry a
  // lease the word has ended, which no Dispatched can name. The controller
  // finds the earlier lease by the id's 64-bit fingerprint, among the
  // gateway's leases that wait for a dispatch: two ids of one gateway that
  // share a fingerprint read as one request. A repeat its stream answers
  // Busy before a decider takes it (no credit, a full queue, a budget of 0)
  // ends nothing: the earlier lease waits out its dispatch deadline.
  //
  // Beside decode_of the word reaches one side. It takes back the issue of
  // the decode side of the lease that field names, where a call issued it
  // and no dispatch named it, and nothing else: no search by the id's
  // fingerprint is run for a frame that carries decode_of, with the word or
  // without. The side is chosen again and holds the first decision's decode
  // targets, ahead of the decision and whatever its answer. A pick of the
  // same frame issues it anew. Where the frame brings no pick, a Dispatched
  // that names a target of the first decision books the side.
  //
  // A gateway that sent a decode call and read no answer asks it again with
  // this word before it sends a decode. Until then the unread answer's
  // issue stands, and a Dispatched names a target of that answer's pick: it
  // would book a worker the decode never reached.
  bool again = 4;
  // This pair's decode is sent after its prefill has run. The decision names
  // the decode targets and issues the prefill side alone: the decode side is
  // chosen, books nothing and waits under no dispatch deadline. Read on a
  // request that enters a pair plan at its prefill, and on no other.
  bool decode_later = 5;
  // This request asks the decode side of the pair's lease this id names,
  // issued to this gateway, while its prefill is dispatched and not ended and
  // its decode side is chosen. The facts and the constraints are the
  // request's own, as on its first decision. It is read at the decode phase,
  // whatever its facts' phase says, and its decode_later is not read. The
  // answer's pick names decode targets, each with the lease's prefill, under
  // the same lease id. A refusal is a Busy with a reason of its own, and a
  // decision that sheds is no refusal of the request, whose prefill runs:
  // behind either the gateway sends the decode the first pick named, and
  // that Dispatched books the side. An id of 0 is out of range.
  optional fixed64 decode_of = 6;
}

message DecideAnswer {
  // Empty on a Credit frame.
  bytes request_id = 1;
  uint64 term = 2;
  oneof answer {
    Decision decision = 3;
    Busy busy = 4;
    Credit credit = 5;
  }
}

// Credit added to this Decide stream, a delta as HTTP/2's WINDOW_UPDATE:
// each DecideRequest spends one, no answer returns one, the controller never
// takes credit back; a new stream starts again at Welcome.decide_window.
message Credit {
  uint32 window = 1;
}

// --- WatchWorkers: membership, health, the id-to-URL map, the needs ---------

message WatchWorkersRequest {
  // Empty for every model. Otherwise the snapshot holds the rows that serve
  // one of these, and the tail tells an event when a row it names does: a
  // replacement that takes a worker out of them names both rows. No more
  // names than a row may serve models (a limit of this build), each a model
  // id as a registration states one: INVALID_ARGUMENT by this field's name
  // otherwise.
  repeated string models = 1;
  // 0: a snapshot first, then the tail; otherwise the tail after this seq,
  // exclusive: every membership or health event, and with `with_needs` every
  // generation's needs, at a greater log position (a needs event carries its
  // generation's position; the gaps are other event kinds). A log that holds
  // this seq under another term, or no longer holds the position after it,
  // answers one SnapshotRequired and ends the stream, never a silent skip or
  // replay (replicas match by position and term: the replication contract's
  // rejoin check); a synced standby behind it holds the stream and delivers
  // as it applies. Each run of a controller starts its log at a place drawn
  // below 2^48. A later run can take a term again, at each start where the
  // lease is not shared and where a shared lease's record was lost, and the
  // draw keeps a position of another run outside the positions this run
  // holds, under its first or ahead of its head, but for a chance of 4,097
  // in 2^48 a resume.
  // membership_epoch moves only on a membership change and is no resume point.
  uint64 resume_seq = 2;
  // INVALID_ARGUMENT, by this field's name, where the controller tells no
  // generation's needs.
  bool with_needs = 3;
  // The term `resume_seq` was written under, WorkerEvent.term as delivered; 0
  // with resume_seq 0 (INVALID_ARGUMENT, by this field's name, otherwise).
  uint64 resume_term = 4;
}

message WorkerEvent {
  // The replication log position of the event: the leader assigns it, the
  // batch carries it and a standby adopts it, so every replica numbers the
  // event alike. Every page of one snapshot carries the position the snapshot
  // is consistent with, filtered by `models` or not: the last position of the
  // kinds a watcher can ask for when the rows were read (a standby's
  // snapshot stands at the log's head, at or after it; the rows are the
  // same at both); the tail starts after it. A registration call's answer
  // carries a position at or after the call's write, and where the call
  // wrote nothing the last position of those kinds: a watcher that has
  // passed it holds the row as answered or a later one.
  uint64 seq = 1;
  uint64 membership_epoch = 2;
  oneof event {
    WorkerSnapshot snapshot = 3;
    WorkerRow registered = 4;
    Replaced replaced = 5;
    Removed removed = 6;
    StatusChanged status = 7;
    WorkerRow relabelled = 8;
    NeedsSummary needs = 9;
    // The tail cannot resume after the requested seq (the position gone, or
    // held under another term), or the watcher fell behind what the log
    // retains: the stream ends and the watcher reconnects with resume_seq 0.
    // The event carries no position of its own: seq and term are 0.
    SnapshotRequired snapshot_required = 10;
    // The answer of a RegisterWorker that states more than one rank
    // (WorkerSpec.dp_size): what the call made of each rank. No watch tells
    // it: a watcher is told each row's own event, and a reader that meets
    // this case on a watch lets the stream go.
    RankRows ranks = 12;
  }
  // The term `seq` was written under; a watcher hands both back on resume.
  uint64 term = 11;
}

// What a registration that states more than one rank made of each rank, in
// rank order, then one entry for each row of the engine that left with it:
// a rank a narrower worker no longer has, or the plain row of a worker that
// comes back ranked. Each entry is the event a watcher is told of that row,
// with no position of its own: the answer's seq, epoch and term are read
// after the call's last write, so a watcher past them holds every rank as
// answered or later. A call that wrote nothing answers each rank
// `relabelled`, the row unmoved. At most 64 ranks (WorkerSpec.dp_size): a
// replacement tells two rows, and the answer stays within half of a 4 MiB
// frame.
message RankRows {
  repeated RankRow rows = 1;
}

message RankRow {
  oneof made {
    WorkerRow registered = 1;
    Replaced replaced = 2;
    Removed removed = 3;
    WorkerRow relabelled = 4;
  }
}

// Paged at 128 rows or at 2 MiB of rows, whichever comes first, every page at
// the snapshot's seq; a watcher switches to the tail at `last` and, cut
// before it, reconnects with resume_seq 0. A page takes its first row
// whatever it weighs. A row is at most 16,384 bytes at its registration
// (WorkerSpec), so a page stays within half of a 4 MiB frame.
message WorkerSnapshot {
  repeated WorkerRow workers = 1;
  bool last = 2;
}

message SnapshotRequired {
  // The position of the oldest event the log retains.
  uint64 oldest_seq = 1;
}

// Same registration key, new incarnation.
message Replaced {
  WorkerRow old = 1;
  WorkerRow new = 2;
  // Runtime and breaker state carried over. A draining row hands none on:
  // a drain ends with the registration it named.
  bool state_carried = 3;
}

message Removed {
  fixed64 worker_id = 1;
  string registration_key = 2;
  uint64 revision = 3;
  bool draining = 4;
}

enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  WORKER_STATUS_PENDING = 1;
  WORKER_STATUS_READY = 2;
  WORKER_STATUS_NOT_READY = 3;
  WORKER_STATUS_DRAINING = 4;
  // A sustained liveness failure: kept and probed, it may return.
  WORKER_STATUS_FAILED = 5;
}

message StatusChanged {
  fixed64 worker_id = 1;
  WorkerStatus old = 2;
  WorkerStatus new = 3;
  // HealthFlag bits after the transition.
  uint32 health = 4;
}

message WorkerRow {
  fixed64 id = 1;
  string registration_key = 2;
  // The number of this life of the key. Its high 24 bits are the term of
  // the leader that registered it. Its low 40 count the store's membership
  // writes from a base a controller run draws once, so another run under
  // the same term counts from elsewhere. Within one run and one term a later
  // life has the higher number. A caller reads the number from the answer
  // and never computes it.
  uint64 incarnation = 3;
  string url = 4;
  // The one wire a registration serves (one URL on one wire). The numbers
  // are bits: a row that serves several wires tells their sum.
  WireMode wire = 5;
  Role role = 6;
  string runtime = 7;
  repeated string models = 8;
  uint32 dp_size = 9;
  map<string, string> labels = 10;
  string zone = 11;
  WorkerStatus status = 12;
  // Counts the row's stated facts: it moves with the events that carry a
  // row (registered, replaced, relabelled) and with no status change.
  uint64 revision = 13;
  // HealthFlag bits.
  uint32 health = 14;
  Reachability reachable = 15;
  PairingDescriptor pairing = 16;
  OverloadThresholds overload = 17;
  Signals signals = 18;
  uint32 kv_block_size = 19;
  // The registration label `policy`: a lowest-precedence binding of the model.
  string policy = 20;
  repeated string topology = 21;
  uint32 max_running = 22;
  // The rank of its data-parallel engine this row is; 0 for a single rank.
  uint32 dp_rank = 23;
  // The engine the row belongs to: one for the ranks of a data-parallel
  // engine, the registration key for a single rank.
  string engine = 24;
  HealthPolicy health_policy = 25;
  // How long ago the row was admitted, at the send. Set in a snapshot's
  // rows, where a standby restores the instant from it; 0 in an event's
  // row. A row an event adds, a new worker's or a replacement's, is
  // admitted where it is applied; a row an event changes keeps the
  // admission its standby holds.
  uint64 admitted_age_ms = 26;
  // Who made the row. Absent: a control call. The caller that made a row
  // alone changes it: an UPSERT or a REPLACE over it, a patch, a drain and
  // a removal from any other are refused PERMISSION_DENIED, ahead of the
  // revision's test, and the words name the maker. An ADD over it is
  // ALREADY_EXISTS whoever made it. A reader that knows no such field
  // reads every row as a control call's.
  Maker maker = 27;
}

// A provider that finds workers by itself, as a row's maker. Neither
// field is empty: a reader refuses a row whose maker lacks one, by that
// field.
message Maker {
  // The provider's name: one token of visible ASCII (0x21 to 0x7E) with no
  // comma, at most 128 bytes, the form of a principal's stated name.
  string provider = 1;
  // The provider's own key for the worker, at most 2048 bytes. A redacted
  // snapshot does not tell it verbatim where it may hold a credential: a key
  // with a scheme loses its userinfo as a URL does, and any other key that
  // holds an `@` reads as `<unparsable address>`.
  string key = 2;
}

// A host-local wire is reachable from one gateway only.
message Reachability {
  oneof scope {
    bool any = 1;
    string gateway_id = 2;
  }
}

// What one PD worker offers a rendezvous partner, and the store's class.
// The store derives the class where the membership moves a member or an
// offer, and again when a generation moves the pairing mode: the classes
// then move at the same membership epoch and no watch event says so. A
// registration hands none in. pair_class is the worker's one class on its
// side, 0 outside any pairing: the decodes a prefill pairs with are the
// snapshot's PairRow.decodes.
message PairingDescriptor {
  string protocol = 1;
  string connector = 2;
  string transport = 3;
  string version = 4;
  uint32 bootstrap_port = 5;
  string bootstrap_host = 6;
  map<string, string> kv_layout = 7;
  uint32 pair_class = 8;
  bool ec_producer = 9;
  bool ec_consumer = 10;
  bool vision = 11;
  // The worker's end of the encode handoff, with its two EC roles: the form
  // its registration states and, under a push, the connector the role is
  // stated on. Unspecified is no end, as a registration that names no form
  // reads; the connector above is the pair's. The store derives from them
  // which encoders hand an item to which prefills.
  EncodeHandoff encode_handoff = 12;
  string ec_connector = 13;
  // The worker, an encoder, processes an item's references itself.
  bool encode_references = 14;
}

// How an encoder hands an encoded item to a prefill.
enum EncodeHandoff {
  ENCODE_HANDOFF_UNSPECIFIED = 0;
  // The encoder pushes the item to the prefill over an EC connector.
  ENCODE_HANDOFF_PUSH = 1;
  // The encoder and the prefill meet at a rendezvous.
  ENCODE_HANDOFF_RENDEZVOUS = 2;
}

// Per-worker overrides over the spec's defaults; unset means the spec's value.
message OverloadThresholds {
  // Two thresholds no judge read; a reader brings one back under a new number.
  reserved 3, 4;
  reserved "in_flight_limit", "waiting_tokens_limit";
  optional uint32 queue_limit = 1;
  optional uint32 kv_usage_permille = 2;
}

// The prober's settings for one worker. A zero count or period means the
// controller's default.
message HealthPolicy {
  // Consecutive failed probes before a ready worker leaves rotation; three
  // times as many fail it. A threshold whose multiple passes the probe
  // counter's range (32 bits) is never met before the counter's end.
  uint32 failure_threshold = 1;
  // Consecutive passed probes before a worker returns.
  uint32 success_threshold = 2;
  uint32 check_interval_ms = 3;
  uint32 timeout_ms = 4;
  // The checks are off: the worker is ready from its registration and the
  // prober never judges it. The registrant says "do not check", never
  // "healthy".
  bool disabled = 5;
}

// How the controller learns the worker's loads and events.
message Signals {
  bool events = 1;
  bool loads = 2;
  bool scrape = 3;
  uint32 scrape_interval_ms = 4;
  // The scrape source's engine-family name.
  string scrape_family = 5;
}

// --- Ingestion scope: relays only -------------------------------------------

// One load record of one rank: the engine wire's EngineLoad unchanged, with
// the worker, the rank and the relay's receipt; a gateway in front of a
// host-local wire forwards what it received, its verified subject the origin.
message LoadReport {
  fixed64 worker_id = 1;
  // When the relay has no id yet (a worker it registered itself).
  string registration_key = 2;
  uint32 dp_rank = 3;
  smg.grpc.common.EngineLoad record = 4;
  // EVENTS, POLL or SCRAPE at the relay; the controller records the RELAY hop.
  SignalSource source = 5;
  // The relay's receipt, microseconds since its stream opened.
  uint64 received_offset_micros = 6;
  uint64 relay_seq = 7;
}

// The engine wire's event batch unchanged, or the stream status the relay saw.
message RelayKvFrame {
  fixed64 worker_id = 1;
  string registration_key = 2;
  oneof frame {
    smg.grpc.common.KvEventBatch batch = 3;
    RelaySubscribed subscribed = 4;
    RelayResync resync = 5;
    RelayEnded ended = 6;
  }
  uint64 received_offset_micros = 7;
}

message RelaySubscribed {
  uint64 start_sequence_number = 1;
  bool loads_only = 2;
  uint32 dp_size = 3;
}

// The engine wire's status codes and stream ends as frames.
message RelayResync {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    REASON_OUT_OF_RANGE = 1;
    REASON_DATA_LOSS = 2;
    REASON_STREAM_ENDED = 3;
    REASON_SNAPSHOT_ABANDONED = 4;
    REASON_RELAY_RESTART = 5;
    REASON_ENGINE_REPLACED = 6;
  }
  Reason reason = 1;
  uint32 dp_rank = 2;
  uint64 resume_from = 3;
}

message RelayEnded {
  string reason = 1;
}

// --- Control scope: membership ----------------------------------------------

message RegisterWorkerRequest {
  WorkerSpec spec = 1;
  enum Mode {
    // Reads as MODE_ADD.
    MODE_UNSPECIFIED = 0;
    // The URL must be absent: ALREADY_EXISTS otherwise, whoever made the
    // standing row.
    MODE_ADD = 1;
    // The URL must stand: its next incarnation, NOT_FOUND otherwise, whatever
    // the registration leaves unset. A field past its own rule or bound is
    // INVALID_ARGUMENT first, whether the URL stands or not. A caller that
    // did not make the standing row is PERMISSION_DENIED (WorkerRow.maker).
    MODE_REPLACE = 2;
    // Registers an absent URL. Over a standing row: equal facts write nothing
    // and answer the row unmoved, a change of role, wire or models is a new
    // incarnation, any other change is made in place. The models change
    // when their set does: the same ids in another order are written in
    // place, and the row tells the stated order. Over a draining row every
    // registration is the URL's next incarnation, whatever its facts: a
    // drain ends with the registration it named. A caller that did not make
    // the standing row is PERMISSION_DENIED, whatever the facts.
    MODE_UPSERT = 3;
  }
  Mode mode = 2;
  // Wait for the handshake; otherwise the row is answered PENDING and the
  // handshake's result is a StatusChanged on WatchWorkers. A worker whose
  // checks are off is ready from its registration: its wait ends in the call
  // and the answer is the row after it. INVALID_ARGUMENT, by this field's
  // name, where the controller runs no handshake that ends the wait.
  bool wait_ready = 3;
}

// A registration before the handshake fills the row. A name is taken as
// written: a URL, a runtime or a model id that holds a blank or a control
// character is INVALID_ARGUMENT. Over a standing row (MODE_REPLACE,
// MODE_UPSERT) the labels and the health policy are the registration's,
// whole; any other field left unset or empty keeps the row's value, and an
// overload or a signals block that is present replaces the row's. A URL's
// first registration names its wire and its role: INVALID_ARGUMENT by the
// field it leaves unset. A wire or a role that states a number this
// contract does not name is INVALID_ARGUMENT at every registration.
//
// Bounds, each INVALID_ARGUMENT by its field: a URL at most 2,048 bytes; a
// runtime, a zone and a model id at most 256 bytes each; at most 128 labels,
// a key at most 128 bytes and a value at most 4,096. Last, by `spec`: the
// row the registration would make is at most 16,384 bytes as WorkerRow
// encodes it, measured with the numbers the controller gives a row (its id,
// incarnation, revision and status) and the overload block at their widest:
// no later status, revision or patched block adds a byte.
//
// A limit of this build, not a number of the contract: a row names at most
// 128 model ids (INVALID_ARGUMENT by `spec.models`). A gateway's own
// registration takes a worker of more ids, and this door refuses it; the
// count is said again once the store's cost of a row's ids is measured.
message WorkerSpec {
  string url = 1;
  // WIRE_MODE_ZMQ is INVALID_ARGUMENT here: a host-local wire is reachable
  // from the one gateway that holds its socket (Reachability), and no field
  // of a registration names a gateway.
  WireMode wire = 2;
  Role role = 3;
  string runtime = 4;
  repeated string models = 5;
  map<string, string> labels = 6;
  string zone = 7;
  OverloadThresholds overload = 8;
  uint32 kv_block_size = 9;
  // Of the descriptor a registration states the bootstrap port alone, and
  // the row tells it back: the store holds no other field of it yet, and one
  // a caller states is INVALID_ARGUMENT by its path. Zero states no port:
  // the standing port stays, under a REPLACE too, and it is cleared by
  // removing the worker and registering it again.
  PairingDescriptor pairing = 10;
  // 0: the data-parallel width is discovered where a handshake runs (always
  // on) and is one rank where none does. Above 1: one row a rank, rank r
  // under the URL `url@r`, and the call answers a row a rank
  // (WorkerEvent.ranks). Every rule holds before the first write: a
  // refusal of a rank or of the group writes nothing. A lead lost between
  // two ranks is UNAVAILABLE and leaves the ranks written before it: a
  // MODE_UPSERT lays the rest, and so does the same MODE_ADD called again.
  // At most 64: INVALID_ARGUMENT above, and above 1 where the controller's
  // build lays no ranks.
  //
  // The modes hold for the engine. MODE_ADD: ALREADY_EXISTS where a row
  // stands under a rank's URL or the engine stands in another form (its
  // plain row, or ranks the registration does not state). One standing is
  // the add's own: where every rank that stands is this caller's with
  // equal facts and a rank is absent, the call lays the absent ranks and
  // answers each standing rank `relabelled`, the row unmoved. An engine
  // whose every rank stands is ALREADY_EXISTS, with equal facts too: an add
  // whose answer was lost reads the rows (WatchWorkers). MODE_REPLACE:
  // NOT_FOUND unless every stated rank stands; each is its next
  // incarnation. MODE_UPSERT lays each rank over what stands. Under REPLACE
  // and UPSERT the engine's rows that the registration does not state leave
  // with it. A registration of one rank (0 or 1) for an engine that stands
  // as ranks is FAILED_PRECONDITION: it states its width, or its ranks are
  // removed first (DeregisterWorker, a rank at a time).
  uint32 dp_size = 11;
  Signals signals = 12;
  repeated string topology = 13;
  // Unset: checked, under the controller's defaults, whatever stood under
  // the URL: every registration that wants its checks off says so.
  HealthPolicy health_policy = 14;
}

message PatchWorkerRequest {
  // An id names one registration: NOT_FOUND once it left, whatever stands
  // under its URL since.
  fixed64 worker_id = 1;
  // The row the patch would make holds a registration's bounds (WorkerSpec):
  // INVALID_ARGUMENT by this field for a key, a value, the count and the row
  // whole.
  map<string, string> labels = 2;
  // At most 128 keys, each within a key's bound: INVALID_ARGUMENT by this
  // field.
  repeated string remove_labels = 3;
  OverloadThresholds overload = 4;
  // The row's revision the caller read; FAILED_PRECONDITION when it moved.
  // A caller that did not make the row is PERMISSION_DENIED first, whatever
  // revision it read (WorkerRow.maker).
  uint64 revision = 5;
}

message DeregisterWorkerRequest {
  // The id and the revision the caller read, as in PatchWorkerRequest.
  fixed64 worker_id = 1;
  uint64 revision = 2;
  // Drain (no new leases, Removed after the last Completed) instead of an
  // immediate removal that releases its leases. Where the controller counts
  // no lease the row stays DRAINING until a call without the flag removes
  // it or the URL's next incarnation replaces it. A drain of a draining row
  // writes nothing and answers the row unmoved.
  bool drain = 3;
}

// --- Control scope: the store -----------------------------------------------

// Redacted by default: URLs lose credentials, session keys and header values
// are fingerprinted, plugin state dumps hash identifiers. A standby is
// restored on its Replicate stream (ReplicationSnapshot), never by this call.
message SnapshotRequest {
  enum Slice {
    SLICE_UNSPECIFIED = 0;
    SLICE_WORKERS = 1;
    SLICE_HEALTH = 2;
    SLICE_LOADS = 3;
    SLICE_SESSIONS = 4;
    SLICE_LEASES = 5;
    SLICE_PAIRS = 6;
    SLICE_SPEC = 7;
    SLICE_PLUGINS = 8;
    SLICE_KV_INDEX = 9;
    SLICE_GATEWAYS = 10;
  }
  // Empty for every slice.
  repeated Slice slices = 1;
  repeated string models = 2;
  // Admin only in the control scope: identifiers in clear.
  bool plain_identifiers = 3;
  // Rows per slice at most; 0 sets no limit. A slice's rows are bounded by
  // the bytes of a page as well, whatever is asked. `truncated` says when
  // either bound left a row out.
  uint32 limit = 4;
}

message Snapshot {
  // The leader's term at the snapshot (the fencing floor), not the write term
  // of any position: that is `replication_term`.
  uint64 term = 1;
  uint64 generation = 2;
  string controller_id = 3;
  repeated WorkerRow workers = 4;
  repeated HealthRow health = 5;
  repeated LoadSample loads = 6;
  repeated SessionRow sessions = 7;
  repeated LeaseRow leases = 8;
  repeated PairRow pairs = 9;
  SpecStatus spec = 10;
  repeated PluginState plugins = 11;
  KvIndexSummary kv_index = 12;
  repeated GatewayRow gateways = 13;
  bool truncated = 14;
  // The log position the snapshot is consistent with; non-zero only on a
  // complete, unredacted snapshot, zero on a partial or redacted one.
  uint64 replication_seq = 15;
  // The interned-id table at that position.
  IdAssignment ids = 16;
  // The current generation first, then every retained one in `spec.retained`'s
  // order, each as the log replicates it (status and document), so a standby
  // answers GetPolicySpec alike from either path; present with
  // `replication_seq`.
  repeated GenerationEvent documents = 17;
  // The term the event at `replication_seq` was written under; present with
  // it, zero with it.
  uint64 replication_term = 18;
  // The membership epoch at `replication_seq`; present with it.
  uint64 membership_epoch = 19;
}

// The health precedence's inputs.
message HealthRow {
  fixed64 worker_id = 1;
  uint32 health = 2;
  uint32 probe_failures = 3;
  // Gateways with a standing veto on the worker.
  uint32 vetoing_gateways = 4;
  // Gateways whose Completed reports succeeded within the last probe interval.
  uint32 reporting_ok = 5;
  uint32 since_ms = 6;
}

message LoadSample {
  fixed64 worker_id = 1;
  uint32 dp_rank = 2;
  LoadRow load = 3;
  // Whether the report counts resident tokens: the row's 0 is both "none"
  // and "not counted". The host's own reading, in no plugin's view.
  bool resident_counted = 4;
}

message SessionRow {
  // The session's value, as in Pin.
  fixed64 key = 1;
  fixed64 worker_id = 2;
  uint32 dp_rank = 3;
  uint32 idle_ms = 4;
  string model = 5;
}

message LeaseRow {
  Lease lease = 1;
  string gateway_id = 2;
  bytes request_id = 3;
  fixed64 worker_id = 4;
  uint32 dp_rank = 5;
  uint32 age_ms = 6;
  bool dispatched = 7;
}

message PairRow {
  fixed64 prefill_id = 1;
  repeated fixed64 decodes = 2 [packed = true];
  uint32 pair_class = 3;
  uint32 slots_free = 4;
}

enum ApplyMode {
  APPLY_MODE_UNSPECIFIED = 0;
  APPLY_MODE_ENFORCE = 1;
  // A new generation runs as the shadow of the current one.
  APPLY_MODE_AUDIT = 2;
  // Validate and report the needs diff; nothing persisted.
  APPLY_MODE_DRY_RUN = 3;
}

message SpecStatus {
  uint64 generation = 1;
  string digest = 2;
  int64 applied_unix_micros = 3;
  ApplyMode mode = 4;
  // Generations retained for RollbackPolicySpec.
  repeated uint64 retained = 5 [packed = true];
  // `file` or `api`.
  string source = 6;
}

// A bounded, redacted dump per plugin instance.
message PluginState {
  string plugin = 1;
  string digest = 2;
  uint32 instances = 3;
  uint64 traps = 4;
  uint64 budget_hits = 5;
  uint64 declines = 6;
  bool breaker_open = 7;
  bytes state = 8;
  bool state_truncated = 9;
}

message KvIndexSummary {
  uint64 blocks = 1;
  uint32 workers = 2;
  uint32 ranks_live = 3;
  uint32 ranks_resyncing = 4;
  uint32 models = 5;
}

message GatewayRow {
  string gateway_id = 1;
  uint64 acknowledged_generation = 2;
  uint32 decide_streams = 3;
  uint32 leases = 4;
  string zone = 5;
  uint32 idle_ms = 6;
  uint32 protocol = 7;
}

// --- Control scope: Explain and the spec ------------------------------------

message ExplainRequest {
  oneof key {
    fixed64 decision_id = 1;
    bytes request_id = 2;
  }
  // With a request id: which gateway's.
  string gateway_id = 3;
}

// The durable record of one decision: names resolved from the generation's
// spec, identities redacted unless the principal is admin and asked.
message DecisionRecord {
  fixed64 decision_id = 1;
  bytes request_id = 2;
  string gateway_id = 3;
  uint64 generation = 4;
  uint32 binding = 5;
  // A digest of the view as decided, for replay checks.
  fixed64 view_digest = 6;
  RequestFacts request = 7;
  repeated Scored candidates = 8;
  Decision decision = 9;
  // Which exposure each plugin saw.
  repeated PluginProjection projections = 10;
  // Joined later from the lifecycle; unset until then.
  Completed outcome = 11;
  int64 at_unix_micros = 12;
  string profile_name = 13;
  string plan_name = 14;
  string picker_name = 15;
  repeated string filter_names = 16;
  repeated string scorer_names = 17;
}

message PluginProjection {
  string plugin = 1;
  Exposure exposure = 2;
}

message ApplyRequest {
  bytes document = 1;
  // `yaml` or `json`.
  string format = 2;
  // A write states its mode: none, or a number that is no mode, is
  // INVALID_ARGUMENT by the field's name.
  ApplyMode mode = 3;
  // The digest of the generation the caller edited; FAILED_PRECONDITION when
  // another apply landed first.
  string expected_digest = 4;
}

// Persisted first, then applied; under `source: file` every answer is
// read_only: an enforce and a rollback carry the standing number and digest
// and take nothing. A dry run answers OK whatever its verdict: accepted,
// with the number the document would run under, which is not reserved, and
// its digest; or not accepted, with the standing number and digest and one
// issue. `needs` is the feed before and after a document that would run.
message ApplyResult {
  bool accepted = 1;
  uint64 generation = 2;
  string digest = 3;
  repeated SpecIssue issues = 4;
  NeedsDiff needs = 5;
  bool read_only = 6;
  string audit_id = 7;
}

message SpecIssue {
  string field_path = 1;
  string message = 2;
  // The plugin the issue is about, when one.
  string plugin = 3;
}

message NeedsDiff {
  NeedsSummary before = 1;
  NeedsSummary after = 2;
}

message GetPolicySpecRequest {
  // 0 for the current generation.
  uint64 generation = 1;
}

message PolicySpecDocument {
  uint64 generation = 1;
  string digest = 2;
  bytes document = 3;
  string format = 4;
  int64 applied_unix_micros = 5;
  ApplyMode mode = 6;
  repeated GatewayAckRow acks = 7;
}

message GatewayAckRow {
  string gateway_id = 1;
  uint64 generation = 2;
  bool accepted = 3;
  string error = 4;
}

message RollbackRequest {
  uint64 generation = 1;
}

// --- Leadership and the regime ----------------------------------------------

message LeaderRequest {
  // Empty for the controller's own lease; a model for its group's lease.
  string model = 1;
}

message LeaderInfo {
  string controller_id = 1;
  // `host:port`, dialable without a Service.
  string address = 2;
  uint64 term = 3;
  bool is_leader = 4;
  // On a follower: its replication lag is under one load poll interval,
  // or two of the leader's heartbeats where that is longer. The live
  // ranks and the generation narrow this bit with their steps (design
  // 5.4). A leader follows nobody: false.
  bool synced = 5;
  SyncState sync = 6;
  repeated GroupLeader groups = 7;
  uint32 protocol_min = 8;
  uint32 protocol_max = 9;
}

message SyncState {
  // The age of the last frame that left a follower at the head its leader
  // stated (ReplicationBatch.head_seq).
  uint32 replication_lag_ms = 1;
  uint32 ranks_live = 2;
  uint32 ranks_total = 3;
  uint32 ranks_resyncing = 4;
  uint64 generation = 5;
}

message GroupLeader {
  string model_group = 1;
  string controller_id = 2;
  string address = 3;
  uint64 term = 4;
}

message StepDownRequest {
  string successor = 1;
  // Bounded wait for a synced successor; then the lease is released anyway.
  uint32 wait_ms = 2;
}

message RegimeRequest {
  repeated string models = 1;
  uint32 interval_ms = 2;
}

// For autoscalers: per model group and zone.
message Regime {
  string model_group = 1;
  string zone = 2;
  OverloadRegime regime = 3;
  uint32 queued = 4;
  uint32 in_flight = 5;
  uint32 median_report_age_ms = 6;
  // Free capacity as a fraction of the healthy capacity, 0 to 1.
  float headroom = 7;
  uint32 healthy_workers = 8;
  uint64 generation = 9;
}

// --- Replication: the typed log a standby applies ---------------------------

// Reservations and their ends, pins, membership, health, loads and
// generations with their documents; never credits (rebuilt from Hello).
// IdAssignment interns worker ids in the same order on every replica.
message ReplicaFrame {
  oneof frame {
    ReplicaHello hello = 1;
    ReplicationAck ack = 2;
  }
}

message ReplicaHello {
  string replica_id = 1;
  uint64 last_applied_seq = 2;
  // The highest term seen: the fencing floor, not the term of any position.
  uint64 term_seen = 3;
  // Events the standby can hold unacknowledged. The leader sends it no
  // further, and tells a standby that leaves the bound full for a second
  // to resync. Zero asks for the leader's own bound, and a bound above
  // the leader's is cut to it.
  uint32 max_backlog = 4;
  // The term the event at `last_applied_seq` was written under. A leader
  // continues a standby only when its log holds `last_applied_seq` under
  // `last_applied_term`; on another term, a position past its head, or one
  // older than it retains, it answers a resync_required batch, never a
  // continuation: two replicas that agree on a position and its term share
  // the prefix before it. A standby restored from a snapshot stands at the
  // snapshot's place under its term. A non-zero `last_applied_seq` with a
  // zero term is answered resync_required as well: a standby on which its
  // leader's event did not land states its head's number under no term, and
  // is restored whole. A standby that
  // applied nothing states zero for both: it is continued from the leader's
  // first write, at the position after the place the leader's run drew,
  // while the leader's log retains every write since.
  uint64 last_applied_term = 5;
}

message ReplicationAck {
  uint64 seq = 1;
}

message ReplicationBatch {
  uint64 first_seq = 1;
  // The term every event of the batch was written under, never the sender's
  // current term: a catch-up batch splits at a term boundary, so a standby
  // records each position under its write term.
  uint64 term = 2;
  // No events and no part of a snapshot: the leader's heartbeat, one a
  // second on an idle stream. `first_seq` is then the position after the
  // leader's head and `term` the head's: a standby that applied
  // `first_seq - 1` stands at the head.
  repeated ReplicationEvent events = 3;
  // The standby's backlog was cut, or its `last_applied_seq` is not held
  // under `last_applied_term`: the leader's snapshot follows on this stream
  // in parts (`snapshot`), then the log from the snapshot's place. A standby
  // that re-syncs ends its open WatchWorkers tails with SnapshotRequired:
  // their positions came from the log it dropped.
  bool resync_required = 4;
  // One part of the leader's snapshot; the batch carries no event.
  // `first_seq` is then the position after the snapshot's place and `term`
  // the place's, the same on every part: a standby restored from the
  // snapshot stands at `first_seq - 1`, and the next batch of events starts
  // at `first_seq`.
  ReplicationSnapshot snapshot = 5;
  // The leader's head as the frame was made: the last position its log
  // holds. A standby that applied through it stood at the head then, and
  // its lag's instant moves at such a frame alone: inside a replay, or in
  // the tail a restore leaves, it reads not synced however fast the frames
  // come. 0 states no head (a leader of a build before the field): the
  // frame moves the instant, as every applied frame did.
  uint64 head_seq = 6;
}

// One part of a snapshot a standby is restored from: the leader's rows and
// load rows as one write of its log left them, cut once and sent in parts on
// the stream that then carries the log from that place, so no gap stands
// between a snapshot and what follows it. Rows are paged as a watch's
// snapshot is (WorkerSnapshot: 128 rows or 2 MiB of rows, a first row
// whatever it weighs), the load rows within the same bytes, the rows' parts
// first. A leader of this build sends no load row and a standby reads past
// one: the field stays until the protocol's next break.
// A standby stages the parts and restores at the last one, whole or
// not at all: a stream that ends inside a snapshot leaves its store as it
// was. An empty store is one empty part.
message ReplicationSnapshot {
  // The part's number in its snapshot: zero, then one more each part.
  uint32 part = 1;
  // The snapshot's last part.
  bool last = 2;
  // The membership epoch at the snapshot's place, on every part. A standby
  // restored from the snapshot numbers its next membership change after it,
  // as the leader does.
  uint64 membership_epoch = 3;
  // Each row's `admitted_age_ms` is its age at the part's send.
  repeated WorkerRow workers = 4;
  repeated LoadSample loads = 5;
  // The generation that stands at the leader when the part is sent, with its
  // document, on the snapshot's first part: at the snapshot's place or
  // after it, never before. Unset where the leader holds no document. A
  // standby restored from the snapshot runs the document under this number;
  // the event of the same generation, where it follows, changes nothing.
  GenerationEvent generation = 6;
}

message ReplicationEvent {
  oneof event {
    WorkerEvent membership = 1;
    HealthRow health = 2;
    // A leader of this build sends none. A standby told one by an older
    // leader journals its position alone, as a term's start, and keeps no
    // load row. The case stays until the protocol's next break.
    LoadSample load = 3;
    SessionRow pin = 4;
    LeaseRow reservation = 5;
    GenerationEvent generation = 6;
    IdAssignment ids = 7;
    LeaseEnd lease_end = 8;
    // The first position of a term: the leader's take, journaled before its
    // first write under the term. It changes no row; a standby journals the
    // position. An event with no case set is one the reader's build does not
    // know: a standby never skips it, it leaves the synced state at that
    // position.
    TermStart term_start = 9;
  }
}

// The start of the term its batch is written under.
message TermStart {}

// A generation as the leader applied it (the status, the document the
// gateways receive), so a standby serves GetPolicySpec and RollbackPolicySpec
// and runs it after promotion; a rollback replicates the restored one alike.
// A leader's log keeps the generation's number alone, and the document is
// joined at the send: an event with no document states a generation that
// stood no longer by then. A standby applies nothing for it and journals the
// position; a later event carries what replaced it. A leader states the
// generation that stands again behind the start of each term it takes.
message GenerationEvent {
  SpecStatus status = 1;
  SpecPush document = 2;
}

// A reservation's end, keyed as its row is: the gateway, the lease id
// (LeaseOrigin, with its bounds) and the side (a pair's two sides share an
// id); the standby drops the row at once, never at the lease's term.
message LeaseEnd {
  string gateway_id = 1;
  fixed64 lease_id = 2;
  Side side = 3;
  enum Cause {
    CAUSE_UNSPECIFIED = 0;
    // Completed of its side.
    CAUSE_COMPLETED = 1;
    // Released by the gateway; `reason` says why.
    CAUSE_RELEASED = 2;
    // The stream rule's grace passed without a Completed.
    CAUSE_EXPIRED = 3;
    // An immediate deregistration released the worker's leases.
    CAUSE_WORKER_REMOVED = 4;
  }
  Cause cause = 4;
  Released.Reason reason = 5;
}

message IdAssignment {
  repeated IdEntry entries = 1;
}

message IdEntry {
  fixed64 worker_id = 1;
  string registration_key = 2;
  uint64 incarnation = 3;
  // The position the index interns the worker at.
  uint32 interned = 4;
}
