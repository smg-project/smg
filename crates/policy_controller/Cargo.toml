[package]
name = "smg-policy-controller"
version = "0.1.0"
edition = "2021"
description = "The policy controller: the routing policy engine (a bounded view, a typed decision, a lifecycle, a filter, score and pick framework under one versioned spec) and, in later steps, the standalone controller's store, ingestion, API and election"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
keywords = ["routing", "policy", "load-balancing", "llm"]
categories = ["algorithms"]

[dependencies]
# No workspace crate in the default build: the engine knows nothing about
# its host (a gateway, a controller, a binding). The ingestion drivers below
# the `ingest` feature speak to the engines and are the first to need one.
# The credit tally is read by every deciding thread and replaced whole on
# the rare write (a rank's first dispatch, a membership change): a load
# costs no shared write.
arc-swap = "1.9.1"
parking_lot = { workspace = true }
rustc-hash = "2"
# The spec's JSON schema is generated from its types; serde_json renders it
# as the committed artifact.
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The WebAssembly plugin host (`wasm`): the runtime and one kept instance per
# module per deciding thread. The log lines a plugin writes go through the
# optional tracing declared with the controller's dependencies below; this
# feature turns it on too.
thread_local = { version = "1.1", optional = true }
wasmtime = { workspace = true, optional = true }

# The Kubernetes Lease elector (design 10), behind the `kubernetes` feature:
# the gateway's own kube client stack, pinned to the same release. The
# runtime handle its election thread blocks on is the optional tokio declared
# with the controller's dependencies below; this feature turns it on too.
# Nothing of it is built without the feature.
k8s-openapi = { version = "0.27.0", features = ["v1_33"], optional = true }
kube = { version = "3.0.1", default-features = false, features = ["client", "rustls-tls", "ring"], optional = true }

# The ingestion drivers (the `ingest` feature): the load path over the
# store's ingress traits (the `GetLoads` poll through the engines' gRPC
# clients, the metrics scrape over HTTP) and the load helpers the gateway
# shares with the controller (the row conversion, the scrape parser).
openai-protocol = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["rustls-no-provider"], optional = true }
smg-grpc-client = { workspace = true, optional = true }

# The standalone controller (the `controller` feature): the listeners, the
# health service, the admin endpoints and the binary. Every dependency below
# is optional so a host that embeds the engine (the gateway, a binding)
# builds the crate as it is today, with no server stack.
axum = { workspace = true, optional = true }
clap = { version = "4", features = ["derive", "env"], optional = true }
metrics = { version = "0.24.6", optional = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, optional = true }
# The process TLS crypto provider, installed once before the first listener
# or HTTP client; the gateway, the servicer and the mock worker install the
# same one.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"], optional = true }
tonic = { workspace = true, features = ["tls-ring"], optional = true }
tonic-health = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# The ingestion drivers over the store: the load path (the `GetLoads` poll
# per engine under the store's poll arbitration, the metrics scrape of an
# engine without a servicer) and the load helpers the gateway shares. Off by
# default; the gateway turns it on for the helpers, the controller for the
# drivers.
ingest = [
    "dep:openai-protocol",
    "dep:reqwest",
    "dep:rustls",
    "dep:smg-grpc-client",
    "dep:tokio",
    "dep:tonic",
    "dep:tracing",
]
# The standalone controller: the ingestion drivers, the listeners with their
# scopes, the gRPC health service, the admin endpoints and the binary of the
# package's name. Off by default: the engine alone has no server dependency.
controller = [
    "ingest",
    "dep:axum",
    "dep:clap",
    "dep:metrics",
    "dep:metrics-exporter-prometheus",
    "dep:rustls",
    "dep:tokio",
    "dep:tonic",
    "dep:tonic-health",
    "dep:tracing",
    "dep:tracing-subscriber",
]

# The Kubernetes Lease backend of the elector.
kubernetes = ["dep:k8s-openapi", "dep:kube", "dep:tokio"]

default = ["wasm"]
# The WebAssembly plugin host over the committed `smg:policy` worlds.
wasm = ["dep:wasmtime", "dep:thread_local", "dep:tracing"]

[dev-dependencies]
criterion = "0.8"
# The Kubernetes elector's tests run its client against a service in the
# test's process that plays one Lease, and its three-process cell against
# the same stand-in served over HTTP.
axum = { workspace = true }
http = { workspace = true }
# The load driver's unit tests add the test macro and tokio's paused clock.
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "test-util"] }
# The corpus test reads YAML documents; the gateway reads its spec file with
# the same crate.
serde_yaml = { workspace = true }
# The contract tests (tests/contracts.rs) compile the protocol to a
# descriptor set through protoc and resolve the WebAssembly world; no code
# is generated and nothing at run time reads the files.
prost-build = { version = "0.14.4", default-features = false }
prost-types = { workspace = true }
wit-parser = { version = "0.258.3", default-features = false, features = ["std"] }
# The lease-file tests and bench write under a directory of their own.
tempfile = "3"
# The plugin host's test guests are WebAssembly text in the test sources,
# assembled and wrapped into components of the committed world at test time:
# no binary fixture and no cross target.
wat = "1"
wit-component = { version = "0.258.3", default-features = false }
# The controller's mutual-TLS test mints its authority, server and client
# certificates when it runs; no certificate file lives in the repository.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The admin router's tests drive it with `oneshot`, no socket.
# The Kubernetes elector's stand-in is a `service_fn` of the same crate.
tower = { version = "0.5", default-features = false, features = ["util"] }
# The load driver's tests poll the mock worker's gRPC engines in-process:
# the same `GetLoads` answers the gateway's tests read.
mock-worker = { path = "../mock_worker" }

[[bin]]
name = "smg-policy-controller"
path = "src/main.rs"
required-features = ["controller"]

[[test]]
name = "binary"
required-features = ["controller"]

[[test]]
name = "controller"
required-features = ["controller"]

[[test]]
name = "elector_k8s_cell"
required-features = ["kubernetes"]

[[test]]
name = "ingest"
required-features = ["controller"]

[[bench]]
name = "decision"
harness = false

[[bench]]
name = "affinity"
harness = false

[[bench]]
name = "elector"
harness = false

[[bench]]
name = "wasm_plugin"
harness = false
required-features = ["wasm"]

[[bench]]
name = "epd"
harness = false

[[bench]]
name = "contention"
harness = false

[[bench]]
name = "store"
harness = false

[lints]
workspace = true
