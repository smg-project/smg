[package]
name = "smg-mesh"
version = "1.4.4"
edition = "2021"
description = "Mesh gossip protocol and distributed state synchronization for Shepherd Model Gateway"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Tony Lu <tonyluj@gmail.com>",
]
keywords = ["mesh", "gossip", "crdt", "distributed", "cluster"]
categories = ["network-programming", "data-structures"]

[dependencies]
# Workspace dependencies
anyhow.workspace = true
blake3.workspace = true
async-trait.workspace = true
dashmap.workspace = true
http.workspace = true
parking_lot.workspace = true
rand.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full", "sync", "time"] }
tracing.workspace = true

# Mesh-specific dependencies
bincode = "1.3"
bytes = "1"
futures.workspace = true
metrics = "0.24.6"
prost.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2"
tokio-stream = "0.1"
tonic = { workspace = true, features = ["tls-ring"] }
# The generated gossip service decodes with its codec.
tonic-prost.workspace = true
uuid = { workspace = true, features = ["v4"] }

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
openssl = "0.10.81"
tempfile = "3"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
