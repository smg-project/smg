syntax = "proto3";

package sglang.grpc.scheduler;

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";
import "common.proto";

// Service definition for SGLang scheduler communication
// This protocol bridges the Rust router and Python scheduler
service SglangScheduler {
  // Submit a generation request (supports streaming)
  rpc Generate(GenerateRequest) returns (stream GenerateResponse);

  // Submit an embedding request
  rpc Embed(EmbedRequest) returns (EmbedResponse);

  // Health check and metrics
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Abort a running request
  rpc Abort(AbortRequest) returns (AbortResponse);

  // Get model information
  rpc GetModelInfo(GetModelInfoRequest) returns (GetModelInfoResponse);

  // Get server information
  rpc GetServerInfo(GetServerInfoRequest) returns (GetServerInfoResponse);

  // Get comprehensive load metrics
  rpc GetLoads(GetLoadsRequest) returns (GetLoadsResponse);

  // Flush the KV cache on all scheduler processes
  rpc FlushCache(smg.grpc.common.FlushCacheRequest) returns (smg.grpc.common.FlushCacheResponse);

  // Start the profiler on all scheduler processes
  rpc StartProfile(smg.grpc.common.StartProfileRequest) returns (smg.grpc.common.ProfileResponse);

  // Stop the profiler and export traces
  rpc StopProfile(smg.grpc.common.StopProfileRequest) returns (smg.grpc.common.ProfileResponse);

  // Get tokenizer artifacts for remote construction
  rpc GetTokenizer(smg.grpc.common.GetTokenizerRequest) returns (stream smg.grpc.common.GetTokenizerChunk);

  // Subscribe to KV cache events (server-streaming)
  rpc SubscribeKvEvents(smg.grpc.common.SubscribeKvEventsRequest)
      returns (stream smg.grpc.common.KvEventBatch);

  // Load a LoRA adapter into the engine (weights from local disk to CPU DRAM)
  rpc LoadLoRAAdapter(LoadLoRAAdapterRequest) returns (LoadLoRAAdapterResponse);

  // Unload a LoRA adapter from the engine
  rpc UnloadLoRAAdapter(UnloadLoRAAdapterRequest) returns (UnloadLoRAAdapterResponse);

  // List the LoRA adapters currently loaded in the engine, with the
  // metadata supplied at load time. Read-only: lets a client reconcile
  // its view of loaded adapters (e.g. after a restart) without issuing
  // a mutating load/unload call.
  rpc ListLoadedLoRAAdapters(ListLoadedLoRAAdaptersRequest)
      returns (ListLoadedLoRAAdaptersResponse);
}

// =====================
// Common Types
// =====================

// Sampling parameters matching SGLang's SamplingParams
//
// IMPORTANT: Do not use SamplingParams::default() directly!
// The proto3 defaults (0 for numeric fields) do NOT match the semantic defaults
// (temperature=1.0, top_p=1.0, top_k=-1, etc.). Always construct with explicit values
// or use the conversion functions in sglang_scheduler.rs / grpc_server.py.
message SamplingParams {
  float temperature = 1;
  float top_p = 2;
  int32 top_k = 3;
  float min_p = 4;
  float frequency_penalty = 5;
  float presence_penalty = 6;
  float repetition_penalty = 7;

  optional uint32 max_new_tokens = 8;
  repeated string stop = 9;
  repeated uint32 stop_token_ids = 10;
  bool skip_special_tokens = 11;
  bool spaces_between_special_tokens = 12;

  // Structured generation
  oneof constraint {
    string regex = 13;
    string json_schema = 14;
    string ebnf_grammar = 15;
    string structural_tag = 16;
  }

  // Speculative decoding
  uint32 n = 17;  // Number of samples

  // Additional parameters
  uint32 min_new_tokens = 18;
  bool ignore_eos = 19;
  bool no_stop_trim = 20;
  optional int32 stream_interval = 21;
  map<string, float> logit_bias = 22;

  // Custom parameters for extensibility
  google.protobuf.Struct custom_params = 23;
}


// Disaggregated serving parameters
message DisaggregatedParams {
  string bootstrap_host = 1;
  int32 bootstrap_port = 2;
  int32 bootstrap_room = 3;
}

// =====================
// Generate Request
// =====================

message GenerateRequest {
  string request_id = 1;

  // Input must be tokenized (no raw text)
  TokenizedInput tokenized = 2;

  // Multimodal inputs
  MultimodalInputs mm_inputs = 3;

  // Generation parameters
  SamplingParams sampling_params = 4;

  // Return options
  bool return_logprob = 5;
  int32 logprob_start_len = 6;
  int32 top_logprobs_num = 7;
  repeated uint32 token_ids_logprob = 8;
  bool return_hidden_states = 9;

  // For disaggregated serving
  DisaggregatedParams disaggregated_params = 10;

  // Custom logit processor (serialized)
  string custom_logit_processor = 11;

  // Request metadata
  google.protobuf.Timestamp timestamp = 12;
  bool log_metrics = 13;

  // Input embeddings (alternative to text/tokens)
  repeated float input_embeds = 14;

  // LoRA adapter ID (if pre-loaded)
  string lora_id = 15;

  // Data parallel routing
  int32 data_parallel_rank = 16;

  // Whether client wants streaming response
  bool stream = 17;

  // Ask SGLang scheduler to count reasoning tokens.
  // Keep false unless the request explicitly enables reasoning/thinking.
  bool require_reasoning = 18;
}

message TokenizedInput {
  string original_text = 1;  // For reference
  repeated uint32 input_ids = 2;
}

// A typed tensor: raw little-endian bytes + shape + dtype.
// Replaces the base64-in-Struct hack for binary data over gRPC.
message TensorData {
  bytes data = 1;              // Raw little-endian bytes (f32/i64/u32)
  repeated uint32 shape = 2;   // Dimension sizes
  string dtype = 3;            // "float32", "int64", "uint32"
}

message MultimodalInputs {
  repeated string image_urls = 1;
  repeated string video_urls = 2;
  repeated string audio_urls = 3;

  // Preprocessed pixel values tensor
  TensorData pixel_values = 4;

  // Raw image/video/audio bytes
  repeated bytes image_data = 5;
  repeated bytes video_data = 6;
  repeated bytes audio_data = 7;

  // Modality metadata
  repeated string modalities = 8;

  // Model-specific tensors (aspect_ratios, image_grid_thw, etc.)
  map<string, TensorData> model_specific_tensors = 9;

  // Image token ID for pad_input_ids_func
  optional uint32 im_token_id = 10;

  // Placeholder offsets: where each image's tokens are in input_ids
  repeated PlaceholderRange mm_placeholders = 11;
}

message PlaceholderRange {
  uint32 offset = 1;
  uint32 length = 2;
}

// =====================
// Generate Response
// =====================

message GenerateResponse {
  string request_id = 1;

  // Response type
  reserved 4;  // was GenerateError — removed, errors use gRPC status

  oneof response {
    GenerateStreamChunk chunk = 2;
    GenerateComplete complete = 3;
  }
}

message GenerateStreamChunk {
  // Generated tokens (incremental chunk)
  repeated uint32 token_ids = 1;

  // Cumulative counts
  uint32 prompt_tokens = 2;
  uint32 completion_tokens = 3;
  uint32 cached_tokens = 4;
  uint32 reasoning_tokens = 9;

  // Output logprobs (if requested) - incremental for streaming
  OutputLogProbs output_logprobs = 5;

  // Hidden states (if requested)
  repeated float hidden_states = 6;

  // Input logprobs (if requested) - only in first chunk
  InputLogProbs input_logprobs = 7;

  // Index for ordering when n>1 (for parallel request multiplexing)
  uint32 index = 8;
}

message GenerateComplete {
  // Final output
  repeated uint32 output_ids = 1;

  // Finish reason as OpenAI-compatible string ("stop", "length", "abort")
  string finish_reason = 2;

  // Token usage counts
  uint32 prompt_tokens = 3;
  uint32 completion_tokens = 4;
  uint32 cached_tokens = 5;
  uint32 reasoning_tokens = 12;

  // Output logprobs if requested (cumulative)
  OutputLogProbs output_logprobs = 6;

  // All hidden states if requested
  repeated HiddenStates all_hidden_states = 7;

  // Matched stop information (for stop sequences)
  oneof matched_stop {
    uint32 matched_token_id = 8;
    string matched_stop_str = 9;
  }

  // Input logprobs if requested (for prompt tokens)
  InputLogProbs input_logprobs = 10;

  // Index for ordering when n>1 (for parallel request multiplexing)
  uint32 index = 11;

  uint32 spec_accepted_tokens = 13;
  uint32 spec_draft_tokens = 14;
}

// Output logprobs - all values are present (no None)
message OutputLogProbs {
  repeated float token_logprobs = 1;
  repeated uint32 token_ids = 2;

  // Top logprobs at each position
  repeated TopLogProbs top_logprobs = 3;
}

// Input logprobs - first token has no logprob (None)
message InputLogProbs {
  repeated InputTokenLogProb token_logprobs = 1;
  repeated uint32 token_ids = 2;

  // Top logprobs at each position
  repeated TopLogProbs top_logprobs = 3;
}

// Wrapper to represent optional logprob (first input token has no logprob)
message InputTokenLogProb {
  optional float value = 1;
}

message TopLogProbs {
  repeated float values = 1;
  repeated uint32 token_ids = 2;
}

message HiddenStates {
  repeated float values = 1;
  int32 layer = 2;
  int32 position = 3;
}

// =====================
// Embedding Request
// =====================

message EmbedRequest {
  string request_id = 1;

  // Input must be tokenized (no raw text)
  TokenizedInput tokenized = 2;

  // Multimodal inputs
  MultimodalInputs mm_inputs = 4;

  // Dummy sampling params for compatibility
  // EmbedRequest doesn't use sampling_params
  SamplingParams sampling_params = 5;

  reserved 6;  // was log_metrics — removed, SGLang-specific concern

  // Token type IDs for models that require them
  repeated int32 token_type_ids = 7;

  // Data parallel routing
  int32 data_parallel_rank = 8;

  // For cross-encoder requests
  bool is_cross_encoder = 9;
  repeated string texts = 10;  // For cross-encoder batch
}

message EmbedResponse {
  // Fields 1-3 reserved: old layout was request_id(1), oneof{EmbedComplete(2), EmbedError(3)}
  reserved 1, 2, 3;

  // Flat response — no oneof, errors via gRPC status
  uint32 embedding_dim = 4;
  repeated float embedding = 5;
  uint32 prompt_tokens = 6;
}

// =====================
// Management Operations
// =====================

message HealthCheckRequest {}

message HealthCheckResponse {
  bool healthy = 1;
  string message = 2;
}

message AbortRequest {
  string request_id = 1;
  string reason = 2;
}

message AbortResponse {
  bool success = 1;
  string message = 2;
}


// =====================
// LoRA Adapter
// =====================

// Load a LoRA adapter into the engine (weights read from a local
// directory into CPU DRAM; GPU residency is managed by the engine).
message LoadLoRAAdapterRequest {
  // Engine-side adapter name (human-readable identifier).
  string lora_name = 1;
  // Local directory containing the adapter weights. Must be readable
  // by the engine process (shared volume).
  string lora_path = 2;
  // Pin the adapter in the engine's GPU buffer pool (never evicted).
  bool pinned = 3;
  // Unique adapter id minted by the caller. Required: the scheduler-direct
  // path has no TokenizerManager to auto-generate one, and inference
  // requests reference the adapter by this id (GenerateRequest.lora_id).
  string lora_id = 4;
}

message LoadLoRAAdapterResponse {
  bool success = 1;
  // Status or error description; empty on success.
  string message = 2;
  // Full set of caller-minted adapter ids loaded in the engine after
  // this operation (engine-truth snapshot; see ListLoadedLoRAAdapters).
  repeated string loaded_lora_ids = 3;
}

// Unload a LoRA adapter from the engine (frees CPU DRAM; the engine
// reclaims any GPU slot on its own).
message UnloadLoRAAdapterRequest {
  // Human-readable adapter name given at load time. Required — the
  // primary selector, mirroring the HTTP unload payload.
  string lora_name = 1;
  // The caller-minted id the adapter was loaded under (see
  // LoadLoRAAdapterRequest.lora_id). Complements lora_name rather than
  // replacing it: both refer to the same adapter and are supplied
  // together.
  string lora_id = 2;
}

message UnloadLoRAAdapterResponse {
  bool success = 1;
  // Status or error description; empty on success.
  string message = 2;
  // Full set of caller-minted adapter ids still loaded after this
  // operation (engine-truth snapshot; see ListLoadedLoRAAdapters).
  repeated string loaded_lora_ids = 3;
}

// List every LoRA adapter currently loaded in the engine, regardless
// of how it was loaded — via LoadLoRAAdapter or preloaded at startup
// (e.g. --lora-paths).
message ListLoadedLoRAAdaptersRequest {}

// One loaded adapter, echoing the metadata supplied at load time —
// the same per-adapter fields the HTTP surface exposes via /v1/models.
message LoadedLoRAAdapter {
  // Caller-minted for adapters loaded via LoadLoRAAdapter;
  // engine-assigned for adapters loaded outside this API. Either way,
  // this is the id inference requests reference
  // (GenerateRequest.lora_id) and UnloadLoRAAdapter accepts.
  string lora_id = 1;
  string lora_name = 2;
  string lora_path = 3;
  bool pinned = 4;
}

message ListLoadedLoRAAdaptersResponse {
  repeated LoadedLoRAAdapter loaded_adapters = 1;
}

// =====================
// Additional Operations (Future)
// =====================

// Update weights
message UpdateWeightsRequest {
  oneof source {
    string disk_path = 1;
    bytes tensor_data = 2;
    string remote_url = 3;
  }
  string weight_name = 4;
}

message UpdateWeightsResponse {
  bool success = 1;
  string message = 2;
}

// Get internal state for debugging
message GetInternalStateRequest {
  repeated string state_keys = 1;
}

message GetInternalStateResponse {
  google.protobuf.Struct state = 1;
}

// Set internal state for testing
message SetInternalStateRequest {
  google.protobuf.Struct state = 1;
}

message SetInternalStateResponse {
  bool success = 1;
  string message = 2;
}

// =====================
// Model and Server Info
// =====================

// Get model information
message GetModelInfoRequest {}

message GetModelInfoResponse {
  string model_path = 1;
  string tokenizer_path = 2;
  bool is_generation = 3;
  string preferred_sampling_params = 4;  // JSON string or empty
  string weight_version = 5;
  string served_model_name = 6;
  int32 max_context_length = 7;
  int32 vocab_size = 8;
  bool supports_vision = 9;
  string model_type = 10;
  repeated int32 eos_token_ids = 11;
  int32 pad_token_id = 12;
  int32 bos_token_id = 13;
  int32 max_req_input_len = 14;
  repeated string architectures = 15;

  // Classification model support (from HuggingFace config.json)
  // id2label maps class indices to label names, e.g., {"0": "negative", "1": "positive"}
  string id2label_json = 16;
  // Number of classification labels (0 if not a classifier)
  int32 num_labels = 17;

  // Resolved sampling defaults from --sampling-defaults + --preferred-sampling-params.
  // JSON dict, e.g. '{"temperature": 0.6, "top_p": 0.9}'. Empty = no overrides.
  string default_sampling_params_json = 20;
}

// Get server information
message GetServerInfoRequest {}

message GetServerInfoResponse {
  // Server configuration (as structured data)
  google.protobuf.Struct server_args = 1;

  // Scheduler metrics (from scheduler initialization)
  google.protobuf.Struct scheduler_info = 2;

  // Runtime state
  int32 active_requests = 3;
  bool is_paused = 4;
  double last_receive_timestamp = 5;
  double uptime_seconds = 6;

  // Version info
  string sglang_version = 7;

  // Server metadata
  string server_type = 8;  // "grpc"
  google.protobuf.Timestamp start_time = 9;
  int32 max_total_num_tokens = 10;

  // Note: internal_states not provided in gRPC mode
  // Scheduler-side metrics (memory usage, throughput) require
  // bidirectional communicator infrastructure not available in gRPC.
  // Use HTTP /get_server_info if scheduler internal state is needed.
}

// =====================
// Load Metrics (v1/loads)
// =====================

message GetLoadsRequest {
  // Optional: filter to specific DP rank
  optional int32 dp_rank = 1;

  // Sections to include: core, memory, spec, lora, disagg, queues, all
  repeated string include = 2;
}

message GetLoadsResponse {
  // ISO 8601 timestamp
  string timestamp = 1;

  // SGLang version
  string version = 2;

  // Number of DP ranks
  int32 dp_rank_count = 3;

  // Per-DP-rank load metrics
  repeated SchedulerLoad loads = 4;

  // Aggregate metrics across all DP ranks
  AggregateMetrics aggregate = 5;
}

message SchedulerLoad {
  int32 dp_rank = 1;

  // Core metrics (always included)
  int32 num_running_reqs = 2;
  int32 num_waiting_reqs = 3;
  int32 num_total_reqs = 4;
  int32 num_used_tokens = 5;
  int32 max_total_num_tokens = 6;
  double token_usage = 7;
  double gen_throughput = 8;
  double cache_hit_rate = 9;
  double utilization = 10;
  int32 max_running_requests = 11;

  // Queued token-work: waiting-queue tokens not yet served from cache
  // (SGLang num_waiting_uncached_tokens). Field 17 is intentionally out of
  // order — appended after the optional-section field numbers to preserve
  // wire compatibility with existing readers.
  int32 num_waiting_uncached_tokens = 17;

  // Optional sections
  optional MemoryMetrics memory = 12;
  optional SpeculativeMetrics speculative = 13;
  optional LoRAMetrics lora = 14;
  optional DisaggregationMetrics disaggregation = 15;
  optional QueueMetrics queues = 16;
}

message MemoryMetrics {
  double weight_gb = 1;
  double kv_cache_gb = 2;
  double graph_gb = 3;
  int32 token_capacity = 4;
}

message SpeculativeMetrics {
  double accept_length = 1;
  double accept_rate = 2;
}

message LoRAMetrics {
  int32 slots_used = 1;
  int32 slots_total = 2;
  double utilization = 3;
}

message DisaggregationMetrics {
  string mode = 1;  // "prefill", "decode", or "null"
  int32 prefill_prealloc_queue_reqs = 2;
  int32 prefill_inflight_queue_reqs = 3;
  int32 decode_prealloc_queue_reqs = 4;
  int32 decode_transfer_queue_reqs = 5;
  int32 decode_retracted_queue_reqs = 6;
  double kv_transfer_speed_gb_s = 7;
  double kv_transfer_latency_ms = 8;
}

message QueueMetrics {
  int32 waiting = 1;
  int32 grammar = 2;
  int32 paused = 3;
  int32 retracted = 4;
}

message AggregateMetrics {
  int32 total_running_reqs = 1;
  int32 total_waiting_reqs = 2;
  int32 total_reqs = 3;
  double avg_token_usage = 4;
  double avg_throughput = 5;
  double avg_utilization = 6;
}
