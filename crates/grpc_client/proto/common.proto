syntax = "proto3";
package smg.grpc.common;

// =====================
// Tokenizer
// =====================

message GetTokenizerRequest {}

message GetTokenizerChunk {
  bytes data = 1;       // Raw zip bytes (concatenate all chunks)
  string sha256 = 2;    // SHA-256 fingerprint; set on final chunk only, empty on previous
}

// =====================
// KV Cache Events
// =====================

message SubscribeKvEventsRequest {
  // Resume from this sequence number (0 = start from current state).
  uint64 start_sequence_number = 1;
}

message KvEventBatch {
  uint64 sequence_number = 1;
  double timestamp = 2;
  repeated KvCacheEvent events = 3;
  optional int32 dp_rank = 4;
  // Group metadata is learned from received events when the engine provides it.
  // Legacy events remain unchanged when unset.
  bool group_events_enabled = 5;
  repeated KvGroupEvent group_events = 6;
}

// GPU-local reports, retaining opaque native keys and the complete token span.
// Sparse stores need not contain one hash per token block; no offsets are guessed.
message KvGroupEvent {
  enum Operation {
    INVALID = 0;
    STORE = 1;
    REMOVE = 2;
    CLEAR = 3;
  }
  Operation operation = 1;
  uint32 group_id = 2;
  repeated bytes block_hashes = 3;
  bytes parent_block_hash = 4;
  repeated uint32 token_ids = 5;
  uint32 block_size = 6;
  string kind = 7;
  uint32 sliding_window = 8;
  // False when LoRA or extra hash inputs prevent token-only matching.
  bool tokens_matchable = 9;
}

message KvCacheEvent {
  uint64 event_id = 1;
  oneof data {
    KvBlocksStored stored = 2;
    KvBlocksRemoved removed = 3;
    KvCacheCleared cleared = 4;
  }
}

message KvBlocksStored {
  repeated KvBlock blocks = 1;
  optional int64 parent_block_hash = 2;
}

message KvBlock {
  int64 block_hash = 1;
  repeated uint32 token_ids = 2;
  int32 block_size = 3;
  optional int64 lora_id = 4;
  optional int32 cache_level = 5;
}

message KvBlocksRemoved {
  repeated int64 block_hashes = 1;
  optional int32 cache_level = 2;
}

message KvCacheCleared {}

// =====================
// Admin Operations
// =====================

message FlushCacheRequest {
  // Seconds to wait for the scheduler to go idle before flushing.
  // 0 = flush immediately (fails if requests are in flight).
  float timeout_s = 1;
}

message FlushCacheResponse {
  bool success = 1;
  string message = 2;
}

message StartProfileRequest {
  // Directory where profiler traces are written (backend default if unset).
  optional string output_dir = 1;
  // Forward step at which profiling starts (immediately if unset).
  optional int32 start_step = 2;
  // Number of forward steps to profile (until StopProfile if unset).
  optional int32 num_steps = 3;
  // Profiler activities, e.g. "CPU", "GPU", "MEM". Backend default if empty.
  repeated string activities = 4;
  optional bool with_stack = 5;
  optional bool record_shapes = 6;
  bool profile_by_stage = 7;
}

message StopProfileRequest {}

message ProfileResponse {
  bool success = 1;
  string message = 2;
}

// =====================
// Multimodal Tensor Transport
// =====================
//
// Out-of-band transport descriptors for large multimodal tensor payloads,
// shared by every engine's TensorData. The raw tensor bytes live in exactly
// one transport; the engine's TensorData carries shape and dtype.

message ShmHandle {
  string name = 1;
  uint64 offset = 2;
  uint64 nbytes = 3;
  // Producer/lifetime owner. Used by implementations to coordinate cleanup.
  string owner_id = 4;
}

message RemoteTensorHandle {
  // Examples: "nixl", "ucx", "object_store".
  string transport = 1;
  bytes descriptor = 2;
  uint64 nbytes = 3;
}

// Multimodal input modality, shared across engine protos so the servicers can
// route each request to the matching encoder (image vs video vs audio).
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  IMAGE = 1;
  AUDIO = 2;
  VIDEO = 3;
}
