[package]
name = "smg-grpc-client"
version = "1.17.0"
edition = "2021"
description = "gRPC clients for vLLM, TensorRT-LLM, MLX, TokenSpeed, and SGLang backends"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
]
keywords = ["grpc", "vllm", "tokenspeed", "llm", "sglang"]
categories = ["api-bindings"]

[lib]
name = "smg_grpc_client"

[dependencies]
# Workspace dependencies
openai-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing.workspace = true

# gRPC dependencies
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true

# Async/concurrency
futures.workspace = true

# The HTTP/2 layer the channel runs on (`channel`): the connection, its
# streams and pings; also the type of the transport fault a `tonic::Status`
# made of one carries in its source chain (`channel::is_transport_failure`),
# and the raw peer of the channel tests.
h2 = "0.4.19"
# The HTTP body frame the channel hands tonic for a response.
http-body = "1"

# Archive validation
sha2 = "0.11"
zip = "9.0"
tempfile = "3.27"

[build-dependencies]
tonic-prost-build = "0.14.6"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# Mock-server harness for the abort-on-drop behavioral tests.
tokio-stream = { version = "0.1", features = ["net"] }

[lints]
workspace = true
