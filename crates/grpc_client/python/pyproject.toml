# grpcio-tools is capped at 1.81.x so the bundled protoc emits protobuf-6
# gencode: 1.82.x emits protobuf-7 gencode, which the protobuf 6.x runtime
# (pinned via grpcio-health-checking/reflection in ci_install_e2e_deps.sh)
# refuses to load. The runtime floors under [project] follow from that cap:
# every generated *_pb2.py checks at import that the protobuf runtime is at
# least the protobuf it was generated with (6.33.5, from grpcio-tools 1.81.x;
# an older runtime raises VersionError at import, a newer one loads it),
# and every *_pb2_grpc.py refuses a grpcio older than the grpcio-tools that
# wrote it (1.81.1). tests/test_declared_floors.py fails when the floors and
# the generated modules drift apart. Drop the cap once the whole stack moves
# to protobuf 7, and move the floors with it.
[build-system]
requires = ["setuptools>=77.0", "grpcio-tools>=1.81.1,<1.82"]
build-backend = "setuptools.build_meta"

[project]
name = "smg-grpc-proto"
version = "0.4.28"
description = "SMG gRPC proto definitions for vLLM, TRT-LLM, MLX, TokenSpeed, and SGLang"
requires-python = ">=3.10"
dependencies = [
    "grpcio>=1.81.1",
    "protobuf>=6.33.5",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Chang Su", email = "mckvtl@gmail.com"},
    {name = "Simo Lin", email = "linsimo.mark@gmail.com"},
    {name = "Keyang Ru", email = "rukeyang@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/smg-project/smg"
Repository = "https://github.com/smg-project/smg"

[tool.setuptools.packages.find]
where = ["."]
include = ["smg_grpc_proto*"]

[tool.setuptools.package-data]
smg_grpc_proto = ["proto/*.proto", "generated/*.py", "generated/*.pyi"]
