[package]
name = "kv-index"
version = "1.6.0"
edition = "2021"
description = "Radix tree implementations for prefix matching and cache-aware routing"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
    "Keyang Ru <rukeyang@gmail.com>",
]
keywords = ["radix-tree", "prefix-matching", "cache-routing", "llm"]
categories = ["data-structures", "caching"]

[dependencies]
bincode = "1.3"
blake3 = { workspace = true }
crossbeam-queue = "0.3"
crossbeam-utils = "0.8"
dashmap = { workspace = true }
once_cell = "1.21.4"
parking_lot = { workspace = true }
rustc-hash = "2.1.2"
serde = { version = "1", features = ["derive"] }
tracing = { workspace = true }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[features]

[dev-dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.8", features = ["html_reports"] }
rand = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# mooncake_replay: CPU pinning and absolute monotonic sleeps, and one allocator for every
# backend the harness measures.
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "match_insert"
harness = false

[[bench]]
name = "mooncake_replay"
harness = false

[[bench]]
name = "churn"
harness = false

[lints]
workspace = true
