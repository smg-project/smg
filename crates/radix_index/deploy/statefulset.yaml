# Reference deployment: 2-replica radix index behind one stable Service
# name per replica (headless). Gateways point --kv-indexer-url at ONE
# replica address (or a per-zone one); replicas relay to each other and
# a restarting replica bootstraps from its sibling before going ready.
#
# Sizing note: state is hash-only (no tokens); production-scale fleets
# measured ~275 B/entry in-process. Set memory limits from your fleet's
# total block count, and default-capacity-blocks from engine KV size /
# page size so inferred holders stay bounded.
apiVersion: v1
kind: Service
metadata:
  name: radix-index
spec:
  clusterIP: None
  selector:
    app: radix-index
  ports:
    - name: grpc
      port: 40000
    - name: metrics
      port: 40100
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: radix-index
spec:
  serviceName: radix-index
  replicas: 2
  selector:
    matchLabels:
      app: radix-index
  template:
    metadata:
      labels:
        app: radix-index
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: radix-index
          image: REGISTRY/radix-index-service:VERSION
          # Peer and bootstrap addresses are PER-ORDINAL, and Kubernetes
          # has no downward-API expression for "the other ordinal", so
          # the entrypoint derives both from the pod's own name. One
          # shared static address would be wrong for at least one pod,
          # and the self-reference is the dangerous case: the gRPC
          # listener is not up yet when the bootstrap pull runs, so the
          # connect is refused, the server treats a refused bootstrap as
          # a cold start, and /readyz goes green on an EMPTY index —
          # indistinguishable from a sibling that legitimately had
          # nothing to hand over. Self-relay is excluded for the same
          # reason it is pointless: a pod re-applying its own accepted
          # writes. `exec` keeps the server as PID 1 so SIGTERM still
          # reaches it and terminationGracePeriodSeconds means something.
          command: ["/bin/sh", "-c"]
          args:
            - |
              ORDINAL="${POD_NAME##*-}"
              PEERS=""
              i=0
              while [ "$i" -lt "$REPLICAS" ]; do
                if [ "$i" -ne "$ORDINAL" ]; then
                  PEERS="${PEERS:+$PEERS,}http://radix-index-$i.radix-index:40000"
                fi
                i=$((i + 1))
              done
              set -- --bind=0.0.0.0 --port=40000 --metrics-port=40100 \
                     --inferred-ttl-secs=180
              # Bootstrap from the first sibling, never from self. At
              # replicas: 1 there is no sibling, so both flags are
              # omitted and the cold start is the honest answer.
              if [ -n "$PEERS" ]; then
                set -- "$@" --peers="$PEERS" --bootstrap-from="${PEERS%%,*}"
              fi
              exec radix-index-service "$@"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # MUST match spec.replicas: the entrypoint enumerates
            # ordinals from it. Too low and the highest pods are never
            # relayed to; too high and every pod wastes connects on a
            # hostname that does not resolve.
            - name: REPLICAS
              value: "2"
          ports:
            - name: grpc
              containerPort: 40000
            - name: metrics
              containerPort: 40100
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 64Gi
---
# Ingress isolation. Both verbs are UNAUTHENTICATED, and with no policy
# selecting these pods Kubernetes allows ingress from every pod in the
# cluster: Publish mutates placement state, so anything on the network
# can point every query at a worker holding nothing, and Pull streams
# the whole index — every model, holder and prompt-chain hash — to any
# caller that asks. This needs a NetworkPolicy-enforcing CNI; on a CNI
# that ignores NetworkPolicy the object applies cleanly and enforces
# nothing, so verify rather than assume. Ingress only, on purpose: the
# relay and the bootstrap pull dial out to siblings, and a half-written
# egress rule fails into exactly the silent cold start the per-ordinal
# bootstrap above exists to prevent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: radix-index
spec:
  podSelector:
    matchLabels:
      app: radix-index
  policyTypes:
    - Ingress
  ingress:
    # gRPC: the gateway queries and publishes placements, the bridge
    # publishes the event feed, and siblings relay + bootstrap-Pull from
    # each other. These caller labels are this reference's placeholders,
    # like REGISTRY/VERSION above — match them to whatever your gateway
    # and bridge deployments actually set, or the index answers nobody.
    - from:
        - podSelector:
            matchLabels:
              app: smg-router
        - podSelector:
            matchLabels:
              app: radix-index-bridge
        - podSelector:
            matchLabels:
              app: radix-index
      ports:
        - port: 40000
    # Admin plane. Kubelet probes /readyz and /healthz from the NODE, not
    # from a pod, so they do not need this rule and stay green without
    # it — which is the trap: drop this and the pods look healthy while
    # the scrape dies, taking the anti-entropy and capacity-cut counters
    # with it, the only signals that replicas are diverging.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 40100
