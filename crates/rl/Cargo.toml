[package]
name = "smg-rl"
version = "0.1.0"
edition = "2021"
description = "RL control plane for SMG: worker discovery, engine-route passthrough, and fan-out"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
publish = false

[lib]
name = "smg_rl"

[dependencies]
openai-protocol.workspace = true
axum = { workspace = true, features = ["macros"] }
http.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
futures.workspace = true
tracing.workspace = true
thiserror.workspace = true
metrics = "0.24.6"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
