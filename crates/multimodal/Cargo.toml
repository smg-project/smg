[package]
name = "llm-multimodal"
version = "1.16.0"
edition = "2021"
description = "Multimodal processing for vision and other modalities"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
]
keywords = ["vision", "multimodal", "image-processing", "llm"]
categories = ["multimedia::images", "science"]

[lib]
name = "llm_multimodal"

[features]
default = ["hf-hub"]
# Downloads model config files from the Hugging Face Hub (`hub`). Consumers that
# resolve model files themselves can opt out with `default-features = false`.
hf-hub = ["dep:hf-hub"]
opencv-video = ["dep:opencv"]

[dependencies]
# Not used directly: constrains resolution. zune-core 0.5.2 breaks
# zune-jpeg 0.5.15's compile (its no-op log macros stop expanding to
# expressions), and zune-jpeg rides in via `image`. Without this pin any
# fresh resolve — every CI run — fails. Drop once a fixed zune-jpeg ships.
zune-core = "=0.5.3"
base64 = "0.23"
hf-hub = { version = "0.5.0", default-features = false, features = ["tokio", "rustls-tls"], optional = true }
bytes = { workspace = true, features = ["serde"] }
fast_image_resize = { version = "6.0.0", features = ["image"] }
# The image containers the crate decodes. AVIF is not among them: its decoder
# is a native library, and such a file is refused with a typed error that
# names the format.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
libloading = "0.8"
ndarray = "0.17"
once_cell = "1.21.4"
rayon = "1.12"
rustfft = "6.4"
symphonia = { version = "0.6", default-features = false, features = ["all"] }
opencv = { version = "0.99.0", default-features = false, features = ["clang-runtime", "imgproc", "videoio"], optional = true }
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile = "3.27"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "fs", "io-util", "net", "rt-multi-thread", "process", "time"] }
tracing.workspace = true
url = "2.5.8"
futures.workspace = true

# Workspace crates
anyhow.workspace = true
blake3.workspace = true

# The x86-64 vector paths: `multiversion` dispatches a function to its
# feature-specific clone from safe code, and `bytemuck` moves vector words in
# and out of byte arrays without pointers, so the kernels carry no `unsafe`.
[target.'cfg(target_arch = "x86_64")'.dependencies]
bytemuck = { version = "1.25", features = ["must_cast"] }
multiversion = "0.9"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
http.workspace = true
# The reqwest hf-hub binds: the hub tests build the Hub's answers to a file request with it.
reqwest-hub = { package = "reqwest", version = "0.12", default-features = false }
# The golden tests read `.npz` fixtures: a zip archive whose members are the arrays as `.npy` files.
npyz = "0.9"
zip = "9.0"
# The dump example for bellwether's multimodal fixtures digests its artifacts with SHA-256, as the fixtures do.
sha2 = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# The wire benchmark measures the process's CPU time.
rustix = { version = "1", default-features = false, features = ["time"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# The baseline harness runs the gateway's allocator (jemalloc with the gateway's options), so its cells read the
# page-return policy production runs, not the system allocator's. Guarded like the gateway's own edge, and built
# with the statistics the `smg` executable builds it with.
[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dev-dependencies]
tikv-jemallocator = { workspace = true, features = ["stats"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

# The dump example for bellwether's multimodal fixtures carries unit tests of its own (`cargo test --example bellwether_dump`).
[[example]]
name = "bellwether_dump"
test = true

[[bench]]
name = "image_preprocess"
harness = false

[[bench]]
name = "minimax_m3_preprocess"
harness = false

[lints]
workspace = true

[[bench]]
name = "minimax_m3_concurrency"
harness = false

[[bench]]
name = "pixel_cache_hit"
harness = false

[[bench]]
name = "audio_clip"
harness = false

[[bench]]
name = "audio_preprocess"
harness = false
