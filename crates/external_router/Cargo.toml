[package]
name = "smg-external-router"
version = "0.1.0"
edition = "2021"
description = "Routers for third-party providers behind the SMG gateway, and the contract they are built on"
license = "Apache-2.0"
repository = "https://github.com/smg-project/smg"
authors = [
    "Simo Lin <linsimo.mark@gmail.com>",
    "Chang Su <mckvtl@gmail.com>",
    "Keyang Ru <rukeyang@gmail.com>",
]
keywords = ["smg", "llm", "gateway", "router"]
categories = ["api-bindings"]

[features]
default = []
# One feature per built-in router; a self-hosted build takes none.
openai = []
anthropic = []
gemini = []

[lib]
name = "smg_external_router"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["macros", "multipart", "ws", "tracing"] }
bytes = "1.12.0"
chrono.workspace = true
dashmap.workspace = true
futures-util = "0.3"
futures.workspace = true
http-body-util = "0.1"
http.workspace = true
memchr = "2.8"
metrics = "0.24.6"
multer = { workspace = true }
once_cell = "1.21.4"
openai-protocol = { workspace = true, features = ["axum"] }
rand.workspace = true
regex = "1.12"
reqwest = { workspace = true, features = ["stream", "blocking", "json", "rustls", "multipart", "http2"] }
rmcp = { version = "1.7", features = ["client"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std", "preserve_order", "raw_value"] }
smg-data-connector.workspace = true
smg-mcp.workspace = true
str0m = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { workspace = true }
tokio-util.workspace = true
tracing.workspace = true
url = "2.5.8"
uuid = { workspace = true, features = ["serde"] }
webpki-roots = { workspace = true }
