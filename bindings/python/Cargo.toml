[package]
name = "smg-python"
version = "1.16.0-dev"
edition = "2021"
rust-version.workspace = true

[lib]
name = "smg_rs"
crate-type = ["cdylib"]

[dependencies]
tonic.workspace = true
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py38"] }
tokio = { version = "1.52.3", features = ["full"] }
once_cell = "1.21"
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# The tokenizer binding: the HTTP layer's own request types and checks, the
# deserializer that names a refused field's path, the pool that keeps
# llm-tokenizer's rayon work off rayon's global pool, and the digest of the
# files a tokenizer loads.
blake3 = { workspace = true }
rayon = "1.12"
serde_path_to_error = "0.1"
# openai-protocol's version (crates/protocols/Cargo.toml): its request types
# implement that version's `Validate`, and a semver-incompatible version's
# `Validate` is another trait.
validator = "0.20.0"

[dependencies.smg]
path = "../../model_gateway"
default-features = false
features = ["grpc-client", "jemalloc-stats", "providers"]

[dependencies.engine-servicer]
workspace = true

[dependencies.llm-multimodal]
workspace = true

[dependencies.llm-tokenizer]
workspace = true

[dependencies.openai-protocol]
workspace = true

[dependencies.prost]
workspace = true

[dependencies.smg-grpc-client]
workspace = true

[dependencies.smg-symphony]
workspace = true

[dependencies.bytes]
workspace = true

[dependencies.tracing]
workspace = true

[dependencies.smg-rl]
workspace = true

[dependencies.smg-auth]
workspace = true

[dependencies.smg-mesh]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.tool-parser]
workspace = true

[dependencies.reasoning-parser]
workspace = true

[dev-dependencies]
tempfile = "3.27"

[features]
default = ["pyo3/extension-module"]
opencv-video = ["smg/opencv-video"]
vendored-openssl = ["smg/vendored-openssl"]
jemalloc-profiling = ["smg/jemalloc-profiling", "tikv-jemallocator/profiling"]

[lints]
workspace = true

[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }
