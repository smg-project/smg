[package]
name = "smg-python"
version = "1.10.1"
edition = "2021"

[lib]
name = "smg_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["abi3-py38"] }
tokio = { version = "1.52.3", features = ["full"] }
once_cell = "1.21"
serde_yaml = "0.9"
prost-types.workspace = true
smg-grpc-client.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tokio-stream = { version = "0.1", features = ["net"] }

[dependencies.smg]
path = "../../model_gateway"
default-features = false
features = ["grpc-client", "jemalloc-stats"]

[dependencies.smg-auth]
workspace = true

[dependencies.smg-mesh]
workspace = true

[dependencies.rand]
workspace = true

[dependencies.tool-parser]
workspace = true

[dependencies.reasoning-parser]
workspace = true

[features]
# `extension-module` must NOT be in `default`. It tells PyO3 to leave the
# libpython symbols undefined (the interpreter supplies them when it dlopens
# the module), which is right for the cdylib but unlinkable for the test
# binary `cargo test` builds for this crate. maturin turns it on explicitly
# via `[tool.maturin] features` in pyproject.toml.
default = []
extension-module = ["pyo3/extension-module"]
opencv-video = ["smg/opencv-video"]
vendored-openssl = ["smg/vendored-openssl"]
jemalloc-profiling = ["smg/jemalloc-profiling", "tikv-jemallocator/profiling"]

[profile.ci]
inherits = "release"
opt-level = 2       # Lighter optimization (still fast runtime, much faster compile)
lto = "thin"        # Thin LTO - good balance
codegen-units = 16  # More parallelization for faster builds
strip = true

[lints]
workspace = true

[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }
