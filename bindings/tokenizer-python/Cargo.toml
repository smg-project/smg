[package]
name = "smg-tokenizer-python"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
tokenizers-v1 = ["llm-tokenizer/tokenizers-v1"]

[dependencies]
llm-tokenizer.workspace = true
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py311"] }
serde_json.workspace = true
chrono.workspace = true

[build-dependencies]
pyo3-build-config = "0.29.0"

[lints]
workspace = true
