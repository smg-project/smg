[build-system]
requires = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name = "smg-tokenizer"
version = "0.1.0"
requires-python = ">=3.11"
description = "Standalone Python bindings for SMG rendering and tokenization"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "smg_tokenizer._native"
