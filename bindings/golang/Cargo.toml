[package]
name = "smg-golang"
version = "1.10.1"
edition = "2021"

[lib]
name = "smg_go"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde_json = { version = "1.0", default-features = false, features = [
    "std",
    "preserve_order",
] }
uuid = { version = "1.23", features = ["v7", "serde"] }
once_cell = "1.21.4"
futures-util = "0.3"
tracing = "0.1"
libc = "0.2.186"
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false }

[dependencies.smg]
path = "../../model_gateway"
default-features = false
features = ["grpc-client"]

[dependencies.openai-protocol]
workspace = true

[dependencies.llm-tokenizer]
workspace = true

[dependencies.tool-parser]
workspace = true

[dependencies.smg-grpc-client]
workspace = true

[features]
default = []
opencv-video = ["smg/opencv-video"]
vendored-openssl = ["smg/vendored-openssl"]
jemalloc-profiling = ["smg/jemalloc-profiling", "tikv-jemallocator/profiling"]

[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Full LTO for smaller binaries
codegen-units = 1   # Better optimization, slower compile
strip = true        # Strip debug symbols

[profile.ci]
inherits = "release"
opt-level = 2       # Lighter optimization (still fast runtime, much faster compile)
lto = "thin"        # Thin LTO - good balance
codegen-units = 16  # More parallelization for faster builds
strip = true

[profile.dev]
opt-level = 0
debug = 1
split-debuginfo = "unpacked"
incremental = true
codegen-units = 256

[lints]
workspace = true

[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dependencies]
tikv-jemallocator = { workspace = true, features = ["disable_initial_exec_tls"] }

[target.'cfg(all(not(target_env = "msvc"), not(target_env = "musl")))'.dev-dependencies]
tikv-jemalloc-ctl = { workspace = true }
